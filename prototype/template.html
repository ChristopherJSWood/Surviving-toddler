<title>Bedtime or Bust</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@500;600;700&family=VT323&display=swap">
<style>
/* Layout: one phone-width column. A microwave-clock HUD sits over a fridge-note
   card; choices are chunky toy blocks; nights go dark; the week ends on a
   performance review printed like a till receipt. */
:root {
  --bg: #e8ecf1;
  --paper: #ffffff;
  --ink: #1c2130;
  --muted: #566074;
  --line: #cdd4de;
  --block: #ffd84d;
  --block-ink: #1c2130;
  --block-edge: #1c2130;
  --accent: #d93f45;
  --accent-ink: #ffffff;
  --lcd-bg: #23262e;
  --lcd-fg: #7fe3c6;
  --magnet: #d93f45;
  --energy: #d36b0c;
  --rel: #c93a72;
  --mood: #b38a00;
  --sleepy: #4253c9;
  --debt: #6b4fd6;
  --home: #178f82;
  --rep: #2f8a6a;
  --good: #1b7f46;
  --bad: #c2353a;
  --warn: #9a6200;
  --good-bg: #dff3e7;
  --bad-bg: #fbe3e3;
  --warn-bg: #fdf0d2;
  --neutral-bg: #e3e6fb;
  --love: #c93a72;
  --love-bg: #fbe3ee;
  --night-bg: #0d1020;
  --night-paper: #171b33;
  --night-ink: #d9def5;
  --night-muted: #8a91b5;
  --night-line: #2a3052;
  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-lcd: "VT323", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --step--1: 0.875rem;
  --step-0: 1.0625rem;
  --step-1: 1.25rem;
  --step-2: 1.6rem;
  --step-3: 2.4rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c; --paper: #1c212b; --ink: #edf0f5; --muted: #a2abbd; --line: #313846;
    --block: #f3cb47; --block-ink: #1c2130; --block-edge: #05070a;
    --accent: #ff6d71; --accent-ink: #1d0b0c; --lcd-bg: #0a0c10; --magnet: #ff6d71;
    --energy: #ffa94d; --rel: #ff7cab; --mood: #f1d04b; --sleepy: #8d99ff; --debt: #ae9bff; --home: #43cdbb; --rep: #5fd3a6;
    --good: #5ccf8e; --bad: #ff7b7f; --warn: #f5c25c; --good-bg: #183324; --bad-bg: #3a1c1e; --warn-bg: #3a2c10; --neutral-bg: #202546;
    --love: #ff7cab; --love-bg: #3a1a2a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c; --paper: #1c212b; --ink: #edf0f5; --muted: #a2abbd; --line: #313846;
  --block: #f3cb47; --block-ink: #1c2130; --block-edge: #05070a;
  --accent: #ff6d71; --accent-ink: #1d0b0c; --lcd-bg: #0a0c10; --magnet: #ff6d71;
  --energy: #ffa94d; --rel: #ff7cab; --mood: #f1d04b; --sleepy: #8d99ff; --debt: #ae9bff; --home: #43cdbb; --rep: #5fd3a6;
  --good: #5ccf8e; --bad: #ff7b7f; --warn: #f5c25c; --good-bg: #183324; --bad-bg: #3a1c1e; --warn-bg: #3a2c10; --neutral-bg: #202546;
  --love: #ff7cab; --love-bg: #3a1a2a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 var(--step-0)/1.5 var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
  transition: background-color 400ms ease;
}
/* Night: the whole screen goes dark regardless of theme. */
body.night { --bg: var(--night-bg); --paper: var(--night-paper); --ink: var(--night-ink); --muted: var(--night-muted); --line: var(--night-line); color-scheme: dark; }
main { max-width: 34rem; margin: 0 auto; display: grid; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 600; line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sleepy); outline-offset: 3px; border-radius: 6px; }
.eyebrow { font: 700 var(--step--1)/1.2 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: var(--step--1); }

.lcd { font-family: var(--font-lcd); background: var(--lcd-bg); color: var(--lcd-fg); border-radius: 8px; padding: 2px 12px 0; font-size: 2rem; line-height: 1.1; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; text-shadow: 0 0 8px color-mix(in srgb, var(--lcd-fg) 45%, transparent); white-space: nowrap; }
.lcd small { font-size: 0.6em; }
.lcd .colon { animation: blink 1.2s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0.25; } }

/* HUD */
.hud { display: grid; gap: 10px; }
.hud-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.dayname { font: 600 var(--step-1)/1 var(--font-display); }
.pill { font: 600 0.8rem/1 var(--font-body); padding: 7px 10px; border-radius: 999px; background: var(--paper); border: 1px solid var(--line); }
.hud-top .spacer { flex: 1; }
.groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.group { background: var(--paper); border-radius: 12px; padding: 10px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.group .eyebrow { font-size: 0.7rem; }
.meter { display: grid; gap: 3px; min-width: 0; }
.meter-head { display: flex; align-items: baseline; gap: 6px; font-size: 0.8rem; font-weight: 700; }
.meter-head .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meter-head .val { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); }
.meter.danger .val { color: var(--bad); }
.bar { position: relative; height: 8px; border-radius: 999px; background: color-mix(in srgb, var(--ink) 10%, transparent); overflow: hidden; }
.bar.thin { height: 5px; }
.bar .fill { position: absolute; inset: 0 auto 0 0; border-radius: inherit; transition: width 400ms ease; }
.meter.danger .fill { background: var(--bad) !important; }
.bar .tick { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: 0.75; }
.ticker { display: flex; flex-wrap: wrap; gap: 6px; }
.ticker span { font: 700 0.75rem/1 var(--font-body); padding: 6px 9px; border-radius: 99px; background: var(--warn-bg); color: var(--warn); }
details.list { background: var(--paper); border-radius: 12px; padding: 10px 12px; border: 1px solid var(--line); }
details.list summary { cursor: pointer; font-weight: 700; font-size: 0.9rem; }
details.list .rows { display: grid; gap: 6px; margin-top: 8px; font-size: 0.9rem; }
details.list .row { display: flex; justify-content: space-between; gap: 10px; }
details.list .row span:first-child { min-width: 0; }
.done { text-decoration: line-through; color: var(--muted); }
.expired { text-decoration: line-through; color: var(--bad); }

/* Fridge note */
.note { position: relative; background: var(--paper); border-radius: 6px 6px 18px 6px; padding: 26px 22px 22px; box-shadow: 0 1px 0 var(--line), 0 10px 24px -14px color-mix(in srgb, var(--ink) 40%, transparent); display: grid; gap: 12px; min-width: 0; border: 2px solid transparent; }
.note::before { content: ""; position: absolute; top: -9px; left: 50%; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, color-mix(in srgb, var(--magnet) 55%, white), var(--magnet) 60%); box-shadow: 0 2px 3px color-mix(in srgb, var(--ink) 35%, transparent); }
.note h2 { font-size: var(--step-2); }
.note .text { font-size: var(--step-1); line-height: 1.5; }
.note.k-red { border-color: var(--bad); }
.note.k-warn { border-color: var(--warn); border-style: dashed; }
.note.k-love { border-color: var(--love); }
.note.k-night { border-color: var(--night-line); }
.tag-line { font: 700 0.75rem/1 var(--font-body); letter-spacing: 0.1em; text-transform: uppercase; }
.tag-line.red { color: var(--bad); }
.tag-line.warn { color: var(--warn); }
.tag-line.love { color: var(--love); }
.tag-line.night { color: var(--sleepy); }

/* Toy blocks */
.choices { display: grid; gap: 14px; }
.block { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; background: var(--block); color: var(--block-ink); border: 2px solid var(--block-edge); border-radius: 12px; padding: 14px 16px; box-shadow: 0 5px 0 var(--block-edge); cursor: pointer; transition: transform 90ms ease, box-shadow 90ms ease; font-weight: 700; line-height: 1.35; }
.block:hover { transform: translateY(-1px); box-shadow: 0 6px 0 var(--block-edge); }
.block:active { transform: translateY(5px); box-shadow: 0 0 0 var(--block-edge); }
.block .key { flex: none; width: 1.7em; height: 1.7em; border-radius: 6px; display: grid; place-items: center; font: 700 0.85rem/1 var(--font-display); background: color-mix(in srgb, var(--block-ink) 12%, transparent); }
.block .label { flex: 1; min-width: 0; }
.block .mins { flex: none; font: 600 0.8rem/1.6 var(--font-body); opacity: 0.75; white-space: nowrap; }
.block.locked, .block.locked:hover, .block.locked:active { background: transparent; color: var(--muted); border: 2px dashed var(--line); box-shadow: none; transform: none; cursor: not-allowed; }
.block.locked .key { background: color-mix(in srgb, var(--muted) 12%, transparent); }
.block.locked .mins { opacity: 1; color: var(--bad); }
.block.primary { background: var(--accent); color: var(--accent-ink); justify-content: center; text-align: center; font-family: var(--font-display); font-size: var(--step-1); font-weight: 600; }
.linkish { background: none; border: 0; padding: 6px; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; justify-self: center; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 700 0.85rem/1 var(--font-body); padding: 7px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.chip.good { background: var(--good-bg); color: var(--good); }
.chip.bad { background: var(--bad-bg); color: var(--bad); }
.chip.neutral { background: var(--neutral-bg); color: var(--sleepy); }
.banner { border-radius: 10px; padding: 10px 12px; font-weight: 700; }
.banner.bad { background: var(--bad-bg); color: var(--bad); }

/* Title */
.title-screen { display: grid; gap: 20px; padding-top: 24px; justify-items: center; text-align: center; }
.title-screen h1 { font-size: clamp(2.6rem, 11vw, 3.6rem); font-weight: 700; letter-spacing: -0.01em; }
.title-screen h1 span { color: var(--accent); }
.title-screen .tag { font-size: var(--step-1); max-width: 28ch; }
.title-screen .actions { display: grid; gap: 14px; width: 100%; }
details.help { width: 100%; text-align: left; background: var(--paper); border-radius: 12px; padding: 14px 16px; border: 1px solid var(--line); }
details.help summary { cursor: pointer; font-weight: 700; }
details.help ul { margin: 10px 0 0; padding-left: 1.1em; display: grid; gap: 6px; }

.morning-head { display: grid; gap: 4px; justify-items: center; text-align: center; padding-top: 8px; }
.morning-head h1 { font-size: var(--step-3); }
.kv { display: grid; gap: 6px; }
.kv .row { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.kv .row b { font-weight: 700; }
.due { color: var(--bad); font-weight: 700; white-space: nowrap; }

.ending-head { display: grid; gap: 8px; text-align: center; padding-top: 12px; padding-bottom: 10px; }
.ending-head h1 { font-size: var(--step-3); }
.badge { justify-self: center; font: 700 var(--step--1)/1 var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; padding: 8px 12px; border-radius: 999px; }
.badge.win { background: var(--good-bg); color: var(--good); }
.badge.loss { background: var(--bad-bg); color: var(--bad); }
.score { font: 600 var(--step-2)/1 var(--font-display); font-variant-numeric: tabular-nums; }
.receipt { font-family: var(--font-lcd); font-size: 1.3rem; line-height: 1.25; background: var(--paper); padding: 20px 18px; border-radius: 4px; box-shadow: 0 10px 24px -16px color-mix(in srgb, var(--ink) 45%, transparent);
  mask: radial-gradient(circle 6px at 50% 0, transparent 98%, #000) 0 0 / 16px 51% repeat-x, radial-gradient(circle 6px at 50% 100%, transparent 98%, #000) 0 100% / 16px 51% repeat-x;
  -webkit-mask: radial-gradient(circle 6px at 50% 0, transparent 98%, #000) 0 0 / 16px 51% repeat-x, radial-gradient(circle 6px at 50% 100%, transparent 98%, #000) 0 100% / 16px 51% repeat-x; }
.receipt h3 { font-family: var(--font-lcd); font-weight: 400; font-size: 1.5rem; text-align: center; letter-spacing: 0.06em; }
.receipt .rule { border-top: 2px dashed var(--line); margin: 10px 0; }
.receipt .row { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
.receipt .row span:first-child { min-width: 0; }
.receipt .total { font-size: 1.45rem; }
.share { display: grid; gap: 8px; }
.share textarea { width: 100%; min-height: 4.5em; resize: none; font: 400 var(--step--1)/1.4 var(--font-body); color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
footer { text-align: center; font-size: 0.8rem; color: var(--muted); padding-top: 8px; }

/* v3: chats, stamps, the panic timer, reactions, screen effects */
.chat { display: grid; gap: 6px; margin-top: 6px; }
.chat-with { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: var(--step--1); }
.chat-with .avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--sleepy); color: #fff; display: grid; place-items: center; font-size: 0.8rem; }
.bubble { max-width: 82%; padding: 8px 12px; border-radius: 18px; font-size: var(--step--1); line-height: 1.35; animation: pop 260ms ease both; }
.bubble.theirs { justify-self: start; background: color-mix(in srgb, var(--muted) 18%, var(--paper)); }
.bubble.mine { justify-self: end; background: #2f7bf6; color: #fff; }
.bubble .from { display: block; font-size: 0.72rem; font-weight: 700; color: var(--muted); }
.after-chat { animation: pop 300ms ease both; }
.stamp { justify-self: center; display: inline-block; font: 700 1.45rem/1 var(--font-display); letter-spacing: 0.06em; padding: 7px 14px; border: 4px solid currentColor; border-radius: 8px; transform: rotate(-7deg); animation: slam 380ms cubic-bezier(.2, 1.6, .4, 1) .35s both; }
.stamp.good { color: var(--good); }
.stamp.bad { color: var(--bad); }
.stamp.neutral { color: var(--sleepy); }
.stamp-row { display: grid; justify-items: center; padding: 8px 0 2px; }
.lights-out { text-align: center; font: 700 var(--step-2)/1.1 var(--font-display); letter-spacing: 0.2em; animation: pop 700ms ease both; }
.countdown { display: grid; gap: 6px; color: var(--warn); font-weight: 800; }
.countdown .head { display: flex; justify-content: space-between; letter-spacing: 0.2em; font-size: var(--step--1); }
.countdown .secs { font: 700 var(--step-1)/1 var(--font-display); }
.countdown.urgent { color: var(--bad); }
.countdown .track { height: 10px; border-radius: 999px; background: color-mix(in srgb, var(--muted) 18%, transparent); overflow: hidden; }
.countdown .run { height: 100%; width: 100%; background: currentColor; border-radius: 999px; }
.reactions { display: flex; gap: 8px; align-items: center; }
.reactions .spacer { flex: 1; }
.reactions button { font-size: 1.4rem; padding: 6px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--paper); cursor: pointer; transition: transform 150ms ease, opacity 150ms ease; }
.reactions button[aria-pressed="true"] { transform: scale(1.2); border-color: var(--ink); }
.reactions button.dim { opacity: 0.35; }
.reactions .send { font: 700 var(--step--1)/1 var(--font-body); }
.house { display: grid; gap: 14px; }
.house label { display: grid; gap: 6px; font-weight: 700; }
.house input[type=text] { font: 400 var(--step-0)/1.2 var(--font-body); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.house .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.house .opts button { padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; font: 600 var(--step--1)/1 var(--font-body); }
.house .opts button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.house .toggle { display: flex; gap: 10px; align-items: center; font-weight: 600; }
#app.shake { animation: shake 450ms linear both; }
.fx-flash { position: fixed; inset: 0; background: #ff2a2a; pointer-events: none; z-index: 20; animation: flash 800ms ease-out both; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 21; }
.confetti i { position: absolute; top: -20px; width: 10px; height: 5px; border-radius: 2px; animation: fall var(--d) ease-in var(--delay) both; }
@keyframes pop { from { opacity: 0; transform: scale(0.6); } to { opacity: 1; transform: none; } }
@keyframes slam { from { opacity: 0; transform: rotate(-7deg) scale(2.8); } to { opacity: 0.92; transform: rotate(-7deg) scale(1); } }
@keyframes shake { 10% { transform: translateX(-16px); } 25% { transform: translateX(14px); } 40% { transform: translateX(-11px); } 55% { transform: translateX(8px); } 70% { transform: translateX(-4px); } 100% { transform: none; } }
@keyframes flash { from { opacity: 0.45; } to { opacity: 0; } }
@keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--spin)); } }
@media (prefers-reduced-motion: reduce) {
  .bubble, .after-chat, .stamp, .lights-out, #app.shake { animation: none !important; }
  .confetti { display: none; }
}

.enter { animation: enter 260ms ease both; }
@keyframes enter { from { transform: translateY(10px); } to { transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .enter, .lcd .colon { animation: none; }
  .bar .fill, .block, body { transition: none; }
}
@media (max-width: 420px) {
  .groups { grid-template-columns: 1fr 1fr; }
  .groups .group:first-child { grid-column: 1 / -1; grid-template-columns: 1fr 1fr; }
  .groups .group:first-child .eyebrow { grid-column: 1 / -1; }
  .note { padding: 24px 16px 18px; }
}
</style>

<main id="app" aria-live="polite">
  <section class="title-screen">
    <div class="lcd" aria-hidden="true">5<span class="colon">:</span>58</div>
    <h1>Bedtime <span>or</span> Bust</h1>
    <p class="tag">Five days. One toddler. One partner. Make it to date night.</p>
    <p class="muted small">Loading the week…</p>
  </section>
</main>

<script type="module">
/*__ENGINE__*/

/*__CONTENT__*/

// ---- Playtest UI. Rules live in the engine above; this only renders. ----
const app = document.getElementById("app");
const cfg = CONTENT.config;
const SAVE_KEY = "bedtime-or-bust.week.v2";
const STATS_KEY = "bedtime-or-bust.stats.v2";
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const name = (m) => CONTENT.meters[m];
const taskDef = (id) => CONTENT.tasks.find((t) => t.id === id);
const HIGHER_IS_BETTER = { energy: true, rel: true, mood: true, home: true, rep: true, sleepy: null, debt: false };
const DANGER = { energy: 20, rel: 20, home: 20, rep: 20, mood: 10 };
// Friday's 7:00 PM requirements, read from the date_check card's failure checks.
const DATE_CHECKS = CONTENT.events.find((e) => e.id === "date_check")?.checks ?? [];
const FRIDAY_SLEEPY = (DATE_CHECKS.find((c) => c.when?.max?.sleepy != null)?.when.max.sleepy ?? 59) + 1;
const FRIDAY_ENERGY = (DATE_CHECKS.find((c) => c.when?.max?.energy != null)?.when.max.energy ?? 29) + 1;

// Names (docs/VOICE.md placeholders), settings and the playtest reaction log.
const HOUSE_KEY = "bedtime-or-bust.household.v1";
const SETTINGS_KEY = "bedtime-or-bust.settings.v1";
const REACT_KEY = "bedtime-or-bust.reactions.v1";
const CALL_YOU = ["Mama", "Dada", "Mommy", "Daddy", "Mom", "Dad", "Papa", "Mum"];
const trim = (x) => String(x ?? "").trim().slice(0, 14);
const houseComplete = (h) => !!(h && trim(h.kid) && trim(h.partner) && trim(h.me));
function say(text) {
  const h = storage.get(HOUSE_KEY) ?? {};
  const kid = trim(h.kid) || "Bean";
  const partner = trim(h.partner) || "your partner";
  const me = trim(h.me) || "Mama";
  return String(text ?? "").replaceAll("{kid}", kid).replaceAll("{KID}", kid.toUpperCase())
    .replaceAll("{partner}", partner).replaceAll("{me}", me).replaceAll("{ME}", me.toUpperCase());
}
const sayEsc = (text) => esc(say(text));
const settings = () => ({ timers: true, reactions: true, ...(storage.get(SETTINGS_KEY) ?? {}) });
const reduceMotion = () => !!window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches;

const storage = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
  del(k) { try { localStorage.removeItem(k); } catch { /* storage unavailable */ } },
};

let session = null; // { seed, picks, game, screen, last }
let houseScreen = null; // "start" | "edit" while the names form is open
let timerHandle = null;

function persist() {
  if (!session) return;
  if (session.game.isOver && session.screen === "ending") storage.del(SAVE_KEY);
  else storage.set(SAVE_KEY, { v: CONTENT.version, seed: session.seed, picks: session.picks, screen: session.screen });
}

// A saved week is its seed plus the choices made; replaying them rebuilds it exactly.
function rebuild(saved) {
  try {
    if (!saved || saved.v !== CONTENT.version || typeof saved.seed !== "number") return null;
    const game = new Game(CONTENT, saved.seed);
    let last = null;
    for (const p of saved.picks ?? []) last = game.choose(p);
    const screens = ["morning", "event", "outcome", "lifeline", "ending"];
    let screen = screens.includes(saved.screen) ? saved.screen : "event";
    if (screen === "outcome" && !last) screen = "event";
    return { seed: saved.seed, picks: [...(saved.picks ?? [])], game, screen, last };
  } catch {
    return null;
  }
}

function newWeek(seed = Math.floor(Math.random() * 4294967296)) {
  session = { seed, picks: [], game: new Game(CONTENT, seed), screen: "morning", last: null };
  persist();
  render();
}

function choose(i, fromTimer = false) {
  const g = session.game;
  if (g.isOver || session.screen !== "event") return;
  const vis = g.visibleChoices();
  if (!(i >= 0 && i < vis.length) || g.isLocked(vis[i])) return;
  if (vis[i].timeout && !fromTimer) return;
  session.last = g.choose(i);
  session.picks.push(i);
  session.screen = "outcome";
  if (g.isOver) recordStats(g);
  persist();
  render();
}

function next() {
  const g = session.game;
  const r = session.last;
  session.screen = g.isOver ? "ending" : r?.dayEnded === "lifeline" ? "lifeline" : r?.dayEnded === "morning" ? "morning" : "event";
  persist();
  render();
}

function recordStats(g) {
  const s = storage.get(STATS_KEY) ?? { played: 0, won: 0, best: 0, endings: [] };
  s.played += 1;
  if (CONTENT.endings[g.state.endingId].kind === "win") { s.won += 1; s.best = Math.max(s.best, g.score()); }
  if (!s.endings.includes(g.state.endingId)) s.endings.push(g.state.endingId);
  storage.set(STATS_KEY, s);
}

// ---- Views ----
function lcd(text) {
  const [hm, ap] = text.split(" ");
  const [h, m] = hm.split(":");
  return `<div class="lcd" role="img" aria-label="${esc(text)}">${h}<span class="colon">:</span>${m} <small>${ap}</small></div>`;
}

function meter(m, value) {
  const danger = DANGER[m] != null && value <= DANGER[m];
  return `<div class="meter${danger ? " danger" : ""}" role="meter" aria-label="${esc(name(m))}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${value}">
    <div class="meter-head"><span class="name">${esc(name(m))}</span><span class="val">${value}</span></div>
    <div class="bar"><span class="fill" style="width:${value}%;background:var(--${m})"></span></div>
  </div>`;
}

function sleepWidget(g) {
  const { sleepy, debt } = g.state.meters;
  const th = g.state.day === 4 ? FRIDAY_SLEEPY : cfg.bedtime.threshold;
  return `<div class="meter" role="meter" aria-label="Sleepiness, needs ${th} at bedtime" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${sleepy}">
      <div class="meter-head"><span class="name">Sleepy</span><span class="val">${sleepy}</span></div>
      <div class="bar thin"><span class="fill" style="width:${sleepy}%;background:var(--sleepy)"></span><span class="tick" style="left:${th}%"></span></div>
    </div>
    <div class="meter" role="meter" aria-label="Sleep debt" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${debt}">
      <div class="meter-head"><span class="name">Debt</span><span class="val">${debt}</span></div>
      <div class="bar thin"><span class="fill" style="width:${debt}%;background:var(--debt)"></span></div>
    </div>`;
}

function listDetails(g) {
  const tasks = g.state.tasks;
  const open = tasks.filter((t) => t.status === "open").length;
  const cats = [...new Set([...Object.keys(g.state.ledger.you), ...Object.keys(g.state.ledger.partner)])].sort();
  const taskRows = tasks.length
    ? tasks.map((t) => `<div class="row"><span class="${t.status === "done" ? "done" : t.status === "expired" ? "expired" : ""}">${sayEsc(taskDef(t.id)?.label ?? t.id)}</span><span class="muted">${esc(CONTENT.days[Math.min(4, Math.floor(t.due / 1440))].name.slice(0, 3))} ${formatClock(t.due % 1440)}</span></div>`).join("")
    : `<div class="muted">Nothing yet. Enjoy it.</div>`;
  const ledgerRows = cats.length
    ? cats.map((c) => `<div class="row"><span>${esc(c[0].toUpperCase() + c.slice(1))}</span><span>You ${g.state.ledger.you[c] ?? 0} · ${sayEsc("{partner}")} ${g.state.ledger.partner[c] ?? 0}</span></div>`).join("")
    : `<div class="muted">Nobody has done anything yet. Suspicious.</div>`;
  return `<details class="list"><summary>Your list (${open} open) and the ledger</summary>
    <div class="rows"><span class="eyebrow">List</span>${taskRows}<span class="eyebrow" style="margin-top:6px">Ledger</span>${ledgerRows}</div>
  </details>`;
}

function upcoming(g) {
  return g.state.queue
    .filter((q) => q.at > g.now)
    .sort((a, b) => a.at - b.at || a.seq - b.seq)
    .slice(0, 2)
    .map((q) => `<span>⏳ ${sayEsc(CONTENT.events.find((e) => e.id === q.event)?.title ?? q.event)} at ${formatClock(q.at % 1440)}</span>`)
    .join("");
}

function hud(g) {
  const m = g.state.meters;
  const night = g.state.phase === "night";
  const ticks = upcoming(g);
  return `<section class="hud" aria-label="Status">
    <div class="hud-top">${lcd(night ? "2:47 AM" : formatClock(g.state.clock))}<span class="dayname">${esc(CONTENT.days[g.state.day].name)}</span><span class="spacer"></span>${g.modifier && g.modifier.title !== CONTENT.days[g.state.day].name ? `<span class="pill">${esc(g.modifier.title)}</span>` : ""}</div>
    <div class="groups">
      <div class="group"><span class="eyebrow">You</span>${meter("energy", m.energy)}${meter("rel", m.rel)}</div>
      <div class="group"><span class="eyebrow">Toddler</span>${meter("mood", m.mood)}${sleepWidget(g)}</div>
      <div class="group"><span class="eyebrow">Household</span>${meter("home", m.home)}${meter("rep", m.rep)}</div>
    </div>
    ${ticks ? `<div class="ticker">${ticks}</div>` : ""}
    ${night ? "" : listDetails(g)}
  </section>`;
}

function chips(deltas) {
  const keys = METERS.filter((k) => deltas[k]);
  if (!keys.length) return "";
  return `<div class="chips">${keys.map((k) => {
    const d = deltas[k];
    const hib = HIGHER_IS_BETTER[k];
    const cls = hib == null ? "neutral" : (d > 0) === hib ? "good" : "bad";
    return `<span class="chip ${cls}">${d > 0 ? "+" : "−"}${Math.abs(d)} ${esc(name(k))}</span>`;
  }).join("")}</div>`;
}

function eyebrow(ev) {
  if (ev.phase === "night") return ["2 AM", "night", "k-night"];
  if (ev.hazard === "catastrophe") return ["Catastrophe", "red", "k-red"];
  if (ev.hazard === "sting") return ["Hazard", "red", "k-red"];
  if (ev.moment) return ["Small moment", "love", "k-love"];
  if (CONTENT.events.some((e) => e.tell === ev.id)) return ["Warning", "warn", "k-warn"];
  if (CONTENT.tasks.some((t) => t.expire === ev.id)) return ["From your list", "warn", "k-warn"];
  if (ev.forced && !ev.endsWeek) return ["Payback", "warn", "k-warn"];
  return null;
}

function chatThread(withName, messages, startDelay = 0) {
  let delay = startDelay;
  const rows = messages.map((m, i) => {
    const mine = m.from === "you";
    const prev = messages[i - 1];
    const sender = !mine && withName && m.from !== withName && (!prev || prev.from !== m.from) ? `<span class="from">${sayEsc(m.from)}</span>` : "";
    delay += 0.35 + Math.min(0.75, String(m.text).length * 0.01);
    return `<div class="bubble ${mine ? "mine" : "theirs"}" style="animation-delay:${delay.toFixed(2)}s">${sender}${sayEsc(m.text)}</div>`;
  }).join("");
  const head = withName ? `<div class="chat-with"><span class="avatar">${esc(say(withName).slice(0, 1))}</span>${sayEsc(withName)}</div>` : "";
  return { html: `<div class="chat">${head}${rows}</div>`, ends: delay + 0.3 };
}

function timerOn(ev, choices) {
  return ev.timer != null && choices.some((c) => c.timeout) && settings().timers;
}

function eventView(g) {
  const ev = g.currentEvent;
  const choices = g.visibleChoices();
  const timed = timerOn(ev, choices);
  const tag = timed ? ["Panic", "red", "k-red"] : eyebrow(ev);
  const chat = ev.chat ? chatThread(ev.chat.with, ev.chat.messages) : null;
  const after = chat && !reduceMotion() ? ` after-chat" style="animation-delay:${chat.ends.toFixed(2)}s` : "";
  let key = 0;
  return `${hud(g)}
  <article class="note enter ${tag ? tag[2] : ""}" aria-labelledby="ev-title">
    ${tag ? `<p class="tag-line ${tag[1]}">${tag[0]}</p>` : ""}
    <h2 id="ev-title">${sayEsc(ev.title)}</h2>
    <p class="${chat ? "muted small" : "text"}">${sayEsc(ev.text)}</p>
    ${chat ? chat.html : ""}
  </article>
  ${timed ? `<div class="countdown${after}" data-timer="${ev.timer}"><div class="head"><span>DECIDE</span><span class="secs">${ev.timer}</span></div><div class="track"><div class="run"></div></div></div>` : ""}
  <div class="choices${after}">
    ${choices.map((c, i) => {
      if (c.timeout) return "";
      const locked = g.isLocked(c);
      key += 1;
      return `<button class="block${locked ? " locked" : ""}" data-act="choose" data-i="${i}" ${locked ? `aria-disabled="true"` : ""}><span class="key" aria-hidden="true">${key}</span><span class="label">${sayEsc(c.label)}</span><span class="mins">${locked ? `Too tired · needs ${c.minEnergy}` : `${c.duration} min`}</span></button>`;
    }).join("")}
  </div>`;
}

function stampTone(r) {
  if (r.snapped) return "bad";
  let score = 0;
  for (const [k, d] of Object.entries(r.deltas)) { const hib = HIGHER_IS_BETTER[k]; if (hib != null) score += hib ? d : -d; }
  return score > 4 ? "good" : score < -4 ? "bad" : "neutral";
}

// Screen effects for an outcome or the ending: shake, red flash, confetti.
function effects(kinds) {
  if (kinds.includes("shake") && !reduceMotion()) { app.classList.remove("shake"); void app.offsetWidth; app.classList.add("shake"); }
  if (kinds.includes("flash")) {
    const f = document.createElement("div");
    f.className = "fx-flash";
    f.addEventListener("animationend", () => f.remove());
    document.body.append(f);
  }
  if (kinds.includes("confetti") && !reduceMotion()) {
    const box = document.createElement("div");
    box.className = "confetti";
    const colors = ["#ff5fa2", "#ffb347", "#ffe066", "#6ee7b7", "#818cf8", "#2dd4bf", "#f87171"];
    box.innerHTML = Array.from({ length: 70 }, () => {
      const x = Math.random() * 100, dx = Math.round(Math.random() * 120 - 60), spin = Math.round(240 + Math.random() * 660);
      return `<i style="left:${x}%;background:${colors[Math.floor(Math.random() * colors.length)]};--dx:${dx}px;--spin:${spin}deg;--d:${(1.3 + Math.random()).toFixed(2)}s;--delay:${(Math.random() * 0.35).toFixed(2)}s"></i>`;
    }).join("");
    document.body.append(box);
    setTimeout(() => box.remove(), 3200);
  }
}

// Panic countdown: when it runs out, the card's timeout choice happens.
function startTimer() {
  const el = app.querySelector(".countdown");
  if (!el || !session) return;
  const total = Number(el.dataset.timer) * 1000;
  const lead = parseFloat(el.style.animationDelay || "0") * 1000;
  const t0 = performance.now() + lead;
  const step = session.game.state.step;
  timerHandle = setInterval(() => {
    if (!session || session.screen !== "event" || session.game.state.step !== step) { clearInterval(timerHandle); return; }
    const left = Math.max(0, total - Math.max(0, performance.now() - t0));
    el.querySelector(".run").style.width = `${(100 * left) / total}%`;
    const secs = Math.ceil(left / 1000);
    el.querySelector(".secs").textContent = secs;
    el.classList.toggle("urgent", secs <= 2);
    if (left <= 0) {
      clearInterval(timerHandle);
      const idx = session.game.visibleChoices().findIndex((c) => c.timeout);
      if (idx >= 0) choose(idx, true);
    }
  }, 50);
}

function render() {
  clearInterval(timerHandle);
  let html;
  const g = session?.game;
  if (houseScreen) html = householdView();
  else if (!session) html = titleView();
  else if (session.screen === "morning") html = morningView(g);
  else if (session.screen === "lifeline") html = lifelineView();
  else if (session.screen === "outcome" && session.last) html = outcomeView(g, session.last);
  else if (session.screen === "ending" || g.isOver) html = endingView(g);
  else html = eventView(g);
  document.body.classList.toggle("night", !!g && g.state.phase === "night" && !g.isOver && session.screen !== "morning");
  app.innerHTML = html;
  window.scrollTo({ top: 0 });
  if (!houseScreen && session?.screen === "outcome" && session.last) {
    const r = session.last;
    effects(r.snapped ? ["shake", "flash"] : r.fx ? [r.fx] : []);
  } else if (!houseScreen && session && (session.screen === "ending" || g?.isOver)) {
    setTimeout(() => effects(g.ending.kind === "win" ? ["confetti"] : ["shake", "flash"]), 500);
  } else if (!houseScreen && session?.screen === "event") {
    startTimer();
  }
  if (session && (session.screen === "event" || session.screen === "outcome")) {
    app.querySelector(".choices .block:not(.locked), .block.primary")?.focus({ preventScroll: true });
  }
}

app.addEventListener("click", async (ev) => {
  const btn = ev.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  if (act === "new") { if (houseComplete(storage.get(HOUSE_KEY))) newWeek(); else { houseScreen = "start"; render(); } }
  else if (act === "house-edit") { houseScreen = "edit"; render(); }
  else if (act === "me") {
    const input = app.querySelector('input[name="me"]');
    input.value = btn.dataset.me;
    app.querySelectorAll('[data-act="me"]').forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
  }
  else if (act === "react") {
    const g = session.game, r = session.last;
    const log = (storage.get(REACT_KEY) ?? []).filter((x) => x.step !== g.state.step);
    const had = (storage.get(REACT_KEY) ?? []).find((x) => x.step === g.state.step)?.kind;
    if (had !== btn.dataset.kind) log.push({ at: new Date().toISOString(), day: g.state.day, step: g.state.step, card: r.eventId, title: say(CONTENT.events.find((e) => e.id === r.eventId)?.title ?? r.eventId), choice: r.choiceIndex, outcome: r.outcomeIndex, kind: btn.dataset.kind });
    storage.set(REACT_KEY, log.slice(-5000));
    const mine = log.find((x) => x.step === g.state.step)?.kind;
    app.querySelectorAll('[data-act="react"]').forEach((b) => { b.setAttribute("aria-pressed", String(b.dataset.kind === mine)); b.classList.toggle("dim", !!mine && b.dataset.kind !== mine); });
  }
  else if (act === "send") {
    const r = session.last;
    const text = `${say(CONTENT.events.find((e) => e.id === r.eventId)?.title ?? "")}\n\n${say(r.text)}\n\n(Bedtime or Bust)`;
    try { if (navigator.share) await navigator.share({ text }); else { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; } } catch { /* cancelled */ }
  }
  else if (act === "export") {
    const log = storage.get(REACT_KEY) ?? [];
    const q = (v) => `"${String(v).replaceAll('"', '""')}"`;
    const csv = ["time,day,card,title,choice,outcome,reaction", ...log.map((x) => [x.at, x.day, q(x.card), q(x.title), x.choice, x.outcome, x.kind].join(","))].join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = "bedtime-or-bust-playtest.csv";
    a.click();
  }
  else if (act === "resume") { session = rebuild(storage.get(SAVE_KEY)); render(); }
  else if (act === "begin" || act === "lifeline") { session.screen = "event"; persist(); render(); }
  else if (act === "choose") choose(Number(btn.dataset.i));
  else if (act === "next") next();
  else if (act === "title") { houseScreen = null; session = null; render(); }
  else if (act === "copy") {
    const label = document.getElementById("copy-label");
    try {
      await navigator.clipboard.writeText(shareText(session.game));
      label.textContent = "Copied";
    } catch {
      const ta = document.getElementById("share-text");
      ta.focus();
      ta.select();
      label.textContent = "Selected. Copy it from the box above.";
    }
  }
});

app.addEventListener("submit", (ev) => {
  const form = ev.target.closest('[data-form="house"]');
  if (!form) return;
  ev.preventDefault();
  const data = new FormData(form);
  const h = { kid: trim(data.get("kid")), partner: trim(data.get("partner")), me: trim(data.get("me")) };
  if (!houseComplete(h)) { form.querySelector("input:placeholder-shown, input[value='']")?.focus(); return; }
  storage.set(HOUSE_KEY, h);
  storage.set(SETTINGS_KEY, { timers: !!data.get("timers"), reactions: !!data.get("reactions") });
  const starting = houseScreen === "start";
  houseScreen = null;
  if (starting) newWeek(); else render();
});

document.addEventListener("keydown", (ev) => {
  if (houseScreen || !session || session.screen !== "event" || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const n = Number(ev.key);
  const buttons = [...app.querySelectorAll('.choices [data-act="choose"]')];
  if (n >= 1 && n <= buttons.length) { ev.preventDefault(); choose(Number(buttons[n - 1].dataset.i)); }
});

if (typeof window.claude?.hot?.snapshot === "function") {
  window.claude.hot.snapshot(() => (session ? { seed: session.seed, picks: session.picks, screen: session.screen, v: CONTENT.version } : {}));
}
function start(data) {
  const restored = rebuild(data);
  if (restored) session = restored;
  render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

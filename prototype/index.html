ow. Is it? Neither of you can remember who has mornings. You go. You come back holding the shoe.","effects":{"rel":-4},"ledger":{"night":"you"}}]},{"label":"Pretend to be asleep. Commit fully.","duration":5,"outcomes":[{"weight":1,"text":"It works. They talk quietly to the shoe for twenty minutes and fall back asleep holding it. Some questions answer themselves.","effects":{"energy":6}},{"weight":2,"text":"\"Is it morning?\" becomes \"IT'S MORNING,\" which is not a question. It is now, technically, morning.","effects":{"rel":-2,"debt":3},"ledger":{"night":"you"},"fx":"shake"}]}]},{"id":"night_trained","title":"Trained","text":"4:02 AM. Nothing has happened all night. You and {partner} wake up at the exact same second anyway, both grab for the monitor, and stare at a sleeping child. You've both been trained.","phase":"night","weight":1,"oncePerWeek":true,"choices":[{"label":"Put it down. Don't jinx it.","duration":1,"outcomes":[{"weight":2,"text":"You both lie back down without a word. Neither of you says \"we got a whole night\" out loud, because you're not amateurs.","effects":{"energy":8,"rel":4}},{"weight":1,"text":"You lie back down. {partner} whispers, \"We did it. A whole night.\" From the monitor, very small: \"{ME}?\"","effects":{"rel":-4,"debt":3},"ledger":{"night":"you"},"stamp":"JINXED"}]},{"label":"Watch them sleep for a minute. Together.","duration":5,"outcomes":[{"text":"Two adults and one glowing screen, watching someone 34 inches long breathe. Nobody says anything. Nobody has to.","effects":{"rel":8,"energy":4}}]},{"label":"Go check in person. Just to be sure.","duration":3,"outcomes":[{"weight":1,"text":"The floorboard outside their door has one job. It does it. {kid} sits up and says, \"Is it breakfast?\"","effects":{"energy":-4,"debt":3},"ledger":{"night":"you"},"stamp":"FLOORBOARD: 1"},{"weight":1,"text":"You make it to the door, look in and make it back without a creak. You've never been so quiet in your life. Nobody will ever know.","effects":{"energy":6}}]}]},{"id":"night_regret","title":"The Replay","text":"3:12 AM. You're replaying the moment you lost it today. In the replay you're calm. In the replay you crouch down to their level. In real life, you didn't.","phase":"night","weight":5,"oncePerWeek":true,"when":{"flags":["d:snapped"]},"choices":[{"label":"Wake {partner} and say it out loud","duration":15,"outcomes":[{"text":"They listen with their eyes closed. \"You're a good parent having a hard week,\" they mumble. \"Those aren't opposites.\" It helps more than it should.","effects":{"rel":8,"energy":-6}}]},{"label":"Plan tomorrow's sorry","duration":10,"outcomes":[{"text":"Get down to their level. Say what happened. Say it wasn't okay. Say you love them. You run it three times and fall asleep on the second \"I love you.\"","effects":{"energy":10}}]},{"label":"Go stand in their doorway","duration":5,"outcomes":[{"text":"They're asleep on their back, arms flung up, the way they sleep when they feel safe. Tomorrow you'll say sorry. They'll say \"okay\" and ask for a snack. That's what repair looks like at two.","effects":{"energy":6}}]}]},{"id":"night_late_show","title":"Live From the Crib","text":"11:48 PM. The toddler who wasn't sleepy at bedtime is now hosting a late-night show from the crib. Tonight's guests: Bun-Bun and a sock. The monologue is the word \"BUS.\"","phase":"night","weight":5,"oncePerWeek":true,"when":{"flags":["d:secondWind"],"notFlags":["night:lateshow"]},"choices":[{"label":"Be the dullest guest in TV history","duration":25,"outcomes":[{"text":"You sit in the dark and read the sound machine's warranty aloud, in a monotone. By \"limitation of liability,\" the show is over. Your best set ever, and nobody laughed.","effects":{"energy":-6,"debt":-4},"ledger":{"night":"you"},"set":["night:lateshow"]}]},{"label":"Book {partner} as the closing act","duration":3,"tags":["tagteam"],"outcomes":[{"when":{"min":{"ledger":2}},"text":"{partner} goes in and does the slow-blink-and-hum thing they're weirdly good at. The show is cancelled in six minutes. Network decision.","effects":{"energy":4},"ledger":{"night":"partner"},"stamp":"CANCELLED","set":["night:lateshow"]},{"when":{"max":{"ledger":1}},"text":"\"You did bedtime,\" {partner} whispers. \"This is your encore.\" Harsh. Accurate. You go in to a standing ovation from one.","effects":{"rel":-4},"ledger":{"night":"you"},"set":["night:lateshow"]}]},{"label":"Let the show run long","duration":5,"outcomes":[{"weight":1,"text":"The show runs until 12:31 and ends in the middle of \"BUS.\" They fell asleep on air.","effects":{"debt":4},"set":["night:lateshow"]},{"weight":1,"text":"The show gets picked up for a second season. At 1:05 you go in, and they greet you like a superfan who got backstage.","effects":{"energy":-4,"debt":5},"ledger":{"night":"you"},"stamp":"RENEWED","set":["night:lateshow"]}]}]},{"id":"night_wired","title":"The Fridge Is Thinking","text":"1:30 AM. Everyone in the house is asleep but you. You can hear the fridge thinking. You can hear your own eyelids. The 4 PM coffee is still at work.","phase":"night","weight":4,"oncePerWeek":true,"when":{"flags":["d:lateCoffee"],"notFlags":["night:wired"]},"choices":[{"label":"You're up anyway. Take the next shift.","duration":15,"outcomes":[{"text":"At 2:10 the monitor crackles and you're there in nine seconds, because you were already standing at the door. {partner} wakes up suspiciously rested.","effects":{"rel":8,"debt":-2},"ledger":{"night":"you"},"stamp":"SHIFT COVERED","set":["night:wired"]}]},{"label":"Reorganize the snack drawer by feel","duration":20,"outcomes":[{"text":"You sort 31 snacks by crunch, in total darkness. In the morning, {partner} opens the drawer, looks at it for a while and quietly closes it again.","effects":{"energy":-4,"rel":4},"set":["night:wired"]}]},{"label":"Catch up on the group chat at 1% brightness","duration":20,"outcomes":[{"weight":1,"text":"You vote in the pajama-day poll and answer a six-day-old bake sale question. At 1:34 AM someone replies, \"are you ok?\"","effects":{"energy":2},"set":["night:wired"]},{"weight":1,"text":"You scroll so far back you accidentally heart a photo from 2022. Everyone gets the notification. At 1:36 AM, Brynn hearts your heart.","effects":{"energy":-8},"set":["night:wired"]}]}]},{"id":"night_molar","title":"The Molar, Live","text":"1:15 AM. The molar is still coming in, and it wants everyone to know. {kid} is gnawing the crib rail and crying in a key you didn't know existed.","phase":"night","weight":5,"oncePerWeek":true,"when":{"flags":["d:teething"]},"choices":[{"label":"Rocking chair. Cold washcloth. The long haul.","duration":40,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":1,"text":"Forty minutes in the chair. They chew the washcloth, then your sleeve, then your thumb, then fall asleep mid-chew. You know exactly where the molar is now. So does your thumb.","effects":{"energy":-6,"debt":-5},"ledger":{"night":"you"}},{"weight":1,"text":"Twenty minutes in, they fall asleep on your shoulder with their mouth open, slowly soaking your shirt. You stay another twenty anyway.","effects":{"energy":-6,"debt":-5},"ledger":{"night":"you"}}]},{"label":"Read the dose chart twice. Measure once.","duration":10,"outcomes":[{"text":"Kitchen light on. You read the chart twice and measure with the syringe, not a spoon. Twenty minutes later the crying winds down to a hum.","effects":{"energy":-3,"debt":-3},"ledger":{"night":"you"}}]},{"label":"Tag {partner}: \"Tooth shift's yours.\"","duration":3,"tags":["tagteam"],"outcomes":[{"when":{"min":{"ledger":2}},"text":"{partner} takes it. Through the wall you hear them make up a song about the tooth. Verse three rhymes \"molar\" with \"polar bear.\" It's working.","effects":{"energy":4},"ledger":{"night":"partner"}},{"when":{"max":{"ledger":1}},"text":"\"I did the last molar,\" {partner} whispers. There have been four molars. You decide not to audit this at 1 AM. You go.","effects":{"rel":-4},"ledger":{"night":"you"}}]}]},{"id":"night_earworm","title":"3 AM: Key Change","text":"3:02 AM. Nobody is crying. Nobody needs anything. You're awake because the Sunshine Sing-Along theme is playing in your head at full volume, key change and all.","phase":"night","weight":4,"oncePerWeek":true,"when":{"flags":["d:screen"],"notFlags":["night:earworm"]},"choices":[{"label":"Hum it once. Exorcise it.","duration":5,"outcomes":[{"weight":1,"text":"You hum one bar. Still asleep, {partner} hums the harmony. You lie there in the dark, a duet nobody asked for.","effects":{"rel":6,"energy":-4},"set":["night:earworm"]},{"weight":1,"text":"You hum one bar. Through the monitor, a small voice picks up the next one. Now it's a concert, and you're the opening act.","effects":{"energy":-4,"debt":3},"ledger":{"night":"you"},"set":["night:earworm"]}]},{"label":"Put in one earbud. Rain sounds.","duration":10,"outcomes":[{"weight":1,"text":"Real rain, recorded somewhere with weather. You're asleep by 3:15, smiling.","effects":{"energy":10},"set":["night:earworm"]},{"weight":1,"text":"The rain is lovely for four minutes. Then your brain finds the beat and lays the theme song over it. It's a remix now. It's better. That's the problem.","effects":{"energy":-8},"stamp":"REMIXED","set":["night:earworm"]}]},{"label":"Wake {partner}: \"Do you have it too?\"","duration":2,"outcomes":[{"weight":1,"text":"\"I've had it since last week,\" they whisper. \"I didn't want to give it to you.\" The most romantic thing anyone has ever said to you.","effects":{"rel":6},"set":["night:earworm"]},{"weight":1,"text":"\"I do now,\" {partner} says, bitterly, at 3:04 AM. You've passed it on. You fall asleep in a minute, free.","effects":{"rel":-10,"energy":6},"stamp":"TRANSMITTED","set":["night:earworm"]}]}]},{"id":"night_agenda","title":"The 3 AM Agenda","text":"3:07 AM. Your brain has called a meeting. Attendance is mandatory. The agenda is everything you said \"later\" to this week, read aloud, in order.","phase":"night","weight":4,"oncePerWeek":true,"when":{"flags":["tasks_later"],"notFlags":["night:agenda"]},"choices":[{"label":"Do the oldest thing on the list. Now. One thumb.","duration":15,"outcomes":[{"text":"You do it in the dark at 4% brightness, with one thumb. Confirmation email: 3:22 AM. The meeting is adjourned. You are now, unfortunately, awake.","effects":{"energy":-6},"completeTask":"oldest","stamp":"MOTION CARRIED","set":["night:agenda"]}]},{"label":"Write it on your hand in the dark","duration":2,"outcomes":[{"weight":1,"text":"In the morning your hand says \"THE THING\" in ballpoint. It works. You do the thing before breakfast, still a little proud of the handwriting.","effects":{"energy":-2},"completeTask":"oldest","set":["night:agenda"]},{"weight":1,"text":"In the morning your hand says \"THE THING\" in ballpoint. You stare at it on and off all day, like a riddle you left yourself.","effects":{"energy":2},"set":["night:agenda"]}]},{"label":"Table it. Future you can handle it.","duration":1,"outcomes":[{"text":"Future you has been handling everything since March. Future you is so tired of you. You fall asleep anyway.","effects":{"energy":6},"stamp":"TABLED","set":["night:agenda"]}]}]},{"id":"night_grandma","title":"Grandma Has It","text":"2:20 AM. Crying. Before either of you moves, the guest-room door opens. Slippers in the hall. Then Grandma, in the nursery, singing a song you haven't heard since you were four.","phase":"night","weight":5,"oncePerWeek":true,"when":{"flags":["d:grandma"]},"choices":[{"label":"Let Grandma win this one","duration":2,"outcomes":[{"text":"The crying stops in three minutes. At breakfast Grandma says, \"They sleep fine for me,\" butters toast like someone who has won an argument, and posts about it by 8.","effects":{"energy":12,"rel":-6},"stamp":"GRANDMA: 1"}]},{"label":"Sit in the hallway. Be four again.","duration":10,"outcomes":[{"text":"It's the song about the little boat. You forgot you knew it. You hum the second verse in the dark hallway, very quietly, so nobody hears.","effects":{"energy":4}}]},{"label":"Go in. Your kid, your shift.","duration":15,"outcomes":[{"text":"\"I've got it,\" Grandma whispers. \"I've got it,\" you whisper back. Two grown adults whisper \"I've got it\" over a crib until {kid} falls asleep out of boredom.","effects":{"energy":-4,"debt":-2},"ledger":{"night":"you"}}]}]},{"id":"w_pt_whiteboard","title":"Column Three: Invisible Stuff","text":"The chore whiteboard on the fridge has always had two columns, one each. This morning there's a third, in {partner}'s handwriting: INVISIBLE STUFF. It has eleven checkmarks.","window":[380,560],"weight":2,"oncePerWeek":true,"choices":[{"label":"\"Walk me through the eleven.\"","duration":10,"minEnergy":25,"outcomes":[{"weight":2,"text":"They do. Renewed the car seat registration. Knew the pediatrician's fax number. Thought about the gutters (×3). It's mostly real. You add two checkmarks yourself.","effects":{"rel":14,"energy":-8},"stamp":"MARKS VERIFIED"},{"weight":1,"text":"Checkmark four: \"Remembered your mom's birthday.\" You remembered it. You told them. They wrote it down, which is remembering, which is a checkmark.","effects":{"rel":-8,"energy":-8},"count":{"blames":1},"set":["pt:sniped"]}]},{"label":"Add column four: STUFF I DID WHILE YOU SLEPT","duration":3,"outcomes":[{"text":"It fills up fast. By breakfast the fridge is a spreadsheet. Then {kid} adds a fifth column in purple marker, directly on the fridge. It has more checkmarks than both of yours.","effects":{"energy":6,"rel":-12},"count":{"blames":1},"set":["pt:sniped"],"fx":"shake"}]},{"label":"Wipe the board. Declare amnesty.","duration":2,"outcomes":[{"weight":1,"text":"Clean slate. {partner} exhales like someone let out of a meeting early. For one whole day, nobody counts anything out loud.","effects":{"rel":10,"energy":2}},{"weight":1,"text":"You wipe it clean. {partner} watches, uncaps the marker and adds one checkmark under nothing. \"That's for wiping it.\"","effects":{"rel":-6,"energy":4},"count":{"blames":1},"set":["pt:sniped"]}]}]},{"id":"w_pt_opening_statement","title":"Opening Statement","text":"The bath is running. {partner}, unprompted, from the hallway: \"I did bath yesterday.\" Nobody asked. It wasn't information. It was an opening statement.","window":[1110,1165],"weight":2,"oncePerWeek":true,"when":{"max":{"day":3},"min":{"day":1}},"choices":[{"label":"\"And I did the four before that.\"","duration":3,"outcomes":[{"when":{"min":{"ledger":3}},"text":"They count on their fingers. They run out of fingers. They roll up their sleeves without a word. You were right, and now you get to stand in a hallway being right.","effects":{"energy":10,"rel":-8},"ledger":{"bath":"partner"},"count":{"blames":1},"set":["pt:sniped"]},{"when":{"max":{"ledger":2}},"text":"\"Four? Name them.\" You name three. One of them was Grandma. The tub overflows while you both scroll your phones for proof.","effects":{"energy":-6,"rel":-12},"ledger":{"bath":"you"},"count":{"blames":1},"set":["pt:sniped"],"stamp":"INSUFFICIENT EVIDENCE","fx":"shake"}]},{"label":"\"Rock, paper, scissors. Best of three.\"","duration":3,"tags":["tagteam"],"outcomes":[{"weight":1,"text":"Rock. Rock. Rock. Rock. You know each other too well to win anything. {kid} wanders in naked and picks {partner}, who does the good splashing.","effects":{"rel":10,"energy":8},"ledger":{"bath":"partner"}},{"weight":1,"text":"You lose on paper. Best of five: you lose on paper. You do bath, and {partner} sits on the closed toilet the whole time keeping you company, which is what you wanted.","effects":{"rel":12,"energy":-8},"ledger":{"bath":"you"}}]},{"label":"\"You did. It was beautiful.\" Take bath.","duration":3,"minEnergy":25,"tags":["martyr"],"outcomes":[{"text":"You take bath. They hover, fold one towel, then set a phone alarm for tomorrow at 6:45 called BATH (ME). It's either love or litigation.","effects":{"rel":12,"energy":-10},"ledger":{"bath":"you"}}]}],"priority":31},{"id":"w_pt_dishwasher","title":"The Dishwasher Doctrine","text":"{partner} is reloading the dishwasher you just loaded. Silently. One bowl at a time. Every bowl they move is a small essay about you. You'd be angrier if you hadn't reloaded theirs at 11:40 last night.","window":[400,560],"weight":2,"oncePerWeek":true,"choices":[{"label":"\"Teach me your system.\"","duration":10,"minEnergy":20,"outcomes":[{"weight":2,"text":"There's a system. It has a philosophy. Bowls face the center, \"like a congregation.\" You nod at all of it. You'll never use it. They know, and they're thrilled anyway.","effects":{"rel":12,"energy":-8}},{"weight":1,"text":"They start explaining, stop, and admit there's no system. They just like moving the bowls. It calms them. You hand them a bowl. They move it.","effects":{"rel":16,"energy":-8},"stamp":"IT'S JUST VIBES"}]},{"label":"Confess: \"I reload yours too.\"","duration":3,"outcomes":[{"weight":1,"text":"A long silence. \"Since when?\" Since {kid} was born. For two years nothing in this house has been washed the way it was loaded. You laugh until {kid} joins in without knowing why.","effects":{"rel":12,"energy":4,"mood":6}},{"weight":1,"text":"\"I KNEW the forks were moving.\" An inquiry follows. You agree to alternate weeks. By Thursday you're both reloading again, quietly, at night.","effects":{"rel":-6,"energy":-4},"count":{"blames":1},"set":["pt:sniped"]}]},{"label":"Wait till they leave. Put it all back.","duration":5,"outcomes":[{"weight":2,"text":"You restore every bowl the second their car turns the corner. The dishwasher has now been loaded three times and run zero. The pans have started to form opinions.","effects":{"energy":6}},{"weight":1,"text":"They come back for their keys and catch you holding a bowl. Nobody speaks. You both know exactly what this is.","effects":{"energy":4,"rel":-12},"count":{"blames":1},"set":["pt:sniped"],"stamp":"CAUGHT BOWL-HANDED"}]}]},{"id":"w_pt_tablespoon","title":"Technically Not Empty","text":"The milk carton is back in the fridge with one tablespoon of milk in it. Somebody believes, in their heart, that this carton is not empty. There are two suspects. One can't reach the fridge.","window":[380,620],"weight":2,"oncePerWeek":true,"choices":[{"label":"Photograph it. Send to {partner}. No caption.","duration":2,"outcomes":[{"weight":1,"text":"A full confession in three texts, and a gallon on the counter by 6. The system works.","effects":{"energy":6,"rel":-4},"count":{"blames":1},"set":["pt:sniped"],"chat":[{"from":"{partner}","text":"lol not me"},{"from":"{partner}","text":"ok me"},{"from":"{partner}","text":"getting milk"}]},{"weight":1,"text":"There's another carton? There's another carton. It was you. It was always you.","effects":{"energy":-4,"rel":-10},"count":{"blames":1},"set":["pt:sniped"],"chat":[{"from":"{partner}","text":"that's YOURS"},{"from":"{partner}","text":"i finished the other one and threw it out like an adult"}],"stamp":"IT WAS YOU"}]},{"label":"Put it back. Two can play this game.","duration":1,"outcomes":[{"weight":1,"text":"You put it back, tablespoon intact. It isn't a carton anymore. It's a statement, and nobody throws away a statement.","effects":{"energy":4,"rel":-6}},{"weight":1,"text":"By evening there's a second carton next to it, also holding one tablespoon. Nobody says anything. The fridge is a standoff now.","effects":{"energy":4,"rel":-8},"stamp":"COLD WAR, LITERALLY"}]},{"label":"Black coffee. Rise above it.","duration":2,"minEnergy":20,"outcomes":[{"weight":1,"text":"You drink it black and say nothing. You are, at most, 15% bitter about it. The coffee is the other 85%.","effects":{"energy":-6,"rel":8}},{"weight":1,"text":"You rise above it. {partner} notices the black coffee, then the carton, and quietly writes MILK on the whiteboard in letters a foot tall.","effects":{"energy":-6,"rel":12}}]}]},{"id":"w_pt_natural","title":"Such a Natural","text":"{partner} took {kid} to the grocery store alone. Forty-one minutes. They come home, sit down on the entryway floor in their coat and say, \"The cashier said I'm a natural.\"","window":[930,1160],"weight":2,"oncePerWeek":true,"choices":[{"label":"\"Nobody has ever called me a natural.\"","duration":2,"outcomes":[{"weight":1,"text":"\"What do they call you?\" \"Tired.\" They go quiet, then say \"you look great,\" which is what people say to tired people.","effects":{"rel":-8,"energy":6},"count":{"blames":1},"set":["pt:sniped"]},{"weight":1,"text":"\"The cashier was wrong. I cried in the cereal aisle.\" {kid} took a photo of it on {partner}'s phone. You make it your lock screen.","effects":{"rel":14,"energy":4},"stamp":"NATURAL: RETRACTED"}]},{"label":"Check the bags for what they forgot","duration":5,"outcomes":[{"weight":2,"text":"Bread. The one thing. Instead: a $14 cheese \"for us,\" a bag of limes and a toy truck {kid} \"picked out,\" which means seized.","effects":{"rel":-6,"energy":-6,"mood":8}},{"weight":1,"text":"Nothing. Everything on the list, plus the wipes you forgot to add. You read the receipt twice, slowly, the way other people read poetry.","effects":{"rel":12,"energy":8},"stamp":"FULL MARKS"}]},{"label":"Slow clap. A full minute.","duration":2,"outcomes":[{"text":"You slow-clap for a full minute. {kid} joins in and won't stop. {partner} stands, bows, and accepts all of it, with no shame whatsoever.","effects":{"rel":10,"mood":8,"energy":-2}}]}]},{"id":"w_pt_slept_through","title":"\"Great Night, Huh?\"","text":"\"Great night, huh?\" {partner} says, stretching, rested and wrong. {kid} was up at 2:11, 3:40 and 4:55. You heard every one. They heard none. They're not lying. That's the worst part.","window":[370,500],"weight":2,"oncePerWeek":true,"when":{"min":{"day":1}},"choices":[{"label":"Read them the timestamps. Slowly.","duration":3,"outcomes":[{"weight":1,"text":"2:11. 3:40. 4:55. Their face moves through disbelief, then guilt, and lands, unforgivably, on \"Huh. I slept great.\"","effects":{"rel":-12,"energy":4},"count":{"blames":1},"set":["pt:sniped"]},{"weight":1,"text":"They go pale and swear tonight is theirs. They set three alarms. They'll sleep through all three, but they set them, and you watched them do it.","effects":{"rel":-2,"energy":8},"ledger":{"night":"partner"},"count":{"blames":1}}]},{"label":"\"Yep. Great night.\" Let them have it.","duration":2,"outcomes":[{"weight":1,"text":"You let them have it. They're so rested they do breakfast, drop-off and the dishes, humming. Their good night becomes your good morning.","effects":{"energy":10,"rel":4}},{"weight":1,"text":"You let them have it. Then you seethe through breakfast at 2x speed. By 7:40 you've had the whole argument alone, and lost.","effects":{"energy":-8,"rel":-6}}]},{"label":"Propose odds and evens. You get odds.","duration":10,"minEnergy":20,"tags":["tagteam"],"outcomes":[{"text":"Talks open over cold toast. They want weekends separate. You want 4:55 to count as two. A treaty is signed on a napkin and stuck to the fridge.","effects":{"rel":10,"energy":-6},"ledger":{"night":"partner"},"stamp":"NAPKIN ACCORDS"}]}]},{"id":"w_pt_bag","title":"Packed by {partner}","text":"{partner} packed the daycare bag this morning. Contents: one diaper, a whole uncut cucumber, a single sock, zero wipes and {partner}'s work badge.","window":[400,520],"weight":2,"oncePerWeek":true,"when":{"notFlags":["d:home"]},"choices":[{"label":"Repack it. Silently. Perfectly.","duration":10,"minEnergy":20,"tags":["martyr"],"outcomes":[{"weight":2,"text":"Diapers, wipes, a spare outfit, a snack that doesn't need a knife. You hand {partner} their badge without comment, which is a comment.","effects":{"energy":-8,"rel":-4,"mood":6}},{"weight":1,"text":"In the side pocket: the bag you packed last Tuesday. Two left shoes and a yogurt that is now mostly cheese. You both have a style.","effects":{"energy":-8,"rel":8,"mood":6}}]},{"label":"Send it as is. Let daycare see.","duration":1,"outcomes":[{"text":"Off it goes, cucumber and all. Daycare will see. Daycare sees everything. You feel a deep calm that will last until around lunch.","effects":{"energy":10},"schedule":[{"event":"w_pt_bag_report","in":300}]}]},{"label":"Text {partner}: \"cucumber??\"","duration":2,"outcomes":[{"weight":1,"text":"You can't argue with that. You could, but you'd lose. You add wipes and let the cucumber ride.","effects":{"energy":2,"rel":4},"chat":[{"from":"{partner}","text":"they like cucumber"}]},{"weight":1,"text":"They've been standing outside the office door for twelve minutes. Security is involved. You drive the badge over. They drive the cucumber home.","effects":{"energy":-8,"rel":10},"chat":[{"from":"{partner}","text":"WAIT is my badge in there"}],"stamp":"BADGE RECOVERED"}]}]},{"id":"w_pt_bag_report","title":"A Gentle Note","text":"A notification from the daycare app. Ms. Patty has a gentle note, and gentle notes are the worst kind.","forced":true,"oncePerWeek":true,"chat":{"with":"Ms. Patty 🐛 Caterpillar Room","messages":[{"from":"Ms. Patty","text":"{kid} had a great morning! 🌟"},{"from":"Ms. Patty","text":"We used our spare diapers and wipes 🙂 {kid} enjoyed the cucumber (whole) 🥒"},{"from":"Ms. Patty","text":"Also we found a work badge? 🙂"}]},"choices":[{"label":"\"{partner} packed it 🙂\"","duration":1,"outcomes":[{"weight":1,"text":"Ms. Patty replies \"Ha! 🙂\" and has told the other teachers by lunch. In the staff room, {partner} is now known as Cucumber.","effects":{"rel":-10,"energy":4},"count":{"blames":1},"set":["pt:sniped"]},{"weight":1,"text":"There was a pumpkin in October. Nobody told you about the pumpkin.","effects":{"rel":-4},"chat":[{"from":"Ms. Patty","text":"Ha! 🙂 like the pumpkin in October"}]}]},{"label":"\"Thank you!! Restocking tomorrow!\"","duration":2,"outcomes":[{"text":"Tomorrow you send 40 diapers, two packs of wipes and an apology granola bar. The badge goes home in a sandwich bag, labeled BADGE.","effects":{"energy":-8}}]}]},{"id":"w_pt_your_side","title":"Your Side of the Family","text":"{kid} has thrown a shoe at the wall because the wall was there. {partner} watches it land and says, quietly, \"That's your side.\" Your side has a cousin who bit a mall Santa in 1994.","window":[930,1160],"weight":2,"oncePerWeek":true,"choices":[{"label":"\"Your side has Uncle Ray.\"","duration":2,"outcomes":[{"weight":1,"text":"Neither of you says what Uncle Ray did at the wedding. Nobody has to. {kid} throws the other shoe. Both sides, represented.","effects":{"rel":-10,"energy":6},"count":{"blames":1},"set":["pt:sniped"]},{"weight":1,"text":"\"...The fountain,\" they whisper. You both lose it. You laugh until {kid} stops throwing things to stare at you, which is the first time that's ever worked.","effects":{"rel":12,"mood":6,"energy":4}}]},{"label":"Say nothing. Wait for the sigh.","duration":3,"outcomes":[{"text":"{kid} puts both hands on their hips and lets out a long, wounded sigh. It's {partner}'s sigh, note for note, eye roll included. {partner} hears it. \"Okay,\" they say. \"Okay.\"","effects":{"rel":6,"energy":4,"mood":-4},"stamp":"DNA RESULTS ARE IN"}]},{"label":"Hand back the shoe: \"Shoes are for feet.\"","duration":8,"minEnergy":20,"tags":["boundary"],"outcomes":[{"weight":2,"text":"{kid} considers this, then puts the shoe on the wrong foot, defiantly. It counts. {partner} gives you the nod of someone watching a professional.","effects":{"mood":10,"rel":6,"energy":-8}},{"weight":1,"text":"\"Shoes are for WALLS,\" {kid} corrects you, and demonstrates. Your side. Definitely your side.","effects":{"mood":-8,"energy":-8},"fx":"shake"}]}]},{"id":"w_pt_repair","title":"The Sticky Note","text":"A sticky note on the coffee maker, in {partner}'s handwriting: \"sorry for being a jerk. i was tired and you were right. (about most of it)\"","window":[370,560],"weight":3,"oncePerWeek":true,"when":{"flags":["pt:sniped"],"min":{"day":1}},"choices":[{"label":"Write one back.","duration":5,"minEnergy":20,"outcomes":[{"weight":2,"text":"You write \"me too\" and stick it on their phone. They find it in a meeting. Their face does something that makes a coworker ask if they're okay. They are.","effects":{"rel":16,"energy":-6}},{"weight":1,"text":"You write \"me too\" and leave it on their keys. That evening there's a third note on the coffee maker: \"ok but the dishwasher thing stands.\"","effects":{"rel":10,"energy":-6}}]},{"label":"Fold it into your wallet. Evidence.","duration":1,"outcomes":[{"text":"It goes behind your license, next to the other one, from 2019, which just says \"sorry about the tent.\"","effects":{"rel":8,"energy":6}}]},{"label":"Cross out \"most of\" and stick it back","duration":2,"outcomes":[{"weight":1,"text":"An hour later the note has a reply: \"nice try.\" Under that, a heart. Under that, \"(most of).\"","effects":{"rel":6,"energy":4}},{"weight":1,"text":"They find the edit and laugh out loud at a red light.","effects":{"rel":12,"energy":2},"chat":[{"from":"{partner}","text":"FINE. all of it."}]}]}]},{"id":"w_handoff_fumes","title":"The Handoff: Running on Fumes","text":"{partner} walks in and finds you face-down on the kitchen floor while {kid} drives a dump truck up and down your spine. \"Hi,\" you tell the floor.","window":[1035,1100],"priority":45,"oncePerWeek":true,"when":{"max":{"day":3,"energy":25},"notFlags":["d:handoff"]},"choices":[{"label":"Tag out. Now. No eye contact.","duration":10,"tags":["tagteam"],"outcomes":[{"weight":2,"text":"They take {kid}. You take the stairs one at a time and lie face-down on the bed. Ten minutes. You dream about a different floor.","effects":{"energy":16,"rel":-4},"set":["d:handoff"],"ledger":{"evening":"partner"}},{"weight":1,"text":"{kid} follows you upstairs, climbs onto your back and says \"TRUCK.\" You've been promoted from floor to road. It's still lying down.","effects":{"energy":8,"mood":10,"rel":-2},"set":["d:handoff"],"ledger":{"evening":"partner"}}]},{"label":"\"I'm fine.\" Stand up. Start dinner.","duration":10,"minEnergy":5,"tags":["martyr"],"outcomes":[{"weight":1,"text":"You are not fine. You make pasta anyway. They watch you salt the water three times and say nothing, which is its own kindness.","effects":{"energy":-6,"rel":6},"set":["d:handoff"],"ledger":{"dinner":"you"}},{"weight":1,"text":"You salt the water a third time. They take the spoon out of your hand. \"Sit.\" You sit back down on the floor, which isn't what they meant.","effects":{"energy":6,"rel":10},"set":["d:handoff"],"ledger":{"dinner":"partner"}}]},{"label":"Say it into the floor: \"I'm running on fumes.\"","duration":10,"outcomes":[{"text":"They lie down on the floor next to you. {kid} drives the truck over both of you. Nobody gets up for a while.","effects":{"energy":8,"rel":10,"debt":4},"set":["d:handoff"]}]}]},{"id":"w_handoff_scorekeeper","title":"The Handoff: \"I'm Wrecked.\"","text":"{partner} walks in, drops their bag and says, \"I'm wrecked.\" By your count you've done four more things than them this week. You've counted. The count is a note on your phone. It has a title.","window":[1035,1100],"priority":45,"oncePerWeek":true,"when":{"max":{"day":3},"min":{"ledger":4},"notFlags":["d:handoff"]},"choices":[{"label":"\"Sit. I've got dinner.\" Let the count go.","duration":10,"minEnergy":20,"tags":["martyr"],"outcomes":[{"weight":2,"text":"You let it go, for tonight. They sit. They say \"thank you\" twice: once to you, and once, quietly, to the ceiling.","effects":{"energy":-8,"rel":12},"set":["d:handoff"],"ledger":{"dinner":"you"}},{"weight":1,"text":"They sit for exactly 90 seconds, then get up and do the dishes without being asked. They know the count too. Everyone knows the count.","effects":{"energy":-4,"rel":14},"set":["d:handoff"],"ledger":{"dinner":"you","dishes":"partner"}}]},{"label":"Read them the count. Out loud. With dates.","duration":5,"outcomes":[{"text":"Mornings, dishes, the form, the snack bag, the car seat thing. They listen. They say \"okay.\" The okay has a temperature, and it's cold.","effects":{"energy":6,"rel":-14},"set":["d:handoff","pt:sniped"],"count":{"blames":1},"stamp":"READ INTO THE RECORD"}]},{"label":"Tag out. They owe you.","duration":10,"tags":["tagteam"],"outcomes":[{"when":{"min":{"rel":50}},"text":"They know the count too. They take {kid} without a word. You take a shower long enough to legally count as a bath.","effects":{"energy":14,"rel":-2},"set":["d:handoff"],"ledger":{"evening":"partner"}},{"when":{"max":{"rel":49}},"text":"They take {kid} with a sigh you'll hear in your dreams. You take the ten minutes anyway. They were owed. You think.","effects":{"energy":12,"rel":-8},"set":["d:handoff","pt:sniped"],"ledger":{"evening":"partner"},"count":{"blames":1}}]}]},{"id":"w_handoff_deficit","title":"The Handoff: The Ledger Leans","text":"{partner} walks in carrying groceries, the mail and {kid}'s missing shoe. By any honest count they've done three more things than you this week. They haven't said it. They won't. That's worse.","window":[1035,1100],"priority":45,"oncePerWeek":true,"when":{"max":{"day":3,"ledger":-3},"notFlags":["d:handoff"]},"choices":[{"label":"\"I owe you. Sit down.\" Take dinner.","duration":10,"minEnergy":20,"tags":["martyr"],"outcomes":[{"text":"You cook. They sit. Halfway through the onions you hear them exhale, really exhale, for the first time since Monday.","effects":{"energy":-10,"rel":14},"set":["d:handoff"],"ledger":{"dinner":"you"}}]},{"label":"\"So I've been, um. Busy?\"","duration":3,"outcomes":[{"weight":1,"text":"\"Mm-hm.\" They set the shoe on the counter like an exhibit. {kid} points at you and says, \"BUSY,\" accurately.","effects":{"energy":8,"rel":-8},"set":["d:handoff"]},{"weight":1,"text":"They laugh. \"You were busy. I've seen the kitchen.\" They hand you the mail. It's all bills. It's all yours now.","effects":{"energy":-2,"rel":6},"set":["d:handoff"],"ledger":{"errands":"you"}}]},{"label":"Tag out anyway. Bold.","duration":10,"tags":["tagteam"],"outcomes":[{"when":{"min":{"rel":50}},"text":"They take {kid}. They also take a long look at you. You spend all ten minutes feeling it.","effects":{"energy":10,"rel":-6},"set":["d:handoff"],"ledger":{"evening":"partner"}},{"when":{"max":{"rel":49}},"text":"\"Seriously?\" They take {kid}. You take ten minutes and the full weight of the ledger, which is heavier than {kid}.","effects":{"energy":8,"rel":-14},"set":["d:handoff","pt:sniped"],"ledger":{"evening":"partner"},"count":{"blames":1}}]}]},{"id":"pay_truck_lie","title":"The Ice Cream Truck Doctrine","text":"The ice cream truck's song drifts down the street. {kid} freezes, then turns to you with the face of someone whose ship has come in.","window":[780,1080],"weight":2,"oncePerWeek":true,"when":{"notFlags":["d:home"]},"choices":[{"label":"\"It only plays music when it's out of ice cream.\"","duration":1,"outcomes":[{"text":"{kid} takes this in, nods gravely and waves goodbye to the sad, empty truck. It's the cleanest win of your career. You have just written a check.","effects":{"mood":4,"energy":7},"schedule":[{"event":"pay_truck_due","in":60}]}]},{"label":"Buy the rocket pop. $4.50.","duration":10,"tags":["bribe"],"outcomes":[{"weight":2,"text":"It melts down {kid}'s arm, both sleeves and the stroller. Pure joy, then stickiness, in that order.","effects":{"mood":14,"energy":-4},"count":{"snacks":1}},{"text":"They want the one on the poster. The one on the poster was discontinued years ago. The truck leaves. The poster stays in their heart.","effects":{"mood":-10,"energy":-4}}]},{"label":"\"Ice cream is a weekend food.\"","duration":8,"tags":["boundary"],"snapRisk":true,"outcomes":[{"text":"\"Weekend food,\" they repeat, filing it with the other laws. They will enforce it on you Saturday at 7 AM.","effects":{"mood":-6,"energy":4}},{"weight":2,"text":"The truck turns the corner. The song fades. The scream does not.","effects":{"mood":-14}}]}]},{"id":"pay_truck_due","title":"The Truck Comes Back","text":"The truck is back, song blaring. {kid} waves sadly: \"Bye, empty truck.\" Then the neighbor's kid runs out, comes back with an ice cream sandwich and takes a slow bite, staring straight at your window.","forced":true,"choices":[{"label":"\"That was the LAST one!\"","duration":2,"outcomes":[{"text":"{kid} accepts this. Your lie now has a sequel. By the weekend it will need a prequel and a map.","effects":{"mood":-6,"energy":4},"stamp":"SEQUEL GREENLIT"},{"text":"\"Then why is the music ON?\" They've found the flaw in the doctrine. The investigation will be ongoing. The scream is immediate.","effects":{"mood":-20,"energy":-6},"count":{"tantrums":1},"stamp":"DOCTRINE COLLAPSES","fx":"shake"}]},{"label":"Confess. Run outside with $5.","duration":10,"outcomes":[{"text":"You catch the truck at the corner. {kid} gets the ice cream and full knowledge of what you are. They eat it while watching you, the way the neighbor's kid did.","effects":{"mood":12,"energy":-8},"count":{"snacks":1},"stamp":"FULL DISCLOSURE"}]},{"label":"Close the blinds. \"Who wants a BATH?\"","duration":5,"outcomes":[{"text":"Nobody wants a bath. Behind the blinds, the song plays on for eleven more minutes.","effects":{"mood":-12,"energy":-4}},{"text":"\"BATH!\" It works. They sprint for the tub. You have discovered the only thing that beats ice cream, and it's the thing they fought last night.","effects":{"mood":6,"energy":-6,"sleepy":6},"ledger":{"bath":"you"}}]}]},{"id":"w_lie_down","title":"Just Lie Down for a Minute","text":"The lunch dishes are a tower with a pot on top, like a hat. {partner}, home early, is chiseling rice off the high chair tray. The couch is right there, humming a song only you can hear.","window":[870,1040],"oncePerWeek":true,"choices":[{"label":"Lie down. Just for one minute.","duration":20,"outcomes":[{"weight":2,"text":"You lie down for a minute. The minute lasts 20. It's the best minute of your month.","effects":{"energy":14},"schedule":[{"event":"w_partner_dishes","in":15}]},{"text":"You lie down. {kid} climbs on top of you, nose to nose, and whispers \"are you sleeping\" every nine seconds. Still the best minute of your month.","effects":{"energy":10,"mood":8},"schedule":[{"event":"w_partner_dishes","in":15}]}]},{"label":"Do every dish. Suffer where they can see.","duration":20,"minEnergy":20,"tags":["martyr"],"outcomes":[{"weight":2,"text":"You wash. You stack. You narrate your own sacrifice in your head, in the voice of a nature documentary.","effects":{"energy":-8,"rel":8},"ledger":{"dishes":"you"}},{"text":"You do every dish. At 9 PM {partner} says, \"Oh, you did the dishes?\" in the tone people use when you take up the harp.","effects":{"energy":-8,"rel":-4},"ledger":{"dishes":"you"}}]},{"label":"Do them together. Hip to hip.","duration":15,"minEnergy":20,"tags":["tagteam"],"outcomes":[{"text":"You wash, they dry. Neither of you mentions the toddler. It feels like a small, damp date.","effects":{"energy":-5,"rel":10}}]}]},{"id":"w_partner_dishes","title":"Very Loud Dishes","text":"You open your eyes to the sound of {partner} doing the dishes. Loudly. Each plate goes into the rack like a closing argument.","forced":true,"choices":[{"label":"Get up, grab a towel, say thank you","duration":15,"minEnergy":20,"outcomes":[{"text":"\"Thanks for doing these.\" \"Mm.\" You dry in silence. The silence is itemized.","effects":{"energy":-8,"rel":-4},"ledger":{"dishes":"partner"}},{"text":"\"Thanks for doing these.\" They hand you a plate and, after a second, bump your hip with theirs. Forgiven. Mostly.","effects":{"energy":-8,"rel":8},"ledger":{"dishes":"partner"}}]},{"label":"\"I was up at five with them.\"","duration":3,"outcomes":[{"text":"\"I was up at five too. Then I went to work.\" A pan goes into the rack with real feeling. Nobody wins this one. Not even the pan.","effects":{"energy":2,"rel":-14},"count":{"blames":1},"ledger":{"dishes":"partner"}}]},{"label":"Stay horizontal. Commit to the bit.","duration":10,"outcomes":[{"weight":2,"text":"You keep your eyes shut. They know you're awake. You know they know. The dishes get done, and filed, and remembered.","effects":{"energy":6,"rel":-18},"ledger":{"dishes":"partner"}},{"text":"You fake a snore. Too big. A cartoon snore. {partner} laughs so hard they have to sit on the kitchen floor. You've never been forgiven so fast for something so bad.","effects":{"energy":6,"rel":4},"ledger":{"dishes":"partner"},"stamp":"SNORE ACCEPTED"}]}]},{"id":"w_playground_later","title":"\"Playground?\"","text":"{kid} is holding out your shoes and pointing at the door. \"Playground?\" It's drizzling. You're wearing one sock. The sock isn't yours.","window":[540,960],"oncePerWeek":true,"choices":[{"label":"\"Later. I promise.\"","duration":1,"outcomes":[{"text":"\"Later\" works like a spell. They put the shoes down. You sit. You have just taken out a loan at a rate a payday lender would call aggressive.","effects":{"mood":6,"energy":7},"schedule":[{"event":"w_promise_due","in":120}]}]},{"label":"Go now. Find a second sock.","duration":45,"minEnergy":30,"tags":["present"],"outcomes":[{"weight":2,"text":"Slide, wet bench, slide, for 45 minutes. Their cheeks go pink. You hold your coffee by the swings, as a hand warmer, which is all it is now.","effects":{"mood":14,"energy":-12,"sleepy":10}},{"text":"The playground is closed for \"resurfacing.\" {kid} stares through the fence at the slide. You have invented a new kind of sad.","effects":{"mood":-8,"energy":-10,"sleepy":4}}]},{"label":"\"Not today.\" Hold the line in one sock.","duration":5,"tags":["boundary"],"snapRisk":true,"outcomes":[{"text":"They drop the shoes and wander off to bother a block tower. You suspect a trap. There is no trap. You fold an entire load of laundry, stunned.","effects":{"mood":-4,"energy":4}},{"weight":2,"text":"They lie face-down on the doormat in protest. A sit-in. They've unionized, and the union is one person, and it is lying on your shoes.","effects":{"mood":-12}}]}]},{"id":"w_promise_due","title":"\"Later\" Is Now","text":"Two hours ago you said \"later.\" {kid} did not forget. {kid} never forgets anything you'd like them to. They're at the door in one shoe and your hat. \"IT'S LATER.\"","forced":true,"choices":[{"label":"Keep the promise. Go.","duration":40,"minEnergy":25,"tags":["present"],"outcomes":[{"text":"You go: tired, cold and later. They don't care. They run at the slide like it owes them money. Worth it, barely, then completely.","effects":{"energy":-14,"mood":12,"sleepy":8},"fx":"confetti"}]},{"label":"Break it. Brace.","duration":15,"tags":["boundary"],"snapRisk":true,"outcomes":[{"weight":2,"text":"\"You SAID.\" They're right. You did. This meltdown has the moral high ground, and it knows it.","effects":{"mood":-22,"energy":-6},"count":{"tantrums":1},"stamp":"MORAL HIGH GROUND","fx":"shake"},{"text":"\"You SAID.\" You did. You kneel, explain the rain, promise tomorrow and mean it. They think it over, then grant you a continuance, with conditions.","effects":{"mood":-6,"energy":-8},"stamp":"CONTINUANCE GRANTED"}]},{"label":"\"Later later.\"","duration":1,"outcomes":[{"text":"\"Later later\" buys you 90 more minutes. They empty the shoe rack in protest. Your credit score with this toddler is now in the low hundreds.","effects":{"mood":-8,"energy":3},"schedule":[{"event":"w_promise_due_2","in":90}]},{"text":"\"Later later is NOW,\" they rule, citing nothing, and hand you the other shoe. You've been out-argued by someone who can't open a yogurt.","effects":{"energy":-12,"mood":8,"sleepy":6},"stamp":"OUT-LAWYERED"}]}]},{"id":"w_promise_due_2","title":"\"Later Later\" Is Now","text":"Ninety minutes ago you said \"later later.\" {kid} has waited by the door ever since, in both shoes, holding your keys. They've brought the stuffed rabbit as a witness.","forced":true,"choices":[{"label":"Go. Go now. Go in the dark.","duration":40,"minEnergy":25,"tags":["present"],"outcomes":[{"weight":2,"text":"The playground at dusk: one other parent, staring at nothing by the swings. You nod. They nod. {kid} goes down the slide 31 times. A promise kept late still counts.","effects":{"energy":-16,"mood":14,"sleepy":10}},{"text":"The gate is locked for the night. {kid} slides down the porch steps instead, 14 times, narrating. It counts. They've ruled that it counts.","effects":{"energy":-10,"mood":8,"sleepy":6}}]},{"label":"\"Later later later.\"","duration":1,"outcomes":[{"text":"\"There's no later later later,\" {kid} informs you. They've checked. The rabbit nods. The meltdown opens with a citation.","effects":{"mood":-22,"energy":-6},"count":{"tantrums":1},"stamp":"NO SUCH TIME","fx":"shake"}]},{"label":"\"Tomorrow, first thing. I swear on the rabbit.\"","duration":10,"tags":["boundary"],"snapRisk":true,"outcomes":[{"text":"The rabbit is consulted. The rabbit accepts. {kid} carries your oath and the rabbit to dinner, in that order.","effects":{"mood":-4,"rel":4,"energy":-4}},{"weight":2,"text":"The rabbit has heard your promises before. The rabbit is not convinced. Neither is {kid}.","effects":{"mood":-16,"energy":-6},"count":{"tantrums":1}}]}]},{"id":"w_phone_line","title":"Fourteen People Ahead of You","text":"The post office: fourteen people ahead of you and one window open. {kid} has started introducing themselves to other people's packages. \"Hi, box.\"","window":[540,1000],"oncePerWeek":true,"when":{"notFlags":["d:home"]},"choices":[{"label":"Hand over your phone","duration":15,"tags":["screen"],"outcomes":[{"text":"Silence, instantly. The woman behind you mouths \"same.\" The line moves. Nobody has to know what this costs yet.","effects":{"mood":8,"energy":7},"set":["d:screen"],"count":{"screen":15},"schedule":[{"event":"w_phone_off","in":15}]}]},{"label":"I spy, for fourteen people","duration":15,"minEnergy":25,"tags":["present"],"outcomes":[{"weight":2,"text":"A stamp, a sad plant, a man holding nine identical boxes. By the window, {kid} is narrating for the whole line. Two people clap. The clerk does not.","effects":{"mood":6,"energy":-8}},{"text":"\"I spy something... YOU.\" They spy you eleven times in a row. It's still somehow the best option you had.","effects":{"mood":4,"energy":-8}}]},{"label":"Abandon the line. Mail it never.","duration":3,"outcomes":[{"weight":2,"text":"You leave. The package rides home in the stroller basket, where it will live for another week, judging you.","effects":{"energy":-4}},{"text":"You leave. Right outside is a mailbox. The package already has postage. It always had postage.","effects":{"energy":6,"mood":4},"stamp":"WAS ALWAYS AN OPTION"}]}]},{"id":"w_phone_off","title":"You Need Your Phone Back","text":"In 15 minutes they've changed your phone's language to Finnish, set a 4:45 AM alarm called BUS and texted your boss a single \"p.\" They will not be returning it.","forced":true,"choices":[{"label":"Take it back. Brace for impact.","duration":15,"tags":["boundary"],"snapRisk":true,"outcomes":[{"weight":2,"text":"You pry it loose. The scream has a bridge and a key change. Everyone in the post office is a witness now, and two of them are filming.","effects":{"mood":-18,"energy":-6},"count":{"paybacks":1,"tantrums":1},"fx":"shake"},{"text":"You hold out your hand. They hand it over. Just like that. A stranger looks at you like you're a wizard. You will never understand them.","effects":{"mood":-2,"energy":6},"count":{"paybacks":1},"stamp":"UNEXPLAINED","fx":"confetti"}]},{"label":"Five more minutes","duration":5,"tags":["screen"],"outcomes":[{"text":"Five more minutes. You both know what five more minutes is. It's a down payment on this exact fight.","effects":{"mood":6,"energy":4},"set":["d:screen"],"count":{"screen":5,"paybacks":1},"schedule":[{"event":"w_phone_off_2","in":5}]}]},{"label":"Trade it for your car keys","duration":5,"tags":["negotiate"],"outcomes":[{"text":"The keys are accepted after a review period. You get the phone back, sticky forever. The keys vanish. You find them 40 minutes later in a boot.","effects":{"mood":-4,"energy":-10},"count":{"paybacks":1}},{"text":"They take the keys and press the red button. Outside, your car starts screaming. {kid} is thrilled. The post office is not. You've traded one alarm for a louder one.","effects":{"mood":6,"energy":-4},"count":{"paybacks":1},"fx":"shake"}]}]},{"id":"w_phone_off_2","title":"Five More Minutes Are Up","text":"The five minutes are up. The phone is now in Finnish and Portuguese. There are three new voicemails from Grandma, all of them just breathing. {kid} holds the phone the way you'd hold a newborn.","forced":true,"choices":[{"label":"Take it back. For real this time.","duration":15,"tags":["boundary"],"snapRisk":true,"outcomes":[{"weight":2,"text":"\"For real this time\" is louder than last time. The scream has a second verse now, about fairness. You did earn this one.","effects":{"mood":-22,"energy":-8,"debt":-4},"count":{"paybacks":1,"tantrums":1},"fx":"shake"},{"text":"They hand it over with a heavy sigh and say, \"Thank you for the time.\" You are both changed.","effects":{"mood":-4,"energy":6,"debt":-4},"count":{"paybacks":1}}]},{"label":"Offer the TV remote. It's basically a phone.","duration":3,"tags":["negotiate"],"outcomes":[{"text":"They hold the remote to their ear and have a long, serious call with it. Nobody hangs up. You've won something.","effects":{"mood":6,"energy":6},"count":{"paybacks":1}},{"text":"\"That's a REMOTE,\" they say, with total contempt. Negotiations collapse. The scream is in Finnish.","effects":{"mood":-18,"energy":-4},"count":{"paybacks":1}}]},{"label":"Let them keep it. You live here now.","duration":2,"tags":["screen"],"outcomes":[{"text":"You surrender and sit on the floor. Twenty minutes later the phone dies at 1%, in their hands. They take it up with the battery. Perfect crime.","effects":{"energy":8,"mood":-4},"set":["d:screen"],"count":{"screen":20,"paybacks":1},"stamp":"BLAME THE BATTERY"}]}]},{"id":"w_couch_rest","title":"Just Resting My Eyes","text":"3 PM, the dead zone. {kid} is next to you on the couch, \"reading\" a board book upside down, out loud. You could close your eyes. Just to listen better.","window":[870,960],"oncePerWeek":true,"choices":[{"label":"Close your eyes. Just to listen.","duration":15,"outcomes":[{"text":"You're not asleep. You're listening with your eyes closed. You're listening so hard you drool a little.","effects":{"energy":12},"schedule":[{"event":"w_couch_hangover","in":45}]}]},{"label":"Get up. Fresh air. Pretend it works.","duration":25,"minEnergy":25,"tags":["present"],"outcomes":[{"weight":2,"text":"Cold air, one stick, one extremely important leaf. You come back more awake than you left. They come back sleepier. Everyone wins.","effects":{"energy":-6,"mood":8,"sleepy":8}},{"text":"The walk takes 25 minutes and covers 40 feet. They found an ant. The ant was the walk.","effects":{"energy":-8,"mood":12,"sleepy":4}}]},{"label":"A third coffee. Sign the waiver.","duration":3,"outcomes":[{"weight":2,"text":"The third coffee of the day tastes like a decision you'll revisit at 1 AM.","effects":{"energy":9},"set":["d:lateCoffee"],"count":{"coffee":1}},{"text":"The third coffee works. You feel unstoppable. You feel so unstoppable you reply \"happy to help!!\" to the bake sale thread. Brynn hearts it before you've put the mug down.","effects":{"energy":5},"set":["d:lateCoffee"],"count":{"coffee":1}}]}]},{"id":"w_couch_hangover","title":"The Couch Hangover","text":"The little rest is billing you. Your head is full of wet sand, a couch seam is printed across your cheek, and your body is now certain it's bedtime. It isn't even dinner.","forced":true,"choices":[{"label":"Cold water on the face. Be an athlete about it.","duration":10,"minEnergy":20,"outcomes":[{"weight":2,"text":"Cold water, a head shake and a pep talk in the mirror, which you lose. You get through the afternoon at about 60% of a person.","effects":{"energy":-12}},{"text":"Cold water, a head shake, a long look in the mirror. Something clicks. Second wind. You fold two loads of laundry in record time and decide not to question it.","effects":{"energy":6}}]},{"label":"Coffee. Fight fire with fire.","duration":3,"outcomes":[{"text":"Coffee, this late. The fog lifts. You can already hear it at 1 AM, knocking politely on the inside of your skull.","effects":{"energy":4},"set":["d:lateCoffee"],"count":{"coffee":1}}]},{"label":"Lie back down. Negotiate with the couch.","duration":15,"outcomes":[{"weight":2,"text":"You lie back down. {kid} narrates the living room's destruction like a sports announcer. The cushions are gone. You hear the word \"marker.\"","effects":{"energy":6,"rel":-6}},{"text":"You wake at 5:15 with {kid} asleep on your chest, warm and heavy. It's lovely. It's also a 5 PM nap, which means tonight there's a late show, live from the crib.","effects":{"energy":10,"sleepy":-24},"stamp":"LATE SHOW BOOKED","fx":"flash"}]}]},{"id":"pay_sticker_spa","title":"The Sticker Spa","text":"{kid} has a sheet of 48 stickers and would like to \"make you pretty.\" It's 20 quiet minutes. You'd only have to lie very still, and you're very good at lying still.","window":[600,960],"oncePerWeek":true,"choices":[{"label":"Lie still. Become a canvas.","duration":20,"outcomes":[{"weight":2,"text":"Twenty glorious minutes of tiny hands patting your face. You may have dozed. You definitely relaxed. You did not check a mirror.","effects":{"energy":12,"mood":10},"schedule":[{"event":"pay_sticker_face","in":60}]},{"text":"Every sticker comes with a review: \"Good.\" \"Very good.\" \"Not this one.\" It's the most attention anyone has paid to your face in a year. You did not check a mirror.","effects":{"energy":10,"mood":12},"schedule":[{"event":"pay_sticker_face","in":60}]}]},{"label":"\"Stickers go on paper.\"","duration":5,"tags":["boundary"],"snapRisk":true,"outcomes":[{"text":"They put all 48 on one sheet of paper in a single, furious layer, glaring at you. It's a protest piece. It's honestly strong.","effects":{"mood":-8,"energy":4}},{"weight":2,"text":"They put all 48 on the TV screen instead. It's paper-adjacent. You don't have the energy to argue the definition.","effects":{"mood":4,"rel":-6}}]},{"label":"Sticker them back. Spa for two.","duration":15,"minEnergy":25,"tags":["present"],"outcomes":[{"text":"Matching star cheeks and a dinosaur on each nose. It's the most fun either of you has had all day. You peel yours off before the mail comes.","effects":{"mood":14,"energy":-6}}]}]},{"id":"pay_sticker_face","title":"You Have Been Decorated","text":"You catch your reflection in the microwave door: nine stickers, a cartoon pickle on one eyelid and a gold POTTY STAR in the middle of your forehead. The spa was an hour ago.","forced":true,"choices":[{"label":"Replay the last hour","duration":2,"outcomes":[{"text":"The mail carrier. The neighbor. Eleven coworkers on video, for 40 minutes. Nobody said anything. That's either kindness or a group decision.","effects":{"energy":-4},"stamp":"GROUP DECISION"}]},{"label":"Leave them on. Commit.","duration":1,"outcomes":[{"text":"You wear them to pickup. Two parents compliment your \"look.\" One asks where you got the pickle. You have never been more respected.","effects":{"mood":8,"energy":4}},{"weight":2,"text":"You wear them to pickup. Brynn looks at the POTTY STAR, then at you, then types something into a phone.","effects":{"mood":6,"energy":-10}}]}]},{"id":"task_diapers","title":"Diaper Math","text":"Four diapers left. {kid} goes through six a day. You do the math, and the math says Wednesday at noon.","window":[420,1140],"task":"diapers","weight":4,"oncePerWeek":true,"choices":[{"label":"Order now. Survive the size chart.","duration":8,"minEnergy":20,"outcomes":[{"weight":2,"text":"Size 4 is \"22–37 lbs.\" Size 5 is \"27+ lbs.\" {kid} is 31 pounds and therefore both. You buy the box marked \"Overnight\" because you'd like some of that too.","effects":{"energy":-8},"completeTask":"diapers"},{"weight":1,"text":"Done in four taps. Three days later you learn you've subscribed to a box every nine days, forever, with no visible way out. The diapers have you now.","effects":{"energy":-4},"completeTask":"diapers","stamp":"SUBSCRIBED FOREVER"}]},{"label":"Text {partner}: \"diapers. size 4. NOT pull-ons\"","duration":2,"tags":["tagteam"],"outcomes":[{"when":{"min":{"rel":55}},"text":"\"on it 👍\" You brace for pull-ons. At 6:12 PM a photo arrives: right size, right box, receipt. Who is this person?","effects":{"rel":6},"completeTask":"diapers","ledger":{"errands":"partner"}},{"when":{"max":{"rel":54}},"text":"Read 2:14 PM. No reply. At dinner {partner} asks, \"Did you get diapers?\" The diapers remain theoretical.","effects":{"rel":-8}}]},{"label":"Later. Four is a number.","duration":1,"outcomes":[{"text":"Four is plenty. Four is a number. Nothing bad has ever happened with four.","effects":{"energy":4},"set":["tasks_later"]}]}]},{"id":"task_rsvp","title":"Fourteen Questions","text":"Brynn's RSVP form for Juniper's party has 14 questions. Number 6 is allergies. Number 9 is your child's \"party energy, 1 to 5.\" Number 14 says, \"Tell us about your family!\"","window":[420,1140],"task":"rsvp","weight":4,"oncePerWeek":true,"choices":[{"label":"Answer all 14. Honestly.","duration":15,"minEnergy":20,"outcomes":[{"weight":2,"text":"Allergies: none. Party energy: 5, unfortunately. Number 14 takes eleven minutes and a second draft. Brynn replies at once: \"LOVE this 💛\"","effects":{"energy":-8},"completeTask":"rsvp"},{"weight":1,"text":"You hit submit. A second form arrives: \"Volunteer Sign-Up (optional!!).\" It is not optional. You're on cupcakes: no sugar, no honey, no fruit, \"no workarounds 🙂.\" You're on two dozen small breads.","effects":{"energy":-12},"completeTask":"rsvp","stamp":"VOLUNTEERED"}]},{"label":"Answer every question \"no\"","duration":2,"outcomes":[{"weight":1,"text":"It goes through. Brynn texts: \"Just confirming!! 'No' for number of kids attending?\" You fix it. Your row has a comment on it now.","effects":{"energy":-6},"completeTask":"rsvp"},{"weight":1,"text":"It goes through clean. Nobody reads number 14 anyway, except Brynn, who reads every one of them twice.","effects":{"energy":-2},"completeTask":"rsvp"}]},{"label":"Forward it to {partner}","duration":2,"tags":["tagteam"],"outcomes":[{"when":{"min":{"rel":55}},"text":"Four minutes. Under \"Tell us about your family!\" {partner} has written, \"We're very tired.\" Brynn replies: \"SAME 😭💛\"","effects":{"rel":4},"completeTask":"rsvp","ledger":{"errands":"partner"}},{"when":{"max":{"rel":54}},"text":"\"Who's Brynn?\" You explain Brynn. {partner} is quiet for a long time. \"I'm not doing that.\" Fair.","effects":{"rel":-6}}]},{"label":"Later. Leave it on Maybe.","duration":1,"outcomes":[{"text":"Maybe is a legal status. Maybe means you haven't checked with your toddler's nap. Maybe can last forever.","effects":{"energy":4},"set":["tasks_later"]}]}]},{"id":"task_form","title":"Three Pages","text":"The fire station field-trip form is due Wednesday at 9 AM. It's three pages. It wants a signature, two emergency contacts, and your child's \"comfort item and backup comfort item.\"","window":[420,1140],"task":"form","weight":5,"oncePerWeek":true,"choices":[{"label":"Fill in all three pages properly","duration":15,"minEnergy":20,"outcomes":[{"weight":2,"text":"Emergency contact #2 can't live with the child. You write down your neighbor Dale, whose last name you have never known. \"Dale (next door).\" It's a legal document now.","effects":{"energy":-8},"completeTask":"form","stamp":"DALE (NEXT DOOR)"},{"weight":1,"text":"Comfort item: Bun-Bun. Backup comfort item: you look around the room for a while and write \"also Bun-Bun.\" Signed. It's the most honest document you've ever filed.","effects":{"energy":-6},"completeTask":"form"}]},{"label":"Sign with the closest pen","duration":3,"outcomes":[{"weight":2,"text":"The closest pen is a purple crayon. The second closest is the TV remote. You sign a three-page legal document in purple crayon. Daycare doesn't even blink.","effects":{"energy":-4},"completeTask":"form"},{"weight":1,"text":"The closest pen is a pen. You can't believe it either. Signed, folded and in the backpack in ninety seconds. It will never happen again.","effects":{"energy":-2},"completeTask":"form"}]},{"label":"Leave it on {partner}'s keyboard","duration":2,"tags":["tagteam"],"outcomes":[{"when":{"min":{"rel":55}},"text":"{partner} reads all three pages and catches that you listed the vet as your pediatrician. You don't have a pet. Signed, fixed, in the backpack.","effects":{"rel":4},"completeTask":"form","ledger":{"errands":"partner"}},{"when":{"max":{"rel":54}},"text":"\"Can't it wait?\" It can't. It does anyway. The form goes back on the fridge, gaining power.","effects":{"rel":-6}}]},{"label":"Later. Forms keep.","duration":1,"outcomes":[{"text":"That's the whole point of a form. It goes back on the fridge, under a drawing of either you or a potato.","effects":{"energy":4},"set":["tasks_later"]}]}]},{"id":"task_pediatrician","title":"Press 9 for More Options","text":"The pediatrician's phone tree. Press 1 for appointments. Press 2 for prescriptions. Press 7 to hear these options again, slower, as if you're the problem. Nothing for \"rash.\"","window":[480,1020],"task":"pediatrician","weight":4,"oncePerWeek":true,"choices":[{"label":"Call. Survive the phone tree.","duration":25,"minEnergy":20,"outcomes":[{"weight":2,"text":"You are caller number 6. Then caller number 7. Someone has cut in line on a phone. At minute 22, Nurse Pat: \"Send a photo. Sounds like eczema. Fragrance-free cream twice a day.\" You could cry.","effects":{"energy":-10,"mood":4},"completeTask":"pediatrician"},{"weight":1,"text":"The second a human answers, {kid} yells \"I'M NAKED\" from the next room. Accurate. Nurse Pat makes a note, says \"eczema, cream twice a day,\" and never brings it up.","effects":{"energy":-8},"completeTask":"pediatrician","stamp":"NOTED IN CHART"}]},{"label":"Try the patient portal","duration":10,"outcomes":[{"weight":1,"text":"Password reset. A code, sent to an email you made in 2009. A second code. A photo upload. Two hours later: \"Looks like eczema. Cream twice daily.\" Served by a portal. Who knew.","effects":{"energy":-6},"completeTask":"pediatrician"},{"weight":1,"text":"The portal wants a new password with a symbol, a number and a capital letter, not one of your last twelve. You've used every password there is. The portal wins.","effects":{"energy":-6},"stamp":"PORTAL: SEALED"}]},{"label":"Ask {partner} to call on their break","duration":2,"tags":["tagteam"],"outcomes":[{"when":{"min":{"rel":55}},"text":"They call from a stairwell at work. \"Eczema. Cream twice a day. Nurse Pat says hi.\" You've never met Nurse Pat. You love Nurse Pat.","effects":{"rel":4},"completeTask":"pediatrician","ledger":{"errands":"partner"}},{"when":{"max":{"rel":54}},"text":"\"Can't, back-to-backs all day.\" The rash and the phone tree are still yours. So, somehow, is the pan-flute hold music, in your head.","effects":{"rel":-6}}]},{"label":"Later. It's probably fine.","duration":1,"outcomes":[{"text":"It's probably fine. You check it every eleven minutes for the rest of the day, just to make sure it's still fine.","effects":{"energy":4},"set":["tasks_later"]}]}]},{"id":"task_library","title":"Possession Is Nine-Tenths","text":"The library books are due Friday. {kid} has seen you looking at them and is now lying face down on the stack, saying \"MY books\" into the carpet.","window":[540,1050],"task":"library","weight":4,"oncePerWeek":true,"choices":[{"label":"Make it an outing. They get to work the slot.","duration":30,"minEnergy":25,"tags":["present"],"outcomes":[{"weight":2,"text":"The drop slot takes the books one at a time while {kid} says \"bye, book\" to each one. They check out four new ones. The cycle of ownership continues.","effects":{"energy":-10,"mood":12},"completeTask":"library"},{"weight":1,"text":"At the slot, {kid} won't let go of the last one. A librarian kneels and explains due dates, very seriously, one professional to another. They hand it over.","effects":{"energy":-10,"mood":6},"completeTask":"library"}]},{"label":"Renew them online","duration":5,"outcomes":[{"weight":1,"text":"Renewed. New due date: next Friday. You've bought a week, which is the most anyone can buy.","effects":{"energy":-2},"completeTask":"library"},{"weight":1,"text":"The site asks you to select every square with a bus. You fail. It asks for crosswalks. You fail. The library has decided you're a robot. It isn't wrong.","effects":{"energy":-4},"stamp":"ROBOT: CONFIRMED"}]},{"label":"Hide them in {partner}'s work bag","duration":2,"tags":["tagteam"],"outcomes":[{"when":{"min":{"rel":55}},"text":"At 12:40 PM: a photo of the drop slot, captioned \"you sneak.\" Returned. Respected.","effects":{"rel":4},"completeTask":"library","ledger":{"errands":"partner"}},{"when":{"max":{"rel":54}},"text":"{partner} finds them at the office and, as a courtesy, brings them home again. The books have now commuted.","effects":{"rel":-6}}]},{"label":"Later. Squatter's rights.","duration":1,"outcomes":[{"text":"{kid} wins the property dispute by lying on it. The books stay. You'll deal with it later. Later is getting crowded.","effects":{"energy":4},"set":["tasks_later"]}]}]},{"id":"no_diapers","title":"There Are No Diapers","text":"Your hand reaches into the diaper box and touches cardboard. The worst texture in the world. {kid} is wearing the last diaper, and the last diaper is on a clock.","forced":true,"priority":85,"choices":[{"label":"Drive to the store. With {kid}. In pajama pants.","duration":45,"outcomes":[{"weight":2,"text":"They have every size but yours. You buy the next one up. {kid} rides in the cart announcing \"DIAPERS\" to strangers, who agree: diapers.","effects":{"energy":-22,"mood":6},"ledger":{"errands":"you"}},{"weight":1,"text":"In, out and home in 31 minutes, a personal record, set in pajama pants. {kid} falls asleep in the car seat on the way back. You'll pay for that nap at bedtime.","effects":{"energy":-18,"sleepy":-14},"ledger":{"errands":"you"},"stamp":"PERSONAL BEST"}]},{"label":"Knock on Dale's door. Dale has grandkids.","duration":5,"outcomes":[{"weight":1,"text":"Dale has diapers, left over from the grandkid's beach trip: swim diapers. Swim diapers are designed not to absorb anything. They don't. Your couch finds out first.","effects":{"energy":-14},"stamp":"SWIM DIAPER","fx":"shake"},{"weight":1,"text":"Dale comes back with one cloth diaper from 1987 and two safety pins. Neither of you knows how it works. You figure it out together, on Dale's porch, in silence.","effects":{"energy":-10},"stamp":"DALE PROVIDES"}]},{"label":"Call {partner}: \"Where are you, geographically?\"","duration":3,"tags":["tagteam"],"outcomes":[{"text":"{partner} walks out of a meeting, says \"family thing\" in a voice that ends questions, and shows up 40 minutes later with diapers and a coffee you needed.","effects":{"energy":8,"rel":-6},"when":{"min":{"rel":50}},"ledger":{"errands":"partner"}},{"text":"\"In a meeting till 4.\" It's 12:10. You do the math again. It's worse the second time.","effects":{"rel":-10,"energy":-12},"when":{"max":{"rel":49}},"fx":"flash"}]}]},{"id":"form_missed","title":"No Form, No Truck","text":"Daycare is closed for pink eye. Daycare's email is not. Subject: \"FIRE STATION TRIP: FINAL CALL.\" The trip is tomorrow. The form is still on your fridge.","forced":true,"priority":85,"choices":[{"label":"Grovel by email. Use the word \"unprecedented.\"","duration":10,"outcomes":[{"weight":1,"text":"You write 340 words. You use \"unprecedented\" once and \"so sorry\" four times. The reply: \"This once.\" You will owe this person forever.","effects":{"energy":-8}},{"weight":1,"text":"\"Rules are rules,\" the director replies, in a font that feels personal. Tomorrow, {kid} stays behind with the assistant director and a bin of puzzles.","effects":{"energy":-8,"mood":-12},"stamp":"NO FORM, NO TRUCK","fx":"flash"}]},{"label":"Chaperone. Trade one signature for four hours.","duration":5,"tags":["martyr"],"outcomes":[{"text":"A parent who comes along doesn't need a form. Tomorrow: four hours, eleven toddlers, eleven plastic fire hats and one real hose. You've done the math. You will be wet.","effects":{"energy":-22,"mood":10},"stamp":"CHAPERONE: DRAFTED"}]},{"label":"Let it go. It's just a truck.","duration":2,"outcomes":[{"text":"It isn't just a truck. It's a truck, a bell and a hat, and Juniper got all three. Brynn sends you a photo of the hat, captioned \"next time!! 🙂\"","effects":{"energy":-6,"mood":-8}}]}]},{"id":"rsvp_missed","title":"Brynn Is Following Up","text":"The RSVP for Juniper's party was due at 5. It is no longer before 5.","chat":{"with":"Brynn","messages":[{"from":"Brynn","text":"hiiii!! finalizing the headcount for Juniper's party 🎈"},{"from":"Brynn","text":"still need yours! it was due at 5 🙂"},{"from":"Brynn","text":"it's 5:04 🙂"}]},"forced":true,"priority":85,"choices":[{"label":"\"SO sorry!! YES!! We'd love to!! 🎉🎉🎉\"","duration":3,"outcomes":[{"weight":1,"text":"Late RSVPs bring the ice. Nobody told you this rule. It's the oldest rule there is.","effects":{"energy":-10},"chat":[{"from":"Brynn","text":"yay!! you're on ice 🧊 (30 lbs)"}],"stamp":"ICE DUTY"},{"weight":1,"text":"Brynn will not see what Brynn can do. You can tell from the smiley, which has been through a lot today.","effects":{"energy":-8},"chat":[{"from":"Brynn","text":"headcount already went in 🙂 i'll see what i can do 🙂"}]}]},{"label":"Blame tech: \"it went to spam!!\"","duration":2,"outcomes":[{"text":"Three smileys, each one a little colder than the last.","effects":{"energy":-10},"chat":[{"from":"Brynn","text":"oh weird! it was paper 🙂 in the cubby 🙂 with a ribbon 🙂"}],"stamp":"BUSTED"}]},{"label":"Leave it on read. Brynn might forget.","duration":1,"outcomes":[{"text":"Brynn does not forget. Brynn has a spreadsheet with conditional formatting. Your row is red. Somehow, at the party, your row will still be red.","effects":{"energy":-11},"stamp":"ROW: RED","fx":"flash"}]}]},{"id":"rash_missed","title":"After Hours","text":"The pediatrician's office closed at 5. The rash did not. It's on both elbows now, plus the back of one knee, and you have 31 browser tabs open about it.","forced":true,"priority":85,"choices":[{"label":"Call the after-hours line. Pack a lunch.","duration":50,"outcomes":[{"weight":2,"text":"Forty-six minutes on hold. Then a nurse with a voice like a warm blanket says eczema, fragrance-free cream, call Monday. You say thank you four times and mean every one.","effects":{"energy":-14,"mood":4}},{"weight":1,"text":"The nurse wants them seen tonight, to be safe. Urgent care: eleven people ahead of you, nine of them coughing. A doctor looks for forty seconds. \"Eczema.\" Copay: $75.","effects":{"energy":-24,"mood":-8},"stamp":"$75 FOR ECZEMA","fx":"flash"}]},{"label":"Crowdsource it. Post the knee to the class chat.","duration":5,"outcomes":[{"weight":1,"text":"Marcus's mom is a pediatric nurse. \"Eczema. Fragrance-free cream. Call Monday if it spreads.\" Right, kind, fast. And now 22 parents have seen your child's knee.","effects":{"energy":-12}},{"weight":1,"text":"Forty replies in nine minutes: eczema, allergies, \"have you tried celery juice,\" a photo of somebody else's rash. You call the nurse line anyway, an hour behind.","effects":{"energy":-24}}]},{"label":"\"{partner}. Did YOU call?\"","duration":3,"outcomes":[{"text":"They didn't. You didn't. You both look at the rash like it's a third parent who was supposed to handle this. Then you call the nurse line, not speaking.","effects":{"rel":-12,"energy":-16},"count":{"blames":1}}]}]},{"id":"library_missed","title":"Final Overdue Notice (Final)","text":"Friday, 5 PM. The library has frozen your card until the books come back. Story time is tomorrow. Story time is the one hour a week {kid} sits still.","forced":true,"priority":85,"choices":[{"label":"Run. The library closes at 6.","duration":40,"outcomes":[{"weight":1,"text":"5:52 PM. You slide the books across the desk, panting. {kid} says \"thank you, library\" to the whole building. The librarian waives the fine. You act like you planned the timing.","effects":{"energy":-14,"mood":8}},{"weight":1,"text":"5:59 PM. The door locks as your hand touches it. Through the glass, a librarian points at the hours sign and mouths, \"Monday.\"","effects":{"energy":-20,"mood":-6},"stamp":"SEE YOU MONDAY"}]},{"label":"Pay the fine. Buy your freedom.","duration":5,"outcomes":[{"text":"$16.80, plus a $2 fee for the convenience of paying it. The card stays frozen until the books come back, which they won't, because they're furniture now.","effects":{"energy":-4,"mood":-6}}]},{"label":"Keep them. Start a home library.","duration":1,"outcomes":[{"text":"You declare the books part of the household's permanent collection. The library sends a $68 replacement bill. Your account has gone to collections, in both senses.","effects":{"energy":4,"mood":-8,"rel":-6},"stamp":"COLLECTIONS","fx":"flash"}]}]},{"id":"panic_checkout","title":"Unexpected Item","text":"Self-checkout. {kid} has put Bun-Bun in the bagging area. A red light is spinning. A voice keeps saying UNEXPECTED ITEM. Nine people are in line behind you, and they've all picked a side.","window":[540,1080],"oncePerWeek":true,"timer":5,"when":{"notFlags":["d:home"]},"choices":[{"label":"Trade Bun-Bun for a granola bar","duration":1,"tags":["bribe"],"outcomes":[{"weight":2,"text":"The trade clears. Bun-Bun comes home. The light stops. The man behind you mouths, \"nice.\" You'd put this one on a résumé.","effects":{"mood":6},"count":{"snacks":1}},{"text":"They take the bar and set it in the bagging area, next to Bun-Bun. UNEXPECTED ITEM. UNEXPECTED ITEM. They're starting a collection.","effects":{"mood":4,"energy":-8},"count":{"snacks":1}}]},{"label":"Scan Bun-Bun. Pay whatever Bun-Bun costs.","duration":1,"outcomes":[{"text":"Bun-Bun rings up as ORGANIC KALE, $4.99/lb. You pay it. Doreen, the attendant, 31 years in, bags Bun-Bun like a grandchild.","effects":{"energy":4},"stamp":"DOREEN APPROVES"},{"text":"The scanner can't find Bun-Bun and calls for help. Nine people watch a teenager in a vest learn that the rabbit is not for sale.","effects":{"mood":6,"energy":-6}}]},{"label":"Freeze","duration":1,"timeout":true,"outcomes":[{"text":"The attendant arrives. \"Is this your item?\" {kid} rises in the cart: \"BUN-BUN IS NOT A ITEM.\" The line agrees. The line has never agreed on anything.","effects":{"mood":8,"energy":-10},"stamp":"NOT A ITEM","fx":"shake"}]}]},{"id":"panic_buy_now","title":"Buy Now","text":"{kid} has your phone. On the screen: a ride-on electric tractor, $899.99, under a big yellow BUY NOW button. Their thumb is descending.","window":[480,1140],"oncePerWeek":true,"timer":5,"choices":[{"label":"Lunge for the phone","duration":1,"outcomes":[{"weight":2,"text":"You snatch it with a centimeter to spare. The tractor stays in your cart, where it will follow you around the internet for a month.","effects":{"mood":-10,"energy":-2}},{"text":"You snatch it, but in the struggle a thumb taps \"Add protection plan: $129.\" You now own a warranty for a tractor you don't have.","effects":{"mood":-8,"rel":-8}}]},{"label":"\"Ooh! Let's add it to the WISH LIST!\"","duration":1,"tags":["negotiate"],"outcomes":[{"text":"\"WISH LIST,\" they whisper, and tap the little heart. The tractor is safe in the future, where all expensive things belong.","effects":{"mood":6,"rel":4},"stamp":"DEFERRED"},{"text":"They tap the heart. Then, to be safe, BUY NOW. They're a planner.","effects":{"rel":-16,"mood":12},"stamp":"SHIPPED","fx":"flash"}]},{"label":"Freeze","duration":1,"timeout":true,"outcomes":[{"text":"Tap. {kid} explains, patiently, that you said they could \"have anything\" if they ate their peas. They ate two peas. The tractor arrives Thursday.","effects":{"rel":-18,"mood":14,"energy":-4},"stamp":"ARRIVING THURSDAY","fx":"flash"}]}]},{"id":"panic_flush_keys","title":"Bye-Bye, Keys","text":"{kid} is at the open toilet, dangling your car keys over the water by one finger. Their other hand is on the handle. \"Bye-bye, keys,\" they say, gently.","window":[420,1100],"oncePerWeek":true,"timer":5,"choices":[{"label":"Dive.","duration":1,"outcomes":[{"weight":2,"text":"You cross the bathroom in a single step you didn't know you had. Keys: caught. Knee: tile. {kid} applauds the catch. Only you heard the knee.","effects":{"energy":-8,"mood":4},"stamp":"WHAT A CATCH"},{"text":"You catch the keys. You also catch the bath mat, and finish the move sitting in the tub, fully clothed. {kid} flushes anyway, for closure.","effects":{"energy":-6,"mood":10}}]},{"label":"\"Keys are SCARED of water!\"","duration":1,"tags":["negotiate"],"outcomes":[{"text":"{kid} gasps, hugs the keys and carries them out to \"keep them safe.\" You find them tonight, tucked into bed beside the stuffed rabbit.","effects":{"mood":8,"energy":4}},{"text":"\"Keys are BRAVE,\" {kid} corrects you, and lets go.","effects":{"energy":-10}}]},{"label":"\"REMEMBER WHAT HAPPENED TO REX.\"","duration":1,"when":{"flags":["rex:flushed"]},"outcomes":[{"text":"{kid} goes very still. Rex's sacrifice will not be forgotten. They hand you the keys, then salute the toilet.","effects":{"mood":-6,"energy":6},"stamp":"NEVER FORGET"}]},{"label":"Freeze","duration":1,"timeout":true,"outcomes":[{"text":"Plunk. Flush. The keys don't go all the way. Somewhere in the pipe the fob gets squeezed, and out in the driveway your car honks. It honks every time anyone flushes, until Friday.","effects":{"energy":-10,"mood":10},"stamp":"THE CAR KNOWS","fx":"shake"}]}]},{"id":"panic_dropoff","title":"Morning Announcements","text":"Daycare drop-off. Eight parents, two teachers, one rare moment of quiet. {kid} turns to face the room and takes a big breath. They have news. It's about you.","window":[420,570],"oncePerWeek":true,"timer":5,"when":{"notFlags":["d:home"]},"choices":[{"label":"Scoop them up: \"BIG HUG! BYE!\"","duration":1,"outcomes":[{"weight":2,"text":"They say it straight into your neck, muffled past recognition. One teacher catches the word \"closet\" and nods slowly. It could be anything. It isn't anything.","effects":{"mood":6,"energy":-4}},{"text":"They wriggle free, climb the cubbies for elevation and deliver it to the back row.","effects":{"energy":-4},"fx":"shake"}]},{"label":"\"WHO WANTS TO SEE THE FISH?!\"","duration":1,"outcomes":[{"weight":2,"text":"Nine toddlers sprint to the fish tank, yours first, news forgotten. The teachers look at you with deep gratitude. The fish look at you with fear.","effects":{"energy":4},"stamp":"FISH DEPLOYED"},{"text":"Nobody moves. {kid} waits politely for you to finish, then begins.","effects":{"energy":-10}}]},{"label":"Freeze","duration":1,"timeout":true,"outcomes":[{"text":"\"{ME} EATS COOKIES IN THE CLOSET SO I CAN'T SEE.\" Eight parents nod slowly. Three of them also have a closet.","effects":{"mood":8,"energy":-10},"stamp":"PUBLIC RECORD"}]}]},{"id":"panic_cart_lick","title":"The Handle","text":"Grocery store. {kid} is in the cart seat, mouth open, face lowering slowly toward the handle, which has been touched today by 400 strangers and one man with a cough.","window":[540,1080],"oncePerWeek":true,"timer":4,"when":{"notFlags":["d:home"]},"choices":[{"label":"Hand on the handle. Take the lick yourself.","duration":1,"tags":["martyr"],"outcomes":[{"text":"They lick your hand, end to end, thoroughly, with eye contact. \"Salty,\" they report. You'll be thinking about the 400 strangers anyway.","effects":{"mood":6,"energy":-4},"stamp":"HUMAN SHIELD"}]},{"label":"\"Don't lick that!\"","duration":1,"tags":["boundary"],"outcomes":[{"weight":2,"text":"They hadn't been going to lick it. They'd been going to rest their cheek on it. Now they've heard about licking.","effects":{"mood":6,"energy":-6}},{"text":"\"Okay,\" they say, and don't. You stare at each other. It worked. You don't trust it.","effects":{"mood":-6,"energy":4}}]},{"label":"F

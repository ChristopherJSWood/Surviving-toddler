t":"Thirty minutes on the knee: the surgeon, the parking, the physical therapist who \"isn't a real doctor.\" {partner} finishes dinner in peace and squeezes your hand under the table.","effects":{"rel":10,"energy":-12}},{"weight":1,"text":"The knee, then the other knee, then a neighbor's hip. {partner} mouths \"thank you,\" then \"sorry,\" then \"I love you,\" then nothing. They've fallen asleep sitting up.","effects":{"rel":6,"energy":-14}}]}],"priority":41},{"id":"d_thu_sax","title":"Grandma Brought a Gift","text":"Grandma brought a gift: a toy saxophone. It plays the same eight notes of jazz at 94 decibels and has no off switch. Grandma leaves Sunday. The saxophone does not.","window":[540,1100],"weight":5,"oncePerWeek":true,"when":{"flags":["d:grandma"]},"choices":[{"label":"\"Wow! Thank you!\" Smile through the jazz.","duration":5,"outcomes":[{"weight":2,"text":"You smile through 31 renditions. Grandma glows. {kid} glows. Your left eye does a thing. It will keep doing the thing until Sunday.","effects":{"mood":14,"energy":-10}},{"weight":1,"text":"Your \"Wow!\" is so convincing that Grandma reaches into the bag again. \"I knew you'd love it. That's why I got the drum.\"","effects":{"mood":16,"energy":-14},"stamp":"ENCORE: DRUM","fx":"shake"}]},{"label":"Remove the batteries tonight. Blame the factory.","duration":5,"outcomes":[{"weight":1,"text":"Surgery at 9 PM with a tiny screwdriver. In the morning, {kid} blows into a silent saxophone and looks at you. Not at the saxophone. At you.","effects":{"mood":-10,"energy":10},"stamp":"THE FACTORY DID IT"},{"weight":1,"text":"Batteries out. Silence. Then you learn it has a backup battery, for memory. At 2 AM it plays the eight notes once, softly. Just once. To let you know.","effects":{"mood":-8,"energy":12}}]},{"label":"Pack it in Grandma's suitcase. \"Oops.\"","duration":3,"outcomes":[{"weight":2,"text":"Two days later, a text: \"Found the saxophone in my bag! Silly me! Bringing it back next visit 🎷\" It's coming back. It always comes back.","effects":{"energy":12,"mood":-12},"stamp":"RETURN TO SENDER"},{"weight":1,"text":"Grandma finds it while packing and hands it back with a wink. \"You almost lost this!\" Grandma knows. Grandma has always known.","effects":{"energy":8,"mood":12}}]}]},{"id":"potty_alarm","title":"False Alarm #9","text":"\"I NEED TO GO POTTY!\" This could be the breakthrough. It could also be false alarm number nine since lunch. You can't tell anymore. Neither can they.","window":[420,1140],"weight":5,"oncePerWeek":true,"when":{"flags":["d:potty"]},"choices":[{"label":"Sprint. Carry them under one arm, horizontally.","duration":10,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":1,"text":"SUCCESS. You throw a three-minute celebration with a dance and a sticker. You have never been prouder of anything, including your career.","effects":{"mood":14,"energy":-6},"stamp":"TOUCHDOWN","fx":"confetti"},{"weight":1,"text":"False alarm. Then a real alarm, ninety seconds later, on the rug you'd just decided was safe.","effects":{"energy":-8}}]},{"label":"\"Are you SURE?\"","duration":5,"outcomes":[{"weight":1,"text":"They were sure.","effects":{"energy":-10},"fx":"shake"},{"weight":1,"text":"They weren't sure. They wanted to flush. Seven times. They wave goodbye to each flush like it's leaving on a cruise.","effects":{"mood":10,"energy":2}}]},{"label":"Diaper back on. Day 3 is a social construct.","duration":3,"outcomes":[{"text":"Nobody has to know. Everybody will know. The internet said you'd be tempted, and the internet, for once, was right.","effects":{"energy":10,"mood":-4}}]}]},{"id":"d_thu_stickers","title":"Sticker Inflation","text":"The deal was one sticker per potty. {kid} has renegotiated: two stickers, a cracker and \"the big song.\" The chart on the fridge looks like a currency in collapse.","window":[480,1080],"weight":5,"oncePerWeek":true,"when":{"flags":["d:potty"]},"choices":[{"label":"Hold the line: one sticker, no song","duration":5,"tags":["boundary"],"snapRisk":true,"outcomes":[{"weight":1,"text":"They accept the terms, sulk and go anyway. One sticker. You feel like a central banker who did the hard thing.","effects":{"mood":-8,"energy":6},"stamp":"RATES HELD"},{"weight":1,"text":"{kid} goes on strike. The strike takes place on the kitchen floor, with eye contact, and it is not a dry strike.","effects":{"mood":-4,"energy":-2},"fx":"shake"}]},{"label":"Two stickers and a cracker. Inflation is real.","duration":3,"tags":["bribe"],"outcomes":[{"text":"It works too well. They now go in tiny installments, for maximum stickers. Nine before lunch. You're out of dinosaurs and down to the dentist's smiley faces.","effects":{"mood":12,"energy":-6},"count":{"snacks":1},"stamp":"HYPERINFLATION"}]},{"label":"Full potty parade for every success","duration":20,"minEnergy":25,"tags":["present"],"outcomes":[{"weight":2,"text":"You march. You sing. You bang a pot with a wooden spoon. They're so into it they go twice. You're so into it you pull something in your hip.","effects":{"mood":14,"energy":-14}},{"weight":1,"text":"The parade is such a hit that {kid} now demands one for things that aren't potty. A parade for socks. A parade for a sneeze. You're the band now.","effects":{"mood":12,"energy":-16}}]}]},{"id":"d_thu_bare","title":"Bare-Bottom Afternoon","text":"The method says: no pants, lots of water, watch for \"the signs.\" {kid} is pantsless, hydrated and showing the signs either constantly or never. You've watched a small bottom for 40 minutes like a lighthouse keeper.","window":[600,1080],"weight":5,"oncePerWeek":true,"when":{"flags":["d:potty"]},"choices":[{"label":"Stare at the bottom. Potty every 20 minutes.","duration":40,"minEnergy":25,"tags":["present"],"outcomes":[{"weight":2,"text":"Ding. Sprint. Success! You cheer so loudly a dog two houses down joins in. {kid} takes a bow, which, given the outfit, is a lot.","effects":{"mood":12,"energy":-10},"fx":"confetti"},{"weight":1,"text":"Between timers: the couch. The good couch. Twelve seconds after the last trip, with total confidence.","effects":{"energy":-10},"fx":"shake"}]},{"label":"Sunshine Sing-Along. Stillness helps, right?","duration":25,"tags":["screen"],"outcomes":[{"text":"The man in corduroy sings about rain. {kid} sits perfectly still on the couch. Stillness, it turns out, is exactly when it happens. The cushion cover goes in the wash.","effects":{"energy":10,"mood":6},"set":["d:screen"],"count":{"screen":22},"ledger":{"laundry":"you"},"schedule":[{"event":"screen_off","in":22}]}]},{"label":"Towels on every surface. Every one.","duration":15,"outcomes":[{"weight":2,"text":"Fourteen towels. The living room looks like a spa that's given up. It works: everything lands on terry cloth. You now have fourteen towels to wash.","effects":{"energy":-12,"rel":6},"ledger":{"laundry":"you"}},{"weight":1,"text":"Fourteen towels. {kid} finds the one square foot with no towel on it and uses it, precisely, as if aiming.","effects":{"energy":-9},"ledger":{"laundry":"you"}}]}]},{"id":"d_thu_autoflush","title":"The Auto-Flush","text":"A public restroom. {kid} is finally on the big toilet. Behind them, the auto-flush sensor blinks red. It's thinking about it. You have about five seconds.","window":[600,1080],"weight":5,"oncePerWeek":true,"timer":5,"when":{"flags":["d:potty"]},"choices":[{"label":"Palm over the sensor. Hold.","duration":2,"outcomes":[{"weight":2,"text":"You hold your palm over the sensor for four minutes, bent like a question mark, whispering encouragement. Success. You'll never get the feeling back in that arm.","effects":{"mood":12,"energy":-8},"stamp":"SENSOR BLINDED"},{"weight":1,"text":"You cover the sensor. It flushes anyway, out of spite. {kid} levitates. They'll be telling this story at 30.","effects":{"mood":-14,"energy":-4},"fx":"shake"}]},{"label":"Sticky note over it. You came prepared.","duration":2,"outcomes":[{"weight":1,"text":"The veteran's move. The note goes on and the sensor goes blind. {kid} pees in peace while you stand guard at the stall door, arms crossed, terrifying.","effects":{"mood":14,"energy":-2},"stamp":"VETERAN MOVE","fx":"confetti"},{"weight":1,"text":"You reach into the bag for the sticky notes and find a receipt, a crayon and a single raisin. The sensor decides for you.","effects":{"mood":-14,"energy":-2}}]},{"label":"Freeze","duration":2,"timeout":true,"outcomes":[{"text":"WHOOSH. {kid} is off the toilet and out of the stall in one motion, pantsless, telling the whole restroom \"THE POTTY TRIED TO EAT ME.\" Potty training has been pushed to spring.","effects":{"mood":-24,"energy":4},"stamp":"POSTPONED TO SPRING","fx":"shake"}]}]},{"id":"d_fri_outfit","title":"The Going-Out Shirt","text":"Your going-out shirt has been in a drawer since spring. It has a crease like a folded map, a stain like a smaller map and, as of four minutes ago, a toddler wearing it as a cape.","window":[720,1045],"weight":5,"oncePerWeek":true,"when":{"flags":["d:friday"]},"choices":[{"label":"Iron it. Treat the stain. Be a person.","duration":25,"minEnergy":20,"tags":["martyr"],"outcomes":[{"weight":2,"text":"Stain stick, steam, a second pass. The crease surrenders. The stain fades into something you could call a pattern, in low light, which the restaurant will provide.","effects":{"energy":-10,"rel":8},"ledger":{"laundry":"you"}},{"weight":1,"text":"It's perfect. You hang it on the door. When you come back, the cape has returned, on {kid}, who is now Captain Date Night and will not be taking questions.","effects":{"energy":-10,"mood":10},"ledger":{"laundry":"you"}}]},{"label":"Dryer, damp towel, ten minutes. Pray.","duration":12,"outcomes":[{"weight":1,"text":"The crease is 60% gone. The stain is now baked in, permanently. You'll keep an arm over it all night like a nervous senator.","effects":{"energy":-4}},{"weight":1,"text":"The crease is gone. So are two sizes. It's a crop top now. You're wearing it anyway. It's a choice.","effects":{"energy":3,"rel":9},"stamp":"IT'S A CHOICE"}]},{"label":"Wear the sweater. The sweater is always fine.","duration":2,"outcomes":[{"weight":2,"text":"The sweater has seen four Fridays like this one. {partner} says, \"The sweater, huh?\" in a voice that's either fond or not. You don't ask which.","effects":{"energy":12,"rel":-8}},{"weight":1,"text":"{partner} walks in wearing their own sweater. The same sweater. You bought them as a set in 2021 and swore you'd never wear them together. Tonight, you do.","effects":{"energy":6,"rel":10},"stamp":"MATCHING, UNIRONICALLY","fx":"confetti"}]}]},{"id":"d_fri_reservation","title":"Reservation Confirmed","text":"{partner} texts: \"Confirmed for 7:30!! 🎉\" Then: \"I could leave at 3:30 so you can rest? I'd have to log back on later, but.\" The \"but\" just sits there. It's a real offer. It's also a real but.","window":[600,900],"weight":5,"oncePerWeek":true,"when":{"flags":["d:friday"]},"choices":[{"label":"\"Yes. Please. Come home.\"","duration":3,"tags":["tagteam"],"outcomes":[{"when":{"min":{"rel":55}},"text":"They're home by 4. You lie in a dark room for 40 minutes, charging. When you get up, {kid} has \"helped\" fold the laundry, which means unfolded it.","effects":{"energy":16,"rel":-2},"ledger":{"evening":"partner"}},{"when":{"max":{"rel":54}},"text":"They're home at 4:40 and back on the laptop by 4:45. \"I'm here, though!\" they say, from behind a screen. Technically, they are.","effects":{"energy":8,"rel":-12}}]},{"label":"\"I've got it. Finish your day.\"","duration":3,"minEnergy":25,"tags":["martyr"],"outcomes":[{"weight":2,"text":"You've got it. You absolutely have it. At 4:30 you're on the floor looking for a shoe, and you have it, and {partner} sends a heart, and that has to count for something.","effects":{"rel":10,"energy":-12}},{"weight":1,"text":"You have it until 4:52, when you text \"actually.\" They're home by 5:10 with a pizza and zero questions. The date hasn't started, and it's already the most romantic thing that will happen tonight.","effects":{"rel":12,"energy":6},"stamp":"ACTUALLY."}]},{"label":"\"Only if you bring the good cheese.\"","duration":3,"tags":["negotiate"],"outcomes":[{"weight":1,"text":"They arrive at 3:50 with the expensive cheese and the crackers that come in a box with a window. You eat it standing up in the kitchen, together: an appetizer for the appetizer.","effects":{"rel":9,"energy":12}},{"weight":1,"text":"They arrive at 3:50 with \"cheese\": a family-size bag of string cheese. It's the thought that counts. The thought was \"string cheese.\"","effects":{"rel":-4,"energy":12}}]}]},{"id":"d_fri_clean","title":"Cleaning for a Teenager","text":"The sitter arrives at 7. The sitter is 16 and will notice nothing. You are, nonetheless, about to clean the entire house for a 16-year-old.","window":[660,1000],"weight":5,"oncePerWeek":true,"when":{"flags":["d:friday"]},"choices":[{"label":"Clean everything. You have standards (for a teen).","duration":45,"minEnergy":30,"tags":["martyr"],"outcomes":[{"weight":2,"text":"The bathroom, the counters and a drawer the sitter will never open. At 7, the sitter walks in, looks at nothing and says, \"Cute house.\" You'll take it.","effects":{"energy":-16,"rel":6}},{"weight":1,"text":"You clean for 45 minutes. {kid} follows two steps behind, un-cleaning at exactly the same speed. You end where you began, but sweatier.","effects":{"energy":-16,"mood":8},"stamp":"NET ZERO"}]},{"label":"Close every door. The house is one room now.","duration":5,"outcomes":[{"weight":1,"text":"Bedroom: closed. Laundry room: closed. Office: closed. The sitter will think you live in a kitchen with a couch. You basically do.","effects":{"energy":12}},{"weight":1,"text":"Doors closed. At 7:20 the sitter texts, \"which door is the bathroom 😅\" They've opened them all. They've seen everything.","effects":{"energy":6,"rel":-6},"fx":"flash"}]},{"label":"Rest instead. Energy is the real outfit.","duration":30,"outcomes":[{"text":"You lie down \"for ten minutes\" and get up at 1:40, rested and certain you never fell asleep. {partner} walks in at 5 to a disaster with a new person standing in it.","effects":{"energy":16,"rel":-6}}]}]},{"id":"quiet_tell","title":"A Whiff of Fourth Grade","text":"A smell drifts in from the hallway: sharp, chemical, faintly like the first day of fourth grade. Somewhere, a permanent marker has lost its cap. You own one permanent marker. You hid it.","forced":true,"priority":86,"choices":[{"label":"Go look. Now.","duration":3,"outcomes":[{"weight":2,"text":"{kid} is an inch from the white wall, marker raised, cap in their teeth. You take the marker. They file a stolen-property report with the stuffed rabbit.","effects":{"energy":-6,"mood":-6},"set":["hz:sharpie"],"cancel":["sharpie"]},{"text":"One second late. There's a single line, knee height, 14 inches long, very confident. You take the marker. The line stays, as a warning to others.","effects":{"energy":-5},"set":["hz:sharpie"],"cancel":["sharpie"]}]},{"label":"Call back: \"Are you drawing?\"","duration":1,"outcomes":[{"text":"\"No!\" Then footsteps. {kid} walks in to show you the marker they aren't drawing with, and hands it over as proof. Toddler logic, working for you, once.","effects":{"energy":4,"mood":6},"set":["hz:sharpie"],"cancel":["sharpie"],"stamp":"SELF-REPORTED"},{"weight":2,"text":"\"NO,\" they call back, warmly. The squeak of felt on drywall resumes.","effects":{"energy":6}}]},{"label":"Eat their rejected crusts in peace","duration":4,"outcomes":[{"text":"You eat four rejected crusts at the counter, in total silence. A feast. Down the hallway, someone else is also enjoying some quiet creative time.","effects":{"energy":10}}]}]},{"id":"sharpie","title":"Untitled (Permanent)","text":"The hallway has a mural: one continuous line, 11 feet long, knee height, in permanent marker. At the end, {kid} has signed it with a second, smaller line.","hazard":"sting","tell":"quiet_tell","weight":2,"when":{"notFlags":["hz:sharpie"]},"choices":[{"label":"Scrub it. Sleep is for people with clean walls.","duration":30,"minEnergy":25,"tags":["martyr"],"outcomes":[{"weight":2,"text":"Forty minutes and a $3 melamine sponge, and it comes off. A cleaning product told the truth. For one moment you are a person in an ad.","effects":{"energy":-12,"rel":8},"set":["hz:sharpie"],"stamp":"WALL RESTORED"},{"text":"It comes off, and so does the paint under it. You now have a clean, matte stripe at knee height. It's worse. It's somehow worse.","effects":{"energy":-12},"set":["hz:sharpie"]}]},{"label":"Frame the best part. Call it art.","duration":10,"outcomes":[{"weight":2,"text":"You frame nine inches of it and add a little card: \"Untitled. Marker on drywall.\" Guests think it's charming. It's the only art in the house anyone asks about.","effects":{"energy":-4,"rel":2},"set":["hz:sharpie"]},{"text":"A guest asks, sincerely, what you paid for it. You say $400. They nod: \"Worth it.\" {kid} is now the most commercially successful artist in your family.","effects":{"energy":2,"rel":4},"set":["hz:sharpie"]}]},{"label":"Leave it. It came with the house.","duration":1,"outcomes":[{"text":"You walk past it eleven times today. By the eighth, you've started seeing things in it. A river. A horse. Your security deposit, leaving.","effects":{"energy":3,"rel":-8},"set":["hz:sharpie"]}]}]},{"id":"w_chair_tell","title":"The Chair Is on the Move","text":"From the kitchen: a chair scraping across the tile, a few inches at a time, with pauses. The pauses are for planning. Then, brightly: \"I making BREAKFAST!\"","forced":true,"priority":86,"choices":[{"label":"Sprint to the kitchen","duration":3,"outcomes":[{"weight":2,"text":"You arrive as a small hand closes on the flour. You lift them down mid-reach. \"I was making breakfast,\" they explain, betrayed. \"For YOU.\"","effects":{"energy":-5,"mood":-6},"set":["hz:w_flour"],"cancel":["w_flour"]},{"text":"They're standing on the chair, eating one raw spaghetti noodle like a breadstick, holding eye contact. You'll take it. You take the chair.","effects":{"energy":-4,"mood":6},"set":["hz:w_flour"],"cancel":["w_flour"]}]},{"label":"Yell: \"Chef! What are we making?\"","duration":1,"outcomes":[{"text":"\"Snow,\" says the chef. You get there in time to stop the snow. The chef files a complaint against the health inspector.","effects":{"energy":-3,"mood":-6},"set":["hz:w_flour"],"cancel":["w_flour"]},{"weight":2,"text":"\"SNOW!\" the chef replies, and makes it.","effects":{"energy":5}}]},{"label":"Stay put. Chairs are for moving.","duration":2,"outcomes":[{"text":"You decide a chair being dragged is a chair being used. From the kitchen comes the soft pop of a lid that was never meant to come off.","effects":{"energy":10}}]}]},{"id":"w_flour","title":"It's Snowing in the Kitchen","text":"Five pounds of flour, airborne. {kid} stands in a private blizzard, making a snow angel on the tile. \"{ME}! IT'S WINTER!\"","hazard":"sting","tell":"w_chair_tell","when":{"notFlags":["hz:w_flour"]},"choices":[{"label":"Sweep first. NEVER wet first.","duration":25,"minEnergy":20,"tags":["martyr"],"outcomes":[{"weight":2,"text":"You sweep before you wipe, like someone who's been here before. Twenty-five minutes. You'll find flour in your ear on Thursday.","effects":{"energy":-10,"rel":6},"set":["hz:w_flour"]},{"text":"{kid} \"helps\" with a wet sponge. Flour plus water is paste. Your kitchen floor is now a craft project, and it's drying.","effects":{"energy":-16},"set":["hz:w_flour"]}]},{"label":"Make it a sensory bin. On purpose, now.","duration":30,"minEnergy":25,"tags":["present"],"outcomes":[{"text":"Measuring cups, a whisk, a toy plow. Thirty minutes of what the craft accounts call \"open-ended play.\" It is mostly open-ended flour.","effects":{"mood":14,"energy":-8,"sleepy":8},"set":["hz:w_flour"]}]},{"label":"Close the kitchen door. Order dinner.","duration":2,"outcomes":[{"weight":2,"text":"You don't go back into your own kitchen for an hour. When you do, a trail of tiny white footprints leads out, across the couch and into your bed.","effects":{"energy":4,"rel":-8},"set":["hz:w_flour"]},{"text":"An hour later you go back in. In the flour on the floor, {kid} has drawn a very good cat with one finger. You photograph it before you sweep. You'll keep that photo.","effects":{"mood":8,"energy":4,"rel":-4},"set":["hz:w_flour"]}]}]},{"id":"w_bathroom_tell","title":"The Bathroom Door Is Closed","text":"The bathroom door, which you left open, is closed. From the inside. Someone in there is humming the toothbrush song. That someone has never closed a door in their life.","forced":true,"priority":86,"choices":[{"label":"Open it. You pay the mortgage.","duration":2,"outcomes":[{"weight":2,"text":"Inside: {kid}, holding the toothpaste like a microphone, cap already off, mid-song. You take it. They bow to an audience of one towel.","effects":{"energy":-6,"mood":-4},"set":["hz:w_toothpaste"],"cancel":["w_toothpaste"]},{"text":"Inside: {kid}, fully clothed on the closed lid, reading a shampoo bottle. \"Privacy,\" they say. You leave, taking the toothpaste with you, just in case.","effects":{"energy":-4,"mood":-4},"set":["hz:w_toothpaste"],"cancel":["w_toothpaste"]}]},{"label":"Knock first. Respect the process.","duration":2,"outcomes":[{"text":"\"COME IN!\" A host, welcoming you to the show. You confiscate the toothpaste before the show starts. Reviews are mixed.","effects":{"energy":-3,"mood":-6},"set":["hz:w_toothpaste"],"cancel":["w_toothpaste"]},{"text":"\"BUSY,\" says the voice, with real authority. You respect it. Then you hear the tube.","effects":{"energy":5}}]},{"label":"Everyone deserves alone time. You too.","duration":5,"outcomes":[{"text":"You spend your alone time eating shredded cheese from the bag, standing in the light of the open fridge. It lasts four minutes. You were fully present for all four.","effects":{"energy":10}}]}]},{"id":"w_toothpaste","title":"Minty Fresh","text":"One whole tube of toothpaste, $4.29, in nine minutes. The mirror, the sink, the bath mat and {kid} are now toothpaste. There's some on the ceiling. Nobody will ever explain the ceiling.","hazard":"sting","tell":"w_bathroom_tell","when":{"notFlags":["hz:w_toothpaste"]},"choices":[{"label":"Scrub. The ceiling is for the next owners.","duration":20,"minEnergy":20,"tags":["martyr"],"outcomes":[{"weight":2,"text":"Twenty minutes and a sponge. The bathroom is the cleanest it's been since you moved in, and it smells incredible. You'd never have done this on purpose.","effects":{"energy":-10,"rel":6},"set":["hz:w_toothpaste"],"stamp":"ACCIDENTAL DEEP CLEAN"},{"text":"You scrub. {kid} helps, with a second tube of unknown origin.","effects":{"energy":-12},"set":["hz:w_toothpaste"]}]},{"label":"It's basically soap. Leave it.","duration":1,"outcomes":[{"text":"It is not basically soap. It dries into a white crust with the texture of a seashell. You'll be picking it off the faucet in March.","effects":{"energy":4,"rel":-6},"set":["hz:w_toothpaste"]}]}]},{"id":"w_scissors_tell","title":"The Safety Scissors Are Missing","text":"The craft drawer is open. The round-tipped scissors are gone. So is {kid}. From under the dining table: one small, experimental snip.","forced":true,"priority":86,"choices":[{"label":"Find them. Fast.","duration":2,"outcomes":[{"weight":2,"text":"Under the table: scissors open, a fistful of bangs pulled tight, total concentration. You trade the scissors for a crayon. The crayon is received like a parking ticket.","effects":{"energy":-6,"mood":-6},"set":["hz:w_haircut"],"cancel":["w_haircut"]},{"text":"Under the table: the stuffed rabbit, with brand-new bangs. Honestly, it's an improvement. You take the scissors before the rabbit gets layers.","effects":{"energy":-4,"mood":6},"set":["hz:w_haircut"],"cancel":["w_haircut"]}]},{"label":"They're SAFETY scissors. How bad can it be?","duration":1,"outcomes":[{"text":"You answer one email. From under the table: a second snip. Then a third, more confident one. Then, very quietly: \"Ta-da.\"","effects":{"energy":9}}]}]},{"id":"w_haircut","title":"The Haircut","text":"{kid} has given themselves bangs. One side only. About an inch of forehead is seeing daylight for the first time. On the fridge, a flyer: \"PICTURE DAY IS FRIDAY!\"","hazard":"sting","tell":"w_scissors_tell","when":{"notFlags":["hz:w_haircut"]},"choices":[{"label":"Kids' salon. Pay a professional to lie.","duration":45,"outcomes":[{"text":"\"Happens every week,\" says the stylist, which is a kind lie, and evens it out. It's even now. Even shorter. $28 and a lollipop.","effects":{"energy":-10,"mood":8},"set":["hz:w_haircut"]}]},{"label":"Even it out yourself, with kitchen scissors","duration":10,"outcomes":[{"text":"You even out the left. Then the right. Then the left again. {kid} now looks like a small accountant from 1974, and loves it.","effects":{"energy":-8,"mood":8},"set":["hz:w_haircut"]},{"text":"It's... good? It's genuinely good. You may have a gift. You tell no one, in case someone asks you to do it again.","effects":{"energy":-4,"mood":6},"set":["hz:w_haircut"],"stamp":"UNTAPPED TALENT"}]},{"label":"Post it before anyone else can","duration":2,"outcomes":[{"text":"Thirty-one laughing faces and four \"SAME\" replies, with photos. You've accidentally founded a support group.","effects":{"energy":8},"set":["hz:w_haircut"]},{"text":"One parent replies, sincerely: \"Love it! Who do you go to?\" You can't tell if it's kindness or war.","effects":{"energy":-10},"set":["hz:w_haircut"]}]}]},{"id":"w_laptop_tell","title":"The Shark and the Laptop","text":"Your laptop is open on the coffee table, the report on the screen, last saved at 11:14. {kid} is circling it slowly, like a shark that has read about laptops.","forced":true,"priority":86,"when":{"flags":["d:deadline"]},"choices":[{"label":"Slam the lid. Ask questions later.","duration":1,"outcomes":[{"weight":2,"text":"Slam. The shark looks at you, then at the closed laptop, then swims off toward a softer target: the remote.","effects":{"energy":-4,"mood":-6},"set":["hz:w_laptop_send"],"cancel":["w_laptop_send"]},{"text":"Slam. {kid} opens it. Slam. Open. Slam. It's a game now, and you're losing it, but the report is safe.","effects":{"energy":-6,"mood":6},"set":["hz:w_laptop_send"],"cancel":["w_laptop_send"]}]},{"label":"Save first. THEN close it.","duration":2,"outcomes":[{"weight":2,"text":"Save. Click. The report survives. You'll save it 40 more times today, out of fear.","effects":{"energy":-4,"mood":-4},"set":["hz:w_laptop_send"],"cancel":["w_laptop_send"]},{"text":"While you're pressing save, a small hand presses everything else.","effects":{"energy":4}}]},{"label":"They can't reach the keys. Probably.","duration":2,"outcomes":[{"text":"A pop-up on your phone suggests backing up your files. You swipe it away. You'll think about that swipe.","effects":{"energy":10}}]}]},{"id":"w_laptop_send","title":"Report Submitted","text":"{kid} has added nine pages of the letter J and one winky face to the report, then found the key combination that sends it to your whole team. And, somehow, to Bev in Legal.","hazard":"sting","tell":"w_laptop_tell","when":{"flags":["d:deadline"],"notFlags":["hz:w_laptop_send"]},"choices":[{"label":"Redo it. Send a sheepish v2.","duration":25,"outcomes":[{"text":"\"Please disregard the previous version.\" You delete 4,000 Js. Trent writes back, \"Thanks for the quick fix.\" Nobody mentions the Js. Everyone saw the Js.","effects":{"energy":-4},"set":["hz:w_laptop_send"]}]},{"label":"Reply-all: \"My co-author has notes.\"","duration":2,"outcomes":[{"text":"Trent replies, \"😂 tell them the J section is the strongest part.\" Two people forward it home. For one afternoon, you are beloved.","effects":{"energy":6},"set":["hz:w_laptop_send"],"stamp":"CROWD FAVORITE"},{"text":"Trent replies, \"Ha.\" Just \"Ha.\" With a period. You spend the rest of the day decoding the period.","effects":{"energy":-14},"set":["hz:w_laptop_send"]}]}]},{"id":"w_potty_tell","title":"\"I Don't Need to Go.\"","text":"\"I don't need to go,\" says {kid}, doing a small, urgent dance. \"I don't need to go,\" they repeat, crossing their legs and backing slowly onto the good rug.","forced":true,"priority":86,"when":{"flags":["d:potty"]},"choices":[{"label":"Potty. Now. Carry them like a football.","duration":3,"outcomes":[{"weight":2,"text":"You make it with two seconds to spare. Success! You both cheer. You cheer longer. At the end you're cheering alone, in a bathroom.","effects":{"energy":-5,"mood":8},"set":["hz:w_potty_rug"],"cancel":["w_potty_rug"]},{"text":"You make it. They sit. Nothing. Four minutes of nothing. \"I TOLD you.\" They did. But the rug lives another hour.","effects":{"energy":-6,"mood":-6},"set":["hz:w_potty_rug"],"cancel":["w_potty_rug"]}]},{"label":"Ask a fifth time: \"Do you need to go?\"","duration":1,"outcomes":[{"text":"\"...Yes.\" A breakthrough. You both sprint. You make it.","effects":{"energy":-4,"mood":8},"set":["hz:w_potty_rug"],"cancel":["w_potty_rug"]},{"weight":2,"text":"\"NO,\" they say. Then, quietly, from the middle of the rug: \"yes.\"","effects":{"energy":5}}]},{"label":"Take them at their word","duration":2,"outcomes":[{"text":"They're a person. They know their own body. You respect that, and sit down for the first time since six.","effects":{"energy":10}}]}]},{"id":"w_potty_rug","title":"The Good Rug","text":"The good rug. The rug from before {kid}, back when you had opinions about rugs. It has been christened. {kid} looks at it, then at you. \"I didn't need to go.\"","hazard":"sting","tell":"w_potty_tell","when":{"flags":["d:potty"],"notFlags":["hz:w_potty_rug"]},"choices":[{"label":"Scrub, spray, blot, despair","duration":20,"minEnergy":20,"tags":["martyr"],"outcomes":[{"weight":2,"text":"Enzyme spray, a towel and your full body weight. It's mostly out. It will never be the good rug again, but it will be a rug.","effects":{"energy":-12,"rel":4},"set":["hz:w_potty_rug"]},{"text":"It comes out completely. You text {partner} a photo of the clean rug. They reply with three fire emojis. Nobody else on earth would understand.","effects":{"energy":-12,"rel":6},"set":["hz:w_potty_rug"]}]},{"label":"Roll it up. Garage. Forever.","duration":10,"outcomes":[{"text":"The living room is bare floor now, and it echoes. {kid} spends the afternoon testing the acoustics.","effects":{"mood":6,"energy":-2,"rel":-6},"set":["hz:w_potty_rug"]}]},{"label":"Flip it over. It's reversible now.","duration":2,"outcomes":[{"weight":2,"text":"The back is uglier, but dry. Nobody will ever know. {kid} will tell Grandma on Sunday, unprompted, with gestures.","effects":{"energy":-6},"set":["hz:w_potty_rug"]},{"text":"The back is a rubber grid that smells like a tire shop. You flip it again. Now it's a rug with two problems.","effects":{"rel":-8},"set":["hz:w_potty_rug"]}]}]},{"id":"w_chew_tell","title":"A Soft, Papery Crunch","text":"{kid} has gone quiet in the corner and is chewing something thoughtfully, like a critic. You hear a soft, papery crunch, then a hum of approval.","forced":true,"priority":86,"when":{"flags":["d:teething"]},"choices":[{"label":"Investigate the crunch. Pray it's a cracker.","duration":2,"outcomes":[{"weight":2,"text":"It's the library book. You swap it for a frozen teether. {kid} accepts, with the face of someone who got the better deal and knows it.","effects":{"energy":-6,"mood":-4},"set":["hz:w_book_chewed"],"cancel":["w_book_chewed"]},{"text":"It's not the library book. It's the TV remote. The volume-down button is gone. From now on, the TV only gets louder.","effects":{"energy":-4},"set":["hz:w_book_chewed"],"cancel":["w_book_chewed"]}]},{"label":"Whatever it is, it's helping","duration":2,"outcomes":[{"text":"The whimpering stops. Something is working. You decide not to find out what. Not knowing is a choice, and you're making it.","effects":{"energy":10}}]}]},{"id":"w_book_chewed","title":"Library Property","text":"The library book about a sleepy bear now has a bite-shaped bay where the bear used to be. The sticker on the back says \"Damaged items will be billed.\"","hazard":"sting","tell":"w_chew_tell","when":{"flags":["d:teething"],"notFlags":["hz:w_book_chewed"]},"choices":[{"label":"Confess at the library desk","duration":20,"outcomes":[{"weight":2,"text":"\"Teething?\" asks the librarian, already holding the form. They keep a whole drawer of chewed bears. $14.99 and a pamphlet about board books.","effects":{"energy":-6},"set":["hz:w_book_chewed"]},{"text":"The librarian waves it off. \"We'll call it wear.\" You would now vote for any bond measure this person proposes.","effects":{"energy":-2},"set":["hz:w_book_chewed"],"stamp":"AMNESTY GRANTED"}]},{"label":"Clear tape. Strategic bookmark.","duration":5,"outcomes":[{"text":"Tape, hope and a bookmark placed exactly over the bite. At bedtime {partner} opens it, lifts the bookmark and looks at you for a long, long time.","effects":{"energy":4,"rel":-6},"set":["hz:w_book_chewed"]}]}]},{"id":"lego","title":"You Said the Word","text":"A minivan merged into your lane like it had always been there. You said a word. A [BLEEP] word. From the back seat, {kid} said it right back, in your exact intonation, and is now teaching it to the stuffed rabbit.","hazard":"sting","weight":2,"when":{"notFlags":["hz:lego"]},"choices":[{"label":"Insist you said \"duck\"","duration":2,"outcomes":[{"text":"\"Duck,\" you say, firmly, eleven times. {kid} nods along. \"[BLEEP],\" they agree.","effects":{"energy":-4},"set":["bleep:taught","hz:lego"],"count":{"bleeps":1},"stamp":"NICE TRY"},{"text":"\"DUCK!\" they shout, flapping, thrilled. It worked. Thank you, duck.","effects":{"mood":8,"energy":-2},"set":["hz:lego"],"count":{"bleeps":1}}]},{"label":"Don't react. Reacting makes it a hit.","duration":5,"tags":["boundary"],"snapRisk":true,"outcomes":[{"text":"You say nothing. They say it nine more times, watching your face. Nothing. They move on. The word goes into the vault, to wait for a bigger audience.","effects":{"energy":-6,"mood":-4},"set":["bleep:taught","hz:lego"],"count":{"bleeps":1},"stamp":"FILED FOR LATER"}]}]},{"id":"w_pajama_day","title":"Pajama Day Was Today","text":"It was Pajama Day. You found out the way you find out everything: 31 photos in the class chat at 3:12 PM.","chat":{"with":"Caterpillar Room Parents 🐛 (23)","messages":[{"from":"Dana","text":"[31 photos: tiny pajamas]"},{"from":"Dana","text":"PAJAMA DAY WAS A HIT 😍😍"},{"from":"Marcus","text":"lol who's the little CEO in the cable-knit sweater"}]},"hazard":"sting","when":{"notFlags":["d:home","hz:w_pajama_day"],"min":{"sleepy":30}},"choices":[{"label":"Reply: \"Dress for the job you want.\"","duration":1,"outcomes":[{"text":"Fourteen laughing faces and one \"LEGEND.\" The sweater is the class mascot now.","effects":{"energy":8},"set":["hz:w_pajama_day"],"chat":[{"from":"Marcus","text":"framing this"}]},{"text":"A pause. Then Brynn replies. You go back and count the reminders. There were three.","effects":{"energy":-12},"set":["hz:w_pajama_day"],"chat":[{"from":"Brynn","text":"The reminder went out three times! 🙂"}]}]},{"label":"Leave it on read. Let the sweater speak.","duration":1,"outcomes":[{"text":"Someone replies, \"Aw, they looked so professional!\" with no emoji. You will think about that missing emoji in the shower for a week.","effects":{"energy":-2},"set":["hz:w_pajama_day"]}]}]},{"id":"w_grandma_kitchen","title":"The Kitchen Has Been Improved","text":"You left the room for 20 minutes, and Grandma reorganized your kitchen. It's efficient. It's logical. There are labels. You will never see the colander again.","hazard":"sting","when":{"flags":["d:grandma"],"notFlags":["hz:w_grandma_kitchen"]},"choices":[{"label":"\"Wow. Thank you.\"","duration":1,"outcomes":[{"weight":2,"text":"She glows. You look for a spoon nine times today. The spoons are in a drawer labeled SPOONS. You never once think to look there.","effects":{"energy":-10,"rel":4},"set":["hz:w_grandma_kitchen"]},{"text":"She glows, and does the bathroom next. You'll find the toothbrushes in April, in a jar marked TEETH.","effects":{"energy":-6,"rel":6},"set":["hz:w_grandma_kitchen"]}]},{"label":"\"Where's the colander, though?\"","duration":3,"outcomes":[{"text":"She shows you. Then she tells the family group chat you were \"a little short\" with her. Your cousin reacts with 😬.","effects":{"energy":-8},"set":["hz:w_grandma_kitchen"]},{"text":"She shows you. It's somewhere genuinely better. You both know it. Neither of you will ever say it.","effects":{"energy":6},"set":["hz:w_grandma_kitchen"]}]},{"label":"Put it all back tonight, in secret","duration":40,"minEnergy":25,"tags":["martyr"],"outcomes":[{"text":"You move 140 items back to their wrong, correct places. In the morning she says nothing, beautifully. It will come up at Thanksgiving.","effects":{"energy":-12,"rel":8},"set":["hz:w_grandma_kitchen"]}]}]},{"id":"hz_sippy","title":"The Sippy Cup From the Weekend","text":"A smell. Not a diaper smell. A smell with a backstory. Somewhere in this house, a sippy cup of milk has been hiding since the weekend.","hazard":"sting","when":{"notFlags":["hz:hz_sippy"]},"choices":[{"label":"Follow your nose","duration":20,"minEnergy":20,"outcomes":[{"weight":2,"text":"Inside a rain boot by the door. Do not open it. You open it. Something in there has developed a culture, and a flag.","effects":{"energy":-8,"rel":6},"set":["hz:hz_sippy"],"stamp":"SOVEREIGN NATION"},{"text":"Twenty-five minutes of sniffing. Nothing. Then the smell stops. That's worse. Somewhere, it's waiting.","effects":{"energy":-10},"set":["hz:hz_sippy"]}]},{"label":"Open every window. Light a candle.","duration":3,"outcomes":[{"text":"The house now smells like milk and \"Autumn Hearth.\" {kid} sniffs the air and says, \"Pancakes.\" Nobody in this house will eat pancakes again.","effects":{"energy":2,"rel":-4},"set":["hz:hz_sippy"]}]},{"label":"Let {partner} find it","duration":1,"tags":["tagteam"],"outcomes":[{"text":"They find it at 6:15, in the toy chest, and hold it up at arm's length. \"Whose turn was it to check the cups?\" It was everyone's. It was no one's.","effects":{"rel":-8,"energy":4},"set":["hz:hz_sippy"]},{"text":"They don't notice the smell. Nobody notices the smell. You start to wonder if you're the smell.","effects":{"energy":4,"rel":-4},"set":["hz:hz_sippy"]}]}]},{"id":"hz_lost_shoe","title":"One Shoe","text":"Halfway through the errand, you look down. {kid} has one shoe. The other is somewhere along the last six blocks. \"Shoe went bye-bye,\" {kid} explains, at peace.","hazard":"sting","when":{"notFlags":["d:home","hz:hz_lost_shoe"],"min":{"sleepy":25}},"choices":[{"label":"Retrace all six blocks","duration":30,"minEnergy":20,"outcomes":[{"weight":2,"text":"Four blocks back, someone has set it on top of a fence post, the way strangers do. A small public monument to your lapse. You collect it with dignity.","effects":{"energy":-10,"mood":6},"set":["hz:hz_lost_shoe"]},{"text":"Six blocks out, six blocks back. Nothing. At home, the shoe is in the car seat, where it has been the whole time, holding the sock.","effects":{"energy":-14},"set":["hz:hz_lost_shoe"],"stamp":"INSIDE JOB"}]},{"label":"New shoes. $38. Done.","duration":15,"outcomes":[{"weight":2,"text":"$38, light-up, the only pair in their size. They light up with every step for the next two years, including in the hallway, in the dark, at 3 AM.","effects":{"mood":12,"energy":-4,"debt":4},"set":["hz:hz_lost_shoe"]},{"text":"$38, and {kid} refuses them on sight. \"Those aren't my shoes.\" They aren't. They're better. That's the problem.","effects":{"mood":-8,"energy":-6},"set":["hz:hz_lost_shoe"]}]},{"label":"Carry them the rest of the way","duration":10,"outcomes":[{"text":"You carry 28 pounds of toddler through the rest of the errand. {kid} waves at everyone like a parade float. Your lower back submits its resignation.","effects":{"energy":-14,"mood":6},"set":["hz:hz_lost_shoe"]}]}]},{"id":"stomach_bug","title":"Patient Zero","text":"It began with one ominous burp. It ended with you catching it in the salad bowl, one-handed, without looking. You've never been more athletic. You'll never use that bowl again.","hazard":"catastrophe","weight":2,"when":{"notFlags":["hz:stomach_bug"]},"choices":[{"label":"Bleach everything that holds still","duration":45,"minEnergy":30,"tags":["martyr"],"outcomes":[{"text":"Doorknobs, remotes, light switches, the fridge handle. You smell like a public pool. It works: the bug stops at {kid}, who is already demanding toast.","effects":{"energy":-22,"debt":8},"set":["hz:stomach_bug"],"stamp":"OUTBREAK CONTAINED","fx":"confetti"},{"text":"Forty-five minutes of bleach. At 9:40 PM, {partner} goes quiet and pale at the sink. The bug has found a host with a commute.","effects":{"energy":-22,"rel":-8,"debt":8},"set":["bug:house","hz:stomach_bug"],"stamp":"SECOND CASE","fx":"flash"}]},{"label":"Towels down. Every floor. Brace.","duration":15,"outcomes":[{"text":"You lay towels like sandbags before a flood. {kid} perks up within the hour and wants to wrestle. The laundry pile needs a building permit.","effects":{"energy":-10,"debt":8},"set":["bug:house","hz:stomach_bug"],"ledger":{"laundry":"you"},"fx":"shake"}]},{"label":"Text {partner}: \"bring ginger ale. and gloves.\"","duration":5,"tags":["tagteam"],"outcomes":[{"when":{"min":{"rel":55}},"text":"They come home with ginger ale, crackers, a thermometer and the face of someone walking into a burning building. Two adults, one bucket, a system.","effects":{"energy":-12,"rel":10,"debt":8},"set":["bug:house","hz:stomach_bug"],"ledger":{"laundry":"partner"},"stamp":"HAZMAT TEAM ASSEMBLED"},{"when":{"max":{"rel":54}},"text":"\"Can't, client dinner 😬.\" You run the hot zone alone and send them photos of the bucket, so they understand. They understand.","effects":{"energy":-20,"rel":-12,"debt":8},"set":["bug:house","hz:stomach_bug"],"fx":"shake"}]}]},{"id":"w_dino_flush","title":"Rex Went Swimming","text":"A flush. A gurgle. A small voice: \"Rex went swimming.\" Rex is a 5-inch plastic T. rex. The toilet is now a tide pool, and the tide is coming in.","hazard":"catastrophe","when":{"notFlags":["hz:w_dino_flush"]},"choices":[{"label":"Call the emergency plumber","duration":60,"outcomes":[{"weight":2,"text":"The plumber fishes Rex out with a tool like a robot arm. $240, plus an $85 \"rush fee\" for a rush that took 70 minutes. Rex now costs more than your couch did.","effects":{"energy":-10,"rel":-8},"set":["rex:flushed","hz:w_dino_flush"],"stamp":"$325 DINOSAUR","fx":"flash"},{"text":"The plumber retrieves Rex, waives the fee and confesses that their own kid once flushed a phone. You almost hug the plumber. You do hug Rex.","effects":{"energy":-8,"mood":8},"set":["rex:flushed","hz:w_dino_flush"]}]},{"label":"Plunger, gloves and a video tutorial","duration":45,"minEnergy":30,"tags":["martyr"],"outcomes":[{"text":"Forty minutes, one toilet snake and a noise you'll hear in your sleep. Rex emerges. {kid} greets Rex like a returning astronaut. Nobody greets you at all.","effects":{"energy":-20,"mood":12},"set":["rex:flushed","hz:w_dino_flush"],"stamp":"REX RECOVERED"},{"text":"The tutorial man made it look easy. The tutorial man had a different toilet. You call the plumber anyway, now with wet sleeves.","effects":{"energy":-20,"rel":-8},"set":["rex:flushed","hz:w_dino_flush"],"fx":"shake"}]},{"label":"Close the lid. Sign on the door. Later.","duration":5,"outcomes":[{"text":"\"OUT OF ORDER.\" You're a one-toilet household now, like pioneers. Rex is lost at sea. {kid} holds a small memorial at the bathtub, with crackers.","effects":{"mood":-12,"energy":4},"set":["rex:flushed","hz:w_dino_flush"],"fx":"shake"}]}]},{"id":"w_fever_call","title":"Daycare Is Calling","text":"Daycare: \"They're running 101. Can you come in the next hour?\" You are, at this exact second, unmuting yourself to present the numbers.","hazard":"catastrophe","when":{"flags":["d:deadline"],"notFlags":["d:home","hz:w_fever_call"]},"choices":[{"label":"Leave the meeting. Go now.","duration":40,"outcomes":[{"weight":2,"text":"You leave mid-word: \"So Q3 is—\". {kid} is flushed, floppy and so glad to see you. Fluids, rest, the dose on the fridge. Q3 will be whatever it is without you.","effects":{"energy":-14,"mood":8,"debt":8},"set":["hz:w_fever_call"]},{"text":"You leave mid-word. Trent texts, \"Go. We've got it.\" They do have it. It turns out you were never essential, which is hurtful and freeing.","effects":{"energy":-12,"mood":8,"debt":8},"set":["hz:w_fever_call"]}]},{"label":"Ask {partner} to get them","duration":5,"tags":["tagteam"],"outcomes":[{"when":{"min":{"rel":55}},"text":"\"Leaving now.\" They're there in 20 minutes. You present to a room of nodding faces while texting \"thank you\" under the table 14 times.","effects":{"energy":-8,"rel":6,"mood":-8,"debt":8},"set":["hz:w_fever_call"],"ledger":{"errands":"partner"},"stamp":"COVERED"},{"when":{"max":{"rel":54}},"text":"\"I'm in a thing too.\" Of course they are. You both leave your things. You both drive. You arrive at the same second from opposite ends of the lot.","effects":{"energy":-14,"rel":-12,"debt":6},"set":["hz:w_fever_call"]}]},{"label":"Present first. Then sprint.","duration":25,"outcomes":[{"text":"Nine minutes of slides at 1.5x speed. You say \"great question\" to a question nobody asked. You arrive in 58 minutes. The director's face says \"fifty-eight\" back to you.","effects":{"energy":-18,"mood":-12,"debt":4},"set":["hz:w_fever_call"],"stamp":"58 MINUTES","fx":"flash"}]}]},{"id":"w_lice_notice","title":"A Note From Daycare","text":"\"A case of head lice has been reported in the Caterpillar Room.\" You read it twice. Your scalp starts to itch immediately and will not stop until Sunday.","hazard":"catastrophe","when":{"notFlags":["hz:w_lice_notice","lice:1"]},"choices":[{"label":"Comb every head. Wash every pillow.","duration":90,"minEnergy":30,"tags":["martyr"],"outcomes":[{"weight":2,"text":"Fine-tooth comb, every head, every pillowcase on hot. You find nothing. You keep looking. You will dream in combs.","effects":{"energy":-24,"rel":4},"set":["hz:w_lice_notice"],"ledger":{"laundry":"you"}},{"text":"You find one! Under the lamp, with tweezers, heart pounding: it's glitter. It's always glitter.","effects":{"energy":-20,"mood":4},"set":["hz:w_lice_notice"],"ledger":{"laundry":"you"},"stamp":"FALSE POSITIVE"}]},{"label":"Split it with {partner} tonight","duration":10,"tags":["tagteam"],"outcomes":[{"when":{"min":{"rel":55}},"text":"You comb, they wash. Two adults bent over one small head under the good lamp at 8 PM, whispering \"anything?\" It's almost romantic. It isn't. But it's almost.","effects":{"energy":-12,"rel":6},"set":["hz:w_lice_notice"],"ledger":{"laundry":"partner"}},{"when":{"max":{"rel":54}},"text":"\"Can't it wait till the weekend?\" It cannot. You do it alone, loudly, so they can hear the combing from the couch.","effects":{"energy":-20,"rel":-14},"set":["hz:w_lice_notice"],"ledger":{"laundry":"you"}}]},{"label":"Book the lice clinic","duration":60,"outcomes":[{"text":"A calm professional with a magnifying lamp combs {kid} during cartoons. $180. A daycare parent recognizes your car in the lot and waves, slowly, from theirs.","effects":{"energy":-12},"set":["hz:w_lice_notice"],"stamp":"MUTUALLY ASSURED"}]}]},{"id":"w_lockout","title":"Locked Out","text":"You step onto the porch for one package. Behind you: click. Through the glass, {kid} waves, delighted, one hand still on the lock.","hazard":"catastrophe","when":{"flags":["d:home"],"notFlags":["hz:w_lockout"]},"choices":[{"label":"Yell for Dale. Dale has the spare key.","duration":15,"outcomes":[{"text":"Dale jogs over in a bathrobe and one slipper, holding the spare key aloft. {kid} is thrilled to have company. This story will be told at every block party, forever.","effects":{"energy":-10,"mood":6},"set":["hz:w_lockout"],"stamp":"BLOCK PARTY LORE"}]},{"label":"Coach them through unlocking it","duration":20,"minEnergy":25,"tags":["present"],"outcomes":[{"text":"\"Turn the little thing. The LITTLE thing.\" Ninth try: click. You cheer. They cheer. They lock it again, beaming, so you can both do that part again.","effects":{"energy":-14,"mood":16},"set":["hz:w_lockout"]},{"text":"They wave. They blow you a kiss. They wander off toward the snack drawer. Twenty minutes in, you yell for Dale anyway, now hoarse.","effects":{"energy":-18},"set":["hz:w_lockout"],"fx":"shake"}]},{"label":"Try the back door. Pray.","duration":5,"outcomes":[{"text":"It's open. You always leave it open, and you've scolded yourself about it for two years. Today it's the best thing about you.","effects":{"energy":-4},"set":["hz:w_lockout"],"stamp":"BAD HABIT VINDICATED"},{"weight":2,"text":"Locked. You fixed that habit last week. You're so proud of yourself. You're so locked out. You yell for Dale.","effects":{"energy":-10},"set":["hz:w_lockout"],"fx":"flash"}]}]},{"id":"hz_wrong_chat","title":"Wrong Chat","text":"You meant to send it to {partner}. You did not send it to {partner}.","chat":{"with":"Caterpillar Room Parents 🐛 (23)","messages":[{"from":"you","text":"if brynn says \"circle back\" about the bake sale one more time i'm changing my name and moving to a lighthouse"},{"from":"you","text":"no wifi. just fog"},{"from":"Brynn","text":"Happy to circle back on this! 🙂"}]},"hazard":"catastrophe","when":{"notFlags":["hz:hz_wrong_chat"]},"choices":[{"label":"Delete for everyone. Too late, but delete.","duration":2,"outcomes":[{"text":"Deleted. Twenty-two people saw it. Nine took screenshots. One screenshot is already in a different group chat, captioned with a skull.","effects":{"energy":-10},"set":["chat:brynn","hz:hz_wrong_chat"],"stamp":"RECEIPTS EXIST","fx":"flash"},{"text":"You delete it. You can't delete Brynn's reply, so you delete the whole app. Your phone has never been so peaceful. You reinstall it at 11:40 PM to check.","effects":{"energy":-4},"set":["chat:brynn","hz:hz_wrong_chat"]}]},{"label":"Commit: \"...and I stand by it.\"","duration":1,"outcomes":[{"text":"Silence. Then a private text from Marcus. Then four more, from four other parents. You've started a movement. It doesn't have a name yet.","effects":{"energy":6},"set":["chat:brynn","hz:hz_wrong_chat"],"chat":[{"from":"Marcus","text":"thank you for your service 🫡"}],"stamp":"MOVEMENT STARTED"},{"weight":2,"text":"Silence for eleven hours. Then the bake sale sign-up sheet arrives with your name already on it. On every line.","effects":{"energy":-12},"set":["chat:brynn","hz:hz_wrong_chat"],"chat":[{"from":"Brynn","text":"Put you down for everything! So excited 🙂"}],"stamp":"VOLUNTOLD","fx":"shake"}]},{"label":"\"Sorry!! {kid} got my phone 😅\"","duration":1,"outcomes":[{"text":"Brynn replies, \"Wow, they spell so well for two!\" Eleven people like Brynn's reply. Nobody likes yours.","effects":{"energy":-12},"set":["chat:brynn","hz:hz_wrong_chat"]},{"text":"It works. Everyone believes it. {kid} now has a reputation as a toddler with strong views on bake sales. Brynn now addresses them directly.","effects":{"mood":4,"energy":-4},"set":["chat:brynn","hz:hz_wrong_chat"]}]}]},{"id":"hz_glitter","title":"The Glitter Event","text":"{kid} found the craft glitter (4 oz, \"Galaxy Purple\") and held it open in front of the box fan. The fan was on. The house is now faintly purple, and will be, scientifically, forever.","hazard":"catastrophe","when":{"notFlags":["hz:hz_glitter"]},"choices":[{"label":"Vacuum. Then vacuum the vacuum.","duration":60,"minEnergy":30,"tags":["martyr"],"outcomes":[{"weight":2,"text":"An hour, two vacuum bags and a lint roller. You get 90%. The other 10% will turn up for years: in the butter, in your eyebrow, at a funeral.","effects":{"energy":-22,"rel":10},"set":["hz:hz_glitter"],"stamp":"90% RECOVERED"},{"text":"The vacuum, it turns out, was already full. For one hour it exhales everything back into the room, in a long purple sigh.","effects":{"energy":-22,"rel":-4},"set":["hz:hz_glitter"],"stamp":"VACUUM BETRAYAL","fx":"shake"}]},{"label":"Turn off the fan. Accept the new decor.","duration":2,"outcomes":[{"weight":2,"text":"You turn off the fan. That's all you do. When the late sun hits the couch, the living room becomes a sad disco for one.","effects":{"mood":10,"energy":4,"rel":-12},"set":["hz:hz_glitter"],"fx":"shake"},{"text":"{partner} comes home, takes in the purple from the doorway and sits down on the floor without a word. You sit down next to them. You both sparkle.","effects":{"rel":6,"energy":4},"set":["hz:hz_glitter"]}]},{"label":"Lean in. Put on music. Dance in it.","duration":30,"minEnergy":25,"tags":["present"],"outcomes":[{"text":"Half an hour of dancing in a purple haze. It's genuinely magical. It's also on the dancers, and in the dancers, and in the fridge.","effects":{"mood":18,"energy":-10,"sleepy":8,"rel":-6},"set":["hz:hz_glitter"]}]}]},{"id":"hz_inlaws","title":"Eleven Minutes Out","text":"{partner} texts: their parents are \"in the neighborhood\" and \"popping by.\" ETA: 11 minutes. There is a waffle on the bookshelf, filed between two cookbooks.","hazard":"catastrophe","when":{"notFlags":["hz:hz_inlaws"]},"choices":[{"label":"Everything into the bathtub. Close the curtain.","duration":11,"minEnergy":25,"tags":["martyr"],"outcomes":[{"weight":2,"text":"Toys, laundry, mail and the waffle go in the tub. Curtain closed. The house looks staged. They stay 40 minutes and compliment your \"minimalism.\"","effects":{"energy":-12,"rel":10},"set":["hz:hz_inlaws"],"stamp":"STAGED TO SELL","fx":"confetti"},{"text":"Then {partner}'s mother asks to wash her hands. Opens the curtain, because of course. Closes it. Says nothing, which is louder.","effects":{"energy":-12,"rel":-16},"set":["hz:hz_inlaws"],"stamp":"CURTAIN OPENED","fx":"flash"}]},{"label":"Lights off. Nobody's home.","duration":15,"outcomes":[{"text":"You crouch below the window with {kid}. The doorbell rings. {kid} stands, presses their whole face to the glass and waves. The in-laws wave back. You stay crouched. You don't know why.","effects":{"rel":-20,"energy":4},"set":["hz:hz_inlaws"],"stamp":"WE SEE YOU","fx":"shake"}]},{"label":"Open the door: \"Welcome to the toddler's house.\"","duration":40,"outcomes":[{"text":"They step over a laundry pile and sit in a cushion fort. \"Oh, this takes me back,\" says {partner}'s dad, and means it. They do the dishes before they leave.","effects":{"rel":10,"energy":-8},"set":["hz:hz_inlaws"]},{"text":"{partner}'s mother runs a finger along the bookshelf and stops at the waffle. \"Is this... decor?\" It is now. It's decor now.","effects":{"rel":-10,"energy":-8},"set":["hz:hz_inlaws"]}]}]},{"id":"hz_bug_sequel","title":"The Bug Is on Tour","text":"6:40 AM. Your stomach makes a sound like a garage door. {kid}, fully recovered, eats a waffle and watches you like a headliner watching the opener. The bug is on tour. Tonight: you.","window":[300,720],"oncePerWeek":true,"when":{"flags":["bug:house"]},"choices":[{"label":"Tap out. {partner} has the con.","duration":5,"tags":["tagteam"],"outcomes":[{"when":{"min":{"rel":55}},"text":"{partner} calls in, takes {kid} to the duck pond and texts you a photo of every duck. Eleven ducks. You rate each one from the bathroom floor. All tens.","effects":{"energy":8,"rel":8,"mood":4},"ledger":{"morning":"partner"}},{"when":{"max":{"rel":54}},"text":"\"I literally have the board thing.\" You both look at the bucket. They leave at 11. You parent from the floor, horizontally, until 6.","effects":{"energy":-20,"rel":-12}}]},{"label":"Lie down. Let {kid} run the clinic.","duration":30,"outcomes":[{"text":"{kid} brings you nine toys, one sock and a cracker \"for your tummy.\" You don't eat it. You keep it. It's the nicest thing anyone has given you all week.","effects":{"energy":-16,"mood":8}}]},{"label":"Ginger ale and denial","duration":2,"outcomes":[{"text":"It passes. It was just a feeling. You eat a sleeve of saltines in triumph. At lunch, {partner} texts a single word: \"bucket.\"","effects":{"energy":4,"rel":-8},"stamp":"DODGED IT"},{"text":"It's not denial-shaped. It's bug-shaped. By 10 AM you're on the bathroom floor, cheek to the tile, getting to know the grout.","effects":{"energy":-24},"fx":"shake"}]}]},{"id":"moment_long_arms","title":"The Family Portrait","text":"{kid} hands you a drawing. \"This is {partner}. This is me. This is you.\" You're a circle with two arms that go all the way to the edges of the paper.","window":[540,1110],"weight":1,"weightBy":{"counter":"style.present","every":3},"oncePerWeek":true,"moment":true,"choices":[{"label":"\"Why are my arms so long?\"","duration":3,"outcomes":[{"weight":1,"text":"\"For carrying me,\" they say. Like it's obvious. It goes on the fridge, at their height, under the good magnet.","effects":{"energy":14,"mood":10},"count":{"moments":1}},{"weight":1,"text":"\"So you can reach me,\" they say, \"from anywhere.\" It goes on the fridge, at their height, under the good magnet.","effects":{"energy":14,"mood":10},"count":{"moments":1}}]},{"label":"Send a photo of it to {partner}","duration":2,"outcomes":[{"text":"{partner} calls from work just to hear about it. You describe the arms. There's a long pause on the line. \"Yeah,\" they say. \"That's right.\"","effects":{"rel":10,"energy":8},"count":{"moments":1}}]}]},{"id":"moment_my_me","title":"Pickup","text":"Daycare pickup. {kid} spots you across the room, drops a whole tambourine and runs at you, telling everyone, \"THAT'S MY {ME}! THAT'S MY {ME}!\"","window":[930,1080],"weight":1,"weightBy":{"counter":"style.present","every":3},"oncePerWeek":true,"moment":true,"when":{"notFlags":["d:home"]},"choices":[{"label":"Crouch down. Catch them.","duration":3,"outcomes":[{"weight":1,"text":"They hit you at full speed. Two other kids stop and stare at you like you're somebody. Today, you are.","effects":{"energy":18,"mood":10},"count":{"moments":1},"fx":"confetti"},{"weight":1,"text":"They hit you at full speed and don't let go. Their teacher says, \"They've been watching the door since three.\" You hold on a little longer than they do.","effects":{"energy":16,"mood":12},"count":{"moments":1}}]},{"label":"Let them give you the tour","duration":8,"outcomes":[{"text":"They pull you around by one finger to meet the class fish, their cubby and a boy named Mateo. \"This is my {ME},\" they tell each one.","effects":{"mood":12,"energy":8},"count":{"moments":1}}]}]},{"id":"moment_your_voice","title":"Your Voice, Coming Back","text":"You sit down on the stairs with a work email and a long sigh. {kid} climbs up, rubs your back in small circles and says, in your exact 2 AM voice, \"Shhh. I'm here. I'm right here.\"","window":[600,1140],"weight":1,"weightBy":{"counter":"style.present","every":3},"oncePerWeek":true,"moment":true,"choices":[{"label":"Let them take care of you","duration":5,"outcomes":[{"weight":1,"text":"You let them. Small circles, a little too hard. They keep going until you laugh, and then a little longer, to be sure.","effects":{"energy":16,"mood":6},"count":{"moments":1}},{"weight":1,"text":"You let them. The circles turn into pats, and the pats turn into the song you sing at 2 AM, half the words wrong, perfectly on time. You don't move until it's over.","effects":{"energy":16,"mood":6},"count":{"moments":1}}]},{"label":"\"Where did you learn that?\"","duration":2,"outcomes":[{"text":"\"From you,\" they say. Every night you thought nobody was watching, somebody was.","effects":{"energy":12},"count":{"moments":1}}]}]},{"id":"moment_mid_protest","title":"\"I'm Not Ti—\"","text":"\"I'm not tired,\" {kid} explains, lying face down on your chest. \"I'm not tired. I'm not ti—\" Out. Mid-word. One fist still holding your shirt.","window":[780,1100],"weight":1,"weightBy":{"counter":"style.present","every":3},"oncePerWeek":true,"moment":true,"choices":[{"label":"Don't move. Not for anything.","duration":30,"outcomes":[{"weight":1,"text":"Your phone buzzes on the counter, out of reach. Let it. You don't move for thirty minutes. The fist never lets go of your shirt.","effects":{"energy":18,"mood":8,"sleepy":-12},"count":{"moments":1}},{"weight":1,"text":"Thirty minutes. Once, they say \"no\" very firmly to something in a dream, then go heavy again. You don't move. You'd forgotten you could be this still.","effects":{"energy":18,"mood":8,"sleepy":-12},"count":{"moments":1}}]},{"label":"Ease them onto the couch, inch by inch","duration":8,"outcomes":[{"text":"Eleven inches in four minutes. They don't wake. The fist lets go of your shirt last, and only to take a fistful of blanket.","effects":{"energy":10,"mood":4,"sleepy":-12},"count":{"moments":1}}]}]},{"id":"moment_future","title":"Future Plans","text":"From the back seat, {kid} produces their longest sentence ever: \"When I'm big, I'm going to drive, and you can sit in the back and have a snack.\" Eighteen words. You count them at a red light.","window":[900,1110],"weight":1,"weightBy":{"counter":"style.present","every":3},"oncePerWeek":true,"moment":true,"choices":[{"label":"\"Deal.\"","duration":2,"outcomes":[{"weight":1,"text":"They nod, satisfied, and spend the rest of the drive practicing on the back of your seat. Left turn. Right turn. A very careful stop.","effects":{"energy":14,"mood":8},"count":{"moments":1}},{"weight":1,"text":"\"And I'll do the music,\" they add. \"And I'll say 'almost there.'\" They've been listening from back there the whole time. Every drive.","effects":{"energy":14,"mood":8},"count":{"moments":1}}]},{"label":"\"What snack do I get?\"","duration":5,"outcomes":[{"text":"They think about it for two whole blocks. \"The good one,\" they decide. \"The one I like.\" From them, there is no higher honor.","effects":{"energy":10,"mood":12},"count":{"moments":1}}]}]},{"id":"moment_three_hearts","title":"Three Hearts","text":"\"{ME}. Did you know an octopus has three hearts?\" You did. You told them in August, at the aquarium, holding them up to the glass.","window":[480,1140],"weight":1,"weightBy":{"counter":"style.present","every":3},"oncePerWeek":true,"moment":true,"choices":[{"label":"\"No! Really?\"","duration":3,"outcomes":[{"weight":1,"text":"Their face when they get to teach you something. They hold up three fingers, then four, then three, to be sure you've got it. You've got it.","effects":{"energy":12,"mood":12},"count":{"moments":1}},{"weight":1,"text":"\"Three,\" they say. Then they put a hand flat on your chest to count yours. They count to one and leave the hand there.","effects":{"energy":12,"mood":12},"count":{"moments":1}}]},{"label":"\"I told you that.\"","duration":2,"outcomes":[{"text":"\"I know,\" they say, patiently. \"I'm telling you back.\"","effects":{"energy":16,"mood":4},"count":{"moments":1}}]}]},{"id":"moment_too","title":"\"Too.\"","text":"Nap time. You're halfway out the door when a small voice from the dark says, \"I love you too, {me}.\" You hadn't said it yet. They were answering something you say every day.","window":[720,900],"weight":1,"weightBy":{"counter":"style.present","every":3},"oncePerWeek":true,"moment":true,"choices":[{"label":"Go back in and say it properly","duration":3,"outcomes":[{"weight":1,"text":"You say it into their hair. \"Too,\" they say again, mostly asleep. They don't need the first part anymore. They have it.","effects":{"energy":12,"mood":8},"count":{"moments":1}},{"weight":1,"text":"\"Love you,\" you say into their hair. \"Too,\" they say. \"Too,\" you say. You go back and forth like that, quieter each time, until one of you is asleep. It's them. Barely.","effects":{"energy":12,"mood":8},"count":{"moments":1}}]},{"label":"Stand in the doorway until they're out","duration":10,"outcomes":[{"text":"Ten minutes in the dark, listening to them breathe. You've said it a thousand times. You never once wondered if it was landing.","effects":{"energy":18},"count":{"moments":1}}]}]},{"id":"moment_how_you_met","title":"How You Met","text":"From the hallway you hear {partner} telling {kid} how you met: the wrong train, the shared umbrella, two coffees gone cold. They skip the parking ticket. {kid} keeps asking, \"Then what?\"","window":[1020,1165],"weight":1,"weightBy":{"counter":"style.present","every":3},"oncePerWeek":true,"moment":true,"choices":[{"label":"Walk in and tell the parts they skipped","duration":10,"outcomes":[{"weight":1,"text":"You tell the parking ticket. {partner} tells how long you argued with the meter. {kid} laughs at all of it without understanding any of it, because you're both laughing.","effects":{"rel":12,"mood":8,"energy":4},"count":{"moments":1}},{"weight":1,"text":"You tell the parking ticket part. \"Then what?\" {kid} asks, and you both realize you've reached the part where they come in. You just look at them for a second too long.","effects":{"rel":12,"mood":8,"energy":4},"count":{"moments":1}}]},{"label":"Stay in the hallway and listen","duration":5,"outcomes":[{"text":"\"Then what?\" \"Then we got you.\" You stay out of sight. Some things you only get to hear from the hallway.","effects":{"rel":8,"energy":12},"count":{"moments":1}}]}]},{"id":"moment_forecast","title":"The Forecast","text":"{kid} climbs into your lap and reads your face out loud. \"You happy.\" A long look. \"Now you thinking.\" A longer look. \"Now you tired.\" Three for three.","window":[480,1140],"weight":1,"weightBy":{"counter":"style.present","every":3},"oncePerWeek":true,"moment":true,"choices":[{"label":"\"I am tired. How did you know?\"","duration":3,"outcomes":[{"text":"They pat your cheek twice and announce, \"Now you happy.\" Then they wait, very seriously, for it to come true. It does.","effects":{"energy":16,"mood":4},"count":{"moments":1}}]},{"label":"Make faces and let them call it","duration":8,"outcomes":[{"weight":1,"text":"Surprised. Silly. Grumpy. A sneeze. They call every one, thrilled to be right. Then they put their forehead on yours and just look for a while.","effects":{"energy":10,"mood":14},"count":{"moments":1}},{"weight":1,"text":"They call every one, then demand a turn: their surprised face, their silly face, and their tired face, which is your tired face, exactly.","effects":{"energy":10,"mood":14},"count":{"moments":1}}]}]},{"id":"night_need","title":"Unspecified Need","text":"2:14 AM. \"{ME}. I need you.\" You're there in eleven seconds. \"What do you need?\" A long pause in the dark. \"...I don't know.\"","phase":"night","weight":3,"oncePerWeek":true,"when":{"notFlags":["night:need"]},"choices":[{"label":"Go through every need, alphabetically","duration":15,"tags":["negotiate"],"outcomes":[{"weight":2,"text":"Blanket? No. Bun-Bun? No. Cup? No. Door open? No. \"Elbow?\" An elbow comes out from under the blanket. You hold the elbow until 2:40.","effects":{"energy":-6,"debt":-2},"ledger":{"night":"you"},"stamp":"NEED: ELBOW","set":["night:need"]},{"weight":1,"text":"You get as far as \"water\" before they're asleep. It might have been water. You finish the alphabet in your head out of spite. There's nothing for Q.","effects":{"energy":-8,"debt":-2},"ledger":{"night":"you"},"set":["night:need"]}]},{"label":"Lie on the floor until they figure it out","duration":30,"tags":["martyr"],"outcomes":[{"text":"You wake at 4:10 on the rug with a puzzle piece stuck to your cheek. They're asleep. Whatever they needed, it was you, horizontal.","effects":{"energy":-10,"debt":-4},"ledger":{"night":"you"},"set":["night:need"]}]},{"label":"\"Ask {partner}. {partner} knows.\"","duration":3,"tags":["tagteam"],"outcomes":[{"when":{"min":{"ledger":2}},"text":"{partner} goes in. Twenty minutes later they lie back down without a word. \"What did they need?\" \"I don't know,\" they say. \"But I gave it to them.\"","effects":{"energy":4},"ledger":{"night":"partner"},"set":["night:need"]},{"when":{"max":{"ledger":1}},"text":"\"They said {me},\" {partner} says, without opening their eyes. \"I heard it.\" Correct, and unbearable. You go back in.","effects":{"rel":-6},"ledger":{"night":"you"},"set":["night:need"]}]}]},{"id":"night_fake_sleep","title":"The Performance","text":"3:03 AM. Crying. Beside you, {partner}'s breathing switches from asleep to performing asleep. You know the difference. You've given that performance.","phase":"night","weight":3,"oncePerWeek":true,"when":{"notFlags":["night:fakesleep"]},"choices":[{"label":"Out-sleep them. Commit fully.","duration":8,"outcomes":[{"weight":1,"text":"Nine minutes of competitive sleeping. {partner} cracks first, lets out a sigh with paragraphs in it and gets up. You stay limp until the door closes, to sell it.","effects":{"rel":-4},"ledger":{"night":"partner"},"stamp":"OUT-SLEPT","set":["night:fakesleep"]},{"weight":1,"text":"Neither of you breaks. The crying stops on its own at 3:12. You both lie there in the dark, knowing exactly what the other one did.","effects":{"rel":-6,"debt":3},"set":["night:fakesleep"]},{"weight":1,"text":"\"Nobody breathes that evenly,\" {partner} whispers. \"Not even asleep.\" Betrayed by your own lungs. You go.","effects":{"rel":-4},"ledger":{"night":"you"},"stamp":"PERFORMANCE: REVIEWED","set":["night:fakesleep"]}]},{"label":"Whisper, \"I know you're awake.\"","duration":2,"tags":["tagteam"],"outcomes":[{"when":{"min":{"ledger":2}},"text":"\"I know you know,\" {partner} whispers. A long pause. \"...Fine.\" They go. The ledger remains undefeated.","effects":{"energy":4},"ledger":{"night":"partner"},"set":["night:fakesleep"]},{"when":{"max":{"ledger":1}},"text":"\"And I know what the ledger says,\" {partner} whispers back. So do you. You go.","effects":{"rel":-4},"ledger":{"night":"you"},"set":["night:fakesleep"]}]},{"label":"Get up. Sigh loud enough to go on the record.","duration":15,"tags":["martyr"],"outcomes":[{"text":"You sigh at a volume that will come up in future arguments. {partner} says, \"Thank you,\" which ruins it, because now you can't be mad.","effects":{"rel":6},"ledger":{"night":"you"},"stamp":"ON THE RECORD","set":["night:fakesleep"]}]}]},{"id":"night_at_one","title":"Was There a One?","text":"3:31 AM. Crying again. \"I got up at one,\" {partner} whispers. You have no memory of one. You're not sure one happened. You're not sure this is happening.","phase":"night","weight":3,"oncePerWeek":true,"when":{"notFlags":["night:atone"]},"choices":[{"label":"\"Prove it.\"","duration":4,"tags":["negotiate"],"outcomes":[{"when":{"min":{"ledger":2}},"text":"{partner} thinks about it for a long time. \"...I might have dreamed one.\" They get up. Somewhere, one o'clock is laughing at both of you.","effects":{"energy":4},"ledger":{"night":"partner"},"stamp":"ONE: UNPROVEN","set":["night:atone"]},{"when":{"max":{"ledger":1}},"text":"They describe one in detail: the rabbit, the wet sock, you snoring through all of it. One happened. You go.","effects":{"rel":-6},"ledger":{"night":"you"},"stamp":"ONE: CONFIRMED","set":["night:atone"]}]},{"label":"\"I ALSO got up at one.\"","duration":2,"outcomes":[{"weight":1,"text":"\"...Oh,\" says {partner}, thrown. You both lie there wondering if one o'clock had two of you in it. They get up, just in case.","effects":{"energy":4},"ledger":{"night":"partner"},"set":["night:atone"]},{"weight":2,"text":"\"At one you were asleep with your mouth open,\" {partner} whispers. \"I took a photo.\" They have a photo. You go.","effects":{"rel":-8},"ledger":{"night":"you"},"stamp":"EXHIBIT A","set":["night:atone"]}]},{"label":"Just go. Nobody can be trusted at 3:31.","duration":15,"outcomes":[{"text":"You go. They're asleep before you get there. You stand in the hallway at 3:40 trying to remember one. You remember a sock.","effects":{"rel":4},"ledger":{"night":"you"},"set":["night:atone"]}]}]},{"id":"night_phantom","title":"Phantom Cry","text":"You're standing next to the crib. {kid} is asleep. You don't remember getting up. You don't know if they called, or if your body just went without you.","phase":"night","weight":1,"oncePerWeek":true,"choices":[{"label":"Check the monitor app for evidence","duration":3,"outcomes":[{"text":"Last sound detected: 11:42 PM. Nobody called. Your body is volunteering now, like an intern who really wants the job.","effects":{"energy":-5}}]},{"label":"Stay a minute. Watch them breathe.","duration":10,"outcomes":[{"weight":1,"text":"One hand on the rail. Their back goes up and down, up and down. You stay ten minutes for no reason, and it's the best reason you've had all week.","effects":{"energy":6}},{"weight":1,"text":"Their eyes open. They look at you, say \"Hi\" at a normal volume, and are asleep again before you can answer. You'll never know if that counted.","effects":{"energy":4}}]},{"label":"Claim it on the ledger anyway","duration":2,"outcomes":[{"weight":1,"text":"\"Thanks for getting it,\" {partner} mumbles. You accept the credit. You did get up. Technically, for someone.","effects":{"rel":6},"ledger":{"night":"you"},"stamp":"CREDIT TAKEN"},{"weight":1,"text":"\"The monitor didn't go off,\" {partner} mumbles. \"I'd have heard it.\" They wouldn't have. But they're right.","effects":{"rel":-6},"stamp":"AUDITED"}]}]},{"id":"night_sleeptalk","title":"The Dream Report","text":"1:50 AM. On the monitor, {kid} says, clearly, fast asleep: \"No. That's not how you do it.\" A pause. Then, deeply disappointed in someone: \"Watch me.\"","phase":"night","weight":3,"oncePerWeek":true,"when":{"notFlags":["night:sleeptalk"]},"choices":[{"label":"Lie there and listen. Best show you get.","duration":10,"outcomes":[{"weight":2,"text":"\"...and THEN the duck,\" they explain to someone. \"NO. The OTHER duck.\" Then snoring. You'll think about the other duck all day.","effects":{"energy":6},"set":["night:sleeptalk"]},{"weight":1,"text":"The dream turns into an argument, and the argument turns into a scream. You lose the show and get the encore.","effects":{"energy":-4,"debt":3},"ledger":{"night":"you"},"set":["night:sleeptalk"]}]},{"label":"Wake {partner}. Nobody should hear this alone.","duration":3,"outcomes":[{"weight":1,"text":"\"Watch me,\" says the monitor, again. {partner} laughs into the pillow so hard the bed shakes. You haven't laughed together at 2 AM since before. You should do this more.","effects":{"rel":10},"set":["night:sleeptalk"]},{"weight":1,"text":"\"Why,\" {partner} says, flatly, at 1:52 AM. The monitor has gone silent. You have woken an adult to listen to nothing.","effects":{"rel":-6},"stamp":"WRONG CALL","set":["night:sleeptalk"]}]},{"label":"Go in and see who they're mad at","duration":10,"outcomes":[{"text":"The door creaks. {kid} sits straight up, wide awake and furious. Whoever they were mad at in the dream, it's you now.","effects":{"energy":-4,"debt":4},"ledger":{"night":"you"},"stamp":"IT'S YOU NOW","fx":"shake","set":["night:sleeptalk"]}]}]},{"id":"night_fourteen_inches","title":"Fourteen Inches","text":"{kid} is asleep between you. Nobody can move. Nobody can speak. {partner} texts you from fourteen inches away.","chat":{"with":"{partner}","messages":[{"from":"{partner}","text":"dont move"},{"from":"you","text":"im not moving"},{"from":"{partner}","text":"something is moving"},{"from":"you","text":"thats their foot. its in my ribs"},{"from":"{partner}","text":"who's carrying them back"}]},"phase":"night","weight":3,"oncePerWeek":true,"when":{"notFlags":["night:fourteen"]},"choices":[{"label":"\"rock paper scissors. in the dark. go\"","duration":3,"outcomes":[{"weight":1,"text":"You throw rock. They throw something you can't see and claim it was paper. You can't prove it. You carry {kid} back.","effects":{"rel":-4},"ledger":{"night":"you"},"chat":[{"from":"{partner}","text":"paper 📄"}],"set":["night:fourteen"]},{"weight":1,"text":"You throw paper and whisper \"paper.\" They concede. The mattress shifts as they lift {kid} like a cake with the candles already lit.","effects":{"energy":4},"ledger":{"night":"partner"},"chat":[{"from":"{partner}","text":"fine"}],"set":["night:fourteen"]}]},{"label":"\"leave them. we live like this now\"","duration":2,"outcomes":[{"text":"You sleep on nine inches of mattress. You wake at 5 with a heel in your ear and a hand on your face. You'll be sore all day. You won't mind.","effects":{"energy":-8,"debt":-4,"rel":4},"chat":[{"from":"{partner}","text":"goodnight from the edge"}],"set":["night:fourteen"]}]},{"label":"carry them back yourself. no notes.","duration":10,"minEnergy":20,"tags":["martyr"],"outcomes":[{"weight":2,"text":"A flawless transfer. They don't stir. You get back into a bed that is suddenly enormous.","effects":{"rel":6,"debt":-2},"ledger":{"night":"you"},"chat":[{"from":"{partner}","text":"legend"}],"set":["night:fourteen"]},{"weight":1,"text":"Halfway down the hall they open their eyes, see the hallway and understand everything. The scream wakes the neighbor's dog.","effects":{"energy":-6,"debt":4},"ledger":{"night":"you"},"fx":"shake","set":["night:fourteen"]}]}]},{"id":"night_ocean","title":"The Ocean Stops","text":"3:10 AM. The sound machine's ocean cuts out. The silence is so loud that {kid} sits up to find out what happened to the ocean.","phase":"night","weight":3,"oncePerWeek":true,"when":{"notFlags":["night:ocean"]},"choices":[{"label":"Be the ocean. \"Shhhhhhhhhhhhh.\"","duration":20,"outcomes":[{"weight":2,"text":"You shush for nineteen straight minutes. They lie back down. You're lightheaded and slightly blue, but you're a coastline now.","effects":{"energy":-6,"debt":-2},"ledger":{"night":"you"},"set":["night:ocean"]},{"weight":1,"text":"{kid} listens to your ocean, unimpressed. \"No. The REAL ocean.\" Your ocean has been reviewed.","effects":{"energy":-6,"debt":3},"ledger":{"night":"you"},"stamp":"OCEAN: REJECTED","set":["night:ocean"]}]},{"label":"Find the plug in the dark by feel","duration":5,"outcomes":[{"weight":1,"text":"You find a plug. You push it in. The ocean comes back mid-wave, like it never left. Nobody will ever know you did that.","effects":{"debt":-2},"ledger":{"night":"you"},"set":["night:ocean"]},{"weight":1,"text":"You find a plug. You push it in. It's the lamp. Sixty watts, straight into the face of a toddler who was 80% asleep.","effects":{"energy":-6,"debt":5},"ledger":{"night":"you"},"stamp":"WRONG PLUG","fx":"flash","set":["night:ocean"]}]},{"label":"Nudge {partner}: \"The ocean's down.\"","duration":2,"tags":["tagteam"],"outcomes":[{"when":{"min":{"ledger":2}},"text":"\"On it,\" {partner} mumbles, as if the ocean were a server. It's back up in ninety seconds. Nobody files a ticket.","effects":{"energy":4},"ledger":{"night":"partner"},"set":["night:ocean"]},{"when":{"max":{"ledger":1}},"text":"\"You bought it,\" {partner} says into the pillow. \"You support it.\" Brutal, but that's the policy. You go.","effects":{"rel":-4},"ledger":{"night":"you"},"set":["night:ocean"]}]}]},{"id":"night_is_it_morning","title":"\"Is It Morning?\"","text":"4:52 AM. A bright little voice: \"Is it morning?\" It is not morning. It's a number. They're standing in the crib holding one of your shoes. You don't know how they got a shoe.","phase":"night","weight":1,"oncePerWeek":true,"choices":[{"label":"\"It's still night.\" Repeat until true.","duration":15,"tags":["boundary"],"outcomes":[{"weight":2,"text":"You say it nine times in the same flat voice, like a gate agent. On the tenth, they lie down. You don't. Your body has clocked in.","effects":{"energy":-6,"debt":-2},"ledger":{"night":"you"}},{"weight":1,"text":"On the eleventh \"it's still night,\" a bird starts singing. {kid} points at the window, triumphant. The bird has testified against you.","effects":{"energy":-6,"debt":3},"ledger":{"night":"you"},"stamp":"THE BIRD TESTIFIED"}]},{"label":"Say \"your turn\" into the pillow","duration":3,"tags":["tagteam"],"outcomes":[{"when":{"min":{"ledger":3}},"text":"{partner} goes without a word. At 5:01 you hear them downstairs, whispering a book about diggers, doing every digger's voice. You fall asleep to the excavator.","effects":{"energy":6},"ledger":{"night":"partner"}},{"when":{"max":{"ledger":2}},"text":"\"Your turn for mornings,\" {partner} says into their pill

reeze","duration":1,"timeout":true,"outcomes":[{"text":"One long, slow, thorough lick, end to end. \"It tastes like coins,\" {kid} reports, delighted, to the man with the cough.","effects":{"mood":8,"energy":-8},"stamp":"TASTES LIKE COINS"}]}]},{"id":"panic_eggs","title":"Twelve Eggs, Two Small Arms","text":"The fridge is open. {kid} has the egg carton down from the top shelf and is holding it over their head with both arms, like a championship belt. They aren't looking at the eggs. They're looking at you.","window":[420,1100],"oncePerWeek":true,"timer":5,"choices":[{"label":"Lunge for the eggs","duration":1,"outcomes":[{"weight":2,"text":"You get both hands under the carton as it drops. Eleven eggs saved. One cracks quietly, in sympathy. You scramble it and eat it standing up, as a toast to yourself.","effects":{"energy":-4,"mood":-6},"stamp":"11 OF 12"},{"text":"You lunge. They flinch. You catch the carton upside down and open. Catching it, it turns out, was not the problem.","effects":{"energy":-6,"mood":4},"fx":"shake"}]},{"label":"\"Want to help me make breakfast with those?\"","duration":15,"minEnergy":25,"tags":["present"],"outcomes":[{"text":"They lower the carton like a sacred object and carry it to the counter, one step at a time. They crack two, mostly into the bowl. Best eggs you've ever eaten. Crunchy.","effects":{"mood":12,"energy":-8}}]},{"label":"Freeze","duration":1,"timeout":true,"outcomes":[{"text":"They keep eye contact the whole way down. Twelve eggs, one floor. \"Uh oh,\" they say, which is a lie. This was planned.","effects":{"energy":-6},"stamp":"PREMEDITATED","fx":"shake"}]}]},{"id":"panic_bleep_grandma","title":"Grandma, Meet the Word","text":"Grandma is at the table. {kid} has a new word, from the car, from you. They're looking right at Grandma. They're warming up the first letter.","window":[600,1140],"oncePerWeek":true,"timer":5,"when":{"flags":["d:grandma"]},"choices":[{"label":"\"Mom! How's your knee?\"","duration":2,"outcomes":[{"weight":2,"text":"Grandma's knee is a 20-minute topic, with diagrams. {kid} says the word twice, but nobody can hear it over the meniscus.","effects":{"energy":-2},"stamp":"MENISCUS DEFENSE"},{"text":"\"My knee's FINE.\" She turns back to {kid}, just in time.","effects":{"energy":-10},"count":{"bleeps":1}}]},{"label":"\"Can you say TRUCK?\"","duration":1,"outcomes":[{"text":"\"TRUCK!\" they announce, proudly. Grandma claps. Crisis averted by a vehicle.","effects":{"mood":4}},{"text":"\"[BLEEP],\" they announce, which rhymes with truck, but isn't truck.","effects":{"mood":4,"energy":-10},"count":{"bleeps":1}}]},{"label":"Freeze","duration":1,"timeout":true,"outcomes":[{"text":"\"[BLEEP],\" {kid} tells Grandma, crisply, in your exact voice. Grandma sets down her fork and looks at you, not them. She has waited 30 years for this.","effects":{"mood":6,"energy":-12},"count":{"bleeps":1},"stamp":"SOURCE IDENTIFIED","fx":"shake"}]}]},{"id":"panic_bleep_brynn","title":"Brynn Is Right There","text":"Pickup. Brynn, who once asked the group chat whether the microwave clock counts as screen time, is telling you about Juniper's violin recital. Juniper is two. {kid} remembers the word. {kid} is smiling.","window":[960,1080],"oncePerWeek":true,"timer":5,"when":{"flags":["bleep:taught"],"notFlags":["d:home"]},"choices":[{"label":"\"Sorry, Brynn, we're double-parked!\"","duration":1,"outcomes":[{"text":"You sprint for the car. {kid} says the word to the parking lot, which has heard worse.","effects":{"energy":-6},"count":{"bleeps":1}},{"text":"You aren't double-parked. You walked. Brynn knows you walked. Brynn watched you walk.","effects":{"energy":-8}}]},{"label":"Hug them. Hand over the mouth. Casually.","duration":1,"outcomes":[{"weight":2,"text":"The word goes into your palm, where it belongs. Brynn talks on about Juniper's bow hold. You hear none of it, and it's wonderful.","effects":{"mood":-6}},{"text":"It comes out muffled: \"Mmm-[BLEEP].\" Brynn hears every letter. Brynn's eyebrows go up and stay up.","effects":{"mood":-4,"energy":-8},"count":{"bleeps":1}}]},{"label":"Bring up the group chat thing yourself","duration":3,"when":{"flags":["chat:brynn"]},"outcomes":[{"text":"\"About the lighthouse message—\" Brynn lights up. Brynn has waited days for this. In the long, delicious conversation that follows, {kid}'s word goes unheard.","effects":{"energy":-10},"stamp":"BIGGER FIRE"}]},{"label":"Freeze","duration":1,"timeout":true,"outcomes":[{"text":"\"[BLEEP],\" {kid} tells Brynn, warmly. Brynn smiles the smile of someone who will mention this at the next three bake sales. \"Wherever did they hear THAT?\"","effects":{"energy":-12,"mood":6},"count":{"bleeps":1},"stamp":"BAKE SALE MATERIAL","fx":"shake"}]}]},{"id":"chat_yogurt","title":"Yogurt, Live","text":"{partner} stopped at the store on the way home. Alone. It should be fine.","chat":{"with":"{partner}","messages":[{"from":"{partner}","text":"which yogurt"},{"from":"{partner}","text":"[photo: 31 yogurts]"},{"from":"you","text":"the one with the cow"},{"from":"{partner}","text":"they ALL have cows"},{"from":"{partner}","text":"one cow is wearing a hat"}]},"window":[930,1030],"weight":2,"oncePerWeek":true,"when":{"notFlags":["d:handoff"]},"choices":[{"label":"\"NOT the hat cow.\"","duration":2,"outcomes":[{"weight":1,"text":"They buy the hat cow. You both knew they would. {kid} takes one bite, says \"HAT,\" and pushes it away forever.","effects":{"mood":-10,"energy":4,"rel":-4},"chat":[{"from":"{partner}","text":"it was on sale"}]},{"weight":1,"text":"They get it right. First try. {kid} eats two. You feel a love for {partner} that is at least 60% dairy.","effects":{"mood":10,"rel":10},"chat":[{"from":"{partner}","text":"plain cow. no hat. 🫡"}]}]},{"label":"Video call. Be air traffic control.","duration":12,"minEnergy":20,"outcomes":[{"weight":2,"text":"\"Left. Your other left. Lower. LOWER.\" A stranger in a fleece starts helping. The stranger is now on the call. Together, the three of you find it.","effects":{"energy":-8,"rel":12,"mood":8},"stamp":"CLEARED FOR LANDING"},{"weight":1,"text":"{kid} sees the yogurt wall on your screen and screams the name of a yogurt you've never heard of. {partner} buys it. It's correct.","effects":{"energy":-8,"mood":14,"rel":4}}]},{"label":"\"Surprise me.\"","duration":1,"outcomes":[{"weight":2,"text":"They come home with a $7.99 \"drinkable kefir experience\" and four tubs of the hat cow. They're so proud. {kid} rejects all of it, on the record.","effects":{"energy":6,"mood":-12,"rel":2}},{"weight":1,"text":"They come home with no yogurt at all. \"It felt like a test,\" they explain. It was a test.","effects":{"energy":6,"rel":-10},"stamp":"TEST FAILED"}]}]},{"id":"chat_meme","title":"\"lol this is us\"","text":"{partner} sends a meme from work. You read it twice, like a contract.","chat":{"with":"{partner}","messages":[{"from":"{partner}","text":"[meme: one parent asleep on a couch, the other holding a baby, a laundry basket and a small fire]"},{"from":"{partner}","text":"lol this is us 😂"}]},"window":[600,1000],"weight":2,"oncePerWeek":true,"choices":[{"label":"\"which one are you\"","duration":1,"outcomes":[{"weight":1,"text":"Typing. Stops. Typing. Stops. It's a good answer. It is not an answer.","effects":{"rel":-8,"energy":4},"chat":[{"from":"{partner}","text":"the fire?"}],"count":{"blames":1},"set":["pt:sniped"]},{"weight":1,"text":"They've always known. At 4:52 their car pulls in, early, with noodles.","effects":{"rel":10,"energy":10},"chat":[{"from":"{partner}","text":"the couch one obviously 😭"},{"from":"{partner}","text":"leaving early. bringing noodles"}],"stamp":"SELF-AWARE"}]},{"label":"Reply with a photo. Yours is worse.","duration":2,"outcomes":[{"text":"You, {kid} on your hip, a laundry basket and a pot of pasta foaming onto the burner. No fire. Yet.","effects":{"rel":8,"energy":-4},"chat":[{"from":"{partner}","text":"oh no it's literally us"},{"from":"{partner}","text":"leaving now"}]}]},{"label":"Circle the couch one. Label it YOU.","duration":2,"outcomes":[{"weight":1,"text":"They circle the couch one too and label it SATURDAY. You did nap Saturday. For two hours. In a hammock. Ceasefire.","effects":{"rel":-6,"energy":6},"count":{"blames":1},"set":["pt:sniped"],"stamp":"SEE: SATURDAY"},{"weight":1,"text":"No reply for an hour. Then a screenshot of their calendar: Sunday, 2 to 5 PM, blocked out as COUCH (YOU).","effects":{"rel":6,"energy":10},"chat":[{"from":"{partner}","text":"fair. sunday is yours"}]}]}]},{"id":"chat_late","title":"Running 20 Late!!","text":"A text from {partner}. You can hear the exclamation points from here.","chat":{"with":"{partner}","messages":[{"from":"{partner}","text":"running 20 late sorry!!"},{"from":"{partner}","text":"meeting ran over"},{"from":"{partner}","text":"someone asked a question at 4:58"}]},"window":[960,1030],"weight":2,"oncePerWeek":true,"when":{"max":{"day":3},"notFlags":["d:handoff"]},"choices":[{"label":"\"no worries!!\" Match their two.","duration":1,"minEnergy":20,"tags":["martyr"],"outcomes":[{"weight":1,"text":"Two exclamation points back: the universal sign of a parent doing their best. Twenty minutes is forty. You knew that when you typed it.","effects":{"energy":-8,"rel":10}},{"weight":1,"text":"{kid} saw you type. \"IS IT THEM?\" Every ninety seconds for twenty minutes, then for forty.","effects":{"energy":-12,"rel":8,"mood":-6}}]},{"label":"\"It's fine.\" With a period.","duration":1,"outcomes":[{"weight":2,"text":"The period lands like a dropped plate. They walk in twenty minutes later already apologizing, holding gas-station flowers.","effects":{"energy":4,"rel":-10},"count":{"blames":1},"set":["pt:sniped"]},{"weight":1,"text":"They're home in eleven minutes. Nobody has ever driven a period that fast.","effects":{"energy":8,"rel":-4},"stamp":"PUNCTUATION WORKS"}]},{"label":"\"Then you're bringing dinner.\"","duration":1,"tags":["tagteam"],"outcomes":[{"when":{"min":{"rel":50}},"text":"They walk in with dumplings and a guilty face. You would take this deal every night of the week.","effects":{"energy":10,"rel":2},"ledger":{"dinner":"partner"},"chat":[{"from":"{partner}","text":"on it 🥟"}]},{"when":{"max":{"rel":49}},"text":"They forget. They walk in with apologies and a work bag and nothing that can be eaten.","effects":{"energy":-6,"rel":-8},"chat":[{"from":"{partner}","text":"👍"}]}]}]},{"id":"chat_sitter","title":"Who Booked the Sitter?","text":"A thought arrives in two buildings at once.","chat":{"with":"{partner}","messages":[{"from":"{partner}","text":"u booked the sitter for friday right"},{"from":"you","text":"i thought YOU booked the sitter"},{"from":"{partner}","text":"..."},{"from":"{partner}","text":"calling kaylee"}]},"window":[600,1020],"weight":2,"oncePerWeek":true,"when":{"min":{"day":2},"max":{"day":3}},"choices":[{"label":"\"I'll call the backup. GO.\"","duration":5,"tags":["tagteam"],"outcomes":[{"weight":2,"text":"Kaylee was already booked. By you. On Monday. You don't remember doing it. Your phone does. Past you is a stranger, and a great one.","effects":{"energy":8,"rel":8},"chat":[{"from":"{partner}","text":"kaylee says YOU booked monday??"}],"stamp":"PAST YOU DID IT","fx":"confetti"},{"weight":1,"text":"Kaylee's free. The backup's free. You each book one. On Friday at 7, two teenagers arrive and $44 an hour leaves the house.","effects":{"energy":-6,"rel":10}}]},{"label":"\"This is a sign. We stay home.\"","duration":2,"outcomes":[{"weight":1,"text":"You both feel relieved. Then terrible about feeling relieved. Then relieved again.","effects":{"energy":8,"rel":-12},"chat":[{"from":"{partner}","text":"is it though"},{"from":"you","text":"it is"},{"from":"{partner}","text":"ok"}]},{"weight":1,"text":"They book Kaylee from a stairwell in nine seconds. Date night survives on {partner}'s grit alone.","effects":{"energy":2,"rel":8},"chat":[{"from":"{partner}","text":"absolutely not"}]}]},{"label":"\"Whose turn was it to book?\"","duration":5,"outcomes":[{"weight":1,"text":"You both scroll back eight months to see who booked last time. It was Grandma. The sitter is still unbooked. The scrolling continues.","effects":{"energy":-2,"rel":-10},"count":{"blames":1},"set":["pt:sniped"]},{"weight":1,"text":"Mid-argument, Kaylee texts you both: \"still on for fri? 🙂\" Someone booked Kaylee. Neither of you will ever concede it was the other.","effects":{"energy":8,"rel":-4},"count":{"blames":1},"set":["pt:sniped"],"stamp":"NO CONTEST"}]}]},{"id":"chat_hideout","title":"Status: In the Bathroom","text":"{partner} has been in the bathroom for 26 minutes. Your phone buzzes. It's {partner}. From the bathroom.","chat":{"with":"{partner}","messages":[{"from":"{partner}","text":"did u see this"},{"from":"{partner}","text":"[link: \"Why Parents Need More Time to Themselves\"]"},{"from":"{partner}","text":"so true"}]},"window":[930,1160],"weight":2,"oncePerWeek":true,"choices":[{"label":"Send {kid} to knock.","duration":5,"outcomes":[{"weight":1,"text":"{kid} knocks for four minutes straight: \"WHAT ARE YOU DOING. ARE YOU DONE. CAN I SEE.\" The door opens at minute five. Article: finished.","effects":{"energy":8,"rel":-6,"mood":6},"fx":"shake"},{"weight":1,"text":"{kid} knocks, is let in, and doesn't come out. You hear laughing. The bathroom is a club now. You're not in the club, and it's wonderful.","effects":{"energy":14,"rel":4},"stamp":"MEMBERS ONLY"}]},{"label":"Reply with an article of your own","duration":2,"outcomes":[{"weight":1,"text":"It exists. Of course it exists. They're out in forty seconds, laughing, and take {kid} for the rest of the evening.","effects":{"energy":10,"rel":6},"chat":[{"from":"you","text":"[link: \"Signs Your Partner Is Hiding in the Bathroom\"]"},{"from":"{partner}","text":"ok ok coming"}],"count":{"blames":1}},{"weight":1,"text":"They reply \"lol\" and send another article. It's been 31 minutes. Through the door you hear the little noise a phone game makes when you win.","effects":{"energy":-6,"rel":-10},"chat":[{"from":"you","text":"[link: \"Signs Your Partner Is Hiding in the Bathroom\"]"},{"from":"{partner}","text":"lol"}],"count":{"blames":1},"set":["pt:sniped"]}]},{"label":"Take {kid} to the park. Leave them in there.","duration":40,"minEnergy":25,"tags":["present"],"outcomes":[{"text":"Forty minutes, two swings, one slide, slightly wet. When you get back, {partner} is still in there. They've read eleven articles. They come out rested and extremely sorry.","effects":{"energy":-10,"mood":14,"rel":6,"sleepy":6}}]}]},{"id":"chat_pinkeye","title":"Pink Eye: The Investigation","text":"Daycare is closed for pink eye. The group chat has opened an investigation.","chat":{"with":"Caterpillar Room Parents 🐛 (23)","messages":[{"from":"Brynn","text":"not to point fingers but someone's little one was rubbing their eyes at pickup friday 👀"},{"from":"Marcus","text":"who"},{"from":"Brynn","text":"not pointing fingers 🙂"},{"from":"Dev","text":"lol same"},{"from":"+1 (555) 014-2276","text":"it was the kid in the yellow raincoat"}]},"window":[480,1080],"weight":3,"oncePerWeek":true,"when":{"flags":["d:home"]},"choices":[{"label":"Quietly hide {kid}'s yellow raincoat","duration":2,"outcomes":[{"weight":1,"text":"Into the back of the closet, behind the winter coats. Nobody can prove anything. {kid} spends the afternoon asking for \"MY YELLOW.\"","effects":{"energy":10,"mood":-10},"set":["gc:dev"]},{"weight":1,"text":"Too late. Brynn posts a photo from Friday pickup: {kid}. Yellow. Both fists in both eyes.","effects":{"energy":-8},"set":["gc:dev"],"stamp":"POSITIVE ID","fx":"flash"}]},{"label":"\"lots of kids have yellow raincoats!!\"","duration":2,"outcomes":[{"weight":1,"text":"Four parents reply with photos of their kids' raincoats. All navy. Dev's is also navy. Dev says, \"lol same.\"","effects":{"energy":-6},"set":["gc:dev"]},{"weight":1,"text":"Marcus: \"ours is yellow too.\" Relief. Then Brynn: \"Marcus. 🙂\" The investigation turns. You are free.","effects":{"energy":6},"set":["gc:dev"],"stamp":"CASE REASSIGNED"}]},{"label":"\"who had the class turtle last weekend?\"","duration":5,"minEnergy":20,"outcomes":[{"weight":2,"text":"Fourteen people pivot instantly. A new suspect: the turtle. Brynn proposes a \"turtle pause.\" You've saved {kid} and doomed a turtle.","effects":{"energy":4},"set":["gc:dev"]},{"weight":1,"text":"\"the turtle was with US,\" Brynn writes. \"the turtle is FINE.\" Then Brynn leaves the chat. Then Brynn re-adds Brynn.","effects":{"energy":-6},"set":["gc:dev"]}]}]},{"id":"chat_gift","title":"The Secret Gift Chat","text":"You've been added to a new group. It has 22 members: the class chat, minus one. The one is Ms. Patty.","chat":{"with":"Patty Gift 🤫🎁 (22)","messages":[{"from":"Brynn","text":"hi all!! collecting for Ms. Patty's appreciation basket 💐"},{"from":"Brynn","text":"$40/family: a candle, a robe and a journal that says GROW 🌱"},{"from":"Marcus","text":"is that per kid or per family"},{"from":"Brynn","text":"per heart 🙂"},{"from":"Dev","text":"lol same"}]},"window":[600,1100],"weight":2,"oncePerWeek":true,"choices":[{"label":"Send the $40. Ask nothing.","duration":2,"outcomes":[{"weight":2,"text":"Sent. Brynn reacts with a 🙏 in under a second. You're in good standing for $40, which is about what good standing costs.","effects":{"energy":-4},"set":["gc:dev"]},{"weight":1,"text":"You send $40. Dev sends $400. Dev meant $40. By the time anyone notices, Brynn has bought a second robe.","effects":{"energy":4},"set":["gc:dev"],"stamp":"TWO ROBES"}]},{"label":"\"what if the gift is just a nap\"","duration":1,"outcomes":[{"weight":1,"text":"Eleven hearts, fast. It's the most popular thing you've ever said. Then Brynn: \"love the energy!! still $40 🙂\"","effects":{"energy":6},"set":["gc:dev"]},{"weight":1,"text":"Nobody can argue with that. Nobody tries. You have been out-Brynned.","effects":{"energy":-8},"set":["gc:dev"],"chat":[{"from":"Brynn","text":"naps aren't a gift, they're a right 🙂"}]}]},{"label":"Leave the chat. Quietly.","duration":1,"outcomes":[{"text":"\"You left the conversation.\" Everyone sees it. There is no quietly. Within a minute, Brynn has messaged you privately.","effects":{"energy":-4},"set":["gc:dev"],"chat":[{"from":"Brynn","text":"everything ok? 🙂"}]}]}]},{"id":"chat_dev","title":"Dev Is Typing","text":"Dev, who has only ever written \"lol same,\" is typing. Still typing. Still typing.","moment":true,"chat":{"with":"Caterpillar Room Parents 🐛 (23)","messages":[{"from":"Dev","text":"honestly not doing great. bodhi has been up at 4:10 every day for 2 weeks and yesterday i cried in a car wash"},{"from":"Dev","text":"anyway"},{"from":"Brynn","text":"💛"}]},"window":[600,1100],"weight":3,"oncePerWeek":true,"when":{"flags":["gc:dev"],"min":{"day":2}},"choices":[{"label":"DM Dev: \"want to get coffee? mine's up at 5 too\"","duration":5,"outcomes":[{"weight":2,"text":"Dev replies in four seconds. On Thursday you have coffee with someone you've only ever known as two words. They have a lot more words. So do you.","effects":{"energy":8},"count":{"moments":1},"chat":[{"from":"Dev","text":"yes. please. thursday?"}]},{"weight":1,"text":"A minute later, one more message. You know exactly what it means now.","effects":{"energy":6},"count":{"moments":1},"chat":[{"from":"Dev","text":"can't this week, bodhi. but thank you. really"},{"from":"Dev","text":"lol same"}]}]},{"label":"Reply \"lol same\"","duration":1,"outcomes":[{"weight":1,"text":"You type it and mean it. Dev hearts it instantly. It's the most anyone has said in this chat all year.","effects":{"energy":5}},{"weight":1,"text":"You send it. Then Marcus: \"honestly same.\" Then Brynn: \"same 💛\" Dev sends one crying face. It's a good crying face.","effects":{"energy":5},"count":{"moments":1}}]},{"label":"Heart it. Keep scrolling.","duration":1,"outcomes":[{"text":"A heart from you, one from Marcus, and the chat moves on to a lost water bottle. You put the phone down and finish the block tower with {kid}. You think about the car wash in the shower that night.","effects":{"energy":2,"mood":4}}]}]},{"id":"chat_patty_report","title":"Daily Report","text":"The daycare app pings. Ms. Patty has filed today's report.","chat":{"with":"Ms. Patty 🐛 Caterpillar Room","messages":[{"from":"Ms. Patty","text":"Today {kid} bit NO ONE! 🌟"},{"from":"Ms. Patty","text":"Lunch: crackers, half a pear, one crayon (tip only) 🖍️"},{"from":"Ms. Patty","text":"Also {kid} called me {me} three times today! So sweet 🙂"}]},"window":[840,1030],"weight":2,"oncePerWeek":true,"when":{"notFlags":["d:home"]},"choices":[{"label":"\"Ha! They call the mail carrier that too 🙂\"","duration":1,"outcomes":[{"weight":1,"text":"Ms. Patty sends a 😂. Your position in the hierarchy is secure, right alongside the mail carrier, which is fine. It's fine.","effects":{"energy":10}},{"weight":1,"text":"So it's just you and Ms. Patty. You and Ms. Patty, sharing a title.","effects":{"energy":-2},"chat":[{"from":"Ms. Patty","text":"Oh, they call the mail carrier \"Big Mail\" 🙂"}]}]},{"label":"\"What color was the crayon?\"","duration":1,"outcomes":[{"weight":2,"text":"You realize you're more relieved about the crayon than about anything else in the report.","effects":{"energy":2},"chat":[{"from":"Ms. Patty","text":"Blue! Non-toxic! 🙂"}]},{"weight":1,"text":"The rest of the crayon is in the backpack, wrapped in a paper towel. It's yours now. You keep it in the car.","effects":{"energy":6,"mood":6},"chat":[{"from":"Ms. Patty","text":"They saved you the rest 🙂"}]}]},{"label":"Pick up early. Reclaim the title.","duration":40,"minEnergy":25,"tags":["present"],"outcomes":[{"weight":1,"text":"{kid} looks up from the sand table: \"Hi, {me}.\" Then, cheerfully, to Ms. Patty: \"Bye, {me}.\" A tie, officially.","effects":{"energy":-10,"mood":12},"stamp":"TITLE SHARED"},{"weight":1,"text":"You arrive 40 minutes early. {kid} is mid-song, holds up one finger and makes you wait in the doorway like a delivery. You wait. Proudly.","effects":{"energy":-10,"mood":10}}]}]},{"id":"chat_barnaby","title":"Barnaby Bear's Journal","text":"Barnaby, the class bear, is coming home with {kid} tonight. Barnaby has a journal. The journal is a competition.","chat":{"with":"Ms. Patty 🐛 Caterpillar Room","messages":[{"from":"Ms. Patty","text":"Barnaby is coming home with {kid} tonight!! 🐻📓 Please document Barnaby's adventures!"},{"from":"Ms. Patty","text":"Last week Barnaby went to a lighthouse, an apple orchard and a sound bath with Juniper's family 🌿"}]},"window":[900,1040],"weight":2,"oncePerWeek":true,"when":{"max":{"day":3},"notFlags":["d:home","d:deadline"]},"choices":[{"label":"Stage an adventure. Your kitchen is a market now.","duration":20,"minEnergy":20,"outcomes":[{"weight":2,"text":"Barnaby at the \"farmers market\" (three apples on the counter). Barnaby \"hiking\" (the stairs). Brynn comments on the journal photo: \"love the farmhouse vibe!\" It's your kitchen.","effects":{"energy":-8,"mood":6}},{"weight":1,"text":"{kid} insists Barnaby join bath time. Barnaby goes back to daycare 30% heavier and smelling of strawberry. The entry says \"Barnaby swam!\"","effects":{"energy":-8,"mood":12}}]},{"label":"Write the truth: \"We had cereal for dinner.\"","duration":2,"outcomes":[{"weight":1,"text":"Ms. Patty reads it aloud at circle time. The parents at pickup laugh. Next week's entry, from Marcus: \"Barnaby sat in traffic.\" Honesty is catching.","effects":{"energy":6},"stamp":"HONESTY WINS"},{"weight":1,"text":"Brynn reposts your entry to the group chat with \"haha love this 😅\". You'll be decoding that sweat drop for weeks.","effects":{"energy":-6}}]},{"label":"Take Barnaby somewhere real","duration":45,"minEnergy":30,"tags":["present"],"outcomes":[{"text":"The library, the duck pond and a fire truck that happened to be parked. Barnaby has the best night of anyone's life. {kid} talks about it through dinner, with Barnaby at the table in a napkin.","effects":{"energy":-14,"mood":14,"sleepy":10}}]}]},{"id":"chat_boss_sync","title":"\"quick sync?\"","text":"Your boss, Trent, has sent two words and a question mark. The report is due at 5.","chat":{"with":"Trent (Work)","messages":[{"from":"Trent","text":"quick sync?"},{"from":"Trent","text":"nothing bad!"},{"from":"Trent","text":"well"}]},"window":[540,780],"weight":3,"oncePerWeek":true,"when":{"flags":["d:deadline"]},"choices":[{"label":"\"Sure! Now works!\" (Now does not work.)","duration":30,"minEnergy":25,"outcomes":[{"weight":2,"text":"Trent wants to \"align on fonts.\" Thirty minutes on fonts. The report due at 5 is now due at 5 minus thirty minutes, in a better font.","effects":{"energy":-10}},{"weight":1,"text":"It really is nothing bad. Trent just wanted to say \"great work lately.\" You've never been so tired by good news.","effects":{"energy":6},"stamp":"GENUINELY NOTHING"}]},{"label":"\"Can it be an email?\"","duration":2,"tags":["boundary"],"outcomes":[{"weight":1,"text":"Then nothing. The email never comes. You're free, technically. You'll be thinking about \"well\" until Thursday.","effects":{"energy":4},"chat":[{"from":"Trent","text":"totally!"}]},{"weight":1,"text":"A sentence that means nothing and has put you on a call in two minutes.","effects":{"energy":-10},"chat":[{"from":"Trent","text":"it's kind of a sync thing"}]}]},{"label":"\"In a meeting! 2pm?\" (The meeting is a muffin.)","duration":5,"outcomes":[{"text":"The muffin is excellent. The dread is also excellent. It grows all afternoon.","effects":{"energy":10},"chat":[{"from":"Trent","text":"👍"}],"schedule":[{"event":"chat_boss_bump","in":180}]}]}]},{"id":"chat_boss_bump","title":"Bumping This 🙂","text":"Your 2 PM \"meeting\" with the muffin is over. Trent has bumped the thread. A bump is a knock you can't pretend you didn't hear.","forced":true,"oncePerWeek":true,"when":{"flags":["d:deadline"]},"chat":{"with":"Trent (Work)","messages":[{"from":"Trent","text":"bumping this 🙂"},{"from":"Trent","text":"still nothing bad"},{"from":"Trent","text":"mostly"}]},"choices":[{"label":"Call now. Walk straight into the \"mostly.\"","duration":25,"outcomes":[{"weight":1,"text":"It's about the report. Trent would like it \"punchier.\" You ask what that means. Trent says, \"You know.\" You don't. It's due at 5, and now it also has to punch.","effects":{"energy":-6}},{"weight":1,"text":"Trent wants to know if the report can \"also be a deck.\" You say yes in a voice you don't recognize.","effects":{"energy":-12},"stamp":"NOW IT'S A DECK","fx":"flash"}]},{"label":"\"So sorry!! Toddler emergency!\"","duration":2,"outcomes":[{"weight":1,"text":"It works. You feel great for four seconds, until you remember {kid} is at daycare, napping, and the emergency is you.","effects":{"energy":-6},"chat":[{"from":"Trent","text":"omg of course!! family first 💛"}]},{"weight":1,"text":"Trent is very supportive. Your emergency has been noted and scheduled around.","effects":{"energy":-14},"chat":[{"from":"Trent","text":"of course! report still on for 5?"}]}]}]},{"id":"chat_boss_friday","title":"\"Before You Head Out\"","text":"Friday. The sitter comes at 7. Trent has thoughts.","chat":{"with":"Trent (Work)","messages":[{"from":"Trent","text":"hey before you head out"},{"from":"Trent","text":"tiny favor"},{"from":"Trent","text":"could you look at something this weekend? no rush"},{"from":"Trent","text":"monday am is fine"},{"from":"Trent","text":"monday 7am"}]},"window":[780,1000],"weight":3,"oncePerWeek":true,"when":{"flags":["d:friday"]},"choices":[{"label":"\"Of course!\"","duration":2,"tags":["martyr"],"outcomes":[{"weight":2,"text":"Trent replies \"🙌\". You'll do it Sunday night, in the hour you'd have spent being a person. Date night has a guest now: the attachment.","effects":{"energy":-6,"rel":-4}},{"weight":1,"text":"Trent sends the tiny favor. It's 61 slides. One of them is just the word \"Thoughts?\"","effects":{"energy":-14,"rel":-6},"stamp":"TINY, ALLEGEDLY"}]},{"label":"\"I'm offline this weekend.\" Send. Don't reread.","duration":2,"minEnergy":20,"tags":["boundary"],"outcomes":[{"weight":2,"text":"That was it. That was all it ever took. You sit in the car for a full minute, a new person.","effects":{"energy":6,"rel":8},"chat":[{"from":"Trent","text":"👍 totally! have a great weekend!"}],"stamp":"OUT OF OFFICE","fx":"confetti"},{"weight":1,"text":"You spend forty minutes on \"np.\" No problem? Noted, problem? It follows you to the restaurant and sits between you and {partner} like a third diner.","effects":{"energy":-10,"rel":-4},"chat":[{"from":"Trent","text":"np!"}]}]},{"label":"Leave it on read until Monday","duration":1,"outcomes":[{"text":"\"Read.\" The read receipt does all the talking. Trent will remember. Trent has a folder.","effects":{"energy":-10}}]}]},{"id":"arc_banana_broken","title":"The Banana Is Broken","text":"The banana has been declared broken. It is not broken. It has one brown freckle, the size of a lentil. {kid} holds it at arm's length and looks at you like you did this.","window":[400,720],"weight":6,"oncePerWeek":true,"when":{"max":{"day":1}},"choices":[{"label":"\"Look. I'll eat the freckle.\"","duration":3,"outcomes":[{"text":"You bite out the freckle. Now it's broken AND bitten. {kid} takes it back, says \"I FIX IT,\" and leaves. Four minutes later they return empty-handed, with total professional calm.","effects":{"mood":-10,"energy":4},"set":["banana:1"],"stamp":"WHEREABOUTS UNKNOWN"}]},{"label":"Banana two. Fresh. Unfreckled.","duration":3,"tags":["bribe"],"outcomes":[{"weight":2,"text":"{kid} accepts banana two and keeps banana one. Banana one is carried down the hall \"for a nap.\" Banana one does not come back.","effects":{"mood":10,"energy":-4},"set":["banana:1"]},{"weight":1,"text":"Banana two has a freckle too. They all have freckles. {kid} declares a state of emergency and takes both into the hallway. Neither returns.","effects":{"mood":-12,"energy":-4},"set":["banana:1"],"fx":"shake"}]},{"label":"\"Then it goes in the trash.\"","duration":8,"minEnergy":20,"tags":["boundary"],"outcomes":[{"weight":1,"text":"\"NO. MINE.\" They back out of the kitchen holding the banana and your eye contact. When they return, their hands are empty and their story is ready: \"What banana.\"","effects":{"mood":-8,"energy":-2},"set":["banana:1"],"stamp":"PLEADS THE FIFTH"},{"weight":1,"text":"You drop it in the trash. {kid} waits until you turn around, retrieves it and walks out. Banana: at large.","effects":{"mood":12,"energy":-6},"set":["banana:1"]}]}]},{"id":"arc_banana_fly","title":"A Fruit Fly Has Moved In","text":"One fruit fly is doing slow laps of the hallway with the confidence of someone who knows where the food is. You don't know where the food is. The fly does.","window":[480,1100],"weight":4,"oncePerWeek":true,"when":{"flags":["banana:1"],"min":{"day":1},"max":{"day":3}},"choices":[{"label":"Follow the fly. It knows things.","duration":10,"minEnergy":20,"outcomes":[{"weight":1,"text":"Nine minutes, bent double, squinting. It leads you down the hall, past the closet, and lands on your nose. You've been outplayed by a fly.","effects":{"energy":-8,"mood":10},"set":["banana:fly"],"stamp":"LOST THE FLY"},{"weight":1,"text":"It leads you straight to the hall closet and slips in under the door. You open it. Coats. Umbrella. No fly. No banana. No lead.","effects":{"energy":-8},"set":["banana:fly"]}]},{"label":"Clap it out of the air","duration":1,"outcomes":[{"weight":2,"text":"You miss. {kid} gasps in horror. \"NO! It's VISITING!\" They escort the fly away from you with both hands.","effects":{"energy":4,"mood":-8},"set":["banana:fly"]},{"weight":1,"text":"You get it. {kid} holds a small, devastating funeral by the closet door and says something you don't catch to someone you can't see.","effects":{"energy":4,"mood":-10},"set":["banana:fly"]}]},{"label":"Ask {kid} what they know. Play it cool.","duration":3,"outcomes":[{"text":"{kid} watches the fly loop the hallway. \"That's Banana's friend,\" they say. \"Visiting.\" They will not elaborate. They've said too much.","effects":{"energy":-2,"mood":6},"set":["banana:fly"],"stamp":"SAID TOO MUCH"}]}]},{"id":"arc_banana_closet","title":"Visiting Hours","text":"{kid} walks to the hall closet, opens it, whispers \"night night,\" and closes it very gently. It's the fourth visit since lunch. This time they brought a cracker, and a cup of water for the guest.","window":[480,1100],"weight":4,"oncePerWeek":true,"when":{"flags":["banana:1"],"min":{"day":1},"max":{"day":3}},"choices":[{"label":"Search the closet. Every coat pocket.","duration":10,"minEnergy":20,"outcomes":[{"text":"Coats, an umbrella, a bag of bags, one mitten, a cracker. Every pocket. No banana. You don't check the shoes. Why would anyone check the shoes?","effects":{"energy":-8,"rel":4},"set":["banana:closet"],"stamp":"SEARCH INCONCLUSIVE"}]},{"label":"Tail them. Undercover. In socks.","duration":8,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":1,"text":"{kid} spots you, freezes, and calmly walks you to the bathroom instead. \"Banana here,\" they lie, beautifully.","effects":{"energy":-6,"mood":10},"set":["banana:closet"]},{"weight":1,"text":"They open the closet, see you behind them and shut it again. \"No visitors.\"","effects":{"energy":-6,"mood":-6},"set":["banana:closet"],"stamp":"VISITATION DENIED"}]},{"label":"Let them have this. Some things are private.","duration":1,"outcomes":[{"weight":1,"text":"Some things are between a toddler and a closet. They visit six more times. By dinner the cracker count is three.","effects":{"energy":6,"mood":6,"rel":-4},"set":["banana:closet"]},{"weight":1,"text":"You let them have it. At bedtime {kid} insists on saying good night to the closet. You say it too. You don't know why.","effects":{"energy":4,"mood":8},"set":["banana:closet"]}]}]},{"id":"arc_banana_hotel","title":"Fun Share From Circle Time","text":"Ms. Patty has news from circle time, and an emoji for it.","chat":{"with":"Ms. Patty 🐛 Caterpillar Room","messages":[{"from":"Ms. Patty","text":"Fun share from circle time! 🌈"},{"from":"Ms. Patty","text":"{kid} told everyone the banana is staying \"at the shoe hotel\" 🍌🏨"},{"from":"Ms. Patty","text":"Not sure what that means but they were VERY proud!"}]},"window":[840,1040],"weight":4,"oncePerWeek":true,"when":{"flags":["banana:1"],"notFlags":["d:home"],"min":{"day":1},"max":{"day":3}},"choices":[{"label":"\"Ha! Kids! 🙂\" (You have no idea.)","duration":1,"outcomes":[{"weight":1,"text":"Ms. Patty hearts it. You spend the drive home trying to think of a hotel for shoes. At every red light you get closer. You never once think of the closet.","effects":{"energy":4},"set":["banana:hotel"]},{"weight":1,"text":"Ms. Patty hearts it, then adds one more detail. You decide not to think about it. You've gotten very good at that.","effects":{"energy":4},"set":["banana:hotel"],"chat":[{"from":"Ms. Patty","text":"They said it's very dark there and smells like feet 🙂"}]}]},{"label":"Forward it to {partner}. Get a second opinion.","duration":2,"outcomes":[{"text":"You both agree the shoe hotel is a toddler thing. Two adults with four pairs of shoes each, in a hall closet, agreeing.","effects":{"rel":8,"energy":2},"set":["banana:hotel"],"chat":[{"from":"{partner}","text":"the WHAT hotel"},{"from":"{partner}","text":"lol toddlers"}]}]},{"label":"Go home. Check every shoe. Every single one.","duration":15,"minEnergy":25,"outcomes":[{"weight":1,"text":"You check every shoe in the house except the good ones at the back of the hall closet, because nobody has worn those since March. Nothing.","effects":{"energy":-10,"rel":4},"set":["banana:hotel"],"stamp":"SO CLOSE"},{"weight":1,"text":"Two raisins, a toy car and a sock inside a sock. No banana. You put everything back exactly where it was, including the good shoes, unopened.","effects":{"energy":-10,"mood":6},"set":["banana:hotel"]}]}]},{"id":"arc_banana_found","title":"The Shoe Hotel","text":"Date night is tonight. You pull your good shoes from the back of the hall closet for the first time since March. Your right foot goes in. Something gives. It's warm. It's the banana.","window":[600,1045],"weight":9,"oncePerWeek":true,"when":{"flags":["banana:1"],"min":{"day":4}},"choices":[{"label":"Scream into a dish towel","duration":3,"outcomes":[{"weight":1,"text":"A short, private scream into a towel with a turkey on it. From the next room, {kid} shouts, with enormous pride: \"YOU FOUND IT!\"","effects":{"energy":-6,"mood":14},"set":["banana:found"],"stamp":"CHECKED OUT","fx":"confetti"},{"weight":1,"text":"You scream into the towel. {partner} comes running, sees the shoe, sees your foot and has to sit down on the stairs. They're laughing too hard to help.","effects":{"energy":-6,"rel":12},"set":["banana:found"]}]},{"label":"Wear the sneakers. The ones that say \"parent.\"","duration":2,"outcomes":[{"weight":2,"text":"The sneakers it is: gray, sensible and visibly giving up. {partner} looks at your feet, then your face, and decides not to ask.","effects":{"energy":4,"rel":-6},"set":["banana:found"]},{"weight":1,"text":"You pick up the sneakers. Inside the left one: a second banana. You never noticed a second banana go missing. There's a chain.","effects":{"energy":-4,"mood":8},"set":["banana:found"],"stamp":"IT'S A CHAIN","fx":"shake"}]},{"label":"\"{KID}. Why.\"","duration":5,"minEnergy":20,"tags":["present"],"outcomes":[{"text":"{kid} beams. \"I FIXED IT.\" All week at the shoe hotel. To them, this was repair. You're too impressed to be angry, and it turns out that's the same face.","effects":{"energy":-8,"mood":14,"rel":4},"set":["banana:found"]}]},{"label":"\"The SHOE hotel.\" It all makes sense.","duration":2,"when":{"flags":["banana:hotel"]},"outcomes":[{"text":"Ms. Patty told you. In writing. With an emoji. You text {partner}: \"the shoe hotel was my shoe.\" The reply is instant.","effects":{"energy":6,"rel":6},"set":["banana:found"],"chat":[{"from":"{partner}","text":"i know"},{"from":"{partner}","text":"i smelled it tuesday"}],"stamp":"THEY KNEW"}]}]},{"id":"arc_party_invite","title":"You're Invited (Intentionally)","text":"Brynn has posted an invitation. It has a dress code, a mission statement and a QR code that leads to a second, longer invitation.","chat":{"with":"Caterpillar Room Parents 🐛 (23)","messages":[{"from":"Brynn","text":"Juniper is turning 3!! 🎉🌿"},{"from":"Brynn","text":"friday 4pm, our backyard. nut-free, screen-free, sugar-free and intention-forward 🙏"},{"from":"Brynn","text":"rsvp by thurs 5pm 💛"},{"from":"Dev","text":"lol same"}]},"window":[480,1100],"weight":6,"oncePerWeek":true,"when":{"max":{"day":1}},"choices":[{"label":"RSVP yes. Now. Before you can think.","duration":2,"outcomes":[{"text":"Brynn hearts it in 0.4 seconds. You've committed to a sugar-free party on Friday at 4 PM, the exact hour toddlers turn into weather.","effects":{"energy":-4},"set":["party:1","party:yes","gc:dev"],"completeTask":"rsvp","chat":[{"from":"you","text":"we'll be there!! 🎉"}]}]},{"label":"\"what does intention-forward mean 🙂\"","duration":3,"outcomes":[{"weight":1,"text":"You're no wiser. Now neither is Marcus.","effects":{"energy":6},"set":["party:1","gc:dev"],"chat":[{"from":"Brynn","text":"each child sets an intention at the gate 🙏"},{"from":"Marcus","text":"like a password?"},{"from":"Brynn","text":"like an intention"}]},{"weight":1,"text":"Brynn sends a four-minute voice memo. You play it at 2x. It's still two minutes. You understand it less.","effects":{"energy":-8},"set":["party:1","gc:dev"],"stamp":"PLAYED AT 2X"}]},{"label":"Heart it. Decide later. Decide never.","duration":1,"outcomes":[{"weight":2,"text":"One heart. Commitment level: heart. The RSVP moves into your head and lives next to the dentist appointment you also haven't made.","effects":{"energy":4},"set":["party:1","gc:dev"]},{"weight":1,"text":"Nine seconds later Brynn replies to your heart. You put the phone face down on the counter and walk away from it.","effects":{"energy":-4},"set":["party:1","gc:dev"],"chat":[{"from":"Brynn","text":"is that a yes? 💛"}]}]}]},{"id":"arc_party_rules","title":"A Few Gentle Notes","text":"Brynn has a few gentle notes about Friday. They are numbered.","chat":{"with":"Caterpillar Room Parents 🐛 (23)","messages":[{"from":"Brynn","text":"a few gentle notes for friday 🌿"},{"from":"Brynn","text":"1) no plastic 2) no gifts that make sound 3) no characters 4) experiences > things"},{"from":"Brynn","text":"5) Juniper is not doing \"stuff\" this year 🙏"},{"from":"Marcus","text":"what about a book"},{"from":"Brynn","text":"is it plastic 🙂"}]},"window":[480,1100],"weight":5,"oncePerWeek":true,"when":{"flags":["party:1"],"min":{"day":1},"max":{"day":2}},"choices":[{"label":"\"we'll be there!! 🌿\" Accept all notes.","duration":2,"when":{"notFlags":["party:yes","party:no"]},"outcomes":[{"text":"Sent. You've agreed to five rules, a sixth you haven't seen yet and Friday at 4 PM. Brynn replies with a single leaf. 🌿","effects":{"energy":-4},"set":["party:2","party:yes","gc:dev"],"completeTask":"rsvp"}]},{"label":"RSVP no. Invent a grandma.","duration":2,"when":{"notFlags":["party:yes","party:no"]},"outcomes":[{"weight":1,"text":"\"so sad!! grandma's in town 😩\" Brynn: \"bring grandma!! 🌿\" You now have until Friday to produce a grandma.","effects":{"energy":-6},"set":["party:2","party:no","gc:dev"],"completeTask":"rsvp","stamp":"GRANDMA REQUIRED"},{"weight":1,"text":"\"so sad!! grandma's in town 😩\" Brynn: \"next year 💛\" Relief. Then guilt. Then relief, which wins on points.","effects":{"energy":4},"set":["party:2","party:no","gc:dev"],"completeTask":"rsvp"}]},{"label":"\"is a hug an experience? 🙂\"","duration":2,"outcomes":[{"weight":1,"text":"{kid} will now be giving Juniper one hug, as a gift, in front of everyone. There's no going back.","effects":{"energy":2,"mood":4},"set":["party:2","gc:dev"],"chat":[{"from":"Brynn","text":"LOVE that!! 💛"}]},{"weight":1,"text":"Then Dev, helpfully: \"lol same.\"","effects":{"energy":-8},"set":["party:2","gc:dev"],"chat":[{"from":"Brynn","text":"Juniper isn't doing hugs this year 🙏"}]}]},{"label":"Mute the chat until Friday","duration":1,"outcomes":[{"text":"Muted. Blissful. Brynn posts six more gentle notes, and you read every one of them at 11 PM, in bed, with the brightness all the way down.","effects":{"energy":-4},"set":["party:2","gc:dev"]}]}]},{"id":"arc_party_gift","title":"Gift Panic: Not Stuff","text":"Juniper's gift has to be plastic-free, silent, character-free and \"not stuff.\" You have a closet, $40 and until Friday at 4.","window":[480,1100],"weight":4,"oncePerWeek":true,"when":{"flags":["party:2"],"notFlags":["party:no"],"min":{"day":2},"max":{"day":3}},"choices":[{"label":"Regift the wooden xylophone. Lose the mallets.","duration":5,"outcomes":[{"weight":1,"text":"Wood: yes. Silent: without mallets, yes. Character-free, if you sand off the frog. You wrap it in a paper bag and call it \"rustic.\"","effects":{"energy":4},"set":["party:gift"]},{"weight":1,"text":"You flip it over. A tag: \"Love, Juniper 🌿.\" It's from Juniper's party last year. You were about to return Juniper's gift to Juniper.","effects":{"energy":-2},"set":["party:gift"],"stamp":"FULL CIRCLE"}]},{"label":"Buy an \"experience\": a $45 pottery class","duration":10,"outcomes":[{"weight":2,"text":"It's for ages four and up. Juniper is turning three. Brynn will call it \"aspirational.\" You'll call it $45.","effects":{"energy":4},"set":["party:gift"]},{"weight":1,"text":"Sold out. The only experience left is \"Forest Bathing for Under-5s,\" $70. You buy it. Juniper will bathe in a forest, and so will your savings.","effects":{"energy":-2,"rel":-6},"set":["party:gift"]}]},{"label":"{kid} makes a card. Pure intention.","duration":20,"minEnergy":25,"tags":["present"],"outcomes":[{"weight":2,"text":"{kid} draws Juniper: a circle with eleven teeth. Underneath, with your help, it says HAPY. It's the most intention-forward object in the state.","effects":{"energy":-10,"mood":12},"set":["party:gift","party:card"]},{"weight":1,"text":"{kid} draws Juniper, then eats one corner of the card. It's still a card. It's also a snack. Brynn would call it \"multi-use.\"","effects":{"energy":-10,"mood":10},"set":["party:gift","party:card"]}]}]},{"id":"arc_party_backyard","title":"Juniper's Third","text":"Brynn's backyard. A sign says THIS IS A YES SPACE. There's a toddler sound bath, a \"celebration loaf\" sweetened with \"the idea of apple,\" and no cake. {kid}'s intention, stated at the gate: \"CAKE.\"","window":[900,1000],"weight":10,"oncePerWeek":true,"when":{"flags":["party:1"],"notFlags":["party:no"],"min":{"day":4}},"choices":[{"label":"Find the cake. There is always a cake.","duration":20,"outcomes":[{"weight":2,"text":"Behind the garage, Juniper's other parent is eating a frosted donut over the recycling. They put a finger to their lips, then break off a piece for {kid}. You've joined something.","effects":{"mood":14,"energy":6},"stamp":"DONUT DIPLOMACY"},{"weight":1,"text":"There is no cake. There is a plum. {kid} receives the plum like a diagnosis.","effects":{"mood":-14,"energy":-6},"fx":"shake"}]},{"label":"Lie down for the toddler sound bath","duration":30,"minEnergy":25,"tags":["present"],"outcomes":[{"weight":2,"text":"Twelve toddlers on yoga mats. One gong. {kid} lasts nine seconds, then falls deeply asleep. A 4:30 PM nap, on date night. Brynn whispers, \"See? Intention.\"","effects":{"energy":-6,"mood":12,"sleepy":-25},"stamp":"WORST TIME TO SLEEP"},{"weight":1,"text":"The gong goes off. {kid} screams the scream of the betrayed. Eleven toddlers join in. It is, technically, still a sound bath.","effects":{"energy":-10,"mood":-10,"sleepy":12},"fx":"shake"}]},{"label":"Leave at 4:20, citing \"the nap schedule\"","duration":5,"outcomes":[{"text":"Brynn understands. Brynn respects schedules. You're in the car by 4:22 with a goodie bag containing a single acorn.","effects":{"energy":10,"mood":-8}}]},{"label":"Present the card. The one with eleven teeth.","duration":5,"wh // ---- Playtest UI. Rules live in the engine above; this only renders. ----
const app = document.getElementById("app");
const cfg = CONTENT.config;
const SAVE_KEY = "bedtime-or-bust.week.v2";
const STATS_KEY = "bedtime-or-bust.stats.v2";
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const name = (m) => CONTENT.meters[m];
const taskDef = (id) => CONTENT.tasks.find((t) => t.id === id);
const HIGHER_IS_BETTER = { energy: true, rel: true, mood: true, sleepy: null, debt: false };
const DANGER = { energy: 20, rel: 20, mood: 10, rested: 25 };
// Friday's 7:00 PM requirements, read from the date_check card's failure checks.
const DATE_CHECKS = CONTENT.events.find((e) => e.id === "date_check")?.checks ?? [];
const FRIDAY_SLEEPY = (DATE_CHECKS.find((c) => c.when?.max?.sleepy != null)?.when.max.sleepy ?? 59) + 1;
const FRIDAY_ENERGY = (DATE_CHECKS.find((c) => c.when?.max?.energy != null)?.when.max.energy ?? 29) + 1;

// Names (docs/VOICE.md placeholders), settings and the playtest reaction log.
const HOUSE_KEY = "bedtime-or-bust.household.v1";
const SETTINGS_KEY = "bedtime-or-bust.settings.v1";
const REACT_KEY = "bedtime-or-bust.reactions.v1";
const CALL_YOU = ["Mama", "Dada", "Mommy", "Daddy", "Mom", "Dad", "Papa", "Mum"];
const trim = (x) => String(x ?? "").trim().slice(0, 14);
const houseComplete = (h) => !!(h && trim(h.kid) && trim(h.partner) && trim(h.me));
function say(text) {
  const h = storage.get(HOUSE_KEY) ?? {};
  const kid = trim(h.kid) || "Bean";
  const partner = trim(h.partner) || "your partner";
  const me = trim(h.me) || "Mama";
  return String(text ?? "").replaceAll("{kid}", kid).replaceAll("{KID}", kid.toUpperCase())
    .replaceAll("{partner}", partner).replaceAll("{me}", me).replaceAll("{ME}", me.toUpperCase());
}
const sayEsc = (text) => esc(say(text));
const settings = () => ({ timers: true, reactions: true, ...(storage.get(SETTINGS_KEY) ?? {}) });
const reduceMotion = () => !!window.matchMedia?.("(prefers-reduced-motion: reduce)")?.matches;

const storage = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
  del(k) { try { localStorage.removeItem(k); } catch { /* storage unavailable */ } },
};

let session = null; // { seed, picks, game, screen, last }
let houseScreen = null; // "start" | "edit" while the names form is open
let timerHandle = null;

function persist() {
  if (!session) return;
  if (session.game.isOver && session.screen === "ending") storage.del(SAVE_KEY);
  else storage.set(SAVE_KEY, { v: CONTENT.version, seed: session.seed, picks: session.picks, screen: session.screen });
}

// A saved week is its seed plus the choices made; replaying them rebuilds it exactly.
function rebuild(saved) {
  try {
    if (!saved || saved.v !== CONTENT.version || typeof saved.seed !== "number") return null;
    const game = new Game(CONTENT, saved.seed);
    let last = null;
    for (const p of saved.picks ?? []) last = game.choose(p);
    const screens = ["morning", "event", "outcome", "lifeline", "ending"];
    let screen = screens.includes(saved.screen) ? saved.screen : "event";
    if (screen === "outcome" && !last) screen = "event";
    return { seed: saved.seed, picks: [...(saved.picks ?? [])], game, screen, last };
  } catch {
    return null;
  }
}

function newWeek(seed = Math.floor(Math.random() * 4294967296)) {
  session = { seed, picks: [], game: new Game(CONTENT, seed), screen: "morning", last: null };
  persist();
  render();
}

function choose(i, fromTimer = false) {
  const g = session.game;
  if (g.isOver || session.screen !== "event") return;
  const vis = g.visibleChoices();
  if (!(i >= 0 && i < vis.length) || g.isLocked(vis[i])) return;
  if (vis[i].timeout && !fromTimer) return;
  session.last = g.choose(i);
  session.picks.push(i);
  session.screen = "outcome";
  if (g.isOver) recordStats(g);
  persist();
  render();
}

function next() {
  const g = session.game;
  const r = session.last;
  session.screen = g.isOver ? "ending" : r?.dayEnded === "lifeline" ? "lifeline" : r?.dayEnded === "morning" ? "morning" : "event";
  persist();
  render();
}

function recordStats(g) {
  const s = storage.get(STATS_KEY) ?? { played: 0, won: 0, best: 0, endings: [] };
  s.played += 1;
  if (CONTENT.endings[g.state.endingId].kind === "win") { s.won += 1; s.best = Math.max(s.best, g.score()); }
  if (!s.endings.includes(g.state.endingId)) s.endings.push(g.state.endingId);
  storage.set(STATS_KEY, s);
}

// ---- Views ----
function lcd(text) {
  const [hm, ap] = text.split(" ");
  const [h, m] = hm.split(":");
  return `<div class="lcd" role="img" aria-label="${esc(text)}">${h}<span class="colon">:</span>${m} <small>${ap}</small></div>`;
}

function meter(m, value, label = name(m), color = m) {
  const danger = DANGER[m] != null && value <= DANGER[m];
  return `<div class="meter${danger ? " danger" : ""}" role="meter" aria-label="${esc(label)}" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${value}">
    <div class="meter-head"><span class="name">${esc(label)}</span><span class="val">${value}</span></div>
    <div class="bar"><span class="fill" style="width:${value}%;background:var(--${color})"></span></div>
  </div>`;
}

// Today's sleepiness as a word against tonight's bedtime bar.
function bedtime(g) {
  const sleepy = g.state.meters.sleepy;
  const bar = g.state.day === 4 ? FRIDAY_SLEEPY : cfg.bedtime.threshold;
  if (sleepy >= 80) return ["Overtired", "bad"];
  if (sleepy >= bar) return ["Ready for bed", "good"];
  if (sleepy >= bar - 20) return ["Drowsy", "neutral"];
  return ["Wired", "warn"];
}

function bedtimeChip(g) {
  if (g.state.phase === "night") return `<span class="chip neutral">🌙 Asleep (allegedly)</span>`;
  const [word, cls] = bedtime(g);
  return `<span class="chip ${cls}">Bedtime: ${word}</span>`;
}

function listDetails(g) {
  const tasks = g.state.tasks;
  const open = tasks.filter((t) => t.status === "open").length;
  const cats = [...new Set([...Object.keys(g.state.ledger.you), ...Object.keys(g.state.ledger.partner)])].sort();
  const taskRows = tasks.length
    ? tasks.map((t) => `<div class="row"><span class="${t.status === "done" ? "done" : t.status === "expired" ? "expired" : ""}">${sayEsc(taskDef(t.id)?.label ?? t.id)}</span><span class="muted">${esc(CONTENT.days[Math.min(4, Math.floor(t.due / 1440))].name.slice(0, 3))} ${formatClock(t.due % 1440)}</span></div>`).join("")
    : `<div class="muted">Nothing yet. Enjoy it.</div>`;
  const ledgerRows = cats.length
    ? cats.map((c) => `<div class="row"><span>${esc(c[0].toUpperCase() + c.slice(1))}</span><span>You ${g.state.ledger.you[c] ?? 0} · ${sayEsc("{partner}")} ${g.state.ledger.partner[c] ?? 0}</span></div>`).join("")
    : `<div class="muted">Nobody has done anything yet. Suspicious.</div>`;
  return `<details class="list"><summary>Your list (${open} open) and the ledger</summary>
    <div class="rows"><span class="eyebrow">List</span>${taskRows}<span class="eyebrow" style="margin-top:6px">Ledger</span>${ledgerRows}</div>
  </details>`;
}

function upcoming(g) {
  return g.state.queue
    .filter((q) => q.at > g.now)
    .sort((a, b) => a.at - b.at || a.seq - b.seq)
    .slice(0, 2)
    .map((q) => `<span>⏳ ${sayEsc(CONTENT.events.find((e) => e.id === q.event)?.title ?? q.event)} at ${formatClock(q.at % 1440)}</span>`)
    .join("");
}

function hud(g) {
  const m = g.state.meters;
  const night = g.state.phase === "night";
  const ticks = upcoming(g);
  return `<section class="hud" aria-label="Status">
    <div class="hud-top">${lcd(night ? "2:47 AM" : formatClock(g.state.clock))}<span class="dayname">${esc(CONTENT.days[g.state.day].name)}</span><span class="spacer"></span>${g.modifier && g.modifier.title !== CONTENT.days[g.state.day].name ? `<span class="pill">${esc(g.modifier.title)}</span>` : ""}</div>
    <div class="groups">
      <div class="group"><span class="eyebrow">You</span>${meter("energy", m.energy)}${meter("rel", m.rel)}</div>
      <div class="group"><span class="eyebrow">${sayEsc("{kid}")}</span>${meter("mood", m.mood)}${meter("rested", 100 - m.debt, "Sleep", "debt")}</div>
    </div>
    <div class="chips">${bedtimeChip(g)}</div>
    ${ticks ? `<div class="ticker">${ticks}</div>` : ""}
    ${night ? "" : listDetails(g)}
  </section>`;
}

function chips(deltas) {
  const keys = METERS.filter((k) => deltas[k]);
  if (!keys.length) return "";
  return `<div class="chips">${keys.map((k) => {
    if (k === "sleepy") return `<span class="chip neutral">${deltas[k] > 0 ? "Sleepier" : "Livelier"}</span>`;
    // Sleep is how rested the toddler is: debt down means Sleep up.
    const d = k === "debt" ? -deltas[k] : deltas[k];
    const hib = k === "debt" ? true : HIGHER_IS_BETTER[k];
    const cls = hib == null ? "neutral" : (d > 0) === hib ? "good" : "bad";
    return `<span class="chip ${cls}">${d > 0 ? "+" : "−"}${Math.abs(d)} ${k === "debt" ? "Sleep" : esc(name(k))}</span>`;
  }).join("")}</div>`;
}

function eyebrow(ev) {
  if (ev.phase === "night") return ["2 AM", "night", "k-night"];
  if (ev.hazard === "catastrophe") return ["Catastrophe", "red", "k-red"];
  if (ev.hazard === "sting") return ["Hazard", "red", "k-red"];
  if (ev.moment) return ["Small moment", "love", "k-love"];
  if (CONTENT.events.some((e) => e.tell === ev.id)) return ["Warning", "warn", "k-warn"];
  if (CONTENT.tasks.some((t) => t.expire === ev.id)) return ["From your list", "warn", "k-warn"];
  if (ev.forced && !ev.endsWeek) return ["Payback", "warn", "k-warn"];
  return null;
}

function chatThread(withName, messages, startDelay = 0) {
  let delay = startDelay;
  const rows = messages.map((m, i) => {
    const mine = m.from === "you";
    const prev = messages[i - 1];
    const sender = !mine && withName && m.from !== withName && (!prev || prev.from !== m.from) ? `<span class="from">${sayEsc(m.from)}</span>` : "";
    delay += 0.35 + Math.min(0.75, String(m.text).length * 0.01);
    return `<div class="bubble ${mine ? "mine" : "theirs"}" style="animation-delay:${delay.toFixed(2)}s">${sender}${sayEsc(m.text)}</div>`;
  }).join("");
  const head = withName ? `<div class="chat-with"><span class="avatar">${esc(say(withName).slice(0, 1))}</span>${sayEsc(withName)}</div>` : "";
  return { html: `<div class="chat">${head}${rows}</div>`, ends: delay + 0.3 };
}

function timerOn(ev, choices) {
  return ev.timer != null && choices.some((c) => c.timeout) && settings().timers;
}

function eventView(g) {
  const ev = g.currentEvent;
  const choices = g.visibleChoices();
  const timed = timerOn(ev, choices);
  const tag = timed ? ["Panic", "red", "k-red"] : eyebrow(ev);
  const chat = ev.chat ? chatThread(ev.chat.with, ev.chat.messages) : null;
  const after = chat && !reduceMotion() ? ` after-chat" style="animation-delay:${chat.ends.toFixed(2)}s` : "";
  let key = 0;
  return `${hud(g)}
  <article class="note enter ${tag ? tag[2] : ""}" aria-labelledby="ev-title">
    ${tag ? `<p class="tag-line ${tag[1]}">${tag[0]}</p>` : ""}
    <h2 id="ev-title">${sayEsc(ev.title)}</h2>
    <p class="${chat ? "muted small" : "text"}">${sayEsc(ev.text)}</p>
    ${chat ? chat.html : ""}
  </article>
  ${timed ? `<div class="countdown${after}" data-timer="${ev.timer}"><div class="head"><span>DECIDE</span><span class="secs">${ev.timer}</span></div><div class="track"><div class="run"></div></div></div>` : ""}
  <div class="choices${after}">
    ${choices.map((c, i) => {
      if (c.timeout) return "";
      const locked = g.isLocked(c);
      key += 1;
      return `<button class="block${locked ? " locked" : ""}" data-act="choose" data-i="${i}" ${locked ? `aria-disabled="true"` : ""}><span class="key" aria-hidden="true">${key}</span><span class="label">${sayEsc(c.label)}</span><span class="mins">${locked ? `Too tired · needs ${c.minEnergy} Bandwidth` : `${c.duration} min`}</span></button>`;
    }).join("")}
  </div>`;
}

function stampTone(r) {
  if (r.snapped) return "bad";
  let score = 0;
  for (const [k, d] of Object.entries(r.deltas)) { const hib = HIGHER_IS_BETTER[k]; if (hib != null) score += hib ? d : -d; }
  return score > 4 ? "good" : score < -4 ? "bad" : "neutral";
}

  return `${hud(g)}

// Screen effects for an outcome or the ending: shake, red flash, confetti.
function effects(kinds) {
  if (kinds.includes("shake") && !reduceMotion()) { app.classList.remove("shake"); void app.offsetWidth; app.classList.add("shake"); }
  if (kinds.includes("flash")) {
    const f = document.createElement("div");
    f.className = "fx-flash";
    f.addEventListener("animationend", () => f.remove());
    document.body.append(f);
  }
  if (kinds.includes("confetti") && !reduceMotion()) {
    const box = document.createElement("div");
    box.className = "confetti";
    const colors = ["#ff5fa2", "#ffb347", "#ffe066", "#6ee7b7", "#818cf8", "#2dd4bf", "#f87171"];
    box.innerHTML = Array.from({ length: 70 }, () => {
      const x = Math.random() * 100, dx = Math.round(Math.random() * 120 - 60), spin = Math.round(240 + Math.random() * 660);
      return `<i style="left:${x}%;background:${colors[Math.floor(Math.random() * colors.length)]};--dx:${dx}px;--spin:${spin}deg;--d:${(1.3 + Math.random()).toFixed(2)}s;--delay:${(Math.random() * 0.35).toFixed(2)}s"></i>`;
    }).join("");
    document.body.append(box);
    setTimeout(() => box.remove(), 3200);
  }
}

// Panic countdown: when it runs out, the card's timeout choice happens.
function startTimer() {
  const el = app.querySelector(".countdown");
  if (!el || !session) return;
  const total = Number(el.dataset.timer) * 1000;
  const lead = parseFloat(el.style.animationDelay || "0") * 1000;
  const t0 = performance.now() + lead;
  const step = session.game.state.step;
  timerHandle = setInterval(() => {
    if (!session || session.screen !== "event" || session.game.state.step !== step) { clearInterval(timerHandle); return; }
    const left = Math.max(0, total - Math.max(0, performance.now() - t0));
    el.querySelector(".run").style.width = `${(100 * left) / total}%`;
    const secs = Math.ceil(left / 1000);
    el.querySelector(".secs").textContent = secs;
    el.classList.toggle("urgent", secs <= 2);
    if (left <= 0) {
      clearInterval(timerHandle);
      const idx = session.game.visibleChoices().findIndex((c) => c.timeout);
      if (idx >= 0) choose(idx, true);
    }
  }, 50);
}

function render() {
  clearInterval(timerHandle);
  let html;
  const g = session?.game;
  if (houseScreen) html = householdView();
  else if (!session) html = titleView();
  else if (session.screen === "morning") html = morningView(g);
  else if (session.screen === "lifeline") html = lifelineView();
  else if (session.screen === "outcome" && session.last) html = outcomeView(g, session.last);
  else if (session.screen === "ending" || g.isOver) html = endingView(g);
  else html = eventView(g);
  document.body.classList.toggle("night", !!g && g.state.phase === "night" && !g.isOver && session.screen !== "morning");
  app.innerHTML = html;
  window.scrollTo({ top: 0 });
  if (!houseScreen && session?.screen === "outcome" && session.last) {
    const r = session.last;
    effects(r.snapped ? ["shake", "flash"] : r.fx ? [r.fx] : []);
  } else if (!houseScreen && session && (session.screen === "ending" || g?.isOver)) {
    setTimeout(() => effects(g.ending.kind === "win" ? ["confetti"] : ["shake", "flash"]), 500);
  } else if (!houseScreen && session?.screen === "event") {
    startTimer();
  }
  if (session && (session.screen === "event" || session.screen === "outcome")) {
    app.querySelector(".choices .block:not(.locked), .block.primary")?.focus({ preventScroll: true });
  }
}

app.addEventListener("click", async (ev) => {
  const btn = ev.target.closest("[data-act]");
  if (!btn) return;
  const act = btn.dataset.act;
  if (act === "new") { if (houseComplete(storage.get(HOUSE_KEY))) newWeek(); else { houseScreen = "start"; render(); } }
  else if (act === "house-edit") { houseScreen = "edit"; render(); }
  else if (act === "me") {
    const input = app.querySelector('input[name="me"]');
    input.value = btn.dataset.me;
    app.querySelectorAll('[data-act="me"]').forEach((b) => b.setAttribute("aria-pressed", String(b === btn)));
  }
  else if (act === "react") {
    const g = session.game, r = session.last;
    const log = (storage.get(REACT_KEY) ?? []).filter((x) => x.step !== g.state.step);
    const had = (storage.get(REACT_KEY) ?? []).find((x) => x.step === g.state.step)?.kind;
    if (had !== btn.dataset.kind) log.push({ at: new Date().toISOString(), day: g.state.day, step: g.state.step, card: r.eventId, title: say(CONTENT.events.find((e) => e.id === r.eventId)?.title ?? r.eventId), choice: r.choiceIndex, outcome: r.outcomeIndex, kind: btn.dataset.kind });
    storage.set(REACT_KEY, log.slice(-5000));
    const mine = log.find((x) => x.step === g.state.step)?.kind;
    app.querySelectorAll('[data-act="react"]').forEach((b) => { b.setAttribute("aria-pressed", String(b.dataset.kind === mine)); b.classList.toggle("dim", !!mine && b.dataset.kind !== mine); });
  }
  else if (act === "send") {
    const r = session.last;
    const text = `${say(CONTENT.events.find((e) => e.id === r.eventId)?.title ?? "")}\n\n${say(r.text)}\n\n(Bedtime or Bust)`;
    try { if (navigator.share) await navigator.share({ text }); else { await navigator.clipboard.writeText(text); btn.textContent = "Copied"; } } catch { /* cancelled */ }
  }
  else if (act === "export") {
    const log = storage.get(REACT_KEY) ?? [];
    const q = (v) => `"${String(v).replaceAll('"', '""')}"`;
    const csv = ["time,day,card,title,choice,outcome,reaction", ...log.map((x) => [x.at, x.day, q(x.card), q(x.title), x.choice, x.outcome, x.kind].join(","))].join("\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
    a.download = "bedtime-or-bust-playtest.csv";
    a.click();
  }
  else if (act === "resume") { session = rebuild(storage.get(SAVE_KEY)); render(); }
  else if (act === "begin" || act === "lifeline") { session.screen = "event"; persist(); render(); }
  else if (act === "choose") choose(Number(btn.dataset.i));
  else if (act === "next") next();
  else if (act === "title") { houseScreen = null; session = null; render(); }
  else if (act === "copy") {
    const label = document.getElementById("copy-label");
    try {
      await navigator.clipboard.writeText(shareText(session.game));
      label.textContent = "Copied";
    } catch {
      const ta = document.getElementById("share-text");
      ta.focus();
      ta.select();
      label.textContent = "Selected. Copy it from the box above.";
    }
  }
});

app.addEventListener("submit", (ev) => {
  const form = ev.target.closest('[data-form="house"]');
  if (!form) return;
  ev.preventDefault();
  const data = new FormData(form);
  const h = { kid: trim(data.get("kid")), partner: trim(data.get("partner")), me: trim(data.get("me")) };
  if (!houseComplete(h)) { form.querySelector("input:placeholder-shown, input[value='']")?.focus(); return; }
  storage.set(HOUSE_KEY, h);
  storage.set(SETTINGS_KEY, { timers: !!data.get("timers"), reactions: !!data.get("reactions") });
  const starting = houseScreen === "start";
  houseScreen = null;
  if (starting) newWeek(); else render();
});

document.addEventListener("keydown", (ev) => {
  if (houseScreen || !session || session.screen !== "event" || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const n = Number(ev.key);
  const buttons = [...app.querySelectorAll('.choices [data-act="choose"]')];
  if (n >= 1 && n <= buttons.length) { ev.preventDefault(); choose(Number(buttons[n - 1].dataset.i)); }
});

if (typeof window.claude?.hot?.snapshot === "function") {
  window.claude.hot.snapshot(() => (session ? { seed: session.seed, picks: session.picks, screen: session.screen, v: CONTENT.version } : {}));
}
function start(data) {
  const restored = rebuild(data);
  if (restored) session = restored;
  render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>

</body>
</html>

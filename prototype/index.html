:1,"text":"\"Oh, we're done with diapers,\" says the parent at the sink, and explains how it only took a weekend. You say \"wow\" four times and leave with nothing.","effects":{"energy":-6},"set":["diaper:3"]}]},{"label":"Engineer one. Paper towels and a hair tie.","duration":8,"outcomes":[{"weight":2,"text":"You build a diaper from 14 paper towels and a hair tie. It holds all the way home. You could do this for a living. You'd earn more.","effects":{"mood":8,"energy":-6},"set":["diaper:3"],"stamp":"FIELD ENGINEERING"},{"weight":1,"text":"Fourteen paper towels and a hair tie. It holds until the parking lot, then turns back into paper towels, one at a time, in a trail behind you.","effects":{"mood":-6,"energy":-6},"set":["diaper:3"]}]}]},{"id":"diaper_4","family":"diaper","title":"Diaper #4: The Pail","text":"The diaper pail has been full for three days. You've been stomping it down with your foot. It makes a sound now when you open it. Not a smell. A sound.","window":[840,1160],"weight":4,"oncePerWeek":true,"when":{"flags":["diaper:3"],"notFlags":["diaper:4"]},"choices":[{"label":"Empty it. Now. Hold your breath.","duration":6,"minEnergy":20,"tags":["martyr"],"outcomes":[{"text":"You carry the bag out at arm's length, breathing through your mouth, then somehow through your ears. A neighbor watering their plants turns off the hose and goes inside.","effects":{"energy":-8,"rel":6},"set":["diaper:4"]}]},{"label":"One more stomp.","duration":1,"outcomes":[{"weight":2,"text":"One more stomp. The lid closes. Then, slowly, on its own, it opens again, as if it has something to say.","effects":{"energy":4},"set":["diaper:4"]},{"weight":1,"text":"The bag splits. You'll be cleaning the pail at 9 PM with a hose and the last of your will.","effects":{"energy":-8},"set":["diaper:4"],"stamp":"STRUCTURAL FAILURE","fx":"shake"}]},{"label":"Text {partner}: \"whose turn is the pail\"","duration":2,"tags":["tagteam"],"outcomes":[{"weight":1,"text":"They do it tonight, gagging twice in the driveway, quietly, so the neighbors won't know. You watch from the window with deep, unspoken love.","effects":{"rel":6,"energy":6},"set":["diaper:4"],"chat":[{"from":"{partner}","text":"mine. sorry. tonight"}]},{"weight":1,"text":"You did. Days ago. Neither of you replies. The pail keeps the score.","effects":{"rel":-8},"set":["diaper:4"],"chat":[{"from":"{partner}","text":"didn't you say you'd do it?"}]}]},{"label":"Potty day 3. Throw out the pail. Burn the boats.","duration":4,"when":{"flags":["d:potty"]},"outcomes":[{"weight":1,"text":"Out goes the pail, and every diaper with it. Commitment works: three trips to the potty, the last one standing on the stool, announcing it to the street.","effects":{"mood":14},"set":["diaper:4"],"stamp":"BOATS BURNED","fx":"confetti"},{"weight":1,"text":"Out goes the pail and all hope of retreat. Forty minutes later there's an accident on the couch, and you're digging a diaper out of the outside bin.","effects":{"energy":-6},"set":["diaper:4"]}]}]},{"id":"why_1","family":"why","title":"Why? (63 So Far)","text":"It's not even lunch and you've answered 63 whys. The chain began at \"Why is it raining?\" and has arrived, via clouds, Grandpa and the plumbing, at: \"Why is there a hole in your hair?\"","window":[450,720],"weight":2,"oncePerWeek":true,"when":{"notFlags":["why:1"]},"choices":[{"label":"\"There isn't.\" Check the mirror.","duration":2,"outcomes":[{"text":"There is. A small, perfect clearing, right on top. {kid} spotted it from the couch. Why #64: \"Can I touch it?\"","effects":{"energy":-6,"mood":8},"set":["why:1"],"stamp":"NEW INFORMATION"}]},{"label":"Answer honestly. Follicles. Genetics. Grandpa.","duration":10,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":1,"text":"You explain follicles, genetics and Grandpa. They listen to all of it. Why #64: \"Why Grandpa?\" You've been here all morning. You'll be here all afternoon.","effects":{"mood":10,"energy":-8},"set":["why:1"]},{"weight":1,"text":"You explain follicles and genetics. They nod slowly, then pat the hole in your hair, gently, as if it were a small pet. Why #64 never comes. You check the mirror anyway.","effects":{"mood":14,"energy":-6},"set":["why:1"]}]},{"label":"\"Because.\"","duration":1,"tags":["boundary"],"outcomes":[{"weight":1,"text":"\"Because why?\" Because because. \"Because because why?\" You've built a staircase with no top floor, and they're running up it.","effects":{"mood":-6,"energy":-6},"set":["why:1"]},{"weight":1,"text":"\"Oh,\" they say, satisfied. It worked. You'll never know why it worked. Now you have a why of your own.","effects":{"mood":6,"energy":4},"set":["why:1"]}]}]},{"id":"why_2","family":"why","title":"Why? (Now 211)","text":"Why #211 this week: \"Why is the moon following the car?\" You've started counting them in your phone, in the note where you used to write down ideas.","window":[780,1100],"weight":2,"oncePerWeek":true,"when":{"flags":["why:1"],"notFlags":["why:2"]},"choices":[{"label":"\"Because it loves you.\"","duration":2,"outcomes":[{"weight":2,"text":"\"The moon loves me,\" they tell the window, then the moon, then a man at a gas station. You'll be hearing about it for years.","effects":{"mood":14,"energy":2},"set":["why:2"]},{"weight":1,"text":"\"Why?\" \"It just does.\" \"Why does it just does?\" The moon doesn't have to answer questions. You do.","effects":{"mood":4,"energy":-6},"set":["why:2"]}]},{"label":"Pull over. Prove the moon isn't following.","duration":15,"minEnergy":25,"tags":["present"],"outcomes":[{"text":"You pull into a parking lot to prove it. The car stops. The moon stops. \"{ME},\" {kid} whispers. \"It's WAITING for us.\" You've proved the opposite, with science.","effects":{"mood":14,"energy":-10},"set":["why:2"],"stamp":"EXPERIMENT BACKFIRED"}]},{"label":"Make something up. Confidently.","duration":1,"outcomes":[{"weight":2,"text":"\"It's nosy.\" This is accepted at once. You've installed a nosy moon in their worldview. It will come up at every parent-teacher conference until fifth grade.","effects":{"mood":10},"set":["why:2","why:nosyMoon"]},{"weight":1,"text":"\"It's lost,\" you say. {kid} gasps and spends the drive shouting directions out the window. \"LEFT, MOON. LEFT.\" The moon misses the turn. So do you.","effects":{"mood":10,"energy":-4},"set":["why:2"]}]}]},{"id":"why_3","family":"why","title":"Why #1,000","text":"Your phone note says 999. {kid} inhales. Why #1,000 of the week is coming, and you'd like it to be a good one. \"Why do you write in your phone every time I say why?\"","window":[600,1140],"weight":2,"oncePerWeek":true,"when":{"flags":["why:2"],"notFlags":["why:3"]},"choices":[{"label":"Tell the truth: you're counting.","duration":2,"outcomes":[{"text":"\"I'm counting your whys.\" A long pause. \"Why?\" That's 1,001.","effects":{"mood":8,"energy":-2},"set":["why:3"],"stamp":"1,001"}]},{"label":"\"It's a list of the best questions ever.\"","duration":8,"minEnergy":20,"tags":["present"],"outcomes":[{"text":"They nod, proud, and spend the afternoon trying to get on the list. Why is the sky up. Why is shoes. Why is {partner}. The list grows by 140.","effects":{"mood":16,"energy":-10},"set":["why:3"]}]},{"label":"\"Why do YOU think?\"","duration":3,"outcomes":[{"weight":2,"text":"They think about it. It's the first silence of the why phase. Then: \"Because you love me.\" Then: \"Why?\" You'll take it.","effects":{"mood":12,"energy":4},"set":["why:3"]},{"weight":1,"text":"They think. \"Because you're old.\" They pat your hand. \"And you forget.\" You write that down too.","effects":{"mood":8,"energy":-4},"set":["why:3"]}]},{"label":"\"The nosy moon tells me what to write.\"","duration":2,"when":{"flags":["why:nosyMoon"]},"outcomes":[{"text":"A gasp. The moon is nosy AND it texts you. The next note from daycare is a full page, double-sided, and requests a reply.","effects":{"mood":14,"energy":-6},"set":["why:3"],"stamp":"LORE EXPANDED"}]}]},{"id":"bath","title":"Bath Time: Results May Vary","text":"Bath time. Tonight's bath will be either the best part of {kid}'s day or a formal grievance. They'll rule once the water's running, and the ruling is final.","window":[1110,1165],"priority":30,"when":{"max":{"day":3}},"choices":[{"label":"Full spa: bubbles, cups, the whale that squirts","duration":25,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":3,"when":{"max":{"day":0}},"text":"The whale squirts. {kid} laughs so hard they get hiccups, then laughs at the hiccups. The bath mat is a wetland now. But they're yawning.","effects":{"sleepy":12,"mood":8,"energy":-8},"ledger":{"bath":"you"}},{"weight":1,"when":{"max":{"day":0}},"text":"Ninety seconds in, the water is ruled \"too wet.\" {kid} escapes down the hallway, naked and triumphant. You give chase, holding the towel out like a matador.","effects":{"sleepy":6,"mood":-6,"energy":-10},"ledger":{"bath":"you"}},{"weight":3,"when":{"min":{"day":1},"max":{"day":1}},"text":"{kid} pours a cup of water over your head \"to wash you,\" then another, because you're \"still dirty.\" You come out cleaner than they do. They come out yawning.","effects":{"sleepy":12,"mood":8,"energy":-8},"ledger":{"bath":"you"}},{"weight":1,"when":{"min":{"day":1},"max":{"day":1}},"text":"The bath toys must be lined up on the edge in an order only {kid} understands. You move the duck. Bath is over. Everyone is wet and nobody is clean.","effects":{"sleepy":4,"mood":-8,"energy":-8},"ledger":{"bath":"you"},"stamp":"THE DUCK WAS MOVED"},{"weight":3,"when":{"min":{"day":2},"max":{"day":2}},"text":"Tonight the bath is a restaurant. You order soup. It's bathwater, served in a cup, and {kid} watches until you pretend to finish every drop. Five stars. Huge yawn.","effects":{"sleepy":12,"mood":8,"energy":-8},"ledger":{"bath":"you"}},{"weight":1,"when":{"min":{"day":2},"max":{"day":2}},"text":"{kid} discovers the drain: the most fascinating and terrifying thing in the house. It must be watched until every drop is gone. That takes 11 minutes. You both watch.","effects":{"sleepy":10,"mood":4,"energy":-10},"ledger":{"bath":"you"}},{"weight":3,"when":{"min":{"day":3}},"text":"{kid} announces they're a shark. Then a sleepy shark. Then, slumped against the side of the tub, just sleepy. You have never been so grateful to a shark.","effects":{"sleepy":12,"mood":8,"energy":-8},"ledger":{"bath":"you"}},{"weight":1,"when":{"min":{"day":3}},"text":"A brown bath crayon bobs to the surface. {kid} is out of the tub before your brain finishes the thought. It's a crayon. You both stand there, dripping, reconsidering everything.","effects":{"sleepy":6,"mood":2,"energy":-12},"ledger":{"bath":"you"},"stamp":"ALL CLEAR: CRAYON","fx":"shake"}]},{"label":"Invoke the bath treaty (signed this morning)","duration":5,"tags":["tagteam"],"when":{"flags":["d:partnerBath"],"notFlags":["d:partnerOut"]},"outcomes":[{"weight":2,"text":"A promise, kept. Through the door: splashing, a song about a boat and one heartfelt \"oh, come ON.\" You lie on the hallway floor and listen to someone else's problem.","effects":{"sleepy":10,"energy":10,"rel":4},"ledger":{"bath":"partner"}},{"weight":1,"text":"{partner} does bath. They also do the floor, the hallway and their own shirt. It's a disaster, but it's their disaster, and you are horizontal. The hallway will come up tomorrow.","effects":{"sleepy":10,"energy":12,"rel":-4},"ledger":{"bath":"partner"}}]},{"label":"Ask {partner}, casually, like it's not a negotiation","duration":5,"tags":["tagteam"],"when":{"notFlags":["d:partnerBath","d:partnerOut"]},"outcomes":[{"when":{"min":{"ledger":2}},"text":"{partner} does the math, finds it unflattering and rolls up their sleeves without a speech. You hear \"rubber ducky\" through the door, sung with real resentment.","effects":{"sleepy":10,"energy":8},"ledger":{"bath":"partner"}},{"when":{"max":{"ledger":1}},"text":"\"Can you?\" \"Can YOU?\" You can, it turns out. You do bath, without bubbles, and hear about the bubbles until 7:45.","effects":{"sleepy":6,"energy":-4,"rel":-4,"mood":-6},"ledger":{"bath":"you"}}]},{"label":"Skip it. They're clean enough. Mostly.","duration":2,"outcomes":[{"weight":2,"text":"You wipe the big three: face, hands and the neck crease where crackers go to retire. Daycare will smell the rest.","effects":{"energy":6}},{"weight":1,"text":"No bath tonight. {kid} is outraged, because tonight, for the first time in recorded history, they wanted one.","effects":{"energy":4,"mood":-10}}]}]},{"id":"partner_text","title":"The Doorway Negotiation","text":"{partner} is halfway out the door: keys in teeth, coffee in one hand, laptop bag in the other. You have one sentence to lock in bath tonight. Choose it carefully.","window":[390,520],"weight":2,"oncePerWeek":true,"when":{"max":{"day":3}},"choices":[{"label":"\"Bath's yours tonight.\" Say it like weather.","duration":2,"tags":["tagteam"],"outcomes":[{"when":{"min":{"ledger":1}},"text":"{partner} nods around the keys. A verbal contract, witnessed by {kid}, who is sitting in the laundry basket wearing a sock as a glove.","effects":{"energy":12,"rel":4},"set":["d:partnerBath"],"stamp":"VERBAL CONTRACT"},{"when":{"max":{"ledger":0}},"text":"\"Mmf,\" says {partner}, through the keys. It could mean \"yes.\" It could mean \"I did it Sunday.\" The door closes on the ambiguity.","effects":{"energy":4,"rel":-8}}]},{"label":"Text it before they reach the car. Timestamped.","duration":2,"tags":["tagteam"],"outcomes":[{"weight":2,"text":"Their phone buzzes at the car door. They read it, turn and give you a thumbs-up through the window. You screenshot the thumbs-up. It's admissible.","effects":{"energy":12,"rel":-4},"set":["d:partnerBath"]},{"weight":1,"text":"They read it at a red light and reply \"k.\" One letter. Legally sufficient. Emotionally, you'll be thinking about that \"k\" until lunch.","effects":{"energy":8,"rel":-12},"set":["d:partnerBath"]}]},{"label":"Offer a trade: you'll take tomorrow's 5 AM","duration":3,"tags":["negotiate"],"outcomes":[{"text":"\"Deal.\" They take bath tonight; you take the 5 AM. Tomorrow-you will hate today-you, but tomorrow-you isn't here.","effects":{"rel":12,"energy":-12},"set":["d:partnerBath"]}]},{"label":"Say nothing. They'll offer. (They won't.)","duration":1,"outcomes":[{"weight":2,"text":"They don't offer. Nobody offers. Bath tonight goes to whoever is slower to sit down after dinner.","effects":{"energy":8,"rel":-8}},{"weight":1,"text":"At the door, unprompted: \"I'll do bath tonight.\" You stare at them like they've started speaking Latin. You say nothing, in case it breaks.","effects":{"energy":8,"rel":12},"set":["d:partnerBath"],"fx":"confetti"}]}]},{"id":"buffet","title":"\"Did I Not Mention the Dinner?\"","text":"A text from {partner}, late in the afternoon.","chat":{"with":"{partner}","messages":[{"from":"{partner}","text":"ok so. client dinner is tonight 😬"},{"from":"{partner}","text":"it's been on my calendar for weeks"},{"from":"you","text":"your calendar"},{"from":"{partner}","text":"home by 7:15!! SO sorry"},{"from":"{partner}","text":"[photo: a bread basket]"}]},"window":[930,1030],"weight":2,"oncePerWeek":true,"when":{"max":{"day":3},"notFlags":["d:handoff"]},"choices":[{"label":"\"Have fun! ❤️\" (A lie with a heart on it.)","duration":2,"tags":["martyr"],"outcomes":[{"weight":2,"text":"The bigger person eats four fish sticks standing at the counter at 6:40 and calls it dinner, out loud, to no one.","effects":{"rel":8,"energy":-10},"set":["d:handoff","d:partnerOut"],"ledger":{"evening":"you"},"chat":[{"from":"{partner}","text":"you're the best. bringing you the tiramisu"}]},{"weight":1,"text":"{partner} sends a photo back: the client brought their toddler, who is throwing bread at the VP. You feel a deep, warm solidarity with a stranger's child.","effects":{"rel":10,"energy":-8},"set":["d:handoff","d:partnerOut"],"ledger":{"evening":"you"}}]},{"label":"Reply with a photo of dinner: four fish sticks","duration":2,"outcomes":[{"when":{"min":{"rel":50}},"text":"{partner} calls from the restaurant hallway to apologize. {kid} grabs the phone and hangs up on them, which is the strongest statement anyone makes all day.","effects":{"rel":8,"energy":8},"set":["d:handoff","d:partnerOut"],"ledger":{"evening":"you"}},{"when":{"max":{"rel":49}},"text":"Read 4:15 PM. No reply until 7:15, when they walk in smelling of garlic bread and a room where nobody threw anything.","effects":{"rel":-10,"energy":2},"set":["d:handoff","d:partnerOut"],"ledger":{"evening":"you"}}]},{"label":"\"Must be nice.\"","duration":2,"outcomes":[{"weight":2,"text":"Three words. Accurate, and you both know it. They send back a paragraph. You don't read the paragraph. You feel fantastic for almost a full minute.","effects":{"rel":-18,"energy":10},"set":["d:handoff","d:partnerOut"],"count":{"blames":1},"ledger":{"evening":"you"},"stamp":"SENT. NO REGRETS (YET)"},{"weight":1,"text":"Three dots. Then the truth. Suddenly the fish sticks look pretty good. You both feel better, and slightly worse about crypto.","effects":{"rel":-3,"energy":12},"set":["d:handoff","d:partnerOut"],"count":{"blames":1},"ledger":{"evening":"you"},"chat":[{"from":"{partner}","text":"it isn't. the client is explaining crypto to me. i've been here 40 min"}]}]},{"label":"\"You promised bath.\" Attach the screenshot.","duration":2,"when":{"flags":["d:partnerBath"]},"outcomes":[{"text":"A long pause. Then an offer you didn't even have to ask for. Being wronged has never paid this well.","effects":{"rel":-2,"energy":10},"set":["d:handoff","d:partnerOut"],"ledger":{"evening":"you"},"stamp":"SETTLEMENT REACHED","chat":[{"from":"{partner}","text":"ok. bath AND bedtime tomorrow"},{"from":"{partner}","text":"and saturday morning. i'm so sorry"}]}]}]},{"id":"zoom","title":"Can Everyone See My Screen?","text":"Your call is cameras-on (\"it's a culture thing\"). {partner} has a call in the next room. {kid} is wearing your bike helmet and nothing else. Somebody has to take the helmet.","window":[540,1020],"weight":2,"oncePerWeek":true,"when":{"notFlags":["d:partnerOut","d:deadline"]},"choices":[{"label":"Take {kid}. Audio only. Say \"great point\" a lot.","duration":30,"minEnergy":25,"tags":["martyr"],"outcomes":[{"weight":2,"text":"Camera off, toddler on lap, \"great point\" into the mute button eleven times. {partner} mouths \"thank you\" through the glass door. You'll be invoicing them later.","effects":{"energy":-10,"rel":10,"mood":6}},{"weight":1,"text":"Audio-only works until {kid} finds unmute and tells 14 people and a client in Denver, \"{ME} DOESN'T HAVE PANTS ON EITHER.\" You do. Nobody will ever believe that now.","effects":{"energy":-10,"rel":6},"stamp":"BROADCAST LIVE","fx":"shake"}]},{"label":"\"Mine's a client. Yours is a stand-up.\"","duration":30,"tags":["negotiate"],"outcomes":[{"when":{"min":{"ledger":2}},"text":"{partner} does the ledger math and takes the helmet. Their stand-up gets a status update from a pantsless toddler: \"Truck.\" Best update of the sprint.","effects":{"energy":12,"rel":-8}},{"when":{"max":{"ledger":1}},"text":"\"Mine's with the VP.\" A standoff. {kid} settles it by attending both calls, in the helmet, and getting more reactions than anyone.","effects":{"rel":-8,"mood":10}}]},{"label":"Present anyway. Radiate confidence.","duration":30,"outcomes":[{"weight":1,"text":"You present the Q3 roadmap while a figure in a bike helmet does laps behind you. Nobody mentions it. Your manager says, \"Love the energy in this one.\"","effects":{"energy":-9,"mood":-12,"rel":8}},{"weight":1,"text":"Mid-slide four, the helmet climbs into your lap and addresses the camera: \"Hi. I'm the boss.\" Nobody on the call disagrees.","effects":{"mood":12,"energy":-6,"rel":6},"stamp":"NEW MANAGEMENT"}]},{"label":"Crackers, mute, pray","duration":30,"tags":["bribe"],"outcomes":[{"text":"Mute. Unmute: \"great point.\" Mute. {kid} eats crackers in your doorway and drops every fourth one into your keyboard. The Q key will crunch until you retire.","effects":{"mood":12,"energy":-3},"count":{"snacks":1}}]}]},{"id":"screen","title":"The Duck One","text":"{kid} wants Sunshine Sing-Along. Not any episode: \"the one with the duck.\" There are 211 episodes. Sixty-four of them have a duck.","window":[480,1140],"weight":3,"oncePerWeek":true,"choices":[{"label":"Audition ducks until one of them is the duck","duration":25,"tags":["screen"],"outcomes":[{"weight":1,"text":"Episode 112: a duck learns to share. {kid} gasps, \"THAT duck,\" and goes perfectly still. You fold a load of laundry and stare at a wall, in that order.","effects":{"energy":12},"set":["d:screen"],"count":{"screen":22},"ledger":{"laundry":"you"},"schedule":[{"event":"screen_off","in":22}]},{"weight":1,"text":"Nine ducks: wrong, wrong, \"NO,\" wrong. Episode ten has no duck in it at all. \"DUCK ONE,\" says {kid}, satisfied. You will never understand the duck.","effects":{"energy":12,"mood":9},"set":["d:screen"],"count":{"screen":22},"schedule":[{"event":"screen_off","in":22}]}]},{"label":"\"How about a BOOK with a duck?\"","duration":15,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":1,"text":"You read \"Duck Has a Day\" in four voices. {kid} adds a fifth. Nobody watches anything. You'd brag about it, but then you'd have to admit you tried.","effects":{"energy":-8,"mood":12}},{"weight":1,"text":"\"Not a BOOK duck. A TV duck.\" The distinction is critical, and you have insulted the duck.","effects":{"energy":-4,"mood":-12},"stamp":"WRONG DUCK","fx":"shake"}]},{"label":"\"Ducks are a weekend show.\" Invent a policy.","duration":5,"tags":["boundary"],"snapRisk":true,"outcomes":[{"weight":1,"text":"{kid} accepts the policy, gravely, and goes to explain it to the duck book. You get eleven minutes of quiet and a reputation as a lawmaker.","effects":{"energy":12,"mood":-8},"stamp":"POLICY ENACTED"},{"weight":1,"text":"\"MAKE IT THE WEEKEND.\" You can't. They know you can't. They lie face-down on the remote until somebody does.","effects":{"energy":-4,"mood":-14},"fx":"shake"}]}]},{"id":"dressed","title":"Launch Sequence: Scrubbed","text":"Getting dressed has a sequence: diaper, left sock, right sock, shirt, pants. You did the right sock first. {kid} has scrubbed the launch. Everything comes off. The countdown restarts at diaper.","window":[400,600],"weight":2,"oncePerWeek":true,"when":{"notFlags":["d:home"]},"choices":[{"label":"Restart the sequence. By the book.","duration":15,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":2,"text":"Diaper. Left. Right. Shirt. Pants. Each stage is inspected and approved. Liftoff, eight minutes ahead of schedule. Mission control weeps quietly into its coffee.","effects":{"mood":12,"energy":-8},"stamp":"LIFTOFF"},{"weight":1,"text":"Diaper, left, right, shirt— \"NO.\" Shirts go on from the back. There is a back way. Nobody told you. Launch scrubbed again.","effects":{"mood":-10,"energy":-10},"fx":"shake"}]},{"label":"Argue it's the left sock from where you stand","duration":5,"tags":["negotiate"],"outcomes":[{"weight":1,"text":"{kid} walks around to your side, studies the sock from your angle and accepts this. You've won a case on a technicality.","effects":{"mood":12,"energy":6},"stamp":"OBJECTION SUSTAINED"},{"weight":1,"text":"{kid} walks around to your side to check. Still the right sock. Now they don't trust either of your feet.","effects":{"mood":-10,"energy":2}}]},{"label":"Pajamas to daycare. It's a look.","duration":2,"outcomes":[{"weight":1,"text":"Ms. Patty says, \"Cozy!\" in the voice teachers use for things they'll mention to the director. The director's email arrives at 10:14. It's friendly. It's three paragraphs.","effects":{"energy":-6,"mood":6}},{"weight":1,"text":"Nobody notices. Two other kids are in pajamas. One is wearing a parent's sweater as a dress. You are among your people.","effects":{"energy":12,"mood":9}}]}]},{"id":"blowout","title":"It's in the Car Seat","text":"The blowout went up the back, past the onesie and into the car seat. The car seat cover is machine-washable. The manual says so. The manual does not say how the straps go back in.","window":[370,1140],"weight":2,"oncePerWeek":true,"choices":[{"label":"Wash it and re-thread it, with a 19-minute video","duration":45,"minEnergy":25,"tags":["martyr"],"outcomes":[{"weight":2,"text":"The video is 19 minutes. The first six are the man's personal journey with car seats. Forty minutes later the straps are in. You check them twice, because that part matters. You're a mechanic now.","effects":{"energy":-12,"mood":6}},{"weight":1,"text":"Done. Then you see it: one buckle piece, on the floor, unexplained. It goes in at step one. You start again, because that one matters.","effects":{"energy":-18,"mood":4}}]},{"label":"Eighty wipes and denial","duration":10,"outcomes":[{"weight":2,"text":"Eighty wipes later, it's clean from a distance. It will smell faintly of today until the day you sell it. {partner} is driving it tomorrow.","effects":{"energy":6,"rel":-6}},{"weight":1,"text":"Seventy-nine wipes in, you find more. It's in the cup holder. How is it in the cup holder? You put the windows down and stop asking questions.","effects":{"energy":-4},"stamp":"CUP HOLDER: COMPROMISED","fx":"flash"}]},{"label":"Text {partner}: \"the car seat is yours tonight\"","duration":2,"tags":["tagteam"],"when":{"notFlags":["d:partnerOut"]},"outcomes":[{"when":{"min":{"rel":50}},"text":"\"oh no.\" Then \"on it.\" At 8:40 PM, a photo of perfectly re-threaded straps, captioned \"never speak of this.\" It's basically a love letter.","effects":{"energy":10,"rel":4},"ledger":{"laundry":"partner"}},{"when":{"max":{"rel":49}},"text":"\"lol.\" Just \"lol.\" The car seat is still yours. So is the \"lol,\" forever.","effects":{"energy":-3,"rel":-12}}]}]},{"id":"playground","title":"The Narrator","text":"At the playground, another parent narrates their child's every move, loudly, for an audience: \"I see you CHOOSING to climb! So BRAVE with your body!\" {kid} is eating a wood chip. The narrator turns to you.","window":[540,1080],"weight":2,"oncePerWeek":true,"when":{"notFlags":["d:home"]},"choices":[{"label":"Narrate back: \"I see you choosing a wood chip.\"","duration":15,"outcomes":[{"weight":1,"text":"The narrator nods, impressed. {kid}, unnerved at being narrated, spits out the wood chip. It worked by accident, which is how most things work.","effects":{"mood":-6,"sleepy":8,"energy":6}},{"weight":1,"text":"{kid} eats a second wood chip to hear what you'll say next. You've created an audience, and the audience wants more.","effects":{"mood":12,"sleepy":8}}]},{"label":"Confiscate the chip. Produce an emergency apple.","duration":15,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":1,"text":"Your emergency apple has been in the bag since Sunday. It has more bruise than apple. The narrator says \"ooh, an APPLE\" with real effort. Still: an apple.","effects":{"mood":-6,"energy":-12,"sleepy":10},"count":{"snacks":1}},{"weight":1,"text":"{kid} trades the wood chip for the apple, takes one bite and offers the rest to the narrator's child. The narrator has nothing to say. For once.","effects":{"mood":10,"energy":-8,"sleepy":10},"count":{"snacks":1}}]},{"label":"Sit on the bench. Make eye contact with your phone","duration":20,"outcomes":[{"weight":1,"text":"The narrator narrates you: \"Some grown-ups need a little break, don't they?\" Everyone hears it. You spend the next twenty minutes pushing a swing with enormous energy, for the record.","effects":{"energy":-8,"sleepy":8},"fx":"flash"},{"weight":1,"text":"The narrator sits beside you, drops the voice and says, \"I hate this. Do you hate this?\" You trade numbers. You'll never text. It helps anyway.","effects":{"energy":16,"sleepy":8},"stamp":"UNLIKELY ALLIANCE"}]}]},{"id":"grocery","title":"The Car Cart","text":"The grocery store has one cart shaped like a race car. It's 11 feet long and steers like a cruise ship. {kid} has seen it. {kid} will not be shopping in any other vehicle.","window":[540,1020],"weight":2,"oncePerWeek":true,"when":{"notFlags":["d:home"]},"choices":[{"label":"Take the race car. All 11 feet of it.","duration":30,"outcomes":[{"weight":2,"text":"Every turn takes three points. {kid} honks the plastic horn 140 times. A man in cereal says \"beep beep\" each time you pass. By aisle 9, it means something else.","effects":{"mood":12,"energy":-8},"ledger":{"errands":"you"}},{"weight":1,"text":"Two minutes in, {kid} climbs out of the car and into a regular cart. You push both carts through the store. People part for you.","effects":{"mood":8,"energy":-12},"ledger":{"errands":"you"}}]},{"label":"Regular cart. \"The race car is broken.\"","duration":20,"tags":["boundary"],"snapRisk":true,"outcomes":[{"weight":1,"text":"\"Broken?\" {kid} accepts this, gravely, and walks over to pat the race car on the hood. You've never felt worse about getting your way.","effects":{"mood":-8,"energy":12},"ledger":{"errands":"you"}},{"weight":1,"text":"A child rolls past in the race car, honking. It is not broken. {kid} looks at you the way a jury looks at a witness who just lied.","effects":{"mood":-20,"energy":2},"ledger":{"errands":"you"},"stamp":"WITNESS DISCREDITED","fx":"shake"}]},{"label":"Let them push the tiny customer cart","duration":25,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":1,"text":"{kid} does their own shopping: a lemon, a lemon, a lemon and a birthday candle. They are so proud. You buy the lemons.","effects":{"mood":14,"energy":-8},"ledger":{"errands":"you"}},{"weight":1,"text":"The tiny cart hits top speed in aisle 3 and finds a man's ankles. \"It's fine,\" says the man, in a voice that isn't. You apologize all the way to dairy.","effects":{"mood":10,"energy":-8},"ledger":{"errands":"you"}}]}]},{"id":"cl_plank","title":"The Plank","text":"Parking lot, light rain. {kid} has gone stiff as a board at the one angle that makes car seats impossible. An SUV has its blinker on for your spot. It's waiting. Its driver is watching.","window":[480,1080],"weight":2,"oncePerWeek":true,"when":{"notFlags":["d:home"]},"choices":[{"label":"Ancient technique: tickle ribs, fold at the hips","duration":3,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":2,"text":"One tickle at the ribs and they fold like a lawn chair. Buckled in four seconds. The SUV driver nods once: a professional acknowledging a professional.","effects":{"mood":10,"energy":-6},"stamp":"FOLDED"},{"weight":1,"text":"You tickle. {kid} laughs. {kid} stays perfectly rigid while laughing, which you didn't know the human body could do. The SUV turns its wipers on, pointedly.","effects":{"mood":12,"energy":-12}}]},{"label":"Wave the SUV on. You live in this spot now.","duration":15,"outcomes":[{"weight":1,"text":"You wave. The SUV doesn't leave. It's committed. So are you. Fourteen minutes later the plank sighs and sits down on its own, damp and victorious.","effects":{"energy":-2,"mood":10}},{"weight":1,"text":"The SUV gives up and leaves. The moment the audience is gone, {kid} relaxes and climbs in. It was never about the car seat. It was about the crowd.","effects":{"energy":4,"mood":12}}]},{"label":"Fruit snack, held up like a badge","duration":2,"tags":["bribe"],"outcomes":[{"weight":2,"text":"The fruit snack appears. The plank bends instantly. They were never rigid. They were negotiating.","effects":{"mood":12,"energy":9},"count":{"snacks":1},"stamp":"TERMS ACCEPTED"},{"weight":1,"text":"The fruit snack appears. The plank bends, accepts it and goes rigid again. \"Two.\" The price of a car seat has doubled in four seconds, in the rain.","effects":{"mood":8,"energy":-6},"count":{"snacks":1}}]}]},{"id":"cl_check","title":"Check, Please (With the Food)","text":"A family restaurant, lunch rush. You order in 40 seconds, and you order the check with the food. The waiter doesn't blink. {kid} has two crayons. One is broken. The clock is running.","window":[660,840],"weight":2,"oncePerWeek":true,"when":{"notFlags":["d:home"]},"choices":[{"label":"Deploy the kit: stickers, spoon, straw worm","duration":40,"minEnergy":25,"tags":["present"],"outcomes":[{"weight":2,"text":"Stickers buy four minutes. The spoon buys two. The straw-wrapper worm, brought to life with one drop of water, buys the entire meal. You tip 30%.","effects":{"mood":12,"energy":-10},"fx":"confetti"},{"weight":1,"text":"Stickers: four minutes. Spoon: two. Worm: ninety seconds. The food arrives at minute nine. You eat yours standing beside the booth, like a bodyguard.","effects":{"mood":4,"energy":-12}}]},{"label":"Hand over your phone. \"Just this once.\"","duration":40,"tags":["screen"],"outcomes":[{"weight":2,"text":"Silence. {kid} watches a stranger unbox eggs. You eat a hot meal, slowly, like a citizen. The next table gives you a look that's practically a review.","effects":{"mood":8,"energy":12},"set":["d:screen"],"count":{"screen":30}},{"weight":1,"text":"Silence, for 31 minutes. Then you ask for the phone back. The negotiation takes longer than the meal, and you lose, in front of the next table.","effects":{"mood":-12,"energy":4},"set":["d:screen"],"count":{"screen":30}}]},{"label":"Let the waiter work their magic","duration":30,"outcomes":[{"weight":1,"text":"The waiter crouches, learns {kid}'s name and brings a cup of ice \"just for you.\" {kid} is in love. You're in love. The waiter does this 40 times a day and still means it.","effects":{"mood":12,"energy":6}},{"weight":1,"text":"The waiter crouches to say hi. {kid} looks them dead in the eye: \"No.\" Then, to be sure: \"NO.\" The waiter backs away slowly. Service is slower now.","effects":{"mood":-12,"energy":3}}]}]},{"id":"climber","title":"The Summit","text":"{kid} is standing on top of the bookshelf, arms raised, summit pose. You did anchor that bookshelf. Right? You picture the bag of wall anchors in the junk drawer. Unopened.","window":[480,1100],"weight":2,"oncePerWeek":true,"when":{"notFlags":["anchored"]},"choices":[{"label":"Get them down. Calm voice, fast hands.","duration":3,"outcomes":[{"weight":1,"text":"Down in four seconds. {kid} immediately starts up the couch, the next-highest peak in the region. This is their sport now, and you're the unpaid spotter.","effects":{"mood":-12,"energy":-9,"sleepy":4}},{"weight":1,"text":"Down safely. On the way, {kid} leaves a crayon on top of the bookshelf, so the next climber will know they were here.","effects":{"mood":12,"energy":-6}}]},{"label":"Get them down. Anchor everything taller than you.","duration":60,"minEnergy":30,"tags":["martyr"],"outcomes":[{"weight":2,"text":"An hour of drilling into studs while {kid} \"helps\" with a toy hammer. Everything tall is now bolted to a wall. Your lower back will be bringing this up all week.","effects":{"energy":-16,"mood":6,"rel":6},"set":["anchored"],"stamp":"UP TO CODE"},{"weight":1,"text":"You find the stud on the ninth hole. The wall looks like it lost an argument. Everything's anchored. You'll patch the eight extra holes never.","effects":{"energy":-16,"mood":6,"rel":6},"set":["anchored"]}]},{"label":"Get them down. Then build a legal mountain.","duration":20,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":2,"text":"The couch becomes a mountain range with a soft landing zone. {kid} summits it 40 times and gets sleepy. The cushions will never go back in the right order.","effects":{"mood":14,"sleepy":8,"energy":-8}},{"weight":1,"text":"{kid} climbs the cushion mountain once, politely, then walks back to the bookshelf. Better views. You take the books down and go get the anchors after all.","effects":{"mood":6,"energy":-16},"set":["anchored"]}]}]},{"id":"content","title":"Say Cheese","text":"{kid} is doing something genuinely adorable with a wooden spoon. You open the camera. They stop, turn to face you and say \"cheese\" with the flat eyes of someone who has done this before.","window":[480,1080],"weight":2,"oncePerWeek":true,"choices":[{"label":"Hide behind the fridge. Film from cover.","duration":15,"outcomes":[{"weight":1,"text":"Eleven seconds of pure magic before they spot you and say \"cheese\" again. You post it. 312 likes. It's the most you've heard from other adults since Sunday.","effects":{"energy":8}},{"weight":1,"text":"They spot the lens. Now it's a show: fall down, laugh, fall down, check the camera. Twenty minutes of material. None of it is the spoon.","effects":{"energy":-8,"mood":12}}]},{"label":"Put the phone down. Just watch.","duration":5,"tags":["present"],"outcomes":[{"weight":2,"text":"You watch. You don't post. It's lovely, and nobody will ever know it happened, which bothers you more than it should.","effects":{"energy":-4,"mood":10}},{"weight":1,"text":"Free of the lens, {kid} goes right back to the spoon: a drum, a phone, a microphone, a spoon again. Four acts. No recording exists.","effects":{"energy":6,"mood":12}}]},{"label":"Post a long caption about being present","duration":10,"outcomes":[{"weight":1,"text":"\"I put my phone away to be present,\" you type, on your phone. 214 likes, one of them from {partner} in the next room. You check all 214.","effects":{"energy":6,"rel":6}},{"weight":1,"text":"Top comment: \"is that spoon bamboo?\" You spend nine minutes drafting a reply. You delete it. You draft another.","effects":{"energy":-12},"stamp":"COMMENTS: OFF"}]}]},{"id":"cl_doctor","title":"Dr. {kid} Will See You Now","text":"{kid} has a toy doctor kit and a patient: you. You're told to lie down on the couch. Lie down. On the couch. A medical professional is ordering you to lie down.","window":[540,1100],"weight":2,"oncePerWeek":true,"choices":[{"label":"Comply with all medical advice","duration":20,"outcomes":[{"weight":2,"text":"Stethoscope. Reflex hammer. A shot (it's a crayon). Diagnosis: \"tired.\" Prescription: \"more lie down.\" You follow doctor's orders for 14 minutes. Best care you've ever had.","effects":{"energy":16,"mood":10},"stamp":"DOCTOR'S ORDERS","fx":"confetti"},{"weight":1,"text":"Diagnosis: \"broken.\" Treatment: 41 bandages, real ones, from the good box, all on one knee. You're healed. The box is empty, which {partner} will discover at the worst possible time.","effects":{"energy":10,"mood":12,"rel":-4}}]},{"label":"Ask for a second opinion","duration":5,"tags":["negotiate"],"outcomes":[{"weight":1,"text":"{kid} leaves the room and comes back in a different hat. \"Still broken.\" The second opinion agrees with the first.","effects":{"energy":6,"mood":10},"stamp":"SECOND OPINION: BROKEN"},{"weight":1,"text":"The second opinion is Bun-Bun, who examines you closely and says nothing. {kid} interprets this as \"surgery.\" Surgery is sitting on your stomach.","effects":{"energy":-10,"mood":12},"fx":"shake"}]},{"label":"\"Sorry, Doctor, I have another appointment.\"","duration":2,"outcomes":[{"weight":1,"text":"\"Okay,\" says Dr. {kid}, \"but you have to pay.\" The bill is your phone. You get it back in 25 minutes, with 300 photos of the ceiling.","effects":{"energy":12,"mood":9}},{"weight":1,"text":"Dr. {kid} nods, writes something on your arm in marker and says, \"Come back Tuesday.\" You scrub it for ten minutes. It's not washable. You'll be wearing the appointment all week.","effects":{"energy":-6,"mood":8}}]}]},{"id":"art","title":"The Art Bag","text":"Daycare sends home the week's art in a plastic bag: 31 paintings, most of them brown, one still wet. You have nowhere to put 31 paintings. You do have a recycling bin.","window":[960,1110],"weight":2,"oncePerWeek":true,"when":{"notFlags":["d:home"]},"choices":[{"label":"Keep three. Recycle 28 under cover of darkness.","duration":10,"outcomes":[{"weight":2,"text":"You keep three, including a handprint that may be a turkey. The other 28 go to the bottom of the recycling, under a pizza box, where no one will ever look.","effects":{"energy":6},"schedule":[{"event":"cl_art_found","in":90}]},{"weight":1,"text":"Twenty-eight paintings, gone, and nobody ever notices. It's the only perfect crime you will commit in your life, and you can never tell anyone.","effects":{"energy":6}}]},{"label":"Display all 31. The kitchen is a gallery now.","duration":20,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":2,"text":"The fridge, the cabinets, the dishwasher, the back door. {kid} gives you a guided tour and explains every piece. All 31 are \"a bird.\"","effects":{"mood":14,"energy":-8}},{"weight":1,"text":"You hang all 31. {kid} walks past without a glance, then sobs because number 14 is upside down. It wasn't. You flip it. Now it is, and that's correct.","effects":{"mood":6,"energy":-10}}]},{"label":"Mail all 31 to Grandma. It's called \"sharing.\"","duration":15,"outcomes":[{"weight":2,"text":"Grandma calls, weeping with joy, and asks for more. Grandma has bought a binder. Grandma has been waiting for this binder for 30 years.","effects":{"energy":-6,"rel":6},"ledger":{"errands":"you"}},{"weight":1,"text":"Postage: $11.80. Grandma calls, overjoyed, and asks you to send next week's too. You have accidentally started a subscription service.","effects":{"energy":-10,"rel":6},"ledger":{"errands":"you"}}]}]},{"id":"cl_art_found","title":"Exhibit A: The Recycling","text":"{kid} is standing by the recycling bin, holding a wet brown painting with a pizza-box stain on it. They found it. They found all 28. They'd like a word.","forced":true,"choices":[{"label":"\"Oh no! How did THAT get in there?\"","duration":5,"outcomes":[{"weight":1,"text":"\"You put it.\" They saw you. They were there. They're presenting the evidence now, one painting at a time.","effects":{"mood":-22,"energy":-4},"stamp":"EXHIBITS A THROUGH BB","fx":"shake"},{"weight":1,"text":"{kid} accepts your story and blames the recycling bin. They kick it, then apologize to it. You've framed a bin.","effects":{"mood":-4,"energy":8}}]},{"label":"Rescue all 28. Tape them up in the hallway.","duration":20,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":2,"text":"The hallway is lined, floor to ceiling, with brown. You walk through it to the bathroom eleven times a day. Every painting is a bird. Every bird is watching.","effects":{"mood":20,"energy":-8}},{"weight":1,"text":"You tape up all 28. {kid} inspects the hallway, removes one and puts it back in the recycling. \"That one's bad.\" A curator, at two.","effects":{"mood":12,"energy":-8}}]},{"label":"Confess: \"We can't keep everything, love.\"","duration":5,"tags":["boundary"],"snapRisk":true,"outcomes":[{"text":"{kid} thinks about this, nods, takes your phone off the counter and puts it in the recycling. \"Can't keep everything.\" Fair is fair.","effects":{"mood":12,"energy":-12},"stamp":"FAIR IS FAIR"}]}]},{"id":"storytime","title":"Story Time: The Truth","text":"Library story time. The librarian has a bear puppet, and every toddler on the carpet believes in the bear. Then {kid} stands up, points and announces: \"THAT'S A LADY'S HAND.\"","window":[600,1020],"weight":2,"oncePerWeek":true,"when":{"notFlags":["d:home"]},"choices":[{"label":"Lap. Shush. Side with the bear.","duration":30,"tags":["boundary"],"snapRisk":true,"outcomes":[{"weight":2,"text":"Seated, eventually, arms folded. {kid} glares at the bear for the full 25 minutes. The bear avoids eye contact.","effects":{"mood":-12,"energy":4,"sleepy":6}},{"weight":1,"text":"Seated. Silent. Then, during the quietest page, a very loud whisper: \"IT'S STILL A HAND.\" Two parents nod. They've known for years.","effects":{"mood":-8,"energy":-12,"sleepy":6}}]},{"label":"Back them up: \"To be fair, it is a hand.\"","duration":30,"outcomes":[{"weight":1,"text":"Two more toddlers see the hand. Then all of them do. The story ends with the puppet off and the librarian's voice very tight. {kid} applauds. Truth: 1. Story time: 0.","effects":{"mood":12,"sleepy":6,"energy":-6},"stamp":"THE TRUTH IS OUT"},{"weight":1,"text":"The librarian, a professional, turns the bear to face {kid}: \"Yes. I'm a hand. I'm also a bear.\" {kid} sits down slowly, shaken. Theology has come to story time.","effects":{"mood":12,"sleepy":6}}]},{"label":"Fake a phone call. Leave at speed.","duration":10,"outcomes":[{"weight":2,"text":"You say \"oh no, the dentist\" to no one and speed-walk out. {kid} waves goodbye to the bear's hand, specifically.","effects":{"energy":12,"sleepy":2}},{"weight":1,"text":"Mid-fake, your phone actually rings. It's the dentist. You do have an appointment. It was 20 minutes ago.","effects":{"energy":-6,"sleepy":2},"stamp":"IT WAS THE DENTIST","fx":"flash"}]}]},{"id":"experts_food","title":"Experts Say: 8 to 10 Tries","text":"Experts say a child may need to try a new food 8 to 10 times, or more, before accepting it. They never say what counts as a try. You've been counting \"looked at it with contempt.\" Broccoli is at 41.","window":[360,1140],"weight":1,"oncePerWeek":true,"choices":[{"label":"Sneak it into a muffin. Lie, but baked.","duration":25,"minEnergy":25,"tags":["martyr"],"outcomes":[{"weight":2,"text":"{kid} eats the top, leaves the bottom and hands it back to you, green side up. They know. They'd like you to know they know.","effects":{"mood":6,"energy":-10}},{"weight":1,"text":"They love it. They ask for \"the green muffin\" by name. You'll be baking twice a week until they leave for college. You did this.","effects":{"mood":20,"energy":-20},"stamp":"SUCCESS (UNFORTUNATELY)"}]},{"label":"Make {kid} the chef. Eat whatever they serve.","duration":10,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":1,"text":"{kid} serves you a floret with enormous ceremony and watches you eat it. Then they eat one, to check your work. Try 42. It counted.","effects":{"mood":10,"energy":-6},"fx":"confetti"},{"weight":1,"text":"They serve you every floret, one at a time, and supervise each bite. You've eaten an entire head of broccoli. {kid} has eaten none. Science continues.","effects":{"mood":10,"energy":-8}}]},{"label":"Declare broccoli a \"sometimes food\"","duration":2,"outcomes":[{"text":"Broccoli is now a sometimes food. \"Sometimes\" is a legal term meaning \"when they're 30.\" Dinner goes great. You spend 11 PM reading about iron.","effects":{"energy":-6,"mood":12}}]}]},{"id":"phone","title":"Your Phone Is Missing","text":"Your phone is gone. You last saw it in {kid}'s hands. They were saying \"call Grandma\" and walking toward the bathroom.","window":[480,1140],"weight":2,"oncePerWeek":true,"choices":[{"label":"Check the toilet. It's always the toilet.","duration":5,"outcomes":[{"weight":1,"text":"It's in the toilet. It's \"water-resistant.\" You learn exactly what that word was hiding. You say a word. The word is [BLEEP].","effects":{"energy":-12},"count":{"bleeps":1},"fx":"flash"},{"weight":1,"text":"Not the toilet. It's in the oven. The oven is off. You order an oven lock before you even pick up the phone.","effects":{"energy":8}}]},{"label":"Call it. Follow the ringing.","duration":10,"outcomes":[{"weight":2,"text":"It rings inside the toy box. A small voice answers: \"Hello?\" It was your work call. {kid} said \"yes\" to everything. You are on a committee now.","effects":{"mood":10,"energy":-6},"stamp":"COMMITTEE: JOINED"},{"weight":1,"text":"It rings. It's coming from you. Your back pocket. It's been there the whole time. {kid} watches you find it with something like pity.","effects":{"energy":-8,"mood":12}}]},{"label":"Let it go. You live off the grid now.","duration":2,"outcomes":[{"text":"For forty minutes you're unreachable, like it's 1997. It's wonderful. Then the group chat assumes the worst and someone calls your mother, who calls {partner}, at work.","effects":{"energy":14,"rel":-8}}]}]},{"id":"witching","title":"Dinner Minus 45","text":"Dinner is 45 minutes away and everyone in the house, including you, has become a different, worse person. {kid} is sobbing because the cat on their shirt is looking at them.","window":[960,1110],"weight":3,"oncePerWeek":true,"choices":[{"label":"Dance party. Same song. Fourteen times.","duration":15,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":2,"text":"You play the same song 14 times. You'll hear it in your sleep, if you ever sleep again. But by play 11 they're laughing and yawning at the same time.","effects":{"mood":14,"sleepy":8,"energy":-10}},{"weight":1,"text":"Play one: joy. Play two: joy. Play three: the wrong song, apparently, although it is the same song. Party over.","effects":{"mood":-9,"sleepy":4,"energy":-12},"fx":"shake"}]},{"label":"Lock yourself in the bathroom for 90 seconds","duration":2,"outcomes":[{"weight":2,"text":"You sit on the closed lid. One by one, crackers slide under the door. {kid} is feeding you through the gap. Ninety seconds in, and you've been adopted.","effects":{"energy":12,"mood":9}},{"weight":1,"text":"Through the door, {kid} begins reading you the truck book, loudly, from memory, with several new trucks. You stay for the whole thing.","effects":{"energy":9,"mood":12}},{"weight":1,"text":"You come out after ninety seconds. {kid} has emptied the crisper drawer onto the kitchen floor and is lining up carrots by height. One of them is a celery.","effects":{"energy":-6,"mood":8}}]},{"label":"Cheese stick. Pay it out one string at a time.","duration":10,"tags":["bribe"],"outcomes":[{"text":"One cheese stick, peeled into strings, paid out one string every ninety seconds. Everyone calms down. It's not a snack. It's a payment plan.","effects":{"mood":10,"energy":-2},"count":{"snacks":1}}]},{"label":"Hand {kid} to {partner}. Immediately.","duration":5,"tags":["tagteam"],"when":{"flags":["d:handoff"],"notFlags":["d:partnerOut"]},"outcomes":[{"when":{"min":{"rel":50}},"text":"{partner} takes one look at your face and takes {kid}. No questions. You'd marry them again, if either of you had the energy for a wedding.","effects":{"energy":12,"rel":2},"ledger":{"evening":"partner"}},{"when":{"max":{"rel":49}},"text":"\"I literally just walked in.\" They did. You both stand in the kitchen, losing, in stereo.","effects":{"energy":-2,"rel":-10},"count":{"blames":1}}]}]},{"id":"danger_nap","title":"The Danger Nap","text":"Late afternoon, driving home. In the mirror, {kid}'s eyelids are losing a fight. Sleep now, and bedtime moves to 10 PM. You have 12 minutes of road and one weapon: your singing voice.","window":[960,1030],"weight":2,"oncePerWeek":true,"choices":[{"label":"Windows down. Every verse of the farm song.","duration":12,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":2,"text":"A cow, a pig, a duck and, by verse nine, a moose you made up. {kid} stays awake to inform you there are no moose on a farm. You'll take it.","effects":{"mood":9,"energy":-12,"sleepy":4}},{"weight":1,"text":"You sing so loudly the man at the light stares. {kid} sleeps through all of it with a small smile. Your singing has never been so soothing. It was not supposed to be soothing.","effects":{"sleepy":-25,"mood":12,"energy":-12},"stamp":"LULLABY: ACCIDENTAL","fx":"flash"}]},{"label":"Let them sleep. Sit in the driveway. Bliss.","duration":25,"outcomes":[{"text":"Twenty-five minutes of silence in a parked car. You eat a granola bar from the glovebox, vintage unknown. You will pay for this at 9:30 PM, with interest.","effects":{"sleepy":-25,"mood":6,"energy":12}}]},{"label":"Boop their foot every 30 seconds","duration":12,"outcomes":[{"weight":1,"text":"They stay awake, deeply offended, and start booping their own foot every 30 seconds so you can see how it feels. It feels terrible.","effects":{"mood":-10,"sleepy":2,"energy":2}},{"weight":1,"text":"Between boop 19 and boop 20, {kid} sneaks a four-minute nap. They wake up in the driveway, fully charged. It's 4:58. You can feel bedtime moving.","effects":{"sleepy":-10,"mood":12}}]}]},{"id":"lovey","title":"Where Is Bun-Bun?","text":"Bun-Bun, the stuffed rabbit without whom sleep is impossible, is missing. Last seen: the grocery store, the car or the void. Bedtime is in 40 minutes. Bedtime is always in 40 minutes.","window":[1020,1160],"weight":2,"oncePerWeek":true,"choices":[{"label":"Tear the house apart","duration":20,"minEnergy":20,"tags":["martyr"],"outcomes":[{"weight":3,"text":"Bun-Bun is in the freezer. You don't ask. Bun-Bun doesn't say.","effects":{"mood":12,"energy":-8},"fx":"confetti"},{"weight":2,"text":"No Bun-Bun. At 11 PM you're searching the laundry by phone flashlight, whispering, \"Where the [BLEEP] are you.\"","effects":{"mood":-10,"energy":-12,"sleepy":-6},"count":{"bleeps":1},"fx":"shake"}]},{"label":"Deploy Backup Bun-Bun, straight from the closet","duration":5,"outcomes":[{"weight":3,"when":{"flags":["bunbun:washed"]},"text":"{kid} sniffs it. Since Wednesday's hot wash, the real Bun-Bun smells like detergent too. The impostor passes. You planned none of this, and it's your finest work.","effects":{"mood":12,"energy":6},"stamp":"THE PERFECT CRIME"},{"weight":1,"text":"Accepted. Two years of secretly owning a duplicate rabbit finally pay off. You are a criminal mastermind.","effects":{"mood":10,"energy":6}},{"weight":1,"text":"{kid} sniffs it. \"This one smells like a store.\" Correct. It has never known love. They hand it back.","effects":{"mood":-12,"sleepy":-4},"stamp":"IMPOSTOR DETECTED","fx":"flash"}]},{"label":"Age Backup Bun-Bun on your own pillow first","duration":10,"tags":["negotiate"],"outcomes":[{"weight":2,"text":"Sixty seconds on your pillow, your sweatshirt and the couch. {kid} sniffs it, frowns, sniffs again: \"Bun-Bun.\" You've laundered a rabbit.","effects":{"mood":10,"energy":-4}},{"weight":1,"text":"{kid} sniffs it and says, \"That's {me}.\" They hug it anyway, and fall asleep holding the rabbit that smells like you.","effects":{"mood":12,"energy":-6,"sleepy":4}}]},{"label":"Put {partner} on the case","duration":10,"tags":["tagteam"],"when":{"flags":["d:handoff"],"notFlags":["d:partnerOut"]},"outcomes":[{"when":{"min":{"rel":50}},"text":"{partner} finds Bun-Bun in the car seat in four minutes and gloats for nine. Worth it.","effects":{"mood":10,"energy":6,"rel":-2}},{"when":{"max":{"rel":49}},"text":"\"Where did YOU last have it?\" Bun-Bun stays missing for another hour, and so does the warmth in this house.","effects":{"rel":-12,"mood":-9,"energy":3},"count":{"blames":1}}]}]},{"id":"d_tue_queue","title":"Competing Deadlines","text":"Your deadlines today: the report, due at 5 PM. Also a snack, due now. A diaper, overdue. A hug, due immediately, with interest. Only one of these was assigned by an adult.","window":[420,690],"weight":6,"oncePerWeek":true,"when":{"flags":["d:deadline"]},"choices":[{"label":"Clear the toddler queue first. They're the client.","duration":20,"minEnergy":25,"tags":["present"],"outcomes":[{"weight":2,"text":"Snack: delivered. Diaper: resolved. Hug: received, reviewed, approved. {kid} lets you work for 51 straight minutes, a new company record.","effects":{"mood":12,"energy":-10},"set":["d:tueAhead"],"fx":"confetti"},{"weight":1,"text":"Snack, diaper, hug. Then a second hug, unscheduled. Then a third. The report is at 2%. The hugs are at 300%.","effects":{"mood":16,"energy":-10}}]},{"label":"Work first. They can wait. (They cannot wait.)","duration":30,"outcomes":[{"weight":2,"text":"You open the report. {kid} escalates the diaper issue in person, on your lap, in a way that can't be ignored. You're at 0% and you need a shower.","effects":{"mood":-10,"energy":-6},"fx":"shake"},{"weight":1,"text":"Somehow, they wait. They sit beside you \"working\" on a closed calculator for 25 minutes. You hit 30%. They hit nothing. You both feel productive.","effects":{"mood":8,"energy":8},"set":["d:tueAhead"],"stamp":"COWORKER OF THE MONTH"}]},{"label":"Ask {partner}: \"Can you take {kid} till 10?\"","duration":5,"tags":["tagteam"],"outcomes":[{"when":{"min":{"rel":55}},"text":"{partner} closes their laptop and leaves with {kid} and a sippy cup. They don't say \"you owe me.\" Their posture says it for them.","effects":{"energy":12,"rel":-6},"set":["d:tueAhead"],"ledger":{"morning":"partner"}},{"when":{"max":{"rel":54}},"text":"\"I have the all-hands at 10.\" They do. They've mentioned it four times this week. You both stand in the hallway, holding opposite ends of the same tiredness.","effects":{"energy":-8,"rel":-12}}]}]},{"id":"d_tue_wall","title":"The Same Sentence, Four Times","text":"The report needs two more hours of brain. You have about twenty minutes left. You've just read the same sentence four times, and you wrote the sentence.","window":[760,960],"weight":10,"oncePerWeek":true,"when":{"flags":["d:deadline"]},"choices":[{"label":"Fourth coffee. Tonight is tomorrow's problem.","duration":5,"outcomes":[{"weight":1,"text":"The report jumps to 70%. At 11 PM you'll be wide awake explaining it to {partner}, who is asleep, and the ceiling, which isn't.","effects":{"energy":14,"rel":-4},"set":["d:lateCoffee","d:tueAhead"],"count":{"coffee":1}},{"weight":1,"text":"Coffee four hits like a fire alarm. You write 900 words in 20 minutes. Later you'll reread them. They're mostly about coffee.","effects":{"energy":10},"set":["d:lateCoffee"],"count":{"coffee":1},"stamp":"900 WORDS ON COFFEE"}]},{"label":"Beg {partner} for one (1) hour","duration":5,"tags":["tagteam"],"outcomes":[{"when":{"min":{"rel":50}},"text":"They take {kid} to the park. You write in a silent house, finish at 4:10 and spend the rest of the hour lying on the office floor, telling no one.","effects":{"energy":12,"rel":-6},"set":["d:tueAhead"],"ledger":{"evening":"partner"}},{"when":{"max":{"rel":49}},"text":"\"I've got a 3:30.\" It's on the shared calendar, in the color you agreed was theirs. You finish the report with {kid} on your shoulders, steering your head.","effects":{"energy":-12,"rel":-12}}]},{"label":"Cold water, face. Finish it on spite.","duration":40,"minEnergy":25,"tags":["martyr"],"outcomes":[{"text":"It's good, actually. You'd celebrate, but standing up makes the room tilt, so you celebrate sitting down, quietly, with a cracker.","effects":{"energy":-14},"set":["d:tueAhead"]}]}]},{"id":"d_tue_due","title":"Due at 5","text":"The report is 80% done and due at 5, which is suddenly very soon. {kid} has gone behind the curtain to poop and needs you to hold their hand. They have never been in less of a hurry.","window":[900,1020],"weight":20,"oncePerWeek":true,"when":{"flags":["d:deadline"]},"choices":[{"label":"Hold the hand. Type with the other one.","duration":20,"minEnergy":25,"tags":["martyr"],"outcomes":[{"text":"You type one-handed, at arm's length, around a curtain, while {kid} narrates. 91%. 96%. Done. Your cursor is on Send. From behind the curtain: \"{ME}! I'm DONE!\"","effects":{"energy":-10},"schedule":[{"event":"d_tue_send","in":0}]}]},{"label":"Sunshine Sing-Along. They can poop to corduroy.","duration":25,"tags":["screen"],"outcomes":[{"weight":2,"text":"The man in corduroy sings about taking your time. {kid} takes theirs. You write like the building is on fire and hit send as the credits roll. You'll take the meltdown. You'd take ten.","effects":{"energy":4,"mood":6},"set":["d:screen"],"count":{"screen":22},"schedule":[{"event":"screen_off","in":22}],"stamp":"SUBMITTED, SOMEHOW"},{"weight":1,"text":"{kid} finishes, emerges and wants to watch the rest on your lap, holding your typing hand. The last paragraph goes in typed with one finger.","effects":{"energy":3,"mood":12},"set":["d:screen"],"count":{"screen":22},"schedule":[{"event":"screen_off","in":22}]}]},{"label":"Send it at 80%. \"Happy to discuss!\"","duration":3,"outcomes":[{"weight":2,"text":"\"Happy to discuss!\" is corporate for \"I know.\" Trent replies with a thumbs-up and nothing else. A thumbs-up can mean anything. This one means Monday.","effects":{"energy":-6},"fx":"flash"},{"weight":1,"text":"Trent replies at once: \"honestly the first 80% is the part people read.\" You've been doing the last 20% for nothing your entire career.","effects":{"energy":10}}]},{"label":"Hit send. You're somehow ahead.","duration":2,"when":{"flags":["d:tueAhead"]},"outcomes":[{"text":"Sent. Early. You sit there for a full minute, unsure what people do with spare time. {kid} shows you: you build a tower and knock it down until five o'clock.","effects":{"energy":8,"mood":10},"stamp":"SUBMITTED EARLY","fx":"confetti"}]}]},{"id":"d_tue_send","title":"Send or Change","text":"Your cursor is on Send. From behind the curtain: \"{ME}! I'm DONE! CHANGE ME!\" This is a two-hand diaper. You have one free hand, two jobs and about five seconds.","forced":true,"timer":5,"choices":[{"label":"Click Send, then sprint","duration":3,"outcomes":[{"weight":2,"text":"Click. Sent. You sprint. Behind the curtain, {kid} has attempted to change their own diaper. The attempt was ambitious. The curtain is involved.","effects":{"mood":8,"energy":-8}},{"weight":1,"text":"Click. Sent. Then you see the subject line you typed at 6 AM and never fixed: \"report v4 FINAL (cry).\" It has gone to 31 people.","effects":{"energy":-6},"stamp":"SUBJECT: (CRY)","fx":"flash"}]},{"label":"Change first. The report can wait 90 seconds.","duration":5,"outcomes":[{"weight":1,"text":"Change, wash, back at the laptop with 40 seconds to spare. Sent. You stand in the kitchen with clean hands and a pounding heart: a person who did two jobs at once.","effects":{"mood":8,"energy":-6},"stamp":"BOTH. SOMEHOW.","fx":"confetti"},{"weight":1,"text":"Change, wash, back at the laptop one minute too late. Trent replies \"no worries!\" with an exclamation point that will keep you up tonight.","effects":{"mood":12,"energy":-6}}]},{"label":"Freeze","duration":2,"timeout":true,"outcomes":[{"text":"You stand frozen between the laptop and the curtain. {kid} waddles out, diaper at the ankles, and presses Send for you. With their hand. That hand. Sent, on time, technically.","effects":{"energy":-10,"mood":10},"stamp":"SENT. DON'T ASK.","fx":"shake"}]}]},{"id":"d_wed_intent","title":"With Intent","text":"{kid} is walking toward you, one finger extended, with tremendous purpose. That finger has just been in their eye, then the butter, then the remote. It is headed for your mouth.","window":[480,1080],"weight":5,"oncePerWeek":true,"timer":5,"when":{"flags":["d:home"]},"choices":[{"label":"Intercept: \"UP HIGH!\"","duration":1,"outcomes":[{"weight":2,"text":"The finger becomes a palm, the palm becomes a high five, and the germs land somewhere you can wash. {kid} is thrilled. You're 40% hand sanitizer by now anyway.","effects":{"mood":10,"energy":-2},"stamp":"INTERCEPTED"},{"weight":1,"text":"\"Up high!\" Too slow. The finger goes up your nose instead. Nobody has ever been so pleased with a miss.","effects":{"mood":12,"energy":-8},"fx":"shake"}]},{"label":"Offer your elbow, like a doctor","duration":1,"outcomes":[{"weight":1,"text":"{kid} pokes the elbow, satisfied, and wanders off to touch the TV with the same finger. The TV is part of this now.","effects":{"mood":6,"energy":6}},{"weight":1,"text":"{kid} pokes the elbow, considers it and says, \"No. Mouth.\" They've read the policy. They don't agree with it.","effects":{"mood":12,"energy":-9}}]},{"label":"Freeze","duration":1,"timeout":true,"outcomes":[{"text":"The finger arrives. It touches your bottom lip, gently, like a blessing. \"Boop,\" says {kid}. You will think about the remote for the rest of the day.","effects":{"mood":12,"energy":-12},"stamp":"BOOPED"}]}]},{"id":"d_wed_cabin","title":"1,100 Square Feet","text":"Hour seven at home. The house is 1,100 square feet and you've been in every one of them, with {kid}, at least 40 times. You've read the truck book 19 times. You can do it with your eyes closed. You have.","window":[660,1050],"weight":5,"oncePerWeek":true,"when":{"flags":["d:home"]},"choices":[{"label":"Blanket fort. Commit to the bit.","duration":40,"minEnergy":30,"tags":["present"],"outcomes":[{"weight":2,"text":"Four chairs, every blanket you own and a flashlight. Inside, {kid} whispers like you're both hiding from someone. You stay in there much longer than you meant to.","effects":{"mood":16,"energy":-12}},{"weight":1,"text":"The fort collapses at minute three and becomes \"the cave.\" The cave is better. The cave has your pillow and the crackers. You live in the cave now.","effects":{"mood":14,"energy":-10}}]},{"label":"Sunshine Sing-Along. Just one.","duration":25,"tags":["screen"],"outcomes":[{"text":"The man in corduroy sings about a lost mitten. You sit on the kitchen floor eating cold pasta out of the container. It's 2:15. It's lunch. It's also, technically, breakfast.","effects":{"energy":12,"mood":8},"set":["d:screen"],"count":{"screen":22},"schedule":[{"event":"screen_off","in":22}]}]},{"label":"Leave the house. Anywhere. The hardware store.","duration":45,"outcomes":[{"weight":1,"text":"{kid} walks the aisles in awe of the lumber. You buy one hinge for no reason. It's the best outing you've had all year, and it cost $2.14.","effects":{"mood":12,"sleepy":8,"energy":-4},"stamp":"HINGE ACQUIRED"},{"weight":1,"text":"{kid} touches every doorknob in the doorknob aisle, with intent. You remember why you were home. The cashier wipes the counter before you've left it.","effects":{"mood":10,"sleepy":8,"energy":-4}}]},{"label":"\"Quiet time. You play. I lie on the floor.\"","duration":15,"tags":["boundary"],"snapRisk":true,"outcomes":[{"weight":1,"text":"They play beside you, narrating, for 14 whole minutes. In that time you've been described as \"a mountain,\" \"a bridge\" and, once, \"the bad guy.\"","effects":{"energy":10,"mood":-4}},{"weight":1,"text":"Quiet time lasts 90 seconds. Then it becomes loud time, on your stomach, with a drum.","effects":{"energy":-12,"mood":12}}]}]},{"id":"d_wed_bunbun","title":"Wash Everything on Hot","text":"Daycare's email says to wash \"all bedding, towels and soft toys\" on hot. Bun-Bun is a soft toy. Bun-Bun has never been washed. Bun-Bun has a smell {kid} describes as \"home.\"","window":[480,1080],"weight":5,"oncePerWeek":true,"when":{"flags":["d:home"]},"choices":[{"label":"Every load. Bun-Bun too.","duration":45,"minEnergy":25,"tags":["martyr"],"outcomes":[{"weight":2,"text":"Four loads. {kid} watches Bun-Bun tumble in the dryer window, both palms on the glass. Bun-Bun comes out warm, fluffy and, according to {kid}, \"wrong.\"","effects":{"energy":-12,"mood":-10,"rel":6},"set":["bunbun:washed"],"ledger":{"laundry":"you"},"stamp":"BUN-BUN: STERILIZED"},{"weight":1,"text":"Bun-Bun survives the hot wash. One ear does not. {kid} holds the ear up to you like a lost tooth. You get out the sewing kit you've never opened.","effects":{"energy":-16,"mood":-14,"rel":4},"set":["bunbun:washed"],"ledger":{"laundry":"you"},"fx":"flash"}]},{"label":"Text {partner}: \"Laundry is your love language now\"","duration":3,"tags":["tagteam"],"outcomes":[{"when":{"min":{"rel":55}},"text":"\"On it.\" Four loads after bedtime, folded, Bun-Bun included. You find Bun-Bun on your pillow at 10 PM, still warm. You're not crying. It's the steam.","effects":{"rel":-2,"energy":4},"set":["bunbun:washed"],"ledger":{"laundry":"partner"}},{"when":{"max":{"rel":54}},"text":"\"I did laundry Sunday.\" It was one load, of their gym clothes. You don't say that. You think it, at a volume they can probably hear.","effects":{"rel":-12,"energy":3},"count":{"blames":1}}]},{"label":"Just the sheets. Bun-Bun stays feral.","duration":15,"outcomes":[{"text":"Sheets on hot. Bun-Bun stays fragrant and untouched. If daycare asks, Bun-Bun was washed, and you will lie to a teacher's face.","effects":{"energy":-6,"mood":10},"ledger":{"laundry":"you"}}]}]},{"id":"snot","title":"The Snot Straw","text":"{kid} doesn't have pink eye. {kid} has a bonus cold. You own the mouth-powered nasal aspirator: one end goes in their nose, the other end goes in your mouth. There's a filter. You've read about it four times.","window":[420,1080],"weight":5,"oncePerWeek":true,"when":{"flags":["d:home"]},"choices":[{"label":"Use the snot straw. Trust the filter.","duration":5,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":2,"text":"It works. It's horrifying. It works. {kid} won't forgive you until dinner, but they'll breathe through their nose tonight, which means you might sleep.","effects":{"mood":-12,"debt":-12,"energy":-6},"stamp":"THE FILTER HELD"},{"weight":1,"text":"It works so well you can hear it working. You'll hear it again at 3 AM, in your memory, uninvited.","effects":{"mood":-10,"debt":-12,"energy":-10}}]},{"label":"Let it run. Embrace the glaze.","duration":2,"outcomes":[{"weight":2,"text":"By lunch, every surface in the house has been personally initialed.","effects":{"energy":8,"debt":4}},{"weight":1,"text":"{kid} discovers that a sleeve works as well as a tissue. Your sleeve. You're wearing it. They're very polite about it.","effects":{"energy":12,"mood":12}}]},{"label":"Tissues, a song and enormous patience","duration":10,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":2,"text":"You invent a song about noses. It has four verses. They let you wipe on verse three. Partial credit.","effects":{"mood":10,"energy":-10}},{"weight":1,"text":"You invent a nose song. {kid} loves it so much they won't let you wipe until you've sung it nine more times. The nose is still running. So is the song.","effects":{"mood":14,"energy":-14}}]}]},{"id":"d_thu_teething","title":"Teething?","text":"{partner} checks in from work.","chat":{"with":"{partner}","messages":[{"from":"{partner}","text":"how's everyone"},{"from":"you","text":"they bit the couch"},{"from":"{partner}","text":"teething?"},{"from":"you","text":"they cried because their sock was \"too yellow\""},{"from":"{partner}","text":"teething"},{"from":"you","text":"the toaster stopped working"},{"from":"{partner}","text":"...teething?"}]},"window":[540,900],"weight":5,"oncePerWeek":true,"when":{"flags":["d:teething"]},"choices":[{"label":"\"Everything is teething. The economy is teething.\"","duration":2,"outcomes":[{"text":"{partner} laughs at their desk hard enough that someone asks if they're okay. Then they do something better than laugh.","effects":{"rel":10,"energy":6},"ledger":{"errands":"partner"},"chat":[{"from":"{partner}","text":"getting teething rings on the way home. and a toaster"}]}]},{"label":"\"Or maybe they're just like this?\"","duration":2,"outcomes":[{"weight":1,"text":"You both sit with that, in separate buildings, for a long time.","effects":{"rel":8,"energy":-12},"chat":[{"from":"{partner}","text":"what if they're just like this"}]},{"weight":1,"text":"That's not teething. That's slander. It's also accurate. You eat a granola bar and reconsider everything.","effects":{"rel":-3,"energy":12},"stamp":"SLANDER (ACCURATE)","chat":[{"from":"{partner}","text":"they're like you when you're hungry"}]}]},{"label":"Frozen spoon, cold hands, your full attention","duration":20,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":2,"text":"A frozen spoon, then your cold knuckle, then the spoon again. Twenty minutes later {kid} is chewing slowly, eyes heavy, humming. You report back.","effects":{"mood":14,"energy":-10,"sleepy":4},"chat":[{"from":"you","text":"confirmed. teething."},{"from":"{partner}","text":"my hero"}]},{"weight":1,"text":"The spoon works until {kid} realizes it's a spoon, at which point it becomes a drumstick and the coffee table becomes a drum.","effects":{"mood":8,"energy":-10}}]}]},{"id":"d_thu_bite","title":"The Bite","text":"Mid-cuddle, {kid} bites your shoulder. Not a nibble: a molar-assisted chomp, with eye contact. Then a giggle, because your face just did something it has never done before.","window":[420,1140],"weight":5,"oncePerWeek":true,"when":{"flags":["d:teething"]},"choices":[{"label":"Calm voice: \"Ouch. Teeth are for the teether.\"","duration":5,"tags":["boundary"],"snapRisk":true,"outcomes":[{"weight":2,"text":"You swap your shoulder for a cold teether and say it in the voice of a flight attendant during turbulence. They chomp the teether instead. Lesson received, for about ten minutes.","effects":{"mood":14,"energy":-8}},{"weight":1,"text":"They bite the teether, then you, then the teether, as if comparing. You come second. It stings in a whole new way.","effects":{"mood":6,"energy":-12},"stamp":"RUNNER-UP"}]},{"label":"Make a big, wounded noise","duration":2,"outcomes":[{"weight":2,"text":"It's the funniest thing that has ever happened. They bite again, for an encore. The encore gets a [BLEEP]. You're a squeaky toy with a mortgage now.","effects":{"mood":12,"energy":-12},"count":{"bleeps":1},"fx":"shake"},{"weight":1,"text":"Your noise is so big that {kid} pats your shoulder, very gently, to apologize. Then bites it again, very gently. It's an apology. It's also a bite.","effects":{"mood":8,"energy":-10}}]},{"label":"Frozen teether plus a pouch. Buy the peace.","duration":3,"tags":["bribe"],"outcomes":[{"text":"One cold ring, one $2.99 pouch. Silence, chewing, a small sigh from both of you. Then the pouch gets squeezed into the couch. Your shoulder now has a dental record.","effects":{"mood":10,"energy":-6},"count":{"snacks":1}}]}]},{"id":"d_thu_drool","title":"Bib Number Seven","text":"Bib number seven. The drool is industrial. {kid}'s chin is red and chapped, your shoulder is damp, and the couch has a wet patch the shape of a small country.","window":[480,1100],"weight":5,"oncePerWeek":true,"when":{"flags":["d:teething"]},"choices":[{"label":"Chin balm after every wipe. Every. Single. Wipe.","duration":15,"minEnergy":20,"tags":["present"],"outcomes":[{"text":"You apply balm eleven times. By the eleventh, {kid} lifts their chin for it, like a boxer between rounds. The red fades. Your respect for boxing trainers grows.","effects":{"mood":12,"energy":-10}}]},{"label":"Text {partner}: more bibs, the good balm","duration":3,"tags":["tagteam"],"outcomes":[{"when":{"min":{"rel":50}},"text":"They come home with a 10-pack of bibs and the good balm, the one in the tin, bought without a single follow-up question. Competence is very attractive at 6 PM.","effects":{"mood":12,"rel":9,"energy":6},"ledger":{"errands":"partner"}},{"when":{"max":{"rel":49}},"text":"\"What kind of bibs?\" \"The bib kind.\" They come home with one bib. It has a lobster on it and says SHELL YEAH. Technically, a bib.","effects":{"mood":-4,"rel":-12,"energy":4}}]},{"label":"Let it drip. You live in a swamp now.","duration":2,"outcomes":[{"weight":2,"text":"You stop fighting it. Everything you own is slightly damp. The couch patch is now a large country, with a coastline and a capital.","effects":{"energy":6,"mood":-4}},{"weight":1,"text":"{kid} discovers that drool will stick a cracker to a window. There are nine crackers on the window. You leave them up. You're too tired to be someone who takes crackers off windows.","effects":{"energy":6,"mood":8}}]}]},{"id":"grandma_advice","title":"\"In My Day\"","text":"{kid} is gnawing the table leg. Grandma sips some tea and says, \"In my day, we put a little whiskey on your gums, and you slept like a lamb.\" A long look at you. \"And you turned out fine.\" A pause. Too long.","window":[420,1100],"weight":5,"oncePerWeek":true,"when":{"flags":["d:grandma"]},"choices":[{"label":"Cite the pediatrician like scripture","duration":10,"minEnergy":20,"tags":["boundary"],"snapRisk":true,"outcomes":[{"weight":1,"text":"You explain, calmly, that nobody puts whiskey on a toddler now. Grandma nods. \"Oh, I know. I'm not going to DO it. I'm just saying it worked.\" The bottle stays shut. The point stays on the table.","effects":{"energy":-12,"rel":6}},{"weight":1,"text":"You cite the pediatrician, the guidelines and a pamphlet. Grandma reads the entire pamphlet, then hands it back: \"Lovely font.\" {partner} has to leave the room.","effects":{"energy":-12,"rel":12}}]},{"label":"\"Did it work, though?\"","duration":5,"outcomes":[{"weight":2,"text":"\"Oh, no,\" says Grandma. \"You screamed for two years.\" A sip of tea. \"But we slept.\"","effects":{"energy":12},"stamp":"WHISKEY: GRANDMA'S"},{"weight":1,"text":"\"Like a charm.\" A sip of tea. \"Of course, you also didn't talk until you were four.\" From the doorway, {partner}: \"That explains a lot.\"","effects":{"rel":8,"energy":8}},{"weight":1,"text":"\"Oh, wonderfully,\" says Grandma, and then explains how it worked, and then explains 1987, for forty minutes, with digressions.","effects":{"energy":-10}}]},{"label":"Let Grandma take over. Nap face-down.","duration":60,"tags":["tagteam"],"outcomes":[{"weight":2,"text":"You sleep 58 minutes. You wake to a toddler who has eaten three cookies and learned a new word. You don't know which word. {partner} will find out first.","effects":{"energy":22,"mood":8,"rel":-6},"count":{"snacks":3},"fx":"flash"},{"weight":1,"text":"You wake in a panic. The house is silent. {kid} is asleep in the crib. Grandma, from the couch: \"I just put them down, dear.\" Just put them down. You've never been so rested or so insulted.","effects":{"energy":24,"sleepy":-15,"debt":-10,"mood":8},"stamp":"JUST PUT THEM DOWN","fx":"confetti"}]}]},{"id":"d_thu_post","title":"Grandma Has Posted","text":"Grandma has posted 41 photos of today. Number 23: {kid} eating spaghetti with both fists, captioned \"Somebody's parents let them eat like THIS 😂.\" It has 88 likes. Three are from the daycare group chat.","window":[600,1100],"weight":5,"oncePerWeek":true,"when":{"flags":["d:grandma"]},"choices":[{"label":"Call Grandma. Request a takedown. Kindly.","duration":10,"tags":["boundary"],"snapRisk":true,"outcomes":[{"weight":1,"text":"It comes down. A new post goes up: \"Not allowed to share the spaghetti one 🙄.\" It has more likes than the spaghetti.","effects":{"energy":-6,"rel":6}},{"weight":1,"text":"\"Of course, sweetheart,\" says Grandma, and takes it down, in a voice so sincere you check it for traps. There are no traps. You're too tired to trust that.","effects":{"energy":-6,"rel":6}}]},{"label":"Comment: \"Best day ever!! ❤️❤️❤️\"","duration":2,"outcomes":[{"weight":1,"text":"Spin control. Two parents like your comment. One replies \"lol the spaghetti 😂.\" You've made it a thread. Threads are forever.","effects":{"energy":-6}},{"weight":1,"text":"Grandma replies: \"Best day ever because GRANDMA was here!! 😘\" The likes double. You've been out-posted by someone who types with one finger.","effects":{"energy":2},"stamp":"OUT-POSTED"}]},{"label":"Screenshot it to {partner}. No caption.","duration":2,"outcomes":[{"when":{"min":{"rel":50}},"text":"\"LOL. Honestly, the spaghetti looks great.\" A small, private laugh between the two people who actually run this place.","effects":{"rel":12,"energy":6}},{"when":{"max":{"rel":49}},"text":"\"Well, DID you let them eat like that?\" You did. They know you did. You set the phone face-down, very gently, like it might go off.","effects":{"rel":-12,"energy":-3},"count":{"blames":1}}]}]},{"id":"d_thu_noodles","title":"\"You Cut Them THAT Way\"","text":"At dinner, Grandma watches {partner} cut {kid}'s noodles into small, sensible pieces. \"Oh,\" Grandma says, to no one, to everyone. \"You cut them THAT way.\" The knife stops.","window":[1050,1140],"weight":5,"oncePerWeek":true,"when":{"flags":["d:grandma"]},"choices":[{"label":"\"They cut them perfectly.\"","duration":5,"tags":["boundary"],"snapRisk":true,"outcomes":[{"weight":2,"text":"Grandma raises both hands, the picture of innocence. The knife resumes. Later, the family group chat learns you've been \"very sensitive lately.\"","effects":{"rel":12,"energy":-4},"stamp":"SPOUSAL PRIVILEGE"},{"weight":1,"text":"\"Oh, I'm sure they do,\" says Grandma, with a warmth that has teeth. The knife resumes. The tone does not.","effects":{"rel":12,"energy":-6}}]},{"label":"Laugh along. They do cut them a bit small.","duration":2,"outcomes":[{"weight":2,"text":"Grandma beams. The knife stays very still. You'll hear about this at 10:40 PM, in a whisper, in the dark.","effects":{"rel":-18,"energy":4},"count":{"blames":1}},{"weight":1,"text":"Everyone laughs. {partner} laughs a little too long, then cuts the next noodle into one enormous piece, while maintaining eye contact with you.","effects":{"rel":-12,"energy":6},"count":{"blames":1}}]},{"label":"Ask Grandma about the knee. All of it.","duration":30,"minEnergy":25,"tags":["martyr"],"outcomes":[{"weight":2,"tex

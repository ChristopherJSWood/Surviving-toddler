<script type="module">
// Bedtime or Bust: reference rules engine v2 (the week).
//
// This file is the executable specification. docs/RULES.md describes it in
// prose; Core/Sources/BedtimeCore/Engine.swift must behave identically, and
// tools/golden.mjs records traces the Swift tests replay.

// Players see four: Bandwidth (energy), Relationship, Mood, and Sleep (100 - debt).
// Today's sleepy is shown as a bedtime word.
const METERS = ["energy", "rel", "mood", "sleepy", "debt"];

function mulberry32(seed) {
  let a = seed | 0;
  return function next() {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function weightedPick(items, weightOf, rng) {
  let total = 0;
  for (const it of items) total += weightOf(it);
  const r = rng() * total;
  let acc = 0;
  for (let i = 0; i < items.length; i++) {
    acc += weightOf(items[i]);
    if (r < acc) return i;
  }
  return items.length - 1;
}

const clamp = (v) => (v < 0 ? 0 : v > 100 ? 100 : v);

function formatClock(minutes) {
  const m = ((minutes % 1440) + 1440) % 1440;
  const h24 = Math.floor(m / 60);
  const mm = m % 60;
  const h12 = h24 % 12 === 0 ? 12 : h24 % 12;
  return `${h12}:${String(mm).padStart(2, "0")} ${h24 < 12 ? "AM" : "PM"}`;
}

class Game {
  constructor(content, seed) {
    this.content = content;
    this.cfg = content.config;
    this.rng = mulberry32(seed >>> 0);
    this.events = new Map(content.events.map((e) => [e.id, e]));
    this.taskDefs = new Map((content.tasks ?? []).map((t) => [t.id, t]));
    this.state = {
      seed: seed >>> 0,
      meters: { ...this.cfg.startMeters },
      day: 0,
      phase: "day",
      clock: 0,
      dayStart: 0,
      flags: new Set(),
      counters: {},
      ledger: { you: {}, partner: {} },
      nightYou: 0,
      nightPartner: 0,
      nightCardsLeft: 0,
      tasks: [],
      queue: [],
      seq: 0,
      seenToday: new Set(),
      seenWeek: new Set(),
      lastEventId: null,
      currentEventId: null,
      modifierId: null,
      step: 0,
      catastrophesToday: 0,
      lifelineUsed: false,
      lostDays: 0,
      endingId: null,
      report: null,
    };
    this.#startDay(0);
  }

  // ---- queries ----
  get now() {
    return this.state.day * 1440 + this.state.clock;
  }
  get currentEvent() {
    const id = this.state.currentEventId;
    return id == null ? null : this.events.get(id);
  }
  get modifier() {
    return this.content.modifiers.find((m) => m.id === this.state.modifierId) ?? null;
  }
  get ending() {
    const id = this.state.endingId;
    return id == null ? null : { id, ...this.content.endings[id] };
  }
  get isOver() {
    return this.state.endingId != null;
  }
  ledgerBalance() {
    const sum = (o) => Object.values(o).reduce((a, b) => a + b, 0);
    return sum(this.state.ledger.you) - sum(this.state.ledger.partner);
  }
  score() {
    let s = 0;
    for (const [k, w] of Object.entries(this.cfg.weekScore)) s += w * this.state.meters[k];
    return s;
  }
  band() {
    const d = this.state.meters.debt;
    return d <= 29 ? 0 : d <= 59 ? 1 : 2;
  }
  style() {
    let best = null;
    let bestN = 0;
    for (const st of this.content.styles) {
      const n = this.state.counters[`style.${st.id}`] ?? 0;
      if (n > bestN) [best, bestN] = [st, n];
    }
    return best ?? this.content.styles[0];
  }

  meets(cond) {
    if (!cond) return true;
    const s = this.state;
    for (const f of cond.flags ?? []) if (!s.flags.has(f)) return false;
    for (const f of cond.notFlags ?? []) if (s.flags.has(f)) return false;
    const val = (k) => (k === "day" ? s.day : k === "ledger" ? this.ledgerBalance() : s.meters[k]);
    for (const [k, v] of Object.entries(cond.min ?? {})) if (val(k) < v) return false;
    for (const [k, v] of Object.entries(cond.max ?? {})) if (val(k) > v) return false;
    return true;
  }

  visibleChoices(event = this.currentEvent) {
    if (!event) return [];
    return event.choices.filter((c) => this.meets(c.when));
  }
  isLocked(choice) {
    return (choice.minEnergy ?? 0) > this.state.meters.energy;
  }

  // ---- playing ----
  choose(index) {
    if (this.isOver) throw new Error("game is over");
    const s = this.state;
    const ev = this.currentEvent;
    const choices = this.visibleChoices(ev);
    if (!(index >= 0 && index < choices.length)) throw new Error(`bad choice ${index}`);
    const choice = choices[index];
    if (this.isLocked(choice)) throw new Error(`choice ${index} is locked`);
    const before = { ...s.meters };
    const dayBefore = s.day;
    const nowBefore = this.now;

    const cands = choice.outcomes.filter((o) => this.meets(o.when));
    if (cands.length === 0) throw new Error(`no outcome applies: ${ev.id}`);
    let outcomeIndex = 0;
    if (cands.length > 1) outcomeIndex = weightedPick(cands, (o) => o.weight ?? 1, this.rng);
    let out = cands[outcomeIndex];
    let snapped = false;
    const sn = this.cfg.snap;
    if (s.phase === "day" && choice.snapRisk && s.meters.energy < sn.belowEnergy) {
      if (this.rng() * 100 < sn.chancePct) {
        snapped = true;
        // The snap replaces the outcome, but the story keeps going: week-long
        // flags (escalation chains, callbacks) from the original still apply.
        const keep = (out.set ?? []).filter((f) => !f.startsWith("d:"));
        out = { text: sn.text, effects: sn.effects, set: [...(sn.set ?? []), ...keep] };
      }
    }
    this.#applyOutcome(out, nowBefore);
    for (const t of choice.tags ?? []) this.#count(`style.${t}`, 1);

    let minutes = 0;
    if (s.phase === "day") {
      minutes = choice.duration + this.cfg.eventGap;
      this.#advance(minutes);
    }
    s.seenToday.add(ev.id);
    s.seenWeek.add(ev.id);
    s.lastEventId = ev.id;
    s.step += 1;

    let dayEnded = null; // "night" | "lifeline"
    let endingId = this.#lossCheck();
    if (endingId === "lifeline") {
      endingId = null;
      // At night the lifeline just patches you up; by day it ends the day.
      if (s.phase === "day") dayEnded = "lifeline";
    }
    if (!endingId && !dayEnded) {
      for (const chk of ev.checks ?? []) {
        if (this.meets(chk.when)) {
          endingId = chk.ending;
          break;
        }
      }
    }
    if (!endingId && !dayEnded && ev.endsWeek) endingId = this.#grade();
    if (!endingId && !dayEnded && ev.endsDay) {
      const b = this.cfg.bedtime;
      if (s.meters.sleepy >= b.threshold) this.#applyOutcome({ effects: b.asleep }, this.now);
      else {
        this.#applyOutcome({ effects: b.awake }, this.now);
        s.flags.add(b.awakeFlag);
      }
      dayEnded = "night";
    }

    // Deltas describe this choice (including lifeline/bedtime effects), not the
    // overnight changes, which the morning report shows instead.
    const deltas = {};
    for (const m of METERS) if (s.meters[m] !== before[m]) deltas[m] = s.meters[m] - before[m];

    if (endingId) {
      s.endingId = endingId;
      s.currentEventId = null;
    } else if (dayEnded) {
      this.#goToNight();
    } else if (s.phase === "night") {
      s.nightCardsLeft -= 1;
      if (s.nightCardsLeft <= 0) this.#morning();
      else this.#pickNight();
    } else {
      this.#expireTasks();
      if (!ev.hazard && !ev.forced && !ev.noHazard) this.#rollHazard();
      s.currentEventId = this.#nextDayEvent().id;
    }

    return {
      eventId: ev.id,
      choiceIndex: index,
      outcomeIndex,
      snapped,
      text: out.text,
      // Presentation only (the UI's verdict badge, screen effect, reply bubbles).
      stamp: out.stamp ?? null,
      fx: out.fx ?? null,
      chat: out.chat ?? [],
      deltas,
      minutes,
      dayEnded: dayEnded ?? (s.day !== dayBefore ? "morning" : null),
      endingId: s.endingId,
    };
  }

  // ---- internals ----
  #count(k, n) {
    this.state.counters[k] = (this.state.counters[k] ?? 0) + n;
  }

  #applyOutcome(out, nowBefore) {
    const s = this.state;
    for (const [k, v] of Object.entries(out.effects ?? {})) s.meters[k] = clamp(s.meters[k] + v);
    for (const f of out.set ?? []) s.flags.add(f);
    for (const f of out.clear ?? []) s.flags.delete(f);
    for (const [k, v] of Object.entries(out.count ?? {})) this.#count(k, v);
    for (const [cat, who] of Object.entries(out.ledger ?? {})) {
      s.ledger[who][cat] = (s.ledger[who][cat] ?? 0) + 1;
      if (s.phase === "night" && cat === "night") {
        if (who === "you") s.nightYou += 1;
        else s.nightPartner += 1;
      }
    }
    for (const sc of out.schedule ?? []) s.queue.push({ event: sc.event, at: nowBefore + sc.in, seq: s.seq++ });
    if (out.cancel) s.queue = s.queue.filter((q) => !out.cancel.includes(q.event));
    if (out.completeTask) {
      const open = s.tasks.filter((t) => t.status === "open");
      const t = out.completeTask === "oldest" ? open[0] : open.find((x) => x.id === out.completeTask);
      if (t) {
        t.status = "done";
        s.ledger.you.errands = (s.ledger.you.errands ?? 0) + 1;
      }
    }
  }

  #advance(minutes) {
    const s = this.state;
    const t0 = s.clock - s.dayStart;
    const t1 = t0 + minutes;
    for (const rule of this.cfg.drift) {
      if (!this.meets(rule.when)) continue;
      const ticks = Math.floor(t1 / rule.every) - Math.floor(t0 / rule.every);
      s.meters[rule.meter] = clamp(s.meters[rule.meter] + rule.delta * ticks);
    }
    s.clock += minutes;
  }

  #lossCheck() {
    const s = this.state;
    for (const m of this.cfg.lossOrder) {
      if (s.meters[m] > 0) continue;
      if (this.cfg.lifelineMeters.includes(m) && !s.lifelineUsed && s.day < 4) {
        s.lifelineUsed = true;
        s.lostDays += 1;
        const l = this.content.lifeline;
        this.#applyOutcome({ effects: l.effects, set: l.set }, this.now);
        return "lifeline";
      }
      return this.cfg.losses[m];
    }
    return null;
  }

  #grade() {
    const sc = this.score();
    for (const g of this.cfg.grades) if (sc >= g.min) return g.id;
    return this.cfg.grades[this.cfg.grades.length - 1].id;
  }

  #expireTasks() {
    const s = this.state;
    for (const t of s.tasks) {
      if (t.status === "open" && t.due <= this.now) {
        t.status = "expired";
        const def = this.taskDefs.get(t.id);
        if (def?.expire) s.queue.push({ event: def.expire, at: this.now, seq: s.seq++ });
      }
    }
  }

  #rollHazard() {
    const s = this.state;
    const h = this.cfg.hazard;
    const band = this.band();
    const chance = h.base + h.bandBonus[band] + (s.clock >= h.lateDayClock ? h.lateDayBonus : 0);
    if (!(this.rng() * 100 < chance)) return;
    let severity = "sting";
    if (s.catastrophesToday < h.maxCatastrophesPerDay) {
      if (this.rng() * 100 < h.catastropheShare[band]) severity = "catastrophe";
    }
    const pool = this.content.events.filter(
      (e) => e.hazard === severity && !s.seenToday.has(e.id) && !(e.oncePerWeek && s.seenWeek.has(e.id))
        && this.meets(e.when) && !s.queue.some((q) => q.event === e.id),
    );
    if (pool.length === 0) return;
    const hz = pool.length === 1 ? pool[0] : pool[weightedPick(pool, (e) => e.weight ?? 1, this.rng)];
    if (hz.tell) s.queue.push({ event: hz.tell, at: this.now, seq: s.seq++ });
    s.queue.push({ event: hz.id, at: this.now, seq: s.seq++ });
    if (severity === "catastrophe") s.catastrophesToday += 1;
  }

  #nextDayEvent() {
    const s = this.state;
    const now = this.now;
    const due = s.queue.filter((q) => q.at <= now).sort((a, b) => a.at - b.at || a.seq - b.seq);
    let best = null; // { ev, prio, q }
    for (const q of due) {
      const ev = this.events.get(q.event);
      if (!ev || !this.meets(ev.when)) {
        s.queue = s.queue.filter((x) => x !== q);
        continue;
      }
      const prio = ev.priority ?? 80;
      if (!best || prio > best.prio) best = { ev, prio, q };
    }
    for (const ev of this.content.events) {
      if ((ev.priority ?? 0) <= 0 || (ev.phase ?? "day") !== "day" || ev.hazard || ev.forced) continue;
      if (!this.#windowEligible(ev)) continue;
      if (!best || ev.priority > best.prio) best = { ev, prio: ev.priority, q: null };
    }
    if (best) {
      if (best.q) s.queue = s.queue.filter((x) => x !== best.q);
      return best.ev;
    }
    const pool = this.content.events.filter(
      (ev) =>
        (ev.priority ?? 0) <= 0 &&
        (ev.phase ?? "day") === "day" &&
        !ev.hazard &&
        !ev.forced &&
        !ev.filler &&
        this.#windowEligible(ev),
    );
    if (pool.length === 0) return this.content.events.find((e) => e.filler);
    return pool[weightedPick(pool, (e) => this.#weight(e), this.rng)];
  }

  #windowEligible(ev) {
    const s = this.state;
    if (!ev.repeatable && s.seenToday.has(ev.id)) return false;
    if (ev.oncePerWeek && s.seenWeek.has(ev.id)) return false;
    if (ev.id === s.lastEventId) return false;
    if (!ev.window || s.clock < ev.window[0] || s.clock > ev.window[1]) return false;
    if (!this.meets(ev.when)) return false;
    if (ev.task && !s.tasks.some((t) => t.id === ev.task && t.status === "open")) return false;
    return this.visibleChoices(ev).length > 0;
  }

  #weight(ev) {
    const base = ev.weight ?? 1;
    if (!ev.weightBy) return base;
    return base + Math.floor((this.state.counters[ev.weightBy.counter] ?? 0) / ev.weightBy.every);
  }

  #goToNight() {
    const s = this.state;
    s.phase = "night";
    s.nightCardsLeft = this.cfg.night.cards + (s.flags.has(this.cfg.bedtime.awakeFlag) ? 1 : 0);
    s.nightYou = 0;
    s.nightPartner = 0;
    s.queue = [];
    this.#pickNight();
  }

  #pickNight() {
    const s = this.state;
    const pool = this.content.events.filter(
      (e) => e.phase === "night" && !s.seenToday.has(e.id) && !(e.oncePerWeek && s.seenWeek.has(e.id)) && this.meets(e.when),
    );
    if (pool.length === 0) {
      this.#morning();
      return;
    }
    s.currentEventId = pool[weightedPick(pool, (e) => this.#weight(e), this.rng)].id;
  }

  #morning() {
    const s = this.state;
    const n = this.cfg.night;
    const debtBefore = s.meters.debt;
    const refill = Math.max(n.minRefill, n.base - n.perWake * s.nightYou - (s.flags.has(n.lateCoffeeFlag) ? n.lateCoffeePenalty : 0));
    s.meters.energy = clamp(s.meters.energy + refill);
    s.meters.debt = clamp(s.meters.debt + n.debtPerWake * (s.nightYou + s.nightPartner) - n.recovery);
    s.meters.mood = clamp(n.moodBase - Math.floor(s.meters.debt / n.moodDebtDiv));
    s.meters.sleepy = n.sleepyStart;
    for (const f of [...s.flags]) if (f.startsWith("d:")) s.flags.delete(f);
    let partnerDid = null;
    if (s.meters.rel >= n.partnerTaskMinRel) {
      const t = s.tasks.find((x) => x.status === "open");
      if (t) {
        t.status = "done";
        s.ledger.partner.errands = (s.ledger.partner.errands ?? 0) + 1;
        partnerDid = t.id;
      }
    }
    const report = {
      day: s.day + 1,
      nightYou: s.nightYou,
      nightPartner: s.nightPartner,
      refill,
      debtBefore,
      debtAfter: s.meters.debt,
      partnerDid,
    };
    this.#startDay(s.day + 1);
    s.report = { ...report, wakeClock: s.dayStart, tasksAdded: this.content.days[s.day].tasks ?? [], modifierId: s.modifierId };
  }

  #startDay(d) {
    const s = this.state;
    const dayDef = this.content.days[d];
    s.day = d;
    s.phase = "day";
    s.clock = s.dayStart = this.cfg.wake[this.band()];
    s.seenToday = new Set();
    s.queue = [];
    s.catastrophesToday = 0;
    s.lastEventId = null;
    let mod;
    if (dayDef.modifier === "random") {
      const pool = this.content.modifiers.filter((m) => m.pool);
      mod = pool[weightedPick(pool, (m) => m.weight ?? 1, this.rng)];
    } else {
      mod = this.content.modifiers.find((m) => m.id === dayDef.modifier);
    }
    s.modifierId = mod.id;
    this.#applyOutcome({ effects: mod.effects, set: mod.set }, this.now);
    for (const id of dayDef.tasks ?? []) {
      const def = this.taskDefs.get(id);
      s.tasks.push({ id, due: def.dueDay * 1440 + def.dueClock, status: "open" });
    }
    s.currentEventId = this.#nextDayEvent().id;
  }
}

function snapshot(game) {
  const s = game.state;
  const sortObj = (o) => Object.fromEntries(Object.entries(o).sort(([a], [b]) => (a < b ? -1 : 1)));
  return {
    day: s.day,
    phase: s.phase,
    clock: s.clock,
    meters: { ...s.meters },
    flags: [...s.flags].sort(),
    counters: sortObj(s.counters),
    ledger: { you: sortObj(s.ledger.you), partner: sortObj(s.ledger.partner) },
    tasks: s.tasks.map((t) => `${t.id}:${t.status}`),
    step: s.step,
    lostDays: s.lostDays,
    endingId: s.endingId,
  };
}

ves at 7:00. The reservation is at 7:30. All you have to do is get through the day with enough left to put on real pants.","effects":{},"set":["d:friday"]},{"id":"teething","pool":true,"weight":2,"title":"Teething","text":"A molar is coming in. Your toddler is chewing everything, including grudges.","effects":{"mood":-10},"set":["d:teething"]},{"id":"grandma","pool":true,"weight":2,"title":"Grandma Is Visiting","text":"Free childcare! Also opinions. So many opinions.","effects":{"energy":10,"rel":-6},"set":["d:grandma"]},{"id":"potty","pool":true,"weight":2,"title":"Potty Training: Day 3","text":"The internet said it would take three days. It is day 3. The internet lied.","effects":{"energy":-6},"set":["d:potty"]},{"id":"regression","pool":true,"weight":2,"title":"Sleep Regression","text":"Your toddler did stand-up comedy from 2 to 4 AM. You slept in installments.","effects":{"energy":-12,"debt":10}}],"tasks":[{"id":"diapers","label":"Buy diapers","dueDay":2,"dueClock":720,"expire":"no_diapers"},{"id":"rsvp","label":"RSVP to Juniper's party","dueDay":3,"dueClock":1020,"expire":"rsvp_missed"},{"id":"form","label":"Sign the daycare form","dueDay":2,"dueClock":540,"expire":"form_missed"},{"id":"pediatrician","label":"Call the pediatrician about the rash","dueDay":3,"dueClock":1020,"expire":"rash_missed"},{"id":"library","label":"Return the library books","dueDay":4,"dueClock":1020,"expire":"library_missed"}],"lifeline":{"title":"Grandma to the Rescue","text":"You call your mother. She arrives in eleven minutes with a casserole, a bag of cookies and a list of observations. She sends you to bed at 4 PM. You don't argue.","effects":{"energy":40,"mood":20},"set":["grandmaUsed"]},"endings":{"collapse":{"kind":"loss","title":"Parent.exe Has Stopped Responding","text":"You sat down on the kitchen floor to tie a shoe and simply did not get up again. Your toddler covers you with a dish towel and says, \"Night night.\" Your partner finds you like that at 6."},"talk":{"kind":"loss","title":"We Need to Talk","text":"Not a fight, exactly. Two people at the kitchen counter, too tired to finish their sentences. The monitor hisses. Neither of you moves. Next week, you'll try the ledger thing."},"sitter_quits":{"kind":"loss","title":"The Sitter Quits at the Door","text":"The sitter rings the bell at 7:00. Your toddler answers it, naked, holding a spatula, wide awake. The sitter looks at you, looks at the spatula, and leaves. You eat cereal in your going-out shirt."},"couch":{"kind":"loss","title":"Asleep in Your Going-Out Shirt","text":"You sat down on the couch for one minute to put on your shoes. It is now 9:40 PM. Your partner is asleep next to you, also in a going-out shirt. The reservation called twice."},"legend":{"kind":"win","title":"You Remembered You Like Each Other","text":"Dessert. A walk. A whole conversation that wasn't about poop. You get home and the toddler is asleep and the sitter says they were \"an angel,\" which is a lie, but a kind one."},"solid":{"kind":"win","title":"A Good Week, Actually","text":"Dinner was good. You talked about the toddler for forty-one minutes and each other for twenty. That counts. That absolutely counts."},"survived":{"kind":"win","title":"You Made It to Friday","text":"You made it to the restaurant, mostly awake. You split an appetizer and a yawn. It wasn't magic. It was a table for two, and that's more than last month."},"barely":{"kind":"win","title":"Barely, Together","text":"You were home by 8:45 and asleep by 8:50, holding hands, fully dressed. The sitter got paid for three hours. Worth it."}},"events":[{"id":"wake","title":"The Owl Is Not Green","text":"The monitor crackles. A whisper: \"{ME}. The owl's still asleep. Don't wake him.\" Then, at full volume: \"{ME}! I'M UP!\" The $54.99 sleep-trainer owl turns green at 7:00. It's Monday. It's not six.","window":[300,365],"priority":50,"when":{"min":{"day":0},"max":{"day":0}},"choices":[{"label":"Go in. Be the morning person you pretend to be.","duration":10,"minEnergy":30,"tags":["present"],"outcomes":[{"weight":2,"text":"A hug that knocks your glasses sideways, a full briefing on the owl and an order for \"the yellow thing.\" There is no yellow thing. By 6:10 you've found one. It's a lemon. It's accepted.","effects":{"mood":12,"energy":-6},"ledger":{"morning":"you"}},{"weight":1,"text":"\"NOT YOU. I want {partner}.\" You've been fired from a job you got out of bed for. You stay on as an unpaid consultant.","effects":{"mood":-6,"energy":-6},"ledger":{"morning":"you"},"stamp":"TERMINATED"}]},{"label":"Nudge {partner}. Gently. With your whole foot.","duration":5,"tags":["tagteam"],"outcomes":[{"when":{"min":{"ledger":1}},"text":"{partner} gets up without a word, like someone who's seen the spreadsheet. You get eleven more minutes and a dream where you're a hotel.","effects":{"energy":12},"ledger":{"morning":"partner"}},{"when":{"max":{"ledger":0}},"text":"\"I did yesterday,\" {partner} mumbles. Yesterday was Sunday. Sunday doesn't count, and you'll explain why at length, from the hallway, holding {kid}.","effects":{"rel":-6,"energy":-4},"ledger":{"morning":"you"}}]},{"label":"Lie perfectly still. Become furniture.","duration":10,"outcomes":[{"weight":3,"text":"Nine minutes of escalating announcements, including one about the owl that you suspect is slander. It counts as rest. Legally.","effects":{"energy":8,"mood":-12}},{"weight":1,"text":"Silence. Then snoring. They went back to sleep. You lie there, wide awake, furious at the gift.","effects":{"energy":2,"mood":8},"stamp":"MIRACLE (WASTED)"}]}]},{"id":"wake_tue","title":"The Owl's Spokesperson","text":"\"{ME}. The owl says it's morning.\" The owl is not green. The owl has said nothing. As of today, {kid} speaks on the owl's behalf. Your report is due at 5.","window":[300,365],"priority":50,"when":{"min":{"day":1},"max":{"day":1}},"choices":[{"label":"Go in. Request a meeting with the owl.","duration":10,"minEnergy":30,"tags":["present"],"outcomes":[{"weight":2,"text":"\"The owl says pancakes.\" You ask where the owl stands on your report. {kid} confers with the owl. \"The owl says no report.\" It's the most support you've had from management all quarter.","effects":{"mood":12,"energy":-6},"ledger":{"morning":"you"},"stamp":"MANAGEMENT AGREES"},{"weight":1,"text":"{kid} reads out the owl's demands: pancakes, the blue cup and \"the voice.\" There is no voice. You do a voice. A spokesperson informs you it was the wrong voice.","effects":{"mood":14,"energy":-10},"ledger":{"morning":"you"}}]},{"label":"Nudge {partner}: \"I have the deadline.\"","duration":5,"tags":["tagteam"],"outcomes":[{"when":{"min":{"ledger":1}},"text":"\"Go. Write.\" {partner} gets up. You don't write. You lie there composing a thank-you you'll never send. Still: fourteen minutes.","effects":{"energy":12},"ledger":{"morning":"partner"}},{"when":{"max":{"ledger":0}},"text":"\"I ALSO have a deadline,\" says {partner}, into the pillow. News to you. You're now in a deadline-off, at dawn, in whispers. You lose.","effects":{"rel":-6,"energy":-4},"ledger":{"morning":"you"},"stamp":"DEADLINE-OFF: LOST"}]},{"label":"Answer emails from bed. They can narrate.","duration":10,"outcomes":[{"weight":2,"text":"You answer four emails while {kid} relays the owl's position through the monitor. You sign one of them \"Love, the owl.\" It's to Trent.","effects":{"energy":8,"mood":-10},"stamp":"SIGNED: THE OWL","fx":"flash"},{"weight":1,"text":"Nine quiet minutes. You write the best paragraph of your career. It's in your Notes app, titled \"aaaa.\" You will never find it again.","effects":{"energy":6,"mood":-10}}]}]},{"id":"wake_wed","title":"We Have All Day","text":"\"{ME}! NO SCHOOL! WE HAVE ALL DAY!\" Daycare is closed for pink eye. {kid} is fine, and fully briefed. It's not six. \"All day\" is thirteen and a half hours. They meant it lovingly. It landed as a threat.","window":[300,365],"priority":50,"when":{"min":{"day":2},"max":{"day":2}},"choices":[{"label":"Match their energy. It's going to be a GREAT day!","duration":10,"minEnergy":30,"tags":["present"],"outcomes":[{"weight":2,"text":"You burst in singing. {kid} is thrilled. You've set the tone for the whole day, and the tone is \"musical,\" and you can't keep it up.","effects":{"mood":14,"energy":-8},"ledger":{"morning":"you"}},{"weight":1,"text":"By 6:15 you've done the puzzle, the tower and the dinosaur voice. You check the clock. You check it again. It's still 6:15.","effects":{"mood":12,"energy":-12},"ledger":{"morning":"you"},"stamp":"HOUR 1 OF 13"}]},{"label":"Nudge {partner}: \"You get to leave.\"","duration":5,"tags":["tagteam"],"outcomes":[{"when":{"min":{"ledger":1}},"text":"{partner} takes the morning without a word of protest. That's how you know they feel guilty about leaving. Good. Let them.","effects":{"energy":12},"ledger":{"morning":"partner"}},{"when":{"max":{"ledger":0}},"text":"\"You get to stay HOME,\" says {partner}, the way people say \"you get to go to Hawaii.\" You get up. Your shift starts now and ends never.","effects":{"rel":-8,"energy":-4},"ledger":{"morning":"you"}}]},{"label":"Hide. Daycare's closed. So are you.","duration":10,"outcomes":[{"weight":2,"text":"Nine muffled minutes over the monitor. You catch the words \"paint\" and \"bath\" in the same sentence, which is how disasters get planned.","effects":{"energy":8,"mood":-10}},{"weight":1,"text":"They sing to themselves for nine whole minutes: a song about you, and breakfast, and you making breakfast. The message is very clear.","effects":{"energy":6,"mood":-6}}]}]},{"id":"wake_thu","title":"The Owl Has Been Overthrown","text":"Thursday. Whatever today's surprise is, it can wait, because first: \"{ME}. I threw the owl on the floor.\" A pause. \"So he can't say no.\" Airtight.","window":[300,365],"priority":50,"when":{"min":{"day":3},"max":{"day":3}},"choices":[{"label":"Go in. Reinstate the owl.","duration":10,"minEnergy":30,"tags":["present"],"outcomes":[{"weight":2,"text":"You put the owl back on the shelf. {kid} watches with the calm of someone who knows where the shelf is. The owl will never be in charge again.","effects":{"mood":12,"energy":-6},"ledger":{"morning":"you"}},{"weight":1,"text":"The owl is back, glowing a color you've never seen: a sort of furious purple. Nobody knows what purple means. {kid} decides it means \"cookies.\"","effects":{"mood":14,"energy":-8},"ledger":{"morning":"you"},"stamp":"PURPLE MEANS COOKIES"}]},{"label":"Nudge {partner}. Whose turn is it? Nobody knows.","duration":5,"tags":["tagteam"],"outcomes":[{"when":{"min":{"ledger":1}},"text":"{partner} gets up. Neither of you knows whose turn it was; they blinked first. You'll take it. You'll take anything.","effects":{"energy":12},"ledger":{"morning":"partner"}},{"when":{"max":{"ledger":0}},"text":"\"Pretty sure it's you,\" says {partner}. \"Pretty sure it's you,\" you say. By Thursday, turns are a matter of faith. You go.","effects":{"rel":-6,"energy":-4},"ledger":{"morning":"you"}}]},{"label":"Stay down. The owl fell. So did standards.","duration":10,"outcomes":[{"weight":2,"text":"You lie there while {kid} explains to the owl, on the floor, why it's morning now. The owl takes it well. You get nine minutes.","effects":{"energy":8,"mood":-12}},{"weight":1,"text":"Nine minutes, then: \"{ME}. The owl is green now.\" You check the monitor. The owl is face-down on the carpet. Apparently it's green whenever nobody can see it.","effects":{"energy":6,"mood":-10}}]},{"label":"Pass a frozen washcloth through the bars","duration":5,"when":{"flags":["d:teething"]},"outcomes":[{"weight":2,"text":"{kid} takes the frozen washcloth and gnaws it with the focus of a beaver on deadline. Twelve quiet minutes. Wet, but quiet.","effects":{"mood":12,"energy":-4}},{"weight":1,"text":"Chew, throw, want, throw. The washcloth is a game now. You are the dog.","effects":{"mood":6,"energy":-8},"stamp":"YOU ARE THE DOG"}]}]},{"id":"wake_fri","title":"The Owl Is Green","text":"\"{ME}! THE OWL IS GREEN!\" It is. It's not even six, and the owl is green, because {kid} has found the button on the bottom. You made the rule. They found the setting.","window":[300,365],"priority":50,"when":{"min":{"day":4},"max":{"day":4}},"choices":[{"label":"Go in. Praise the engineering. Reset the owl.","duration":10,"minEnergy":30,"tags":["present"],"outcomes":[{"weight":2,"text":"You praise their work and set the owl back to 7:00. {kid} watches every button you press. They're not upset. They're taking notes.","effects":{"mood":12,"energy":-6},"ledger":{"morning":"you"}},{"weight":1,"text":"Too late. {kid} has found a second setting: flashing. The owl is strobing green in the dark like a tiny nightclub, and {kid} is dancing.","effects":{"mood":14,"energy":-8},"ledger":{"morning":"you"},"stamp":"OWL: COMPROMISED"}]},{"label":"Nudge {partner}: \"I need to be alive at 7 PM.\"","duration":5,"tags":["tagteam"],"outcomes":[{"when":{"min":{"ledger":1}},"text":"{partner} gets up. \"Save yourself for tonight,\" they whisper, tucking the blanket around you like a coach icing a knee. Thirteen more minutes.","effects":{"energy":12},"ledger":{"morning":"partner"}},{"when":{"max":{"ledger":0}},"text":"\"I ALSO need to be alive at 7,\" says {partner}, which is fair, which is the problem. You both get up. The owl is extremely green.","effects":{"rel":-5,"energy":-6},"ledger":{"morning":"you"}}]},{"label":"Overrule the owl from under the covers","duration":10,"outcomes":[{"text":"\"THE OWL IS BROKEN,\" you announce into the monitor. {kid} relays this to the owl. The owl, glowing green, doesn't dignify it. You get nine minutes and the sense you've lost a debate to a nightlight.","effects":{"energy":8,"mood":-12}}]}]},{"id":"breakfast","title":"The Egg Is Looking at Me","text":"{kid} ordered an egg. Sunny-side up, at volume. You deliver. They recoil: \"IT'S LOOKING AT ME.\" You look at the egg. It is, a little.","window":[400,540],"priority":40,"when":{"min":{"day":0},"max":{"day":0}},"choices":[{"label":"Scramble it. Close its eye.","duration":10,"minEnergy":20,"tags":["negotiate"],"outcomes":[{"weight":2,"text":"You scramble it in front of them. {kid} watches in silence, then eats every bite. Noted: eggs are fine once they can't see you.","effects":{"mood":12,"energy":-4}},{"weight":1,"text":"You scramble it. {kid} bursts into tears: \"YOU HURT HIM.\" You've made breakfast and a villain, and the villain is you.","effects":{"mood":-10,"energy":-6},"stamp":"VILLAIN ORIGIN STORY","fx":"shake"}]},{"label":"\"Eggs don't have eyes.\" Stand firm.","duration":5,"tags":["boundary"],"snapRisk":true,"outcomes":[{"weight":1,"text":"{kid} eats around the yolk with enormous care, never breaking eye contact with it. Respect, on both sides.","effects":{"mood":-4,"energy":6}},{"weight":2,"text":"\"THEN WHY IS HE WATCHING.\" The egg goes on the floor, face down, so it can't see what happens next.","effects":{"mood":-12,"energy":4},"stamp":"WITNESS REMOVED","fx":"shake"}]},{"label":"Eat the egg yourself. Hand over a pouch.","duration":3,"tags":["bribe"],"outcomes":[{"weight":2,"text":"You eat the egg at the counter while {kid} watches, appalled, sucking on a $3.49 pouch of Harvest Medley. Something has changed between you.","effects":{"mood":8},"set":["eggarc:eaten"],"count":{"snacks":1}},{"weight":1,"text":"{kid} drains the pouch in eleven seconds, hands you the empty and says, \"Egg.\" You make a second egg. It's also looking at them.","effects":{"mood":-6,"energy":-8},"set":["eggarc:eaten"],"count":{"snacks":1}}]}]},{"id":"breakfast_tue","title":"Yesterday's Egg","text":"{kid} places an order: \"Yesterday's egg.\" Not an egg. Yesterday's. The one that was looking at them. The report is due at 5. You don't have time for an egg, let alone a specific one.","window":[400,540],"priority":40,"when":{"min":{"day":1},"max":{"day":1}},"choices":[{"label":"Make a new egg. Introduce it as yesterday's.","duration":10,"minEnergy":20,"tags":["negotiate"],"outcomes":[{"weight":2,"text":"\"Yesterday's egg is back from the doctor.\" {kid} accepts this and eats it, eye and all. You've lied to a child about an egg's medical history. It's 6:48.","effects":{"mood":12,"energy":-4}},{"weight":1,"text":"One look. \"That's a DIFFERENT egg.\" It is. They can tell. You can't, and you made both.","effects":{"mood":-10,"energy":-6},"stamp":"COUNTERFEIT EGG"}]},{"label":"Tell the truth. The egg deserves it.","duration":5,"tags":["boundary"],"snapRisk":true,"outcomes":[{"weight":3,"when":{"flags":["eggarc:eaten"]},"text":"\"{ME} ATE HIM.\" Said slowly, to the whole kitchen, for the record. {kid} won't look at you for the rest of breakfast. It's fair.","effects":{"mood":-14,"energy":4},"stamp":"GUILTY AS CHARGED","fx":"shake"},{"weight":1,"text":"\"Yesterday's egg is gone, sweetheart.\" {kid} asks where. You said \"gone.\" You have no follow-up. You're a grown adult and you don't know where eggs go.","effects":{"mood":-6,"energy":4}}]},{"label":"Pouch for them, laptop for you","duration":3,"tags":["bribe"],"outcomes":[{"weight":2,"text":"Pouch in their hand, laptop on your knees. You answer three emails before they notice there's no egg. Then they notice.","effects":{"mood":4,"energy":6},"count":{"snacks":1}},{"weight":1,"text":"They notice at email two. You finish email three with {kid} attached to your arm like a seat belt.","effects":{"mood":-6,"energy":2},"count":{"snacks":1}}]}]},{"id":"breakfast_wed","title":"Eggs, Eyes Closed","text":"Pink-eye day, second breakfast. {kid} orders \"an egg with its eyes closed.\" You stand very still. They mean scrambled. Two days of egg policy have produced a menu item.","window":[400,540],"priority":40,"when":{"min":{"day":2},"max":{"day":2}},"choices":[{"label":"Make it exactly as ordered. Eyes closed.","duration":10,"minEnergy":20,"tags":["negotiate"],"outcomes":[{"weight":2,"text":"Scrambled, eyes closed. {kid} eats the whole thing and announces, \"He's sleeping.\" You decide not to unpack that. Thirteen hours to go.","effects":{"mood":14,"energy":-4}},{"weight":1,"text":"{kid} inspects it and finds one fleck of yolk. \"One eye is OPEN.\" The plate is sent back to the kitchen. The kitchen is you.","effects":{"mood":-6,"energy":-8},"stamp":"SENT BACK"}]},{"label":"\"The kitchen is closed until lunch.\"","duration":5,"tags":["boundary"],"snapRisk":true,"outcomes":[{"weight":1,"text":"They accept this, then reopen the kitchen themselves at 7:20 using a chair and the cereal. The kitchen is under new management.","effects":{"mood":4,"energy":10}},{"weight":2,"text":"\"THE KITCHEN IS NEVER CLOSED.\" Today, that's correct. They lie down under the table and file a complaint with the table.","effects":{"mood":-12,"energy":2},"stamp":"GRIEVANCE LODGED","fx":"shake"}]},{"label":"Pouch. You're pacing yourself today.","duration":3,"tags":["bribe"],"outcomes":[{"weight":2,"text":"Pouch one of the day. It's 7:06 AM. There are eleven pouches in the cupboard and thirteen hours to go, and you've just done the math.","effects":{"mood":8,"energy":4},"count":{"snacks":1}},{"weight":1,"text":"Pouch one of the day, at 7:06 AM. At 7:09, {kid} asks for pouch two. You say no. They now know where the pouches live, and they'd like to discuss it from inside the cupboard.","effects":{"mood":-8,"energy":-6},"count":{"snacks":1}}]}]},{"id":"breakfast_thu","title":"One Egg, Winking","text":"Day four of eggs. Today's order: \"An egg winking.\" One eye open, one eye closed. You've cooked for this client all week, and the client is getting more specific.","window":[400,540],"priority":40,"when":{"min":{"day":3},"max":{"day":3}},"choices":[{"label":"Attempt the wink. You can do hard things.","duration":10,"minEnergy":20,"tags":["negotiate"],"outcomes":[{"weight":2,"text":"One sunny egg, one scrambled, arranged as a face. {kid} laughs so hard they slide off the chair onto the dog bed. Nobody eats a bite. Worth it.","effects":{"mood":16,"energy":-8},"stamp":"FIVE STARS"},{"weight":1,"text":"It looks less like a wink and more like a pirate. {kid} studies it. \"Now I want a pirate.\" The client has expanded the brief.","effects":{"mood":6,"energy":-10}}]},{"label":"\"We're out of eggs.\" (You aren't.)","duration":5,"tags":["boundary"],"snapRisk":true,"outcomes":[{"weight":1,"text":"{kid} opens the fridge, counts nine eggs out loud and closes the fridge. Neither of you says anything for a while.","effects":{"mood":-8,"energy":-4},"stamp":"PERJURY"},{"weight":1,"text":"{kid} accepts it with suspicious grace and eats a waffle. On Saturday you'll find an egg in the sock drawer. They were protecting it from you.","effects":{"mood":4}}]},{"label":"Draw a wink on a pouch in marker","duration":3,"tags":["bribe"],"outcomes":[{"weight":2,"text":"You draw a winking face on a pouch. {kid} accepts the pouch, rejects the face and somehow drinks around it.","effects":{"mood":8},"count":{"snacks":1}},{"weight":1,"text":"It works too well. Now the banana needs a wink, and the toast, and the other pouch, and your hand. You draw winks until 7:40. Your hand cramps into a wink.","effects":{"mood":10,"energy":-10},"count":{"snacks":1}}]},{"label":"Let Grandma. Grandma's already at the stove.","duration":5,"when":{"flags":["d:grandma"]},"outcomes":[{"text":"Grandma makes a runny egg \"the way you had them,\" and {kid} eats every bite, eye and all, while Grandma looks at you. Just looks. Tonight she describes the look to {partner}, in detail.","effects":{"mood":14,"energy":6,"rel":-6},"stamp":"BETRAYAL"}]}]},{"id":"breakfast_fri","title":"Is the Party Tonight?","text":"{kid} eats a normal egg. Eyes open. No notes. Four days of egg policy, quietly repealed. Then, mouth full: \"Is the party tonight?\" They heard \"date night.\" They're planning an outfit.","window":[400,540],"priority":40,"when":{"min":{"day":4},"max":{"day":4}},"choices":[{"label":"Explain, gently, that it's a grown-up party","duration":10,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":2,"text":"{kid} takes it well, then has follow-ups. Is the sitter a grown-up? Is the owl? Can they be one, just tonight, if they wear the shoes? You hold the line, kindly, for eleven minutes.","effects":{"mood":-4,"energy":-8}},{"weight":1,"text":"\"Okay,\" says {kid}, much too easily. Then they ask what the grown-ups will wear. You've been heard, and not believed.","effects":{"mood":6,"energy":-6},"set":["d:party"]}]},{"label":"\"What party?\" Play dumb, professionally.","duration":5,"tags":["negotiate"],"outcomes":[{"weight":1,"text":"\"THE PARTY.\" Now they think it's a secret party, which is the best kind. For the rest of breakfast they whisper it at you across the table: \"...the party.\"","effects":{"mood":8},"set":["d:party"]},{"weight":1,"text":"{kid} eats their egg and drops the subject. Too easily. Something is being planned, and not by you.","effects":{"mood":4,"energy":2},"set":["d:party"]}]},{"label":"Pouch. Say \"we'll see.\"","duration":3,"tags":["bribe"],"outcomes":[{"text":"\"We'll see,\" you say. {kid} hears \"yes\" and spends twenty minutes on a guest list: the owl, Monday's egg, a crab from a book and you, provisionally.","effects":{"mood":12,"energy":-6},"set":["d:party"],"count":{"snacks":1},"stamp":"PROVISIONAL GUEST"}]}]},{"id":"meltdown","title":"Total Meltdown","text":"You opened the yogurt. {kid} wanted to open the yogurt. It can't be un-opened. Nothing can ever be un-opened again. {kid} is face-down on the kitchen floor, grieving a future that will never happen.","family":"meltdown","window":[0,1440],"priority":90,"repeatable":true,"when":{"max":{"mood":0},"notFlags":["meltdowns:1"]},"choices":[{"label":"Get on the floor. Name the feeling.","duration":15,"minEnergy":35,"tags":["present"],"outcomes":[{"weight":2,"text":"\"You wanted to open it yourself.\" The screaming pauses, like a radio between stations. \"...yeah.\" They crawl into your lap. You're covered in floor, and something like peace.","effects":{"mood":40,"energy":-12},"set":["meltdowns:1"],"count":{"tantrums":1},"stamp":"DE-ESCALATED"},{"weight":1,"text":"\"You're frustrated that—\" \"I'M NOT FRUSTRATED, I'M {KID}!\" Fair. You lie on the floor beside them until it passes, two people studying the ceiling.","effects":{"mood":34,"energy":-14},"set":["meltdowns:1"],"count":{"tantrums":1},"fx":"shake"}]},{"label":"Sunshine Sing-Along. Now. Immediately.","duration":5,"tags":["screen"],"outcomes":[{"text":"The man in corduroy appears. {kid} stops mid-scream, mouth still open, as if someone hit pause. You drink a coffee while it's technically hot.","effects":{"mood":30,"energy":10},"set":["d:screen","meltdowns:1"],"count":{"screen":22,"tantrums":1},"schedule":[{"event":"screen_off","in":22}],"stamp":"CEASEFIRE (TEMPORARY)"}]},{"label":"Become a rock. Rocks don't negotiate.","duration":15,"tags":["boundary"],"snapRisk":true,"outcomes":[{"weight":2,"text":"You sit. You breathe. It peaks at a pitch that makes the dog leave the room, then stops as suddenly as it started. Most tantrums last under five minutes. This one felt like a fiscal quarter.","effects":{"mood":30,"energy":-6},"set":["meltdowns:1"],"count":{"tantrums":1},"stamp":"WEATHERED","fx":"shake"},{"weight":1,"text":"It peaks twice. During peak two a sock comes off by itself. Then they stand up, sniff and ask for a yogurt. The same yogurt.","effects":{"mood":28,"energy":-10},"set":["meltdowns:1"],"count":{"tantrums":1},"fx":"shake"}]}]},{"id":"meltdown_2","title":"Meltdown #2: The Sequel","text":"Again. This time you said \"good job.\" {kid} wanted \"GREAT job.\" Now it's too late; the moment's gone; you've ruined it forever. You know the stages by now: denial, rage, socks, floor.","family":"meltdown","window":[0,1440],"priority":90,"repeatable":true,"when":{"max":{"mood":0},"flags":["meltdowns:1"]},"choices":[{"label":"Floor. Feelings. You know the drill.","duration":15,"minEnergy":35,"tags":["present"],"outcomes":[{"weight":2,"text":"You get on the floor. \"You wanted great.\" They sob \"GREAT\" into your shirt. You tell them it was the greatest job in human history. They accept the upgrade.","effects":{"mood":40,"energy":-12},"count":{"tantrums":1},"stamp":"UPGRADE ACCEPTED"},{"weight":1,"text":"You get on the floor, and they roll away from you like a log you've offended. You wait. Six minutes later, they roll back.","effects":{"mood":34,"energy":-14},"count":{"tantrums":1},"fx":"shake"}]},{"label":"The man in corduroy. Again. Shame later.","duration":5,"tags":["screen"],"outcomes":[{"weight":2,"text":"Sunshine Sing-Along, round two. The screaming stops so fast it echoes. You can feel the bill coming. You'll pay it later. That's what later is for.","effects":{"mood":30,"energy":10},"set":["d:screen"],"count":{"screen":22,"tantrums":1},"schedule":[{"event":"screen_off","in":22}]},{"weight":1,"text":"Sunshine Sing-Along, round two. Ten seconds in, the man in corduroy says, \"GREAT job, friends!\" {kid} stops crying to glare at you. He can say it. Why can't you?","effects":{"mood":26,"energy":10},"set":["d:screen"],"count":{"screen":22,"tantrums":1},"schedule":[{"event":"screen_off","in":22}]}]},{"label":"Become a rock. An experienced rock.","duration":15,"tags":["boundary"],"snapRisk":true,"outcomes":[{"weight":2,"text":"You're getting good at this. Igneous. They scream at the rock. The rock thinks about soup. It's over in four minutes, a personal best for you both.","effects":{"mood":30,"energy":-6},"count":{"tantrums":1},"stamp":"IGNEOUS","fx":"shake"},{"weight":1,"text":"The rock holds. Twelve minutes later {kid} stops, looks you dead in the eye and says, \"You're boring.\" The highest honor a rock can receive.","effects":{"mood":28,"energy":-10},"count":{"tantrums":1},"stamp":"BORING (COMPLIMENT)"}]}]},{"id":"screen_off","title":"The Screen-Off Meltdown","text":"The credits roll. {kid} watches the screen go black, then turns to you slowly, as if you personally cancelled television. What follows will have three acts and no intermission.","priority":85,"forced":true,"choices":[{"label":"One more episode. Just one. (It's never one.)","duration":5,"tags":["screen"],"outcomes":[{"text":"Peace returns, on credit. The man in corduroy sings a song about patience, which is rich.","effects":{"energy":8,"mood":12},"set":["d:screen"],"count":{"screen":22,"paybacks":1},"schedule":[{"event":"screen_off_2","in":22}]}]},{"label":"Ride it out. All three acts.","duration":20,"tags":["boundary"],"snapRisk":true,"outcomes":[{"weight":2,"text":"Act one: grief. Act two: the couch cushions. Act three: quiet sobbing into the dog. Then, abruptly: \"Can I have a snack?\" Like nothing happened. Like you didn't just age.","effects":{"mood":-30,"energy":-10,"sleepy":8},"count":{"paybacks":1},"stamp":"CURTAIN CALL","fx":"shake"},{"weight":1,"text":"Act one is so loud the neighbor's dog joins in. Act two is a duet. By act three {kid} has forgotten the show and is very interested in the neighbor's dog.","effects":{"mood":-24,"energy":-10,"sleepy":8},"count":{"paybacks":1},"fx":"shake"}]},{"label":"\"The TV is tired. It's taking a nap.\"","duration":5,"tags":["negotiate"],"outcomes":[{"weight":1,"text":"{kid} considers this, drapes a blanket over the TV and whispers \"night night.\" Tomorrow they'll tell daycare your TV sleeps in a blanket.","effects":{"mood":-6,"energy":-4},"count":{"paybacks":1}},{"weight":1,"text":"\"TVs don't nap.\" \"Everyone naps.\" \"Then why don't YOU?\" They've got you there. Act two begins.","effects":{"mood":-30,"energy":-10},"count":{"paybacks":1},"stamp":"CROSS-EXAMINED","fx":"shake"}]}]},{"id":"screen_off_2","title":"Screen-Off: The Sequel","text":"The credits roll again. {kid} has learned from the first time. This meltdown skips the overture and goes straight to the finale.","priority":85,"forced":true,"choices":[{"label":"One more. You're in too deep to stop now.","duration":5,"tags":["screen"],"outcomes":[{"text":"Episode three. The man in corduroy is singing about bedtime now, which feels targeted. You're both pretending this is a choice. Bedtime is now a negotiation.","effects":{"energy":6,"mood":8,"sleepy":-12,"debt":6},"set":["d:screen"],"count":{"screen":22,"paybacks":1}}]},{"label":"Ride out the sequel. You've seen the original.","duration":20,"tags":["boundary"],"snapRisk":true,"outcomes":[{"weight":1,"text":"The same three acts, bigger budget. Then a silence so sudden it rings. The remote goes on top of the fridge, where the sad things go.","effects":{"mood":-30,"energy":-12,"sleepy":8},"count":{"paybacks":1},"stamp":"SEQUEL: SURVIVED","fx":"shake"},{"weight":1,"text":"Act two runs long. Act three is a monologue about fairness, delivered to the dark TV. You agree with parts of it.","effects":{"mood":-26,"energy":-14,"sleepy":8},"count":{"paybacks":1},"fx":"shake"}]},{"label":"\"The TV is broken.\"","duration":5,"tags":["negotiate"],"outcomes":[{"weight":2,"text":"{kid} accepts the diagnosis, pats the TV and says, \"Feel better.\" Then they bring it a cracker and the good thermometer. The TV is getting better care than you have all year.","effects":{"mood":-12,"energy":-4},"count":{"paybacks":1}},{"weight":1,"text":"{kid} walks over and presses the power button on the side. They've known where it is for months. They were being polite. Now they aren't.","effects":{"mood":-24,"energy":-8},"count":{"paybacks":1},"stamp":"POLITENESS: REVOKED","fx":"shake"}]}]},{"id":"nap","title":"Nap, Round One","text":"{kid} rubs both eyes with both fists and yawns so wide you can see their molars. Then they announce they've quit napping, effective forever. They announce it lying down.","family":"nap","window":[750,900],"priority":60,"when":{"min":{"day":0},"max":{"day":0}},"choices":[{"label":"Full ritual: sleep sack, white noise, the Song","duration":25,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":7,"text":"Out by verse three. You back out in a crouch, testing each floorboard like it's thin ice. You make it. You've never been prouder of a hallway.","effects":{"sleepy":-40,"debt":-15,"mood":18,"energy":-4},"set":["d:napDone"],"schedule":[{"event":"nap_window","in":25}]},{"weight":3,"text":"Thirty-one minutes. They wake the instant you sit down, as if the couch is wired to the crib. Refreshed. Furious. Ready to talk about it.","effects":{"sleepy":-15,"debt":5,"mood":-12,"energy":-6},"set":["d:napDone"],"stamp":"NAP: ADJOURNED","fx":"shake"}]},{"label":"Car nap. Burn a quarter tank.","duration":45,"outcomes":[{"weight":4,"text":"Out at the second stop sign. You park in the driveway, engine running, and eat cup-holder crackers for forty minutes, a free citizen of a very small country.","effects":{"sleepy":-35,"debt":-10,"mood":12,"energy":8},"set":["d:napDone"]},{"weight":1,"text":"Asleep on the highway, awake in the driveway. Nineteen miles for a nine-minute nap and a new attitude.","effects":{"sleepy":-10,"debt":8,"mood":-10,"energy":-10},"set":["d:napDone"]}]},{"label":"Skip it. Respect the decree.","duration":5,"outcomes":[{"text":"You take a toddler at their word, which no court would. By 3:40 they're sobbing because a cracker is \"too crackery.\"","effects":{"mood":-8,"debt":15,"energy":3},"set":["d:napDone","d:napSkipped"]}]}]},{"id":"nap_tue","title":"The Deadline Nap","text":"The report is due at 5, and this nap is the entire plan. {kid} doesn't know what a report is. {kid} knows.","family":"nap","window":[750,900],"priority":60,"when":{"min":{"day":1},"max":{"day":1}},"choices":[{"label":"Full ritual, flawlessly. The report depends on it.","duration":25,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":7,"text":"Down by 12:52. You open the laptop on the hallway floor, because the hallway is where the Wi-Fi and your courage overlap.","effects":{"sleepy":-40,"debt":-15,"mood":18,"energy":-4},"set":["d:napDone"],"schedule":[{"event":"nap_window_tue","in":25}]},{"weight":3,"text":"They wake at 1:19, as you type \"In summary,\". You'll be summarizing with a toddler on your lap who reads every number aloud as \"poop.\"","effects":{"sleepy":-15,"debt":5,"mood":-12,"energy":-6},"set":["d:napDone"],"stamp":"MOTION TO WAKE: GRANTED","fx":"flash"}]},{"label":"Car nap. Bring the laptop. Work from the driveway.","duration":45,"outcomes":[{"weight":4,"text":"Out by the second light. You write two pages in the driveway with your thumbs, engine running, like a teenager with a term paper.","effects":{"sleepy":-35,"debt":-10,"mood":12,"energy":8},"set":["d:napDone"]},{"weight":1,"text":"Asleep at the first light, awake at the second, thanks to a motorcycle. You've spent 45 minutes of deadline driving a toddler in a circle and returning them, unchanged.","effects":{"sleepy":-10,"debt":8,"mood":-10,"energy":-10},"set":["d:napDone"]}]},{"label":"Skip it. No time for the ritual today.","duration":5,"outcomes":[{"text":"You skip the nap to save time, which is like skipping lunch to save money. At 3:30 {kid} lies face-down in the hallway and sobs at the carpet.","effects":{"mood":-8,"debt":15,"energy":3},"set":["d:napDone","d:napSkipped"]}]}]},{"id":"nap_wed","title":"The Nap Log","text":"Pink-eye day, hour seven. You need this nap more than anyone has needed anything. You've started a nap log on the fridge: start, end and a column marked \"WHY.\"","family":"nap","window":[750,900],"priority":60,"when":{"min":{"day":2},"max":{"day":2}},"choices":[{"label":"Full ritual. Log the start time.","duration":25,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":7,"text":"1:04 PM to... still going. You write \"1:04 –\" on the log and leave the dash open. It's the most hopeful thing you've written in years.","effects":{"sleepy":-40,"debt":-15,"mood":18,"energy":-4},"set":["d:napDone"],"schedule":[{"event":"nap_window_wed","in":25}]},{"weight":3,"text":"Up at 1:26. Under WHY, you write: \"the neighbor's dog, the ice maker, or God.\"","effects":{"sleepy":-15,"debt":5,"mood":-12,"energy":-6},"set":["d:napDone"],"stamp":"LOGGED."}]},{"label":"Car nap. Drive past daycare. Wave at it.","duration":45,"outcomes":[{"weight":4,"text":"Daycare is dark, with a taped sign: PINK EYE. {kid} is out by the second lap of the parking lot. You sit outside it with the engine running, a ghost haunting your old routine.","effects":{"sleepy":-35,"debt":-10,"mood":12,"energy":8},"set":["d:napDone"]},{"weight":1,"text":"Asleep at 1:12. Awake at 1:13, when you sneeze. You haven't sneezed in months. You chose today.","effects":{"sleepy":-10,"debt":8,"mood":-10,"energy":-10},"set":["d:napDone"]}]},{"label":"Skip it. Today has no shape anyway.","duration":5,"outcomes":[{"text":"No daycare, no nap: the afternoon has no edges. At 4:10 you find {kid} asleep standing up against the couch, horse-style. At 4:12 they're awake and furious.","effects":{"mood":-8,"debt":15,"energy":3},"set":["d:napDone","d:napSkipped"]}]}]},{"id":"nap_thu","title":"Nap Theories","text":"You have theories now. Theory 1: the blinds. Theory 2: the dishwasher's \"dry\" click. Theory 3: {kid} can hear you think. Today you test all three.","family":"nap","window":[750,900],"priority":60,"when":{"min":{"day":3},"max":{"day":3}},"choices":[{"label":"Full ritual. Tape the blinds. Think of nothing.","duration":25,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":6,"text":"Blinds taped, dishwasher off, mind blank. They sleep. You'll never know which theory did it, so you'll do all three forever.","effects":{"sleepy":-40,"debt":-15,"mood":18,"energy":-4},"set":["d:napDone"],"schedule":[{"event":"nap_window_thu","in":25}],"stamp":"PEER REVIEW PENDING"},{"weight":2,"text":"Minute 24. Blinds: taped. Dishwasher: off. You were thinking about a sandwich. Theory 3 is confirmed.","effects":{"sleepy":-15,"debt":5,"mood":-12,"energy":-6},"set":["d:napDone"],"stamp":"THEORY 3: CONFIRMED","fx":"shake"},{"weight":2,"when":{"flags":["d:teething"]},"text":"Minute 19: the molar files a grievance. You hold {kid} in the dark while they cry into your collarbone. The theories get a fourth column: TEETH.","effects":{"sleepy":-15,"debt":5,"mood":-12,"energy":-6},"set":["d:napDone"]},{"weight":2,"when":{"flags":["d:potty"]},"text":"Minute 22: \"I'M DRY! I DIDN'T PEE IN MY SLEEP!\" A proud, accurate and extremely loud announcement. Nobody's sleeping now, but everyone's proud.","effects":{"sleepy":-15,"debt":5,"mood":-6,"energy":-6},"set":["d:napDone"]},{"weight":2,"when":{"flags":["d:grandma"]},"text":"Grandma \"just peeks in.\" Grandma's peek has the volume of a dropped tray. \"Oh, look who's awake!\" Grandma says, as if it's good news.","effects":{"sleepy":-15,"debt":5,"mood":-12,"energy":-6},"set":["d:napDone"],"stamp":"PEEKED"},{"weight":2,"when":{"notFlags":["d:teething","d:grandma","d:potty"]},"text":"Nineteen minutes in, they wake up giggling, still on 2 AM time. The regression has reached daylight.","effects":{"sleepy":-15,"debt":5,"mood":-12,"energy":-6},"set":["d:napDone"]}]},{"label":"Car nap. Test Theory 4: it was always the car.","duration":45,"outcomes":[{"weight":4,"text":"Theory 4 holds. You recline the seat two notches, the furthest you've reclined since spring, and mentally draft the paper.","effects":{"sleepy":-35,"debt":-10,"mood":12,"energy":8},"set":["d:napDone"]},{"weight":1,"text":"Engine off, eyes open. New note for the fridge: \"Theory 5: they can hear the engine NOT running.\"","effects":{"sleepy":-10,"debt":8,"mood":-10,"energy":-10},"set":["d:napDone"]}]},{"label":"Skip it. Science needs a control group.","duration":5,"outcomes":[{"text":"Control group established. Findings: at 3:15, {kid} is sobbing at the stairs for being \"too up.\" The hypothesis is supported.","effects":{"mood":-8,"debt":15,"energy":3},"set":["d:napDone","d:napSkipped"]}]}]},{"id":"nap_fri","title":"It's All Connected","text":"Date night depends on this nap, so you've made a board. Red string links the garbage truck, the neighbor's dog, the ice maker and a man who whistles at 1:15. {partner} saw it and said nothing. That's love.","family":"nap","window":[750,900],"priority":60,"when":{"min":{"day":4},"max":{"day":4}},"choices":[{"label":"Full ritual. The board says now.","duration":25,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":7,"text":"Out by 12:58. The board holds: every string, every pin. You stand in the hallway and allow yourself one silent fist pump, the first of the night.","effects":{"sleepy":-40,"debt":-15,"mood":18,"energy":-4},"set":["d:napDone"],"schedule":[{"event":"nap_window_fri","in":25}],"stamp":"THE BOARD WAS RIGHT","fx":"confetti"},{"weight":3,"text":"Minute 26: a woodpecker. One woodpecker, on the gutter, with a work ethic. It wasn't on the board. You pin up a card that just says BIRD and connect it to everything.","effects":{"sleepy":-15,"debt":5,"mood":-12,"energy":-6},"set":["d:napDone"],"stamp":"IT'S ALL CONNECTED","fx":"flash"}]},{"label":"Car nap. Avoid the whistler's route.","duration":45,"outcomes":[{"weight":4,"text":"You take the long way around the whistler. Seventy minutes asleep in the driveway. You don't celebrate. The board might be listening.","effects":{"sleepy":-35,"debt":-10,"mood":12,"energy":8},"set":["d:napDone"]},{"weight":1,"text":"The garbage truck. On a FRIDAY. It isn't even garbage day. Someone sent that truck.","effects":{"sleepy":-10,"debt":8,"mood":-10,"energy":-10},"set":["d:napDone"],"fx":"shake"}]},{"label":"Skip it. Gamble on a 6 PM crash.","duration":5,"outcomes":[{"weight":1,"text":"No nap. By 4, a storm front. By 5:15, glassy-eyed and swaying. The gamble is working, and you hate how well it's working.","effects":{"mood":-8,"debt":15,"energy":3},"set":["d:napDone","d:napSkipped"]},{"weight":1,"text":"No nap, until 4:45, when {kid} falls asleep in the car seat for nine minutes on the way home from the store. The worst nap there is. The board has a card for this. It says NO.","effects":{"mood":-8,"debt":12,"sleepy":-10,"energy":2},"set":["d:napDone","d:napSkipped"],"stamp":"DANGER NAP","fx":"flash"}]}]},{"id":"nap_window","title":"Your 90 Minutes","text":"They're down. You have about ninety minutes and about nine hours of things to do. Somewhere in the house, the weekend's laundry is breathing.","priority":70,"forced":true,"choices":[{"label":"Sleep too. On the couch. Shoes on.","duration":45,"outcomes":[{"weight":3,"text":"You're asleep before the second shoe hits the cushion. Forty-one minutes later you wake up mid-sentence, telling an empty room, \"Let's circle back.\"","effects":{"energy":22}},{"weight":1,"text":"You lie down and can't sleep, because now you're allowed to. Your body has forgotten how. You rest angrily for 45 minutes.","effects":{"energy":8}}]},{"label":"Fold the weekend's laundry. All of it.","duration":40,"tags":["martyr"],"outcomes":[{"weight":2,"text":"Every sock paired. Every shirt folded. Tonight, nobody has to bring up the laundry. You stand there admiring the stacks. A small voice comes over the monitor. It's over.","effects":{"energy":-8,"rel":8},"ledger":{"laundry":"you"}},{"weight":1,"text":"Thirty-eight minutes of folding and one sock left over. Its partner is gone. You fold the single sock anyway and leave it on {partner}'s pillow, like a hotel mint.","effects":{"energy":-10,"rel":6},"ledger":{"laundry":"you"}}]},{"label":"Do the oldest thing on the list. Finally.","duration":20,"outcomes":[{"weight":2,"text":"Done. You cross it off so hard the pen goes through the paper. It's the most powerful you've felt since Friday.","effects":{"energy":-4},"completeTask":"oldest"},{"weight":1,"text":"It takes eleven minutes. It has been on the list for nine days. You'll spend much longer than eleven minutes thinking about the nine days.","effects":{"energy":-4},"completeTask":"oldest"}]},{"label":"Lie on the floor. Scroll in silence.","duration":40,"outcomes":[{"weight":2,"text":"You watch a stranger pressure-wash a patio for 38 minutes. It's the cleanest you've felt all week.","effects":{"energy":10}},{"weight":1,"text":"You open your phone to rest and fall into the class group chat: 63 messages about the turtle's weekend schedule. You read every one. You're not even on the turtle rotation.","effects":{"energy":4}}]}]},{"id":"nap_window_tue","title":"Ninety Minutes, One Report","text":"They're down. The report is due at 5. You open the laptop, and the cursor blinks at you with the patience of a dog waiting for a walk you're not taking.","priority":70,"forced":true,"choices":[{"label":"Write the report. All of it. Now.","duration":40,"minEnergy":20,"tags":["martyr"],"outcomes":[{"weight":2,"text":"1,400 words in 52 minutes. Some of them are good. The ones about Q3 are a cry for help, but they're spelled right.","effects":{"energy":-10},"stamp":"DRAFT: DONE","set":["d:tueAhead"]},{"weight":1,"text":"You write 1,100 words, delete 900, then hear a small voice. You now have 200 words and a very strong title.","effects":{"energy":-10}}]},{"label":"Sleep. The report can be mediocre.","duration":45,"outcomes":[{"weight":2,"text":"You sleep for 44 minutes and dream about the report, which in the dream is a horse. You wake up refreshed and behind. Tonight is a laptop night.","effects":{"energy":22,"rel":-6}},{"weight":1,"text":"You lie down and spend 45 minutes writing the report in your head, beautifully. None of it survives the walk to the laptop. You'll rewrite it at 9 PM, next to {partner}, in silence.","effects":{"energy":8,"rel":-6}}]},{"label":"Do anything on the list except the report","duration":20,"outcomes":[{"text":"Done in nine minutes, with total focus. You've never been so efficient at the wrong thing.","effects":{"energy":-4},"completeTask":"oldest"},{"weight":1,"text":"You do the thing, answer an email about the thing and make a folder for the thing. It's 1:58. The report is exactly where you left it.","effects":{"energy":-6},"completeTask":"oldest"}]}]},{"id":"nap_window_wed","title":"Ninety Minutes of Silence","text":"They're down. It's the first silence since 5-something. The house is so quiet you can hear a clock you didn't know you owned. You're afraid to move. You're afraid not to.","priority":70,"forced":true,"choices":[{"label":"Sleep in the hallway, guarding the door","duration":45,"outcomes":[{"weight":3,"text":"You sleep on the hallway carpet outside their door and wake with its pattern on your cheek and a strong sense of duty.","effects":{"energy":22}},{"weight":1,"text":"You lie in the hallway listening to them breathe, too alert to sleep, like a night guard at a very small museum.","effects":{"energy":8}}]},{"label":"Disinfect everything they've touched","duration":40,"tags":["martyr"],"outcomes":[{"weight":2,"text":"Forty-one surfaces wiped, including the dog. The house smells like a hospital that's really trying. {partner} will never catch it, and will never know why.","effects":{"energy":-8,"rel":8},"ledger":{"dishes":"you"}},{"weight":1,"text":"Forty minutes of bleach. You disinfect the remote so hard the volume button stops working. Nobody else in this house is catching anything, ever again.","effects":{"energy":-8,"rel":6},"ledger":{"dishes":"you"}}]},{"label":"Cross one thing off. Anything. Prove time exists.","duration":20,"outcomes":[{"text":"Done. You add a new column to the nap log, DONE, so the fridge has one piece of good news on it.","effects":{"energy":-4},"completeTask":"oldest"}]},{"label":"Eat a hot lunch. Sitting down. With a fork.","duration":20,"outcomes":[{"text":"A hot lunch, eaten sitting down, that nobody touched first. You almost cry. You eat instead.","effects":{"energy":12}}]}]},{"id":"nap_window_thu","title":"Ninety Minutes, Probably","text":"They're down, by whichever theory worked. You have ninety minutes if the theory holds. You don't know if the theory holds. Nobody ever knows if the theory holds.","priority":70,"forced":true,"choices":[{"label":"Sleep. Trust the theory.","duration":45,"outcomes":[{"weight":3,"text":"You sleep 43 minutes, face-down, so hard you wake up not knowing what year it is. You decide it's a good one.","effects":{"energy":22}},{"weight":1,"text":"You lie down and spend 45 minutes reviewing the theories instead of sleeping. Theory 6 is: you.","effects":{"energy":8}}]},{"label":"Eat the leftovers standing at the open fridge","duration":15,"outcomes":[{"weight":2,"text":"Monday's noodles, Tuesday's taco meat and something from Wednesday in a jar, eaten cold, standing, lit by the fridge. Perfect. The taco meat was {partner}'s lunch. That's a future-you problem.","effects":{"energy":10,"rel":-6}},{"weight":1,"text":"You open the fridge for the leftovers and end up just standing in the cold light for six minutes, eating nothing. It's the quietest room in the house.","effects":{"energy":8}}]},{"label":"Tackle the oldest, scariest thing on the list","duration":20,"outcomes":[{"text":"Done. It took fourteen minutes and three days of dread. The dread was the long part.","effects":{"energy":-4},"completeTask":"oldest"}]},{"label":"Leave Grandma on monitor duty. Go anywhere.","duration":40,"when":{"flags":["d:grandma"]},"outcomes":[{"text":"You go to the grocery store by yourself and walk every aisle. You buy one fancy cheese and eat it in the car. You don't tell {partner} about the cheese.","effects":{"energy":16,"rel":-4}}]}]},{"id":"nap_window_fri","title":"Ninety Minutes to Be a Person","text":"They're down. The sitter comes at 7. You have ninety minutes to turn back into someone who goes to restaurants.","priority":70,"forced":true,"choices":[{"label":"Sleep. Bank it for 7 PM.","duration":45,"outcomes":[{"weight":3,"text":"You sleep 44 minutes on top of the covers, fully dressed, like a coat on a bed at a party.","effects":{"energy":22}},{"weight":1,"text":"You lie down and run through tonight's plan four times. You are, in theory, rested.","effects":{"energy":8}}]},{"label":"Shower like a person. Conditioner. Both legs.","duration":30,"outcomes":[{"weight":2,"text":"A real shower, conditioner and all, with the full wait. You come out a different species. {partner} will notice. {partner} had better notice.","effects":{"energy":6,"rel":8}},{"weight":1,"text":"A real shower, conditioner and all. Halfway through, the monitor on the sink crackles. False alarm. You finish at speed and go to dinner with conditioner in one ear.","effects":{"energy":4,"rel":6}}]},{"label":"Write the sitter a binder","duration":20,"tags":["martyr"],"outcomes":[{"weight":2,"text":"Four pages. Page 3 is about the owl. Page 4 says PLEASE in letters an inch tall. {partner} reads it and laughs for a full minute.","effects":{"energy":-6,"rel":6}},{"weight":1,"text":"Four pages, then a fifth, titled IF THEY ASK ABOUT THE PARTY. It says only: \"Agree. Change the subject. Good luck.\" {partner} initials it.","effects":{"energy":-6,"rel":6}}]},{"label":"Clear the list so tonight is clean","duration":20,"outcomes":[{"text":"Done. For the next few hours you'll be a person with nothing on their list. You have no idea what those people talk about.","effects":{"energy":-4},"completeTask":"oldest"}]}]},{"id":"handoff_blame","title":"\"Who Gave Them the Tablet?\"","text":"{partner} walks in and picks up the tablet. It's warm. It's sticky. It's paused on episode six of Sunshine Sing-Along. \"So,\" they say, and nothing else, which is worse.","window":[1035,1100],"priority":45,"when":{"flags":["d:screen"],"notFlags":["d:handoff","tabletblame:1"],"max":{"day":3}},"choices":[{"label":"\"That was me. It was a day.\"","duration":5,"minEnergy":20,"outcomes":[{"weight":2,"text":"{partner} sets it down. \"Honestly? I'd have caved by ten.\" A truce, signed in yogurt.","effects":{"energy":-6,"rel":10},"set":["d:handoff","tabletblame:1"],"count":{"blames":1}},{"weight":1,"text":"\"Oh, thank God,\" says {partner}. \"I gave them an hour of it on Saturday and I've been carrying that around.\" A confession for a confession. Even trade.","effects":{"energy":-6,"rel":14},"set":["d:handoff","tabletblame:1"],"count":{"blames":1},"stamp":"MUTUAL AMNESTY"}]},{"label":"\"You weren't here.\"","duration":5,"snapRisk":true,"outcomes":[{"weight":1,"text":"It's true. It doesn't help. Dinner is so quiet you can hear the noodles.","effects":{"energy":4,"rel":-10},"set":["d:handoff","tabletblame:1"],"count":{"blames":1}},{"weight":1,"text":"\"I was at WORK.\" \"I was at work TOO. Mine bites.\" You're both right, which is the loneliest way to be right.","effects":{"energy":4,"rel":-10},"set":["d:handoff","tabletblame:1"],"count":{"blames":1},"stamp":"BOTH RIGHT, BOTH LOSE"}]},{"label":"Show them the ledger","duration":5,"outcomes":[{"when":{"min":{"ledger":3}},"text":"They read it top to bottom, slowly, the way you'd read a lease. Then they quietly announce they're doing bedtime. You were right. Being right is a cold little room.","effects":{"energy":12,"rel":-6},"set":["d:handoff","d:partnerBedtime","tabletblame:1"],"count":{"blames":1},"stamp":"AUDIT COMPLETE"},{"when":{"max":{"ledger":2}},"text":"They read it. It's lopsided, just the other way. They point at one column, silently. You both agree the ledger never existed.","effects":{"rel":-8,"energy":-4},"set":["d:handoff","tabletblame:1"],"count":{"blames":1}}]}]},{"id":"handoff_blame_2","title":"The Tablet, Again","text":"Tablet incident #2. {partner} doesn't ask this time. They plug it in to charge, slowly, holding eye contact the whole time.","window":[1035,1100],"priority":45,"when":{"flags":["d:screen","tabletblame:1"],"notFlags":["d:handoff","tabletblame:2"],"max":{"day":3}},"choices":[{"label":"\"I know. I KNOW.\"","duration":5,"minEnergy":20,"outcomes":[{"weight":2,"text":"{partner} sits down next to you. \"Rough one?\" You nod. They hand you half a granola bar from their work bag. It's the nicest thing that's happened to you since March.","effects":{"energy":-6,"rel":12},"set":["d:handoff","tabletblame:2"],"count":{"blames":1}},{"weight":1,"text":"\"I know you know,\" says {partner}. \"I'd have done it at breakfast.\" Nobody has the high ground. The high ground is covered in cereal.","effects":{"energy":-6,"rel":10},"set":["d:handoff","tabletblame:2"],"count":{"blames":1}}]},{"label":"Cite the curriculum: \"It teaches shapes.\"","duration":5,"outcomes":[{"weight":1,"text":"\"Name one shape.\" You can't. {kid} can: \"RECTANGLE!\" The show taught them rectangle. You're acquitted.","effects":{"energy":4,"rel":4},"set":["d:handoff","tabletblame:2"],"count":{"blames":1},"stamp":"ACQUITTED: TECHNICALITY"},{"weight":2,"text":"\"It's a man in corduroy singing about feelings.\" \"Feelings are a shape.\" {partner} looks at you for a very long time.","effects":{"energy":4,"rel":-10},"set":["d:handoff","tabletblame:2"],"count":{"blames":1}}]},{"label":"\"Who left me alone with them for eleven hours?\"","duration":5,"snapRisk":true,"outcomes":[{"text":"\"My JOB.\" \"Your job,\" you repeat, the way you'd say \"your yacht.\" It lasts through dinner. Nobody remembers how it started.","effects":{"energy":6,"rel":-10},"set":["d:handoff","tabletblame:2"],"count":{"blames":1}}]},{"label":"Show them the ledger","duration":5,"outcomes":[{"when":{"min":{"ledger":3}},"text":"They read the ledger, then read it again, the second time with their lips moving. \"I'll take bedtime,\" they say. They say it like a verdict.","effects":{"energy":12,"rel":-6},"set":["d:handoff","d:partnerBedtime","tabletblame:2"],"count":{"blames":1},"stamp":"RECEIPTS PRESENTED"},{"when":{"max":{"ledger":2}},"text":"They read it and tap one line: \"night: partner,\" four times. You'd forgotten about the nights. You both go quiet and fold laundry.","effects":{"rel":-8,"energy":-4},"set":["d:handoff","tabletblame:2"],"count":{"blames":1}}]}]},{"id":"handoff_blame_3","title":"The Tablet: Third Offense","text":"The tablet buzzes: \"Screen time is up 212% this week.\" {partner} reads it out loud, slowly, in the voice they use for parking tickets. Then they look at you. Then at the tablet. Then at you.","window":[1035,1100],"priority":45,"oncePerWeek":true,"when":{"flags":["d:screen","tabletblame:2"],"notFlags":["d:handoff"],"max":{"day":3}},"choices":[{"label":"Propose a treaty: no screens until Saturday","duration":10,"minEnergy":20,"outcomes":[{"weight":2,"text":"Ratified at the kitchen counter, both signatures in crayon. It holds for 19 hours, a record for any treaty in this house.","effects":{"energy":-8,"rel":12},"set":["d:handoff"],"count":{"blames":1},"stamp":"TREATY RATIFIED"},{"weight":1,"text":"\"Saturday?\" says {partner}. \"I was going to use it Saturday.\" The treaty dies in committee, but at least you're both laughing.","effects":{"energy":-6,"rel":8},"set":["d:handoff"],"count":{"blames":1}}]},{"label":"\"212% of a small number is still small.\"","duration":5,"outcomes":[{"text":"\"Of WHAT small number?\" Neither of you knows. You argue about math for fifteen minutes, which at least isn't about the tablet.","effects":{"energy":4,"rel":-8},"set":["d:handoff"],"count":{"blames":1}}]},{"label":"Blame the tablet. It was always the tablet.","duration":5,"outcomes":[{"text":"You agree, out loud, that the tablet is the problem, and sentence it to a night in a drawer. It's the healthiest conversation you've had all week. The tablet says nothing. It knows what it did.","effects":{"energy":2,"rel":6,"mood":-8},"set":["d:handoff"],"count":{"blames":1},"stamp":"SCAPEGOAT ACQUIRED"}]},{"label":"Show them the ledger","duration":5,"outcomes":[{"when":{"min":{"ledger":3}},"text":"The ledger, the screen-time report and the look on your face. {partner} reads all three. \"Bedtime's mine,\" they say. \"And tomorrow's.\" You'll hold them to one.","effects":{"energy":12,"rel":-6},"set":["d:handoff","d:partnerBedtime"],"count":{"blames":1}},{"when":{"max":{"ledger":2}},"text":"The ledger is surprisingly even. The screen-time report is not. {partner} reads the second one out loud again, slowly, for the people in the back.","effects":{"rel":-8,"energy":-4},"set":["d:handoff"],"count":{"blames":1}}]}]},{"id":"handoff","title":"The Handoff","text":"{partner} walks in. {kid} sprints to them screaming their name, as if they've just been rescued from an island. You were here all day. You were the island.","window":[1035,1100],"priority":44,"when":{"notFlags":["d:handoff"],"min":{"day":0},"max":{"day":0}},"choices":[{"label":"Tag out. Ten minutes alone in the car.","duration":10,"tags":["tagteam"],"outcomes":[{"weight":2,"text":"You sit in the driveway, engine off, staring at the garage door. A neighbor waves. You don't wave back. You're not here. You're nowhere. It's wonderful.","effects":{"energy":14,"rel":-4},"set":["d:handoff"],"ledger":{"evening":"partner"}},{"weight":1,"text":"Four minutes in, {kid} presses their face to the car window and fogs it with one word: \"{ME}.\" Not a question. A summons.","effects":{"energy":6,"rel":-2},"set":["d:handoff"],"ledger":{"evening":"partner"},"stamp":"SUMMONED"}]},{"label":"Ask about their day. Really ask.","duration":10,"minEnergy":25,"outcomes":[{"weight":2,"text":"They talk. You listen. For six whole minutes you're two adults discussing a coworker named Glen, who microwaves fish. You've never met Glen. You'd fight Glen.","effects":{"rel":12,"energy":-6},"set":["d:handoff"]},{"weight":1,"text":"They start to tell you, and {kid} starts to tell you louder. You catch \"meeting,\" \"Glen\" and \"fish.\" You're furious at Glen anyway. Glen knows what Glen did.","effects":{"rel":8,"energy":-6},"set":["d:handoff"]}]},{"label":"Deliver the full incident report, with times","duration":10,"outcomes":[{"weight":2,"text":"Egg, owl, nap: all of it, in order, with times. {partner} nods, then delivers theirs: a printer, a parking garage, Glen. It's a bidding war, and the currency is tired.","effects":{"rel":-6,"energy":6},"set":["d:handoff"],"count":{"blames":1}},{"weight":1,"text":"Egg, owl, nap, with times. {partner} listens to the end and says, \"That sounds really hard.\" And means it. You had nothing prepared for being agreed with.","effects":{"rel":8,"energy":4},"set":["d:handoff"]}]}]},{"id":"handoff_tue","title":"\"How'd the Report Go?\"","text":"{partner} walks in. \"How'd the report go?\" Your face starts to answer. Then {kid} answers for you, by handing {partner} the laptop's P key.","window":[1035,1100],"priority":44,"when":{"notFlags":["d:handoff"],"min":{"day":1},"max":{"day":1}},"choices":[{"label":"Tag out. Lie face-down on a bed somewhere.","duration":10,"tags":["tagteam"],"outcomes":[{"weight":2,"text":"Ten minutes face-down on the bed, shoes on. From the kitchen you can hear them looking for the rest of the keyboard.","effects":{"energy":14,"rel":-4},"set":["d:handoff"],"ledger":{"evening":"partner"}},{"weight":1,"text":"Ten minutes face-down. When you surface, {partner} has put the P key back on. Upside down. It still works. You love them a normal, tired amount.","effects":{"energy":12,"rel":2},"set":["d:handoff"],"ledger":{"evening":"partner"}}]},{"label":"Ask about their day. Pretend you have bandwidth.","duration":10,"minEnergy":25,"outcomes":[{"text":"\"How was YOUR day?\" you ask, with the last of your brain. They had a deadline too, it turns out. A smaller one. You let them have it anyway.","effects":{"rel":10,"energy":-6},"set":["d:handoff"]}]},{"label":"Explain the P key. Use the whole day as context.","duration":10,"outcomes":[{"weight":1,"text":"The P key, the deadline, the eleven minutes you typed without the letter between O and Q. {partner} laughs until they have to sit down. Eventually, so do you.","effects":{"rel":6,"energy":4},"set":["d:handoff"]},{"weight":2,"text":"The P key, the report, the whole day, in one breath. They had a day too. You stand there, each waiting for the other to finish being tired first.","effects":{"rel":-6,"energy":6},"set":["d:handoff"],"count":{"blames":1}}]}]},{"id":"handoff_wed","title":"First Adult in Thirteen Hours","text":"{partner} walks in. Since 7:50 AM your only adult conversation was \"thank you\" to a delivery driver, said so warmly they asked if you were okay.","window":[1035,1100],"priority":44,"when":{"notFlags":["d:handoff"],"min":{"day":2},"max":{"day":2}},"choices":[{"label":"Tag out. Leave the house. Any direction.","duration":10,"tags":["ta

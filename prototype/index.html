gteam"],"outcomes":[{"weight":2,"text":"You walk to the end of the street and back. Twice. You look at a tree. You have one whole thought that isn't about juice.","effects":{"energy":16,"rel":-4},"set":["d:handoff"],"ledger":{"evening":"partner"}},{"weight":1,"text":"You make it as far as the mailbox. You stand there for ten minutes holding a catalog. It's the most relaxing catalog you've ever held.","effects":{"energy":10,"rel":-2},"set":["d:handoff"],"ledger":{"evening":"partner"}}]},{"label":"Talk at them. Forty minutes. No breaks.","duration":40,"outcomes":[{"weight":2,"text":"It all comes out: the egg, the eye, the log on the fridge. {partner} listens to every word while {kid} climbs them like a ladder. Best forty minutes of your day.","effects":{"rel":8,"energy":8},"set":["d:handoff"]},{"weight":1,"text":"You talk for forty minutes. {partner} says, \"Wow.\" Just \"wow.\" You realize you've told the egg story twice. You'll tell it again at dinner.","effects":{"rel":-4,"energy":6},"set":["d:handoff"],"stamp":"EGG STORY: 2 OF 3"}]},{"label":"Ask about their day, and mean it.","duration":10,"minEnergy":25,"outcomes":[{"text":"They had a long meeting. They describe it. You're jealous of every minute. A meeting! With chairs! Where nobody licked the table!","effects":{"rel":10,"energy":-6},"set":["d:handoff"]}]}]},{"id":"handoff_thu","title":"Shift Change","text":"{partner} walks in. You've prepared a shift-change briefing, the way nurses do: what happened, what's still happening and what's about to happen. The third part is the longest.","window":[1035,1100],"priority":44,"when":{"notFlags":["d:handoff"],"min":{"day":3},"max":{"day":3}},"choices":[{"label":"Tag out. Shower until the hot water gives up.","duration":10,"tags":["tagteam"],"outcomes":[{"weight":2,"text":"You stand under the water until it goes cold, then thirty seconds more, on principle. You come out pink, damp and a stranger to all of your problems.","effects":{"energy":14,"rel":-4},"set":["d:handoff"],"ledger":{"evening":"partner"}},{"weight":1,"text":"Ninety seconds in, a small fist knocks on the door. \"{ME}? Are you in the shower?\" Yes. \"Why?\" You have no good answer. You get out.","effects":{"energy":6,"rel":-2},"set":["d:handoff"],"ledger":{"evening":"partner"}}]},{"label":"Let them go first. Ask about their day.","duration":10,"minEnergy":25,"outcomes":[{"text":"They tell you about their day. It was hard, in a way that sounds restful. You keep that to yourself. Growth.","effects":{"rel":10,"energy":-6},"set":["d:handoff"],"stamp":"GROWTH"}]},{"label":"Read the whole briefing out loud. All three parts.","duration":10,"outcomes":[{"weight":1,"text":"Part three runs nine minutes. {partner} takes notes, actual notes, on their hand. You feel deeply seen. One note just says \"bath??\"","effects":{"rel":4,"energy":4},"set":["d:handoff"]},{"weight":2,"text":"Halfway through part three, {partner} starts their own briefing over yours. Two nurses talking at once, while the patient licks the window.","effects":{"rel":-6,"energy":6},"set":["d:handoff"],"count":{"blames":1}}]},{"label":"Leave {partner} alone with Grandma. Flee.","duration":10,"when":{"flags":["d:grandma"]},"outcomes":[{"text":"{partner} gets twenty minutes alone with Grandma and the complete catalog of opinions. When you come back, they have the look of someone who has read all the terms and conditions.","effects":{"energy":16,"rel":-8},"set":["d:handoff"],"stamp":"SACRIFICE ACCEPTED"}]}]},{"id":"dinner","title":"Sunday-You's Meal Plan","text":"The meal plan on the fridge was written Sunday night by Sunday-you, who had slept. Monday says: \"Lemon-herb salmon + quinoa + broccolini!\" Sunday-you used an exclamation point.","window":[1050,1140],"priority":40,"when":{"min":{"day":0},"max":{"day":0}},"choices":[{"label":"Honor Sunday-you. Cook the salmon.","duration":30,"minEnergy":25,"tags":["martyr"],"outcomes":[{"weight":1,"text":"Salmon, quinoa and broccolini, on time. {kid} eats the quinoa one grain at a time, with tweezer fingers, and nothing else. You eat the salmon standing up. Sunday-you would be so proud.","effects":{"energy":-10,"mood":6,"rel":6},"ledger":{"dinner":"you"}},{"weight":1,"text":"\"I DON'T LIKE PINK FISH.\" They've never had pink fish. It isn't a review. It's a position.","effects":{"energy":-10,"mood":-8,"rel":4},"ledger":{"dinner":"you"},"stamp":"PRE-REJECTED"}]},{"label":"Buttered noodles. Sunday-you isn't here.","duration":10,"outcomes":[{"weight":2,"text":"Buttered noodles: the national dish of being two. {kid} eats a full bowl. The salmon stays in the fridge, in its paper, judging.","effects":{"mood":12},"set":["mealplan:salmon"]},{"weight":1,"text":"Buttered noodles. {kid} licks the butter off every noodle and hands each one back to you, clean. You eat them. That's your dinner.","effects":{"mood":-6,"energy":-6},"set":["mealplan:salmon"]}]},{"label":"Order takeout. Blame the plan.","duration":10,"tags":["tagteam"],"outcomes":[{"text":"Dumplings from the corner place. {kid} eats the outside of one and hands you the inside, like a tip. {partner} eats theirs facing the meal plan, which also says \"no takeout this week!!\"","effects":{"energy":8,"mood":4,"rel":-4},"set":["mealplan:salmon"]}]}]},{"id":"dinner_tue","title":"Build-Your-Own Night","text":"The meal plan says \"Turkey taco bowls (fun build-your-own night!).\" It's deadline day. You have built nothing. Sunday-you drew a smiley face, which feels personal.","window":[1050,1140],"priority":40,"when":{"min":{"day":1},"max":{"day":1}},"choices":[{"label":"Taco bowls, as decreed","duration":30,"minEnergy":25,"tags":["martyr"],"outcomes":[{"weight":1,"text":"{kid} builds a bowl of cheese, eats the cheese and hands you the bowl. Build-your-own night is a success, for the cheese.","effects":{"energy":-12,"mood":6},"ledger":{"dinner":"you"}},{"weight":1,"text":"\"NOT TOUCHING.\" Every ingredient in its own bowl, nothing touching anything. You'll wash nine bowls tonight, and you'll wash them alone.","effects":{"energy":-14,"mood":2},"ledger":{"dinner":"you"},"stamp":"NINE BOWLS"}]},{"label":"Cereal for dinner. It's a grain.","duration":10,"outcomes":[{"weight":2,"text":"Cereal for dinner: grain, dairy and surrender, three of the food groups. {kid} is delighted. Sunday-you's smiley face looks on.","effects":{"mood":12}},{"weight":1,"text":"Cereal for dinner. {kid} eats the marshmallows, then the idea of the marshmallows, and at 7:10, in pajamas, announces they're \"starving.\"","effects":{"mood":-6,"energy":-6}}]},{"label":"Send {partner} for burritos. Specify the burritos.","duration":10,"tags":["tagteam"],"outcomes":[{"when":{"min":{"rel":50}},"text":"{partner} goes without making it a thing and comes back with your burrito, the right one, with the right sauce, which you've never once told them. You've been underestimating this person.","effects":{"energy":8,"rel":6,"mood":4},"ledger":{"dinner":"partner"}},{"when":{"max":{"rel":49}},"text":"\"It's on the plan,\" says {partner}, pointing at the taco bowls. You order a pizza out of spite. It's great. Spite pizza always is.","effects":{"energy":6,"rel":-6}}]}]},{"id":"dinner_wed","title":"Snack-Based Dinner","text":"The meal plan says \"Chicken stir-fry (use up the bok choy!).\" {kid} was home all day and ate fourteen snacks. You counted. You were there for every one. They aren't hungry. They'd like a snack.","window":[1050,1140],"priority":40,"when":{"min":{"day":2},"max":{"day":2}},"choices":[{"label":"Stir-fry. Save the bok choy.","duration":30,"minEnergy":25,"tags":["martyr"],"outcomes":[{"weight":1,"text":"A real stir-fry. {kid} eats one piece of chicken and feeds the bok choy, leaf by leaf, to the dog, who also doesn't want it.","effects":{"energy":-12,"mood":4},"ledger":{"dinner":"you"}},{"weight":1,"text":"You cook. They eat. They eat everything. You don't know why. You'll never know why. You'll spend years trying to make it happen again.","effects":{"energy":-12,"mood":10},"ledger":{"dinner":"you"},"stamp":"UNREPEATABLE RESULT"}]},{"label":"Declare snack dinner. Call it a board.","duration":10,"outcomes":[{"weight":2,"text":"Six crackers, nine blueberries, a slice of turkey and a pickle, arranged in a circle. You call it a \"board.\" A board is just snacks that went to college.","effects":{"mood":12}},{"weight":1,"text":"You present the board. {kid} eats the pickle, then asks for \"a real dinner, like a family.\" You've been out-parented by someone who ate fourteen snacks.","effects":{"mood":-8,"energy":-6}}]},{"label":"Takeout. You haven't been outside since 7 AM.","duration":10,"tags":["tagteam"],"outcomes":[{"weight":2,"text":"You wait for the delivery on the porch. It's your first time outside since 7 AM. The air is incredible. You tip forty percent, out of gratitude for the air.","effects":{"energy":8,"mood":4}},{"weight":1,"text":"The app says 50 minutes. {kid} holds it together for 31 of them, then falls apart on the front step, at you, while the neighbors water their lawn very slowly.","effects":{"mood":-10,"energy":-4}}]}]},{"id":"dinner_thu","title":"Leftovers Night","text":"The meal plan says \"Leftovers night!\" It's the one night the plan can't fail. There are no leftovers. By Thursday there never are: somebody eats them at 2 PM, standing at the open fridge. The somebody is always you.","window":[1050,1140],"priority":40,"when":{"min":{"day":3},"max":{"day":3}},"choices":[{"label":"Make something from nothing. You're a chef now.","duration":30,"minEnergy":25,"tags":["martyr"],"outcomes":[{"weight":1,"text":"Rice, frozen peas, an egg and soy sauce: fried rice. You're a genius. {kid} picks out every pea and hands them to you, one at a time, like change.","effects":{"energy":-12,"mood":6},"ledger":{"dinner":"you"}},{"weight":1,"text":"Fried rice. {kid} spots something in it and goes quiet. \"Is that an EGG?\" You hadn't thought about the egg situation in hours. It's back.","effects":{"energy":-12,"mood":-6},"ledger":{"dinner":"you"},"stamp":"THE EGG RETURNS"}]},{"label":"Check the back of the fridge","duration":10,"outcomes":[{"weight":3,"when":{"flags":["mealplan:salmon"]},"text":"Behind the yogurt: Monday's salmon. You smell it. It smells back. Twenty minutes later the fridge is clean, the windows are open and you're ordering pizza, which is where this was always going.","effects":{"energy":-6,"mood":6},"stamp":"IT SMELLS BACK"},{"weight":1,"text":"Fridge roulette: four grapes, half a quesadilla and a yogurt that expired yesterday, which doesn't count. {kid} eats the grapes and calls it a feast. You eat the yogurt. It counted.","effects":{"mood":10,"energy":-6}}]},{"label":"Takeout. Thursday is basically Friday.","duration":10,"tags":["tagteam"],"outcomes":[{"text":"The noodle place. The driver says \"see you tomorrow\" as a joke. It isn't a joke. {partner} looks at the receipt and says nothing, loudly.","effects":{"energy":8,"mood":4,"rel":-4}}]},{"label":"\"I NEED TO GO!\" Drop your fork. Sprint.","duration":5,"when":{"flags":["d:potty"]},"outcomes":[{"weight":1,"text":"It's real. It's in the potty. You're both screaming. The noodles are on the floor. Nobody cares about the noodles.","effects":{"mood":16,"energy":-6},"stamp":"A REAL ONE","fx":"confetti"},{"weight":2,"text":"False alarm #12. They just wanted to eat their noodles on the potty, the way kings did.","effects":{"mood":4,"energy":-8}}]}]},{"id":"dinner_fri","title":"Dinner, Allegedly","text":"The meal plan says \"DATE NIGHT 🎉 (feed {kid} first!!)\". You did not feed {kid} first. Dinner was a cheese stick, in the bath. From the dark: \"{ME}. I didn't have dinner.\" It's an accusation. It's accurate.","window":[1050,1140],"priority":40,"when":{"min":{"day":4},"max":{"day":4}},"choices":[{"label":"Sneak in a cracker. Whisper. Retreat.","duration":10,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":2,"text":"You pass a cracker into the dark. They chew, sigh and roll over. You back out of the room on your knees, still on schedule.","effects":{"sleepy":4,"mood":10,"energy":-6}},{"weight":1,"text":"Cracker accepted. Then: \"I'm thirsty.\" Then: \"Where's the owl?\" Then: \"Is it the party now?\" Twenty-five minutes. The cracker was a door.","effects":{"sleepy":-6,"mood":6,"energy":-10},"stamp":"SCOPE CREEP"}]},{"label":"Send {partner}. Their shirt is still clean.","duration":10,"tags":["tagteam"],"outcomes":[{"when":{"min":{"rel":50}},"text":"{partner} goes in with a banana and comes out four minutes later, triumphant, with a stain shaped like Ohio. Worth it.","effects":{"sleepy":2,"rel":6,"energy":6},"ledger":{"dinner":"partner"}},{"when":{"max":{"rel":49}},"text":"\"You're closer,\" says {partner}. You are, by about four feet. You go. The four feet feel personal.","effects":{"sleepy":-2,"rel":-6,"energy":-6},"ledger":{"dinner":"you"}}]},{"label":"Pretend the house is empty","duration":10,"outcomes":[{"weight":1,"text":"Nine minutes of muffled lobbying. Then silence. Either they're asleep or they've gone to the press.","effects":{"sleepy":6,"mood":-8}},{"weight":1,"text":"The lobbying becomes a song. It's about dinner. It's about you. It's a protest song, and it's catchy.","effects":{"sleepy":-6,"mood":-10},"stamp":"PROTEST SONG","fx":"flash"}]}]},{"id":"bedtime","title":"Bedtime: Opening Arguments","text":"7:30. Pajamas on after a four-lap chase. Teeth brushed: one tooth, briefly. {kid} is in bed with a list of demands, which they keep in their head and add to as needed.","window":[1170,1440],"priority":100,"endsDay":true,"when":{"min":{"day":0},"max":{"day":0}},"choices":[{"label":"Full routine: three books, two songs","duration":30,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":2,"text":"Three books become five. Two songs become a medley. Somewhere in verse six they go limp mid-word, like a phone at 1%.","effects":{"sleepy":14,"energy":-6,"rel":2},"ledger":{"bedtime":"you"}},{"weight":1,"text":"Book three has flaps. Flap 7 is missing. {kid} knows what was under flap 7 and tells you, at length. It was a goat. It's 8:10.","effects":{"sleepy":12,"energy":-10,"mood":6},"ledger":{"bedtime":"you"}}]},{"label":"{partner}'s turn","duration":5,"when":{"notFlags":["d:partnerBedtime"]},"tags":["tagteam"],"outcomes":[{"when":{"min":{"rel":45}},"text":"{partner} takes it. Through the wall you hear them do every voice, even the bad ones. You lie on the couch, a free person, for twenty-two minutes.","effects":{"sleepy":10,"energy":10},"ledger":{"bedtime":"partner"}},{"when":{"max":{"rel":44}},"text":"\"I did Sunday.\" \"Sunday doesn't count.\" \"Since when?\" You don't have a since when. You do bedtime.","effects":{"sleepy":10,"energy":-8,"rel":-5},"ledger":{"bedtime":"you"}}]},{"label":"{partner} promised. Collect.","duration":5,"when":{"flags":["d:partnerBedtime"]},"tags":["tagteam"],"outcomes":[{"text":"{partner} heads in without a word, the ledger still fresh in their mind. You hear them read the long book, the one you hide. Justice.","effects":{"sleepy":10,"energy":12},"ledger":{"bedtime":"partner"},"stamp":"DEBT COLLECTED"}]},{"label":"Speedrun: kiss, lights out, door","duration":5,"outcomes":[{"weight":1,"text":"Kiss, lights, door. Silence. You don't trust it. You do the dishes in your socks, on high alert, like a burglar who cleans.","effects":{"rel":6}},{"weight":1,"text":"The door clicks shut. A small voice: \"I need to tell you something.\" It's about a dog they saw in April. It was brown. That's the story. It takes eleven minutes.","effects":{"sleepy":-8,"energy":-4}}]}]},{"id":"bedtime_tue","title":"Bedtime: Where Does the Sun Go?","text":"7:30. The report is gone, for better or worse. {kid} isn't. {kid} has picked tonight to ask where the sun goes, and has cleared their schedule.","window":[1170,1440],"priority":100,"endsDay":true,"when":{"min":{"day":1},"max":{"day":1}},"choices":[{"label":"Answer the sun question. Thoroughly.","duration":30,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":2,"text":"You explain the sun with a flashlight and an orange. The orange gets peeled. The sun gets eaten. They fall asleep satisfied, which is more than science ever gave you.","effects":{"sleepy":14,"energy":-6,"rel":2},"ledger":{"bedtime":"you"}},{"weight":1,"text":"Where the sun goes. Where it goes after that. Eleven \"after that\"s later, you're softly describing the heat death of the universe to someone in dinosaur pajamas.","effects":{"sleepy":12,"energy":-10,"mood":6},"ledger":{"bedtime":"you"},"stamp":"COSMOLOGY 101"}]},{"label":"{partner}'s turn. Hand them the sun.","duration":5,"when":{"notFlags":["d:partnerBedtime"]},"tags":["tagteam"],"outcomes":[{"when":{"min":{"rel":45}},"text":"{partner} takes bedtime and the sun question. Through the door: \"It goes to Australia.\" Close enough. This is why you picked them.","effects":{"sleepy":10,"energy":10},"ledger":{"bedtime":"partner"}},{"when":{"max":{"rel":44}},"text":"\"I've been at work all day,\" says {partner}. So have you, and also here. You don't say it. You say it with your eyebrows. You go.","effects":{"sleepy":10,"energy":-8,"rel":-5},"ledger":{"bedtime":"you"}}]},{"label":"Call in {partner}'s bedtime IOU","duration":5,"when":{"flags":["d:partnerBedtime"]},"tags":["tagteam"],"outcomes":[{"text":"{partner} goes in. \"Where does the sun go?\" A pause. \"To bed. Like you.\" It works, instantly, and you're furious it works.","effects":{"sleepy":10,"energy":12},"ledger":{"bedtime":"partner"},"stamp":"PAID IN FULL"}]},{"label":"Speedrun: \"Great question. Goodnight.\" Door.","duration":5,"outcomes":[{"weight":1,"text":"Kiss, lights, door. Silence. You load the dishwasher in the dark, by feel. Tomorrow you'll find out what you put in it.","effects":{"rel":6}},{"weight":1,"text":"The door clicks. \"Where does the MOON go?\" The sun was just the opener.","effects":{"sleepy":-8,"energy":-4}}]}]},{"id":"bedtime_wed","title":"Bedtime: The Split Decision","text":"7:30. After thirteen hours together, {kid} has saved their best material for last: \"{ME}. My eyes are tired. But I'm not.\" They're asking for a split decision.","window":[1170,1440],"priority":100,"endsDay":true,"when":{"min":{"day":2},"max":{"day":2}},"choices":[{"label":"Read until the eyes win","duration":30,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":2,"text":"You read to the eyes. The eyes win, 2–1. The rest of {kid} files a dissent, mid-yawn, and is asleep before it's entered into the record.","effects":{"sleepy":14,"energy":-6,"rel":2},"ledger":{"bedtime":"you"},"stamp":"THE EYES HAVE IT"},{"weight":1,"text":"The eyes close at book three. The mouth keeps going: \"and then... the truck... and then...\" A filibuster, delivered by someone who's asleep.","effects":{"sleepy":12,"energy":-10,"mood":6},"ledger":{"bedtime":"you"}}]},{"label":"{partner}'s turn. You've done thirteen hours.","duration":5,"when":{"notFlags":["d:partnerBedtime"]},"tags":["tagteam"],"outcomes":[{"when":{"min":{"rel":45}},"text":"{partner} takes it without being asked. They saw your face at 5:15. You lie on the bedroom floor in the dark and it's basically a spa.","effects":{"sleepy":10,"energy":10},"ledger":{"bedtime":"partner"}},{"when":{"max":{"rel":44}},"text":"\"They've been with you all day. They want YOU.\" A compliment, weaponized. You go.","effects":{"sleepy":10,"energy":-8,"rel":-5},"ledger":{"bedtime":"you"}}]},{"label":"{partner} owes you a bedtime. Invoice them.","duration":5,"when":{"flags":["d:partnerBedtime"]},"tags":["tagteam"],"outcomes":[{"text":"{partner} goes in with the authority of someone who owes you. One book, one song, one \"goodnight, eyes.\" It works. Of course it works.","effects":{"sleepy":10,"energy":12},"ledger":{"bedtime":"partner"},"stamp":"COLLECTIONS DEPT."}]},{"label":"Speedrun: rule for the eyes. Door.","duration":5,"outcomes":[{"weight":1,"text":"Door, click, silence. The house is quiet for the first time in thirteen hours, and it's so loud you have to sit down.","effects":{"energy":8}},{"weight":1,"text":"\"{ME}, my eyes are open again.\" They report it like weather.","effects":{"sleepy":-8,"energy":-4}}]}]},{"id":"bedtime_thu","title":"Bedtime: Performance Review","text":"7:30. Before lights out, {kid} would like to give you some feedback on today. It's mostly positive. There are concerns. They'll be brief. They will not be brief.","window":[1170,1440],"priority":100,"endsDay":true,"when":{"min":{"day":3},"max":{"day":3}},"choices":[{"label":"Sit through the full review. Then books.","duration":30,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":2,"text":"Three books, two songs and the feedback session, which ends mid-yawn with \"good job, {me}.\" Best review you've had in years.","effects":{"sleepy":14,"energy":-6,"rel":2},"ledger":{"bedtime":"you"}},{"weight":1,"text":"The feedback runs long. Concerns include the egg, the owl and \"your face when you're tired.\" It's fair. It's 8:05, and they're still on the morning.","effects":{"sleepy":12,"energy":-10,"mood":6},"ledger":{"bedtime":"you"}},{"weight":3,"when":{"flags":["d:teething"]},"text":"Infant pain reliever, measured exactly as the label directs, then two books and a cold washcloth. The molar eases. {kid} falls asleep holding your thumb.","effects":{"sleepy":16,"mood":10,"energy":-6},"ledger":{"bedtime":"you"}}]},{"label":"{partner}'s turn to be reviewed","duration":5,"when":{"notFlags":["d:partnerBedtime"]},"tags":["tagteam"],"outcomes":[{"when":{"min":{"rel":45}},"text":"{partner} takes it. Through the wall, the feedback starts over, from the top, for them. They get a better review. You'll ask about it later. You won't like it.","effects":{"sleepy":10,"energy":10},"ledger":{"bedtime":"partner"}},{"when":{"max":{"rel":44}},"text":"\"You know the routine,\" says {partner}. You do. That's the trouble with knowing the routine.","effects":{"sleepy":10,"energy":-8,"rel":-5},"ledger":{"bedtime":"you"}}]},{"label":"Cash in {partner}'s promise","duration":5,"when":{"flags":["d:partnerBedtime"]},"tags":["tagteam"],"outcomes":[{"text":"{partner} goes in and gets the full review: \"good job\" in every category except singing. You listen from the hall, vindicated.","effects":{"sleepy":10,"energy":12},"ledger":{"bedtime":"partner"},"stamp":"ACCOUNT SETTLED"}]},{"label":"Speedrun: \"Noted.\" Kiss. Door.","duration":5,"outcomes":[{"weight":2,"text":"Kiss, lights, door. Silence. You walk away from the door backward, in case it notices.","effects":{"energy":8}},{"weight":1,"text":"Door, click, then: \"I have one more note.\" The note is that you said \"noted\" wrong. It's fair.","effects":{"sleepy":-8,"energy":-4}},{"weight":2,"when":{"flags":["d:potty"]},"text":"The door clicks. \"I need to TRY.\" You can't say no to trying. You've praised trying all day. It's 8:20 before they're done trying.","effects":{"sleepy":-10,"energy":-8}}]}]},{"id":"friday_bedtime","title":"The Early Bedtime","text":"The sitter arrives at 7:00. {kid} has to be asleep by then, so bedtime is now. {kid} points at the window, where the sun is still very much on duty. You have until 7:00 to make the sun a liar.","window":[1050,1139],"priority":100,"when":{"min":{"day":4}},"choices":[{"label":"Bath, book, song: speed edition","duration":30,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":2,"text":"Bath in four minutes. One book at auctioneer speed. One song, chorus only. Their eyes go heavy. So do yours. Not yet. NOT YET.","effects":{"sleepy":18,"energy":-8},"stamp":"NEW PERSONAL BEST"},{"weight":1,"text":"Mid-book, {kid} notices you're reading fast and demands it \"slow, with voices.\" You do the voices at double speed. It sounds like an auction for ducks.","effects":{"sleepy":12,"energy":-12,"mood":6}},{"weight":2,"when":{"flags":["d:party"]},"text":"They won't get in the bath. They're dressed for the party: swimsuit, one rain boot, a crown made of tape. Negotiating the boot off takes eleven minutes.","effects":{"sleepy":12,"energy":-12,"mood":-6},"stamp":"DRESS CODE VIOLATION","fx":"shake"}]},{"label":"Tag-team it. Bath, book, lights: go.","duration":20,"tags":["tagteam"],"outcomes":[{"when":{"min":{"rel":50}},"text":"You do the bath. {partner} does the book. The towel changes hands like a relay baton. You high-five in the hallway in total silence, which is harder than it sounds.","effects":{"sleepy":16,"rel":8},"stamp":"SYNCHRONIZED"},{"when":{"max":{"rel":49}},"text":"You both do the bath, neither of you does the book, and you argue in whispers about whose job the book was. {kid} referees. {kid} is loving this.","effects":{"sleepy":8,"rel":-8},"fx":"shake"}]},{"label":"Drive around until they pass out","duration":30,"outcomes":[{"weight":3,"text":"Two laps of the neighborhood. Out cold. The transfer from car seat to crib takes four minutes, two adults and zero breathing.","effects":{"sleepy":14,"energy":-4},"stamp":"TRANSFER COMPLETE"},{"weight":1,"text":"Asleep at lap two, awake in the driveway: refreshed, at 6:12 PM, the single worst time in human history to be refreshed.","effects":{"sleepy":6,"mood":-6,"energy":-6},"fx":"flash"}]},{"label":"Throw a four-minute party. Then bed.","duration":15,"minEnergy":25,"when":{"flags":["d:party"]},"tags":["present"],"outcomes":[{"weight":2,"text":"Flashlight disco, one song, one lap of the hallway. \"That was the party,\" you announce. Sweaty and thrilled, {kid} accepts, and is asleep in nine minutes.","effects":{"sleepy":18,"mood":12,"energy":-12},"stamp":"BEST PARTY EVER","fx":"confetti"},{"weight":1,"text":"The party goes great. Too great. {kid} wants an encore, then a second party, then to know where the cake is. There was no cake. That's a problem now.","effects":{"sleepy":6,"mood":6,"energy":-12}}]}]},{"id":"date_check","title":"7:00 PM: The Doorbell","text":"7:00. The doorbell. The sitter is sixteen, holding a phone charger with the confidence of someone who has never been up at 4 AM. The reservation's at 7:30, which used to be early.","window":[1140,1440],"priority":100,"noHazard":true,"when":{"min":{"day":4}},"checks":[{"when":{"max":{"sleepy":66}},"ending":"sitter_quits"},{"when":{"max":{"energy":34}},"ending":"couch"}],"choices":[{"label":"Espresso. A double. You're going in.","duration":5,"outcomes":[{"text":"You drink it in one gulp over the sink. Your eyes open wider. The left one twitches. Tonight's sleep will pay for this. Tonight is tonight.","effects":{"energy":10},"set":["d:lateCoffee"],"count":{"coffee":1},"schedule":[{"event":"date","in":0}],"stamp":"ALL IN"}]},{"label":"Fifteen-minute power nap, fully dressed","duration":15,"outcomes":[{"text":"You lie on the bed in your going-out clothes and set three alarms. You wake up confused, creased and upright. Upright counts.","effects":{"energy":12},"schedule":[{"event":"date","in":0}],"stamp":"SYSTEM REBOOTED"}]},{"label":"Just go. Don't look at the monitor.","duration":2,"outcomes":[{"text":"Shoes. Keys. Hand on the door. You don't look at the monitor. You can feel the monitor looking at you.","effects":{"rel":4},"schedule":[{"event":"date","in":0}],"stamp":"NO LOOKING BACK"}]}]},{"id":"date","title":"Table for Two","text":"You made it. Real napkins. A candle nobody is trying to blow out. You both open the menu and read the word \"Appetizers\" like it's from a language you used to speak.","priority":100,"forced":true,"endsWeek":true,"noHazard":true,"choices":[{"label":"Talk about anything but {kid}","duration":60,"outcomes":[{"when":{"min":{"rel":60}},"text":"You last eleven minutes. Then {partner} slides their phone over: a video of {kid} at breakfast, eating a normal egg, eyes open. You watch it four times. Then {partner} says, \"Hey. I missed you.\"","effects":{"rel":16,"energy":-6},"stamp":"DATE NIGHT: ACHIEVED","fx":"confetti"},{"when":{"max":{"rel":59}},"text":"The silences are long. Then the couple at the next table starts arguing about whose turn it was to book the sitter, and you laugh so hard the waiter comes over. It's almost like before.","effects":{"rel":8,"energy":-6},"stamp":"STILL GOT IT","fx":"confetti"}]},{"label":"Order dessert. Stay out until 9:15.","duration":90,"outcomes":[{"weight":2,"text":"Dessert. A second glass. A walk home the long way, holding hands, past the playground, which you don't look at. You will be destroyed tomorrow. Tomorrow is Saturday.","effects":{"rel":14,"energy":-12},"stamp":"TOMORROW IS SATURDAY","fx":"confetti"},{"weight":1,"text":"Two desserts, one each. No sharing. Nobody reaching onto your plate. At 9:10 {partner} raises a glass: \"To the party.\" {kid} was right all along. It's a party.","effects":{"rel":14,"energy":-10},"stamp":"IT WAS A PARTY","fx":"confetti"}]},{"label":"Text the sitter. Once. Just once.","duration":60,"outcomes":[{"text":"The reply comes instantly. You read it together, heads touching, and laugh until the waiter brings water nobody asked for.","effects":{"rel":10,"energy":-4},"stamp":"OWL STATUS: GREEN","fx":"confetti","chat":[{"from":"Sitter","text":"all good!! 😊 asleep at 7:04"},{"from":"Sitter","text":"quick q is the owl supposed to be green"}]}]}]},{"id":"filler","title":"Suspiciously Quiet","text":"It's quiet. Not nap quiet. The other kind. You find {kid} alone in the hallway, hands behind their back. \"I didn't do nothing,\" they say: a double negative, and a confession.","window":[0,1440],"filler":true,"repeatable":true,"choices":[{"label":"Investigate. You have to know.","duration":10,"outcomes":[{"weight":1,"text":"Behind their back: your lip balm, fully deployed. Every doorknob in the hallway is now moisturized.","effects":{"energy":-2}},{"weight":1,"text":"Behind their back: nothing. Empty hands. They just wanted to see your face do that.","effects":{"mood":6,"energy":-2},"stamp":"GOTCHA"},{"weight":1,"text":"They've been posting your socks through the heating vent, one at a time. Five are in. The vent will give them back in March, warm.","effects":{"energy":-2}}]},{"label":"Don't ask questions you can't afford answers to","duration":10,"outcomes":[{"weight":1,"text":"You walk away. Later, behind the couch, you find forty crackers stacked by size. You'll never know if it was a gift or a warning.","effects":{"energy":6}},{"weight":1,"text":"You walk away. At 4 PM you find every shoe in the house lined up in the bathtub, in pairs, facing the drain. Putting them back takes twenty minutes. It's either art or a ritual, and nobody will say which.","effects":{"energy":-8}}]},{"label":"\"Thank you for telling me.\"","duration":2,"outcomes":[{"weight":2,"text":"{kid} beams, accepts the praise and walks off with the calm of someone cleared by an investigation you never opened. You find out what it was at 6 PM, when you sit on it.","effects":{"mood":8,"energy":-6}},{"weight":1,"text":"\"You're welcome,\" says {kid}, and hands you what was behind their back: your car key, damp. It isn't a confession. It's a receipt.","effects":{"mood":6}}]}]},{"id":"coffee","family":"coffee","title":"Coffee: Attempt #1","text":"You pour a coffee into the CRUSH IT mug from a 2018 sales offsite. You lift it. From the floor: \"{ME}. Hold my hand. No. The coffee hand.\"","window":[365,600],"weight":4,"oncePerWeek":true,"when":{"notFlags":["coffee:1"]},"choices":[{"label":"Switch hands. Become ambidextrous.","duration":4,"outcomes":[{"weight":2,"text":"You move the mug to your left hand. They grab your left hand. You switch back. They switch with you. On lap five you drain it in one gulp. Hand: available.","effects":{"energy":12,"mood":8},"set":["coffee:1"],"count":{"coffee":1}},{"weight":1,"text":"Four laps of hand-switching. By lap five the coffee is lukewarm, {kid} wins, and it all goes on the rug. The mug lands upright, unharmed, still saying CRUSH IT. The mug always survives.","effects":{"mood":8,"energy":-2},"set":["coffee:1"],"stamp":"MUG: UNHARMED","fx":"shake"}]},{"label":"\"One second, sweetheart.\" Set it down.","duration":12,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":1,"text":"One second becomes eleven minutes and four books. The coffee is cold when you get back, with a single puff floating in the middle. You drink around it.","effects":{"mood":16,"energy":-4},"set":["coffee:1"],"count":{"coffee":1}},{"weight":1,"text":"One second becomes eleven minutes. {kid} has made you a fresh one: the cold coffee, plus a raisin, plus a toy block. They're watching. You sip. \"Mmm.\" You've never loved anyone more or a drink less.","effects":{"mood":18,"energy":-6},"set":["coffee:1"],"count":{"coffee":1}}]},{"label":"Drink it scalding. Like it owes you money.","duration":2,"outcomes":[{"weight":2,"text":"You drink it at the temperature of a car hood in July. You can no longer taste. You can, however, hear colors.","effects":{"energy":16,"mood":-8},"set":["coffee:1"],"count":{"coffee":1}},{"weight":1,"text":"Too hot. You burn the roof of your mouth and make a face {kid} learns instantly. By lunch they're doing it at daycare. They call it \"the coffee face.\"","effects":{"energy":10},"set":["coffee:1"],"count":{"coffee":1},"stamp":"THE COFFEE FACE"}]}]},{"id":"coffee_reheat","family":"coffee","title":"Coffee: Reheat #4","text":"The CRUSH IT mug has been microwaved four times since 7 AM and drunk zero times. It has a skin now. The microwave beeps. It beeps again. It is beeping at you, specifically.","window":[480,780],"weight":4,"oncePerWeek":true,"when":{"flags":["coffee:1"],"notFlags":["coffee:2"]},"choices":[{"label":"Reheat #5. Stand guard this time.","duration":3,"outcomes":[{"weight":2,"text":"You stand at the microwave for the full 90 seconds, arms crossed, daring it. Beep. You drink it hot, in front of a witness. The witness asks for some.","effects":{"energy":12},"set":["coffee:2"],"count":{"coffee":1}},{"weight":1,"text":"At 0:04, from the living room: \"{ME}! COME SEE!\" You go see. It's a crumb. A good crumb, to be fair. Reheat #6 is scheduled for later.","effects":{"mood":10,"energy":-4},"set":["coffee:2"],"stamp":"REHEAT #6 PENDING"}]},{"label":"Drink it cold. Call it cold brew.","duration":1,"outcomes":[{"text":"Cold brew is $6.50 at the place with the reclaimed-wood counter. Yours has a skin and was free. You're basically making money.","effects":{"energy":8},"set":["coffee:2"],"count":{"coffee":1}}]},{"label":"Fresh pot. Start over as a new person.","duration":10,"outcomes":[{"weight":1,"text":"Eight minutes of brewing. In that time {kid} takes every magnet off the fridge and lines them up on the floor, by size. You move one. That was a mistake. You drink a hot, fresh coffee during the appeal.","effects":{"energy":16,"mood":-8},"set":["coffee:2"],"count":{"coffee":1}},{"weight":1,"text":"While the pot gurgles, {kid} takes the old mug and waters the fern with it. The fern looks more alert than it has in years. Twenty minutes later, so do you.","effects":{"energy":14},"set":["coffee:2"],"count":{"coffee":1},"stamp":"FERN: CAFFEINATED"}]},{"label":"Tea party. Serve it in the tiny cups.","duration":12,"minEnergy":25,"tags":["present"],"outcomes":[{"weight":2,"text":"{kid} serves your cold coffee back to you in a teacup the size of a thimble, eleven times, in eleven accents. \"Your grown-up soup.\" You get about a tablespoon in total. Five stars.","effects":{"mood":18,"energy":-6},"set":["coffee:2"],"count":{"coffee":1}},{"weight":1,"text":"The party ends when the guest of honor, a stuffed giraffe, is accused of drinking it all. The giraffe goes in time-out. You're still thirsty, but justice was done.","effects":{"mood":12,"energy":-8},"set":["coffee:2"]}]}]},{"id":"coffee_lost","family":"coffee","title":"Coffee: Have You Seen This Mug?","text":"The CRUSH IT mug was in your hand four minutes ago. Full. Hot. Now it's not anywhere. You've checked the fridge. You've checked your other hand. {kid} is humming.","window":[560,900],"weight":4,"oncePerWeek":true,"when":{"flags":["coffee:2"],"notFlags":["coffee:3"]},"choices":[{"label":"Search the house. Every room. Twice.","duration":15,"minEnergy":25,"tags":["martyr"],"outcomes":[{"weight":1,"text":"You find three socks, {partner}'s missing earbud, a crayon in the butter and a shoelace tied, tightly, to a chair. No mug. The house gives you everything except what you asked for.","effects":{"energy":-10,"rel":8},"set":["coffee:3","d:coffeeLost"]},{"weight":1,"text":"Two full sweeps, and all you find is the mug's coaster. Just the coaster, on the bathroom floor, with nothing on it. Somehow that's worse.","effects":{"energy":-12},"set":["coffee:3","d:coffeeLost"]}]},{"label":"Interrogate the witness.","duration":5,"tags":["negotiate"],"outcomes":[{"weight":1,"text":"\"Where's my coffee?\" \"It's sleeping.\" \"Where?\" \"In its house.\" \"Where's its house?\" A finger goes to their lips. The witness has been advised not to answer.","effects":{"mood":6,"energy":-4},"set":["coffee:3","d:coffeeLost"],"stamp":"NO COMMENT"},{"weight":1,"text":"{kid} leads you, very seriously, to the toy kitchen and hands you an empty plastic cup. \"Careful. Hot.\" You blow on it. You fake a long sip. They refill it. Best café in town. No coffee.","effects":{"mood":14,"energy":-4},"set":["coffee:3","d:coffeeLost"]}]},{"label":"Make another. Let the first one go.","duration":8,"outcomes":[{"text":"You make a second coffee in the backup mug, the free one from the dentist. It works fine. It just doesn't believe in you the way CRUSH IT did.","effects":{"energy":12},"set":["coffee:3","d:coffeeLost"],"count":{"coffee":1}}]}]},{"id":"coffee_late","family":"coffee","title":"Coffee: The Point of No Return","text":"It's after 3. You have about forty minutes of person left and four hours of day. A coffee now gets you to bedtime. It also gets you to 1:30 AM, awake, re-planning the kitchen.","window":[900,1080],"weight":4,"oncePerWeek":true,"when":{"flags":["coffee:3"],"notFlags":["coffee:4"]},"choices":[{"label":"Double espresso. Tonight is a rumor.","duration":3,"outcomes":[{"weight":2,"text":"It hits in six minutes. By minute twelve you've emptied the dishwasher, reloaded it correctly and given the junk drawer a theme. The theme is \"batteries?\"","effects":{"energy":20},"set":["coffee:4","d:lateCoffee"],"count":{"coffee":1}},{"weight":1,"text":"It works too well. You start talking at 1.5x speed, and by dinner {kid} is talking at 1.5x back. You're both narrating the same snack, faster and faster.","effects":{"energy":16,"mood":-10},"set":["coffee:4","d:lateCoffee"],"count":{"coffee":1}}]},{"label":"Half-caf. A coward's compromise.","duration":3,"outcomes":[{"text":"Half the caffeine. Half the guilt. All of the 1:30 AM. Your body doesn't do fractions.","effects":{"energy":10},"set":["coffee:4","d:lateCoffee"],"count":{"coffee":1},"stamp":"NO PARTIAL CREDIT"}]},{"label":"Lie face-down on the rug. Four minutes.","duration":5,"outcomes":[{"weight":1,"text":"{kid} uses you as a rug, then a horse, then a bed, then a rug again. It isn't caffeine. But it's horizontal.","effects":{"energy":8,"mood":8},"set":["coffee:4"]},{"weight":1,"text":"Ninety seconds in, {kid} sits on your back and announces, \"I'm the boss of you.\" You don't argue. You can't. They're sitting on your lungs.","effects":{"energy":4,"mood":12},"set":["coffee:4"]}]},{"label":"Just smell the coffee bag. Deeply.","duration":1,"outcomes":[{"text":"You put your face in the bag of beans and inhale. It does nothing. It does something. It does nothing.","effects":{"energy":4},"set":["coffee:4"]}]}]},{"id":"coffee_found","family":"coffee","title":"Coffee: Cold Case","text":"You open the microwave to heat a pouch. Inside, in the dark: the CRUSH IT mug, full, cold, missing for days. {kid} can't reach the microwave. There is only one suspect.","window":[420,1080],"weight":4,"oncePerWeek":true,"when":{"flags":["coffee:4"],"notFlags":["coffee:5"]},"choices":[{"label":"Reheat it. One last time. For closure.","duration":3,"outcomes":[{"weight":2,"text":"Ninety seconds. You drink it. It tastes like a version of you who still had plans for this coffee. It's not bad, which is the worst part.","effects":{"energy":10},"set":["coffee:5"],"count":{"coffee":1},"stamp":"COLD CASE: SOLVED"},{"weight":1,"text":"Thirty seconds in, the microwave starts sparking. CRUSH IT has a gold rim. It was a nice offsite. You yank the plug. The mug is fine. The mug is always fine.","effects":{"energy":-4},"set":["coffee:5"],"fx":"flash"}]},{"label":"Hold a small funeral. {kid} officiates.","duration":8,"minEnergy":20,"tags":["present"],"outcomes":[{"text":"{kid} says a few words: \"Bye, coffee. You was hot.\" You pour it on the flower bed together, and {kid} pats the dirt. It's the most moving service you've been to in years.","effects":{"mood":16,"energy":-6},"set":["coffee:5"]}]},{"label":"Pour it out. Fresh cup. Tell no one.","duration":6,"outcomes":[{"weight":1,"text":"Down the sink. Fresh cup. You stick a note on the microwave: \"CHECK FOR COFFEE.\" By tomorrow you'll have stopped seeing the note. That's how it starts.","effects":{"energy":12},"set":["coffee:5"],"count":{"coffee":1}},{"weight":1,"text":"Rinsed, refilled, back in service: CRUSH IT, hot again. You lift it. From the floor: \"{ME}. Hold my hand. The coffee hand.\" It's Monday again, spiritually.","effects":{"energy":8,"mood":6},"set":["coffee:5"],"count":{"coffee":1}}]}]},{"id":"tantrum_1","family":"tantrum","title":"Tantrum #1: Garbage Day","text":"The garbage truck came, took the garbage and left without honking. {kid} is face-down on the front step. You start a tally on the fridge. You leave room.","window":[450,900],"weight":6,"oncePerWeek":true,"when":{"notFlags":["tantrum:1"]},"choices":[{"label":"Chase the truck. Both of you. Go.","duration":10,"minEnergy":30,"tags":["present"],"outcomes":[{"weight":2,"text":"A block and a half in slippers, {kid} on your hip, both of you waving. The driver sees. The driver honks twice. {kid} will bring this up at their wedding.","effects":{"mood":22,"energy":-12},"set":["tantrum:1"],"count":{"tantrums":1},"stamp":"TWO HONKS","fx":"confetti"},{"weight":1,"text":"The truck turns the corner as you reach the hydrant. You're on a public sidewalk in slippers, holding a sobbing child, waving at nothing. A neighbor waves back, unsure.","effects":{"mood":-10,"energy":-12},"set":["tantrum:1"],"count":{"tantrums":1}}]},{"label":"\"It comes back next Tuesday.\"","duration":6,"tags":["boundary"],"outcomes":[{"weight":1,"text":"\"Next Tuesday\" means very little to someone who has only had 104 Tuesdays. The protest holds the step for nine minutes. Then a bird lands. Truck who?","effects":{"mood":-4,"energy":-4},"set":["tantrum:1"],"count":{"tantrums":1}},{"weight":1,"text":"They accept it. Then they ask if it's next Tuesday. Then again, every twenty minutes, until bedtime. It is not next Tuesday. It is never next Tuesday.","effects":{"mood":8,"energy":-10},"set":["tantrum:1"],"count":{"tantrums":1}}]},{"label":"Be the truck. Wheel the bin out, beeping.","duration":6,"outcomes":[{"weight":2,"text":"You wheel the bin to the curb doing the reverse beep. {kid} stops crying to supervise. You beep the whole way back. You'll be beeping on request until spring.","effects":{"mood":14,"energy":-6},"set":["tantrum:1"],"count":{"tantrums":1}},{"weight":1,"text":"You beep the bin to the curb. Across the street, a retired neighbor starts beeping too, unprompted. Now there are two trucks. {kid} is delighted and slightly afraid.","effects":{"mood":12,"energy":-6},"set":["tantrum:1"],"count":{"tantrums":1},"stamp":"MUTUAL AID"}]},{"label":"Garbage truck videos. One. Okay, four.","duration":3,"tags":["screen"],"outcomes":[{"text":"Fifteen minutes of garbage trucks from around the world. {kid} is calm and has a new favorite truck, which is Belgian. The screen-off is going to be a whole thing.","effects":{"mood":16,"energy":8},"set":["tantrum:1","d:screen"],"count":{"tantrums":1,"screen":15},"schedule":[{"event":"screen_off","in":15}]}]}]},{"id":"tantrum_2","family":"tantrum","title":"Tantrum #2: Put It Back","text":"Tally: 2. A leaf has fallen off the tree in the front yard, and {kid} saw it happen. They want it put back. Not near the tree. ON the tree. They're watching your hands.","window":[460,1040],"weight":6,"oncePerWeek":true,"when":{"flags":["tantrum:1"],"notFlags":["tantrum:2"]},"choices":[{"label":"Tape it back on. Packing tape. Commit.","duration":8,"minEnergy":25,"tags":["present"],"outcomes":[{"weight":2,"text":"You tape the leaf to the branch while a neighbor walks a dog past. Slowly. Twice. {kid} inspects the repair and approves it. In a month you'll have to explain autumn.","effects":{"mood":16,"energy":-10},"set":["tantrum:2"],"count":{"tantrums":1}},{"weight":1,"text":"You tape it on. Another leaf falls. Then two more. The tree is fighting back. {kid} looks at you like a contractor who blew the deadline.","effects":{"mood":-14,"energy":-10},"set":["tantrum:2"],"count":{"tantrums":1},"stamp":"TREE 3, YOU 0","fx":"shake"}]},{"label":"Explain the seasons. All four.","duration":10,"tags":["boundary"],"outcomes":[{"weight":1,"text":"You cover autumn, chlorophyll and the life cycle of deciduous trees. {kid} listens to all of it, then says, \"Put it BACK.\" You were never in a conversation.","effects":{"mood":-10,"energy":-6},"set":["tantrum:2"],"count":{"tantrums":1}},{"weight":1,"text":"Halfway through photosynthesis, the crying stops so they can ask what photosynthesis is. Then why. Then why. You've traded a tantrum for a seminar.","effects":{"mood":12,"energy":-8},"set":["tantrum:2"],"count":{"tantrums":1}}]},{"label":"Hand them an identical leaf. Say nothing.","duration":2,"tags":["negotiate"],"outcomes":[{"weight":1,"text":"You present a matching leaf with total confidence. They accept it, put it in their pocket and say, \"Now the other one.\" There is always another one.","effects":{"mood":8,"energy":2},"set":["tantrum:2"],"count":{"tantrums":1}},{"weight":1,"text":"{kid} holds it up to the light like a jeweler, then hands it back. \"This one is from the GROUND.\" The crying resumes at a higher altitude.","effects":{"mood":-16},"set":["tantrum:2"],"count":{"tantrums":1},"stamp":"FORGERY DETECTED"}]}]},{"id":"tantrum_3","family":"tantrum","title":"Tantrum #3: Hurricane Agnes","text":"The fridge tally says 3. You've started naming them alphabetically, like the weather service. Hurricane Agnes has formed over the moon being out in the daytime, which nobody cleared with {kid}.","window":[780,1140],"weight":6,"oncePerWeek":true,"when":{"flags":["tantrum:2"],"notFlags":["tantrum:3"]},"choices":[{"label":"Yell \"GO HOME, MOON\" together.","duration":6,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":2,"text":"You stand in the driveway and yell at the moon. {kid} joins in. The moon stays put. But you're on the same side now, which was the whole trick.","effects":{"mood":16,"energy":-8},"set":["tantrum:3"],"count":{"tantrums":1}},{"weight":1,"text":"You yell at the moon. The neighbor's kid comes out and yells at the moon. Then the neighbor. Agnes breaks up into a block party.","effects":{"mood":14,"energy":-8},"set":["tantrum:3"],"count":{"tantrums":1},"stamp":"STORM DISSIPATED"}]},{"label":"Close the blinds on the moon.","duration":3,"outcomes":[{"weight":1,"text":"Blinds down. Moon gone. {kid} declares victory over the moon and is extremely nice to you for an hour, the way generals are after a war.","effects":{"mood":12},"set":["tantrum:3"],"count":{"tantrums":1}},{"weight":1,"text":"Blinds down. Agnes weakens to a tropical sulk. Then {kid} opens one slat, sees the moon and re-forms at full strength.","effects":{"mood":-14,"energy":-4},"set":["tantrum:3"],"count":{"tantrums":1},"stamp":"AGNES RE-FORMS","fx":"shake"}]},{"label":"Sunshine Sing-Along. Corduroy man has this.","duration":4,"tags":["screen"],"outcomes":[{"text":"The man in corduroy sings a song about the moon, by coincidence or witchcraft. Agnes is downgraded at once. The screen-off forecast is not good.","effects":{"mood":18,"energy":8},"set":["tantrum:3","d:screen"],"count":{"tantrums":1,"screen":22},"schedule":[{"event":"screen_off","in":22}]}]}]},{"id":"tantrum_4","family":"tantrum","title":"Tantrum #4: Hurricane Bernard","text":"You've started live-texting the tantrums to {partner}, the way storm chasers do.","chat":{"with":"{partner}","messages":[{"from":"you","text":"hurricane bernard has made landfall"},{"from":"you","text":"cause: i said yes too fast"},{"from":"{partner}","text":"yes to what"},{"from":"you","text":"a banana. they wanted to ask twice"},{"from":"{partner}","text":"category?"}]},"window":[720,1030],"weight":6,"oncePerWeek":true,"when":{"flags":["tantrum:3"],"notFlags":["tantrum:4"]},"choices":[{"label":"\"Cat 4. Bring plywood and crackers.\"","duration":2,"tags":["tagteam"],"outcomes":[{"weight":2,"text":"Twenty-five minutes later {partner} walks in with crackers and the face of a first responder. Bernard is a light drizzle by then. They take full credit.","effects":{"rel":8,"energy":10,"mood":6},"set":["tantrum:4"],"count":{"tantrums":1},"chat":[{"from":"{partner}","text":"leaving now. hold on"}]},{"weight":1,"text":"You laugh at the \"lol.\" Bernard sees you laughing at your phone and upgrades to a Category 5.","effects":{"mood":-14,"rel":-4},"set":["tantrum:4"],"count":{"tantrums":1},"chat":[{"from":"{partner}","text":"lol"}],"fx":"shake"}]},{"label":"Phone down. Lie on the floor with them.","duration":10,"minEnergy":25,"tags":["present"],"outcomes":[{"text":"You lie on the kitchen tile next to Bernard. Bernard hiccups twice, then puts their head on your arm. Storm over. You never send the all-clear.","effects":{"mood":20,"energy":-10,"rel":-4},"set":["tantrum:4"],"count":{"tantrums":1},"chat":[{"from":"{partner}","text":"hello??"},{"from":"{partner}","text":"HELLO??"}]}]},{"label":"Send a video. Narrate it like the news.","duration":3,"outcomes":[{"weight":1,"text":"\"Bernard is moving slowly west, toward the snack drawer.\" {partner} watches it in a meeting with the sound on. Four coworkers are now following the storm.","effects":{"rel":6,"mood":-6,"energy":2},"set":["tantrum:4"],"count":{"tantrums":1}},{"weight":1,"text":"You can't tell if it's support or a bit. It's both. With them it's always both.","effects":{"rel":12,"mood":-6},"set":["tantrum:4"],"count":{"tantrums":1},"chat":[{"from":"{partner}","text":"[satellite image of a hurricane]"},{"from":"{partner}","text":"thinking of you all 🙏"}]}]}]},{"id":"tantrum_5","family":"tantrum","title":"Tantrum #5: Hurricane Clara","text":"The library elevator. A man in a fleece vest has just pressed the button. {kid}'s button. The man doesn't know yet. {kid} is drawing the longest breath of their career.","window":[600,1000],"weight":6,"oncePerWeek":true,"timer":5,"when":{"flags":["tantrum:4"],"notFlags":["tantrum:5","d:home"]},"choices":[{"label":"\"Sir, could you un-press it?\"","duration":2,"outcomes":[{"weight":2,"text":"The man looks at you, then at {kid}, and understands everything. A slow, solemn mime of un-pressing. A small bow. {kid} presses it. Clara dissipates. You'd follow this man into battle.","effects":{"mood":14},"set":["tantrum:5"],"count":{"tantrums":1}},{"weight":1,"text":"\"Un-press it?\" the man repeats, loudly, for the whole lobby. Clara makes landfall between the large-print books and a man doing taxes.","effects":{"mood":-12},"set":["tantrum:5"],"count":{"tantrums":1},"fx":"shake"}]},{"label":"Press every button. All of them.","duration":2,"outcomes":[{"weight":2,"text":"You lift {kid} to the panel. They press 1 through 6. The elevator stops at every floor. The man in the fleece vest rides along in silence, gets off at 6 and waits for the next one.","effects":{"mood":14,"energy":-6},"set":["tantrum:5"],"count":{"tantrums":1},"stamp":"ALL FLOORS"},{"weight":1,"text":"They press 1 through 6, then the red one. The alarm is very loud and very brief. The librarian has a face for this. You spend the walk to the car drafting an apology to a building.","effects":{"mood":10,"energy":-10},"set":["tantrum:5"],"count":{"tantrums":1},"fx":"flash"}]},{"label":"\"STAIRS! Who wants the STAIRS?\"","duration":6,"minEnergy":30,"tags":["present"],"outcomes":[{"text":"Forty-two stairs, every one counted out loud. Clara blows out to sea around 19. By the top, you're the one who needs the elevator.","effects":{"mood":12,"energy":-14},"set":["tantrum:5"],"count":{"tantrums":1}}]},{"label":"Freeze","duration":2,"timeout":true,"outcomes":[{"text":"\"THAT MAN TOOKED MY BUTTON.\" The lobby turns around. The man says \"Sorry, buddy,\" and is now, forever, the man who tooked the button.","effects":{"mood":-14},"set":["tantrum:5"],"count":{"tantrums":1},"stamp":"LANDFALL","fx":"shake"}]}]},{"id":"tantrum_6","family":"tantrum","title":"Tantrum #6: Disaster Relief","text":"Tally: 6. Hurricane Desmond. The cause: {kid}'s shadow won't stop following them, and you are \"not doing ANYTHING about it.\" You open the disaster relief website, one-handed.","window":[480,1100],"weight":6,"oncePerWeek":true,"when":{"flags":["tantrum:5"],"notFlags":["tantrum:6"]},"choices":[{"label":"File the claim. Cause of disaster: \"shadow.\"","duration":6,"outcomes":[{"weight":1,"text":"Claim #44718 submitted. Expected response: 6 to 8 weeks. Desmond blows itself out in four minutes, which you add to the claim as a note.","effects":{"mood":10,"energy":-4},"set":["tantrum:6"],"count":{"tantrums":1},"stamp":"CLAIM #44718"},{"weight":1,"text":"The form asks, \"Is this an emergency?\" You look at the floor. You click yes. Desmond, sensing paperwork, intensifies.","effects":{"mood":-14,"energy":-4},"set":["tantrum:6"],"count":{"tantrums":1},"fx":"shake"}]},{"label":"Make the shadow a friend. Flashlight. Puppets.","duration":15,"minEnergy":25,"tags":["present"],"outcomes":[{"weight":2,"text":"Blinds down, flashlight on. The shadow becomes a dog, a bird, a very bad crab. By minute twenty the shadow is named Doug and has been invited to dinner.","effects":{"mood":20,"energy":-12},"set":["tantrum:6"],"count":{"tantrums":1},"fx":"confetti"},{"weight":1,"text":"Flashlight on. The shadow is now nine feet tall, on the wall, right behind them. {kid} turns around slowly. You've made the problem bigger. Literally.","effects":{"mood":-14,"energy":-12},"set":["tantrum:6"],"count":{"tantrums":1}}]},{"label":"Stomp on the shadow. Show it who's boss.","duration":3,"outcomes":[{"weight":1,"text":"You stomp the shadow. It moves. You stomp again. {kid} stops crying to watch an adult lose a fight to the sun.","effects":{"mood":10,"energy":-6},"set":["tantrum:6"],"count":{"tantrums":1},"stamp":"THE SUN WINS"},{"weight":1,"text":"You stomp. They stomp. Soon you're both stomping the driveway, red-faced, yelling at a shadow. It doesn't help with the shadow. It helps with everything else.","effects":{"mood":14,"energy":-8},"set":["tantrum:6"],"count":{"tantrums":1}}]},{"label":"Tablet. Accept the relief package.","duration":3,"tags":["screen"],"outcomes":[{"text":"Relief arrives as a man in corduroy. The shadow is forgotten. You've accepted federal aid, and federal aid comes with strings.","effects":{"mood":16,"energy":8},"set":["tantrum:6","d:screen"],"count":{"tantrums":1,"screen":22},"schedule":[{"event":"screen_off","in":22}]}]}]},{"id":"tantrum_7","family":"tantrum","title":"Tantrum #7: Hurricane {me}","text":"You step on a wooden block and say \"NNNGH\" for nine full seconds. {kid} pats your arm. \"Big feelings, {me}? Smell the flower. Blow the candle.\" Then they go to the fridge and add a tally. Under your name.","window":[840,1160],"weight":6,"oncePerWeek":true,"when":{"flags":["tantrum:6"],"notFlags":["tantrum:7"]},"choices":[{"label":"Smell the flower. Blow the candle.","duration":3,"outcomes":[{"weight":2,"text":"You smell the flower. You blow the candle. They watch, nodding, like the world's smallest yoga teacher. It works, which is humiliating. They give you a sticker.","effects":{"energy":10,"mood":12},"set":["tantrum:7"],"count":{"tantrums":1}},{"weight":1,"text":"You blow the candle too hard. \"Gentle, {me}.\" You do it again, gently. They make you do it four more times, for practice. You've never been so calm or so supervised.","effects":{"energy":8,"mood":10},"set":["tantrum:7"],"count":{"tantrums":1}}]},{"label":"\"I am NOT having a tantrum.\"","duration":2,"tags":["boundary"],"snapRisk":true,"outcomes":[{"weight":1,"text":"\"You're having a tantrum,\" they say, gently. Your voice goes up an octave explaining that you're not. They walk back to the fridge and add a second tally.","effects":{"energy":-6,"mood":-8},"set":["tantrum:7"],"count":{"tantrums":1},"stamp":"TWO TALLIES"},{"weight":1,"text":"\"Okay,\" they say, kindly, in your exact voice, with your exact head tilt. It's what you say to them. It's unbearable to hear.","effects":{"energy":4,"mood":6},"set":["tantrum:7"],"count":{"tantrums":1}}]},{"label":"Lie on the floor and kick. Show them how.","duration":5,"outcomes":[{"weight":2,"when":{"flags":["d:handoff"]},"text":"You lie on the floor and kick. {kid} watches with professional interest, then lies down next to you and does it better. {partner} walks in, assesses the scene and lies down too.","effects":{"rel":12,"mood":16,"energy":-4},"set":["tantrum:7"],"count":{"tantrums":1},"fx":"shake"},{"weight":1,"text":"You lie on the floor and kick. {kid} studies your form and gives notes: \"More legs.\" You do more legs. It feels incredible. Nobody tells you this part.","effects":{"energy":10,"mood":14},"set":["tantrum:7"],"count":{"tantrums":1}}]}]},{"id":"food_1","family":"food","title":"Food #1: Ruled Spicy","text":"Plain pasta. No sauce, no salt, nothing. {kid} takes one bite and pushes the bowl away. \"It's spicy.\" It is not spicy. It has never been spicy. That's their testimony, and they're sticking to it.","window":[560,920],"weight":6,"oncePerWeek":true,"when":{"notFlags":["food:1"]},"choices":[{"label":"Take a bite. Testify: not spicy.","duration":3,"tags":["negotiate"],"outcomes":[{"weight":1,"text":"You eat a forkful. \"Mmm. Not spicy.\" {kid} watches you swallow, then rules: \"Spicy for you too.\" The court has expanded its ruling.","effects":{"mood":-10,"energy":4},"set":["food:1"]},{"weight":1,"text":"\"See? Not spicy.\" {kid} takes a cautious bite, chews for a long time and announces, \"You fixed it.\" You did nothing. Nobody needs to know.","effects":{"mood":12,"energy":2},"set":["food:1"],"stamp":"CHARGES DROPPED"}]},{"label":"Agree. \"Whoa. SO spicy.\" Fan your mouth.","duration":4,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":2,"text":"You gasp and fan your mouth. {kid} is thrilled. They eat the whole bowl, gasping between bites, the bravest person who ever lived.","effects":{"mood":16,"energy":-6},"set":["food:1"],"stamp":"BRAVERY NOTED","fx":"confetti"},{"weight":1,"text":"\"SO spicy,\" you gasp. {kid} nods, vindicated, and pushes the bowl even further away. You've just entered their testimony into the record.","effects":{"mood":-8,"energy":-6},"set":["food:1"]}]},{"label":"\"Then you're done.\" Clear the plate.","duration":2,"tags":["boundary"],"outcomes":[{"text":"You clear it without a word. Forty minutes later: \"I'm HUNGRY. I want the pasta.\" The pasta has been ruled delicious, retroactively, from the bin.","effects":{"mood":-12,"energy":4},"set":["food:1"]}]}]},{"id":"food_2","family":"food","title":"Food #2: False Advertising","text":"{kid} is holding a chicken nugget up next to the bag. The nugget on the bag has a smile and a little chef's hat. This one has neither. They allege false advertising. Honestly, they have a case.","window":[700,1040],"weight":6,"oncePerWeek":true,"when":{"flags":["food:1"],"notFlags":["food:2"]},"choices":[{"label":"Ketchup face. Napkin hat. Full restoration.","duration":6,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":2,"text":"Two dots, a smile and a tiny napkin hat. The nugget is now a client. {kid} talks to it for six minutes, apologizes and eats it head first.","effects":{"mood":16,"energy":-8},"set":["food:2"]},{"weight":1,"text":"You draw the face. {kid} stares at it for a long time. \"Now he's sad, because I'm eating him.\" Lunch is cancelled out of respect.","effects":{"mood":-10,"energy":-8},"set":["food:2"]}]},{"label":"Point to the fine print: \"Serving suggestion.\"","duration":2,"tags":["negotiate"],"outcomes":[{"weight":2,"text":"You point at the tiny words under the picture. {kid} can't read. {kid} can tell when they're being lawyered. The nuggets are thrown, one at a time, as damages.","effects":{"mood":-8},"set":["food:2"],"stamp":"DAMAGES AWARDED","fx":"shake"},{"weight":1,"text":"\"Serving suggestion,\" you read. {kid} considers this, then suggests serving them to you. You eat four nuggets over the sink. It's the first lunch you've had this week.","effects":{"energy":10,"mood":-6},"set":["food:2"]}]},{"label":"Help them write the nugget company a complaint.","duration":8,"minEnergy":20,"tags":["present"],"outcomes":[{"text":"{kid} dictates: \"Dear nugget. You lied. Love, {kid}.\" You fold it into an envelope and mail it to nobody, and they eat four nuggets while waiting for a reply.","effects":{"mood":14,"energy":-6},"set":["food:2"],"stamp":"COMPLAINT FILED"}]},{"label":"Settle out of court. One cracker.","duration":1,"tags":["bribe"],"outcomes":[{"weight":2,"text":"A cracker, no admission of wrongdoing. {kid} accepts the settlement and eats it. The nuggets go in the bin. Their lawyer will open with crackers next time.","effects":{"mood":10},"set":["food:2"],"count":{"snacks":1}},{"weight":1,"text":"A cracker, no admission of wrongdoing. {kid} eats it, then demands one cracker per nugget, retroactively. There were nine nuggets. Their lawyer is very good.","effects":{"mood":-6,"energy":-6},"set":["food:2"],"count":{"snacks":1}}]}]},{"id":"food_3","family":"food","title":"Food #3: The Beige Doctrine","text":"{kid} now eats only beige food: pasta, crackers and one specific bread. You slipped a piece of cauliflower onto the plate. It is also beige. It was identified and expelled in under a second.","window":[560,920],"weight":6,"oncePerWeek":true,"when":{"flags":["food:2"],"notFlags":["food:3"]},"choices":[{"label":"Argue it's beige. Hold it next to a cracker.","duration":4,"tags":["negotiate"],"outcomes":[{"weight":1,"text":"You hold the cauliflower next to a cracker under the kitchen light. A perfect match. {kid} studies them both, then points at the cauliflower: \"That one's lying.\"","effects":{"mood":-8,"energy":-4},"set":["food:3"]},{"weight":1,"text":"\"Beige,\" you say, holding it next to a cracker. {kid} squints, shrugs and eats it. Then another. You've found a loophole. Never mention it again, or it closes.","effects":{"mood":12,"energy":-2},"set":["food:3"],"stamp":"LOOPHOLE FOUND"}]},{"label":"Accept the doctrine. Serve beige until spring.","duration":2,"outcomes":[{"text":"Toast, rice, noodles, a pale apple slice. Everything gets eaten. The daycare form asks about \"variety in the diet.\" You stare at that line for twenty minutes, then write \"tan.\"","effects":{"mood":14,"energy":-6},"set":["food:3"]}]},{"label":"Hide it in a pancake. Beige on beige.","duration":15,"minEnergy":25,"tags":["martyr"],"outcomes":[{"weight":2,"text":"You blend the cauliflower into pancake batter. It's beige. It's a pancake. They eat three, then look at you with a quiet suspicion they'll carry into adulthood.","effects":{"mood":10,"energy":-12},"set":["food:3"]},{"weight":1,"text":"They eat the whole pancake around one tiny, intact piece of cauliflower, which they set on the edge of the plate like a hair they found in soup.","effects":{"mood":-6,"energy":-12},"set":["food:3"]}]}]},{"id":"food_4","family":"food","title":"Food #4: I'm a Dog Now","text":"{kid} has become a dog. Dogs, they explain, eat off the floor, don't use forks and are not subject to the vegetable laws. The dog would like its food in a bowl, on the floor, now. The dog knows its rights.","window":[700,1040],"weight":6,"oncePerWeek":true,"when":{"flags":["food:3"],"notFlags":["food:4"]},"choices":[{"label":"Serve the dog. Bowl, floor, clean mat.","duration":3,"tags":["negotiate"],"outcomes":[{"weight":2,"text":"The dog eats everything, carrots included, face-first, hair included. It's the best they've eaten all week, and it was served on the floor. Draw your own conclusions at bath time.","effects":{"mood":14,"energy":-6},"set":["food:4"]},{"weight":1,"text":"The dog eats three bites, barks at a leaf, then asks for \"dog water\" in a cup. A cup. With a straw. Dogs aren't consistent either.","effects":{"mood":8},"set":["food:4"]}]},{"label":"Become a dog too. Eat beside them.","duration":12,"minEnergy":30,"tags":["present"],"outcomes":[{"text":"You get on all fours and eat cold noodles from a bowl next to theirs. The dog finishes everything just to keep up. Through the window, the mail carrier makes eye contact and decides not to knock.","effects":{"mood":20,"energy":-12},"set":["food:4"],"stamp":"PACK LEADER"}]},{"label":"\"Good dogs sit at the table.\"","duration":4,"tags":["bribe"],"outcomes":[{"weight":2,"text":"Accepted. Good dogs sit at the table and use a fork. Good dogs, it turns out, also get a treat, and this dog knows exactly which cabinet.","effects":{"mood":12,"energy":-2},"set":["food:4"],"count":{"snacks":1}},{"weight":1,"text":"\"I'm a BAD dog,\" they inform you, and eat their noodles off the floor with their whole face, holding your gaze.","effects":{"mood":-8},"set":["food:4"],"stamp":"COUNTERSUIT FILED"}]}]},{"id":"food_5","family":"food","title":"Food #5: The Returns Desk","text":"{kid} isn't refusing their peas. They're returning them. One at a time, overhand, off the high chair, with eye contact and a small, polite \"No thank you\" for each pea.","window":[560,920],"weight":6,"oncePerWeek":true,"when":{"flags":["food:4"],"notFlags":["food:5"]},"choices":[{"label":"\"Food stays on the table.\" (Say it 40 times.)","duration":8,"tags":["boundary"],"outcomes":[{"weight":1,"text":"You say it calmly. A pea leaves the tray. You say it again. The next pea leaves more slowly, so they can watch your face. This is no longer about peas.","effects":{"mood":-8,"energy":-8},"set":["food:5"]},{"weight":1,"text":"You say it once. They hold the next pea over the edge for a long time, looking at you. Then they eat it. You don't move. You don't breathe. They eat nine.","effects":{"mood":10,"energy":-4},"set":["food:5"],"stamp":"TREATY OF PEAS"}]},{"label":"Open a returns desk: a \"no thank you\" bowl.","duration":5,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":2,"text":"A small bowl where unwanted food can go, politely. It works. Peas go in the bowl, not on the floor. {kid} even eats two, out of professional courtesy.","effects":{"mood":12,"energy":-6},"set":["food:5"],"stamp":"RETURNS PROCESSED"},{"weight":1,"text":"They love the no-thank-you bowl. Every pea goes in it. Then the bowl goes on the floor, politely. \"No thank you, bowl.\"","effects":{"mood":8,"energy":-6},"set":["food:5"]}]},{"label":"Accept all returns. Mop in March.","duration":2,"outcomes":[{"text":"Pea after pea, each with a \"No thank you.\" Around pea 40 you stop hearing the thank-yous. {kid} has eaten nothing and will bring it up at 4 PM. The last pea will surface in July, in the dryer.","effects":{"energy":6,"mood":-8},"set":["food:5"]}]}]},{"id":"food_6","family":"food","title":"Food #6: Yesterday Food","text":"Leftovers: the pasta {kid} begged for yesterday, by name, eleven times. Today it's been ruled \"yesterday food.\" They'll only eat what you're eating, off your plate. You're eating the same pasta.","window":[700,1040],"weight":6,"oncePerWeek":true,"when":{"flags":["food:5"],"notFlags":["food:6"]},"choices":[{"label":"Swap plates. Same pasta, new jurisdiction.","duration":3,"tags":["negotiate"],"outcomes":[{"weight":2,"text":"You swap. They eat everything on your former plate. You eat everything on theirs. They watch you finish, then say, quietly, \"That was mine.\"","effects":{"mood":12,"energy":2},"set":["food:6"]},{"weight":1,"text":"You swap. They want to swap back. You swap back. Seven swaps. The pasta is cold and nobody has eaten, but everyone has been extremely fair.","effects":{"mood":-8,"energy":-8},"set":["food:6"]}]},{"label":"Share one plate. A bite each.","duration":10,"minEnergy":20,"tags":["present"],"outcomes":[{"text":"Bite for bite, off one plate. They count your bites out loud and eat exactly as many. It's the most they've eaten in days. You got half a meal, a personal best.","effects":{"mood":16,"energy":-6},"set":["food:6"]}]},{"label":"\"You get what you get.\"","duration":2,"tags":["boundary"],"snapRisk":true,"outcomes":[{"weight":1,"text":"\"You get what you get and you don't get upset,\" you say. They repeat it back, word for word, and get upset. Then they eat a roll, out of spite.","effects":{"mood":-10,"energy":2},"set":["food:6"]},{"weight":1,"text":"They get what they get. They don't get upset. They eat it, every noodle, while you stand there with your mouth open, which is when they put a noodle in it.","effects":{"mood":12,"energy":2},"set":["food:6"],"stamp":"APPEAL WITHDRAWN"}]},{"label":"Cereal. Concede the case.","duration":2,"outcomes":[{"weight":2,"text":"Cereal, poured with the dignity of a lawyer leaving through the courthouse back door. Two bowls. The pasta goes back in the fridge, to be refused again tomorrow.","effects":{"mood":12,"energy":4},"set":["food:6"]},{"weight":1,"text":"Cereal. {kid} eats four bites, then asks, very politely, for the pasta. The yesterday pasta. Overnight, it has been ruled today food.","effects":{"mood":-6,"energy":-6},"set":["food:6"]}]}]},{"id":"snack_1","family":"snack","title":"Snack #1: The Wrapper","text":"You open a granola bar in the pantry with the door shut, peeling the wrapper one millimeter at a time. From two rooms away: \"WHAT'S THAT NOISE.\"","window":[520,1040],"weight":3,"oncePerWeek":true,"when":{"notFlags":["snack:1"]},"choices":[{"label":"\"It's spicy.\" (It's oats.)","duration":1,"outcomes":[{"weight":2,"text":"\"It's spicy,\" you call, chewing. A long pause. \"Okay.\" Footsteps go back to the blocks. You've learned their language. Use it sparingly. They're listening.","effects":{"energy":12},"set":["snack:1"],"stamp":"PRECEDENT CITED"},{"weight":1,"text":"\"It's spicy.\" A pause. Then footsteps, coming closer. \"I LIKE spicy now.\" A small hand appears. You've been out-lawyered by someone who can't open the pantry.","effects":{"mood":10,"energy":-2},"set":["snack:1"],"count":{"snacks":1}}]},{"label":"Split it. Half each. (Mostly theirs.)","duration":3,"tags":["bribe"],"outcomes":[{"text":"You break it in half. They take the bigger half, then the smaller half, then lick the wrapper. You eat a crumb off your own shirt. Lunch.","effects":{"mood":12,"energy":-4},"set":["snack:1"],"count":{"snacks":1}}]},{"label":"Eat it in one bite. Destroy the evidence.","duration":1,"outcomes":[{"weight":1,"text":"Gone in one bite. They arrive to an empty pantry and a parent humming with their mouth closed. \"What was that noise?\" \"Mm?\" You'll take it to your grave.","effects":{"energy":12,"mood":-6},"set":["snack:1"]},{"weight":1,"text":"You get the whole bar in. They arrive. You smile with your mouth shut. They study your cheeks, then leave without a word. Days later, Ms. Patty asks, very gently, what a \"mouth bar\" is.","effects":{"energy":10},"set":["snack:1"]}]}]},{"id":"snack_2","family":"snack","title":"Snack #2: Name That Snack","text":"\"I want the crunchy ones from the time.\" Which crunchy ones. Which time. {kid}'s bottom lip has started to go. You have about six seconds.","window":[700,1050],"weight":3,"oncePerWeek":true,"timer":6,"when":{"flags":["snack:1"],"notFlags":["snack:2"]},"choices":[{"label":"\"The fish crackers!\"","duration":2,"tags":["bribe"],"outcomes":[{"weight":1,"text":"Correct! You hand them over with a game-show flourish. They eat them like a contestant who knew the answer all along.","effects":{"mood":14},"set":["snack:2"],"count":{"snacks":1}},{"weight":1,"text":"\"NOT FISH.\" The lip goes all the way. They eat the fish crackers anyway, sobbing, on principle.","effects":{"mood":-12},"set":["snack:2"],"count":{"snacks":1},"fx":"shake"}]},{"label":"\"The puffs from the car!\"","duration":2,"tags":["bribe"],"outcomes":[{"weight":1,"text":"\"YES.\" They're in the car. The car is in the driveway. You both go out in socks, in the drizzle, for puffs. Worth it.","effects":{"mood":14,"energy":-8},"set":["snack:2"],"count":{"snacks":1}},{"weight":1,"text":"\"NO. From the OTHER car.\" You have one car. {kid} has been in a car you don't know about.","effects":{"mood":-12},"set":["snack:2"]}]},{"label":"\"What did they look like?\" (Stall.)","duration":4,"outcomes":[{"text":"\"Crunchy.\" \"What color?\" \"Crunchy.\" \"A bag or a box?\" \"CRUNCHY.\" You open every cabinet. It's the rice cakes. It was always the rice cakes.","effects":{"mood":8,"energy":-8},"set":["snack:2"],"count":{"snacks":1}}]},{"label":"Freeze","duration":2,"timeout":true,"outcomes":[{"text":"Too slow. \"YOU ATE THEM,\" {kid} announces, which, at some point in history, you did. The crunchy ones are gone. The debt is not.","effects":{"mood":-14,"energy":-4},"set":["snack:2"],"stamp":"DEBT ACKNOWLEDGED","fx":"shake"}]}]},{"id":"snack_3","family":"snack","title":"Snack #3: The Audit","text":"{kid} has emptied your bag onto the floor for a snack audit. Findings: four raisins from August, a cracker from a previous administration and one granola bar you said you didn't have.","window":[600,1100],"weight":3,"oncePerWeek":true,"when":{"flags":["snack:2"],"notFlags":["snack:3"]},"choices":[{"label":"Surrender the bar. Cooperate fully.","duration":2,"tags":["bribe"],"outcomes":[{"text":"You hand it over. As a goodwill gesture, they return the August raisins to you. You eat them. It's the most fruit you've had since August.","effects":{"mood":12,"energy":2},"set":["snack:3"],"count":{"snacks":1}}]},{"label":"\"That's my emergency bar.\"","duration":3,"tags":["boundary"],"snapRisk":true,"outcomes":[{"weight":1,"text":"\"Oh,\" they say gravely, and put it back in your bag. They pat the bag twice. You eat it later at a red light, in two bites, like a fugitive.","effects":{"energy":10,"mood":-4},"set":["snack:3"]},{"weight":1,"text":"\"Emergency,\" they repeat, thoughtfully. Then they lie down on the floor and have one. They're fast. They're very fast.","effects":{"mood":-14},"set":["snack:3"],"stamp":"EMERGENCY DECLARED","fx":"shake"}]},{"label":"Clean out the bag together. Make it a game.","duration":10,"minEnergy":20,"tags":["present"],"outcomes":[{"text":"Trash, treasure or raisin. {kid} classifies a hair tie as a snack and a receipt as treasure. At the bottom: your spare car key, which you stopped looking for in June.","effects":{"mood":12,"energy":-8},"set":["snack:3"]}]}]},{"id":"diaper_1","family":"diaper","title":"Diaper #1: Live Coverage","text":"The bank. A silent line, nine people deep. {kid}, at full volume: \"I'M POOPING.\" Nine heads turn. A pause. \"STILL POOPING.\"","window":[540,1000],"weight":4,"oncePerWeek":true,"when":{"notFlags":["diaper:1","d:home"]},"choices":[{"label":"\"Thank you for the update.\"","duration":2,"outcomes":[{"weight":2,"text":"\"Thank you for the update,\" you say, like a press secretary. \"We'll have more at the top of the hour.\" The teller laughs. The man ahead laughs. \"DONE POOPING,\" {kid} announces, and takes no questions.","effects":{"mood":10},"set":["diaper:1"],"stamp":"PRESS BRIEFING"},{"weight":1,"text":"\"Thank you for the update.\" Nobody laughs. Someone in a blazer moves one place further away. \"MORE POOPING,\" {kid} adds, as a correction.","effects":{"mood":6,"energy":-6},"set":["diaper:1"]}]},{"label":"\"Inside voice, please.\"","duration":2,"tags":["boundary"],"outcomes":[{"weight":2,"text":"\"Inside voice,\" you whisper. {kid} nods and whispers, \"I'm pooping,\" which is somehow worse, and carries further.","effects":{"mood":4,"energy":-6},"set":["diaper:1"]},{"weight":1,"text":"\"Inside voice.\" They nod. Four minutes of perfect silence. Then, to the teller, at a normal volume: \"I pooped. For you.\"","effects":{"mood":8},"set":["diaper:1"]}]},{"label":"Give up your place. Change them in the car.","duration":12,"minEnergy":20,"tags":["present"],"outcomes":[{"text":"You change them on the back seat and come back to a line twelve deep. The teller waves you straight to the front: \"For the updates.\"","effects":{"energy":-10,"mood":6},"set":["diaper:1"]}]}]},{"id":"diaper_2","family":"diaper","title":"Diaper #2: Standing Room Only","text":"{kid} no longer lies down for diaper changes. Lying down is for babies. They will be changed standing up, walking away or, ideally, while running.","window":[600,1140],"weight":4,"oncePerWeek":true,"when":{"flags":["diaper:1"],"notFlags":["diaper:2"]},"choices":[{"label":"Change them standing. Learn the footwork.","duration":6,"minEnergy":20,"tags":["present"],"outcomes":[{"weight":2,"text":"You change a moving target on your knees in 41 seconds, using techniques you didn't know you had. {kid} never breaks stride. You're a professional now. There's no certificate.","effects":{"mood":10,"energy":-8},"set":["diaper:2"],"stamp":"41 SECONDS"},{"weight":1,"text":"Old one off. They're gone. A pantsless lap of the house follows, then a climb onto the couch, then a long look down at you from the top of it. Round two.","effects":{"energy":-10,"mood":8},"set":["diaper:2"]}]},{"label":"Hand over your phone. Lie down for the screen.","duration":3,"tags":["screen"],"outcomes":[{"weight":2,"text":"They lie down instantly, entranced. Change done in 20 seconds. Getting the phone back takes nine minutes and a negotiation over a video of a goose.","effects":{"energy":6,"mood":-6},"set":["diaper:2","d:screen"],"count":{"screen":5}},{"weight":1,"text":"Perfectly still. Change done. When you get the phone back, there's a new alarm, labeled GOOSE, set for 4:10 AM. You can't find it to delete it. You'll both find it at 4:10.","effects":{"energy":6,"rel":-8},"set":["diaper:2","d:screen"],"count":{"screen":5},"stamp":"ALARM: GOOSE, 4:10 AM","fx":"flash"}]},{"label":"Let it ride. It's mostly pee.","duration":1,"outcomes":[{"text":"\"Mostly\" is doing a lot of work. An hour later it's doing all the work, and so is the couch cushion.","effects":{"energy":4,"mood":-6},"set":["diaper:2"]}]},{"label":"Potty day 3. Skip the diaper. Shark underpants.","duration":4,"minEnergy":20,"tags":["present"],"when":{"flags":["d:potty"]},"outcomes":[{"weight":1,"text":"They stand perfectly still for the shark underpants, which is all you've ever wanted. Two potty trips before lunch. You'd frame the underpants if that weren't strange.","effects":{"mood":14,"energy":-4},"set":["diaper:2"]},{"weight":1,"text":"They stand perfectly still for the shark underpants. Eleven minutes later, the shark is wet and so is the rug. \"The shark did it.\"","effects":{"mood":6,"energy":-4},"set":["diaper:2"]}]}]},{"id":"diaper_3","family":"diaper","title":"Diaper #3: Size 2","text":"Public bathroom. Diaper emergency. You dig through the bag. One diaper left: size 2, from a smaller, more innocent {kid}. They're a size 5.","window":[540,1000],"weight":4,"oncePerWeek":true,"when":{"flags":["diaper:2"],"notFlags":["diaper:3","d:home"]},"choices":[{"label":"Make the size 2 work.","duration":4,"outcomes":[{"weight":1,"text":"It goes on like a swimsuit at a very expensive beach. It holds, technically, for nineteen minutes, which is all a diaper really owes you.","effects":{"energy":4},"set":["diaper:3"]},{"weight":1,"text":"One tab reaches. The other tab is in a different time zone. You pull. It snaps, with a sound that echoes off the tile.","effects":{"mood":-8},"set":["diaper:3"],"fx":"flash"}]},{"label":"Ask the parent at the sink. Beg if needed.","duration":4,"minEnergy":20,"outcomes":[{"weight":2,"text":"The parent at the sink hands you a size 5 without a word and walks out, like a spy who was never there. You'll think of them on your deathbed.","effects":{"mood":10,"energy":-4},"set":["diaper:3"],"stamp":"FOREIGN AID"},{"weight"

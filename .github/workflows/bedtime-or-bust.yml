name: Bedtime or Bust

on:
  push:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  content:
    name: Content lint, balance, golden traces, prototype (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: content.json matches content/ sources
        run: node tools/build-content.mjs --check
      - name: Lint content.json
        run: node tools/validate.mjs
      - name: Balance targets (simulated weeks)
        run: node tools/simulate.mjs --check
      - name: Golden traces are up to date
        run: node tools/golden.mjs --check
      - name: Web prototype is up to date
        run: node tools/build-prototype.mjs --check

  engine-linux:
    # BedtimeCore is Foundation-only, so its unit and golden-trace conformance
    # tests run on Linux in the official Swift image. Linux runners are always
    # available; this is the job that proves the Swift engine matches the spec.
    # Swift 5.9 is what Xcode 15 ships (the oldest Xcode the app supports and
    # the one it was first built with); 6.1 covers current toolchains.
    name: Swift ${{ matrix.swift }} engine tests (Linux)
    strategy:
      fail-fast: false
      matrix:
        swift: ["5.9", "6.1"]
    runs-on: ubuntu-latest
    container: swift:${{ matrix.swift }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: swift --version
      - name: Engine unit and conformance tests
        run: swift test --package-path Core
      - name: App logic compiles against the public API
        # The tests use @testable import, which can see internal symbols; the
        # app can't. GameStore.swift and Household.swift need no UI framework,
        # so type-check them here against the built module as the app imports it.
        run: |
          BIN="$(swift build --package-path Core --show-bin-path)"
          # GameStore uses Household and Reaction (App/Household.swift, Foundation only).
          swiftc -typecheck -I "$BIN/Modules" -I "$BIN" App/GameStore.swift App/Household.swift
          echo "App/GameStore.swift and App/Household.swift type-check against BedtimeCore's public API"

  ios:
    name: Swift tests and iOS build (Xcode)
    # In November 2026 every macOS job for this account (macos-26 and macos-15,
    # three runs) was cancelled after 15 minutes in the queue without ever
    # starting (GitHub: "Due to capacity constraints..."). Non-blocking until
    # that clears; build the app on a Mac with tools/mac-build.sh meanwhile.
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Engine unit and conformance tests
        run: swift test --package-path Core
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app for the iOS Simulator
        run: |
          xcodebuild build \
            -project BedtimeOrBust.xcodeproj \
            -scheme BedtimeOrBust \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            -quiet \
            CODE_SIGNING_ALLOWED=NO
